<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jak funguje defibrilátor?</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;700&display=swap">
<noscript><link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;700&display=swap"></noscript>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0;background:#050101}
body{overflow:hidden}
.cc-embed{margin:0!important}

.cc-embed{
  /* Speciál „Z lásky k srdci" má vlastní tmavou paletu; základ .cc-embed se sem
     nevkládá, protože by se celý přepsal. Barvy drží speciál, ne cc.cz. */
  --ac:#ff4343; --plocha:#050101; --txt:#f4eeee; --dim:#9d9294;
  --line:rgba(255,255,255,.13); --sc:1;
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  color:var(--txt); background:var(--plocha);
  box-sizing:border-box; display:flex; flex-direction:column;
  height:100vh; height:100dvh; min-height:100vh; min-height:100dvh; overflow:hidden;
  -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(78% 58% at 76% 3%, rgba(120,32,28,.30), transparent 70%);
}
.cc-embed *{font-family:inherit}
.cc-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.aed{position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
     padding:calc(1.15rem*var(--sc)) calc(1.25rem*var(--sc)) calc(.95rem*var(--sc))}

.aed__head{flex:none;padding-bottom:calc(.85rem*var(--sc))}
.aed__title{margin:0;font-family:"Poppins",Georgia,serif;font-weight:700;
  font-size:calc(clamp(20px,2.9vw,31px)*var(--sc));line-height:1.12;letter-spacing:-.015em}

.aed__body{flex:1 1 auto;min-height:0;display:flex;gap:calc(1.15rem*var(--sc))}

/* ---------- fotka ---------- */
.aed__wrap{flex:1 1 auto;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center}
.aed__stage{position:relative;width:100%;max-width:100%;max-height:100%;aspect-ratio:1448/1086;
  touch-action:manipulation}
.aed__ram{position:absolute;inset:0;overflow:hidden;
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 5%,#000 95%,transparent 100%),
                     linear-gradient(to bottom,transparent 0,#000 5%,#000 95%,transparent 100%);
          mask-image:linear-gradient(to right,transparent 0,#000 5%,#000 95%,transparent 100%),
                     linear-gradient(to bottom,transparent 0,#000 5%,#000 95%,transparent 100%);
  -webkit-mask-composite:source-in; mask-composite:intersect}
.aed__foto,.aed__lit{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.aed__zavoj{position:absolute;inset:0;background:#080203;opacity:0;
  transition:opacity .3s ease;pointer-events:none}
.aed__lit{opacity:0;transition:opacity .3s ease;pointer-events:none;
  filter:brightness(1.07) saturate(1.05) drop-shadow(0 0 10px rgba(255,120,90,.5))}
.aed__lit.on{opacity:1}
/* volitelná kontura; ve výchozím stavu vypnutá (--obrys:0) */
.aed__ov{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.aed__obr{fill:none;stroke:var(--ac);stroke-width:.0026;opacity:0;transition:opacity .3s ease;
  filter:drop-shadow(0 0 5px rgba(255,67,67,.9))}
.aed__obr.on{opacity:var(--obrys,0)}
.aed__terce{position:absolute;inset:0;width:100%;height:100%}
.aed__hit{fill:transparent;stroke:transparent;stroke-width:.016;pointer-events:all;cursor:pointer;outline:none}
.aed__hit:focus-visible{stroke:var(--ac);stroke-width:.004}
.aed__cedule{position:absolute;transform:translate(-50%,-100%);pointer-events:none;
  background:rgba(8,3,4,.88);border:1px solid var(--line);border-radius:999px;
  padding:calc(.3rem*var(--sc)) calc(.72rem*var(--sc));white-space:nowrap;
  font-size:calc(.8rem*var(--sc));font-weight:600;opacity:0;transition:opacity .3s ease}
.aed__cedule.on{opacity:1}

/* ---------- seznam ---------- */
.aed__side{flex:none;width:clamp(184px,25%,268px);min-height:0;display:flex;flex-direction:column;
  gap:calc(.18rem*var(--sc))}
.aed__skup{margin:calc(.35rem*var(--sc)) 0 calc(.22rem*var(--sc));font-size:calc(.62rem*var(--sc));
  letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}
.aed__skup:first-child{margin-top:0}
.aed__grp{display:flex;flex-direction:column}
.aed__row{display:flex;align-items:center;gap:calc(.5rem*var(--sc));width:100%;text-align:left;
  background:none;border:0;color:var(--txt);cursor:pointer;border-radius:7px;
  padding:calc(var(--rowpad,5px)*var(--sc)) calc(.5rem*var(--sc));
  font-size:calc(.85rem*var(--sc));line-height:1.25;touch-action:manipulation;
  transition:background .18s ease,color .18s ease}
.aed__row:hover{background:rgba(255,255,255,.055)}
.aed__row.on{background:rgba(255,67,67,.14)}
.aed__bul{flex:none;width:5px;height:5px;border-radius:50%;background:var(--dim);transition:background .18s}
.aed__row.on .aed__bul{background:var(--ac)}
.aed__ico{flex:none;width:calc(15px*var(--sc));height:calc(15px*var(--sc));
  fill:none;stroke:var(--dim);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:stroke .18s}
.aed__row.on .aed__ico{stroke:var(--ac)}

/* ---------- detail ---------- */
.aed__detail{flex:none;border-top:1px solid var(--line);
  margin-top:calc(.7rem*var(--sc));padding-top:calc(.6rem*var(--sc));
  min-height:calc(4.4rem*var(--sc))}
.aed__jmeno{margin:0 0 calc(.2rem*var(--sc));font-family:"Poppins",Georgia,serif;font-weight:700;
  font-size:calc(1rem*var(--sc));line-height:1.2}
.aed__popis{margin:0;color:var(--dim);font-size:calc(.86rem*var(--sc));line-height:1.45;max-width:64ch}

/* ---------- patička ---------- */
.aed__foot{flex:none;position:relative;display:flex;align-items:center;justify-content:space-between;
  gap:.6rem;padding-top:calc(.6rem*var(--sc))}
.aed__i{width:calc(23px*var(--sc));height:calc(23px*var(--sc));border-radius:50%;
  border:1px solid var(--line);background:none;color:var(--dim);cursor:pointer;
  font-size:calc(.72rem*var(--sc));font-style:italic;font-weight:700;line-height:1;
  display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.aed__i:hover,.aed__i[aria-expanded="true"]{color:var(--txt);border-color:var(--txt)}
.aed__partner{font-size:calc(.62rem*var(--sc));letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.aed__pozn{position:absolute;bottom:100%;left:0;right:0;margin-bottom:.5rem;z-index:6;
  background:#120708;border:1px solid var(--line);border-radius:11px;
  padding:calc(.7rem*var(--sc)) calc(.85rem*var(--sc));
  font-size:calc(.76rem*var(--sc));line-height:1.45;color:var(--dim);display:none}
.aed__pozn.on{display:block}

/* ---------- skládaný layout ----------
   Poměr rámu se láme na 620 px, ale hned nad hranicí je rám nízký a široký,
   takže skládaná varianta musí sahat výš než breakpoint šablony. */
@media (max-width:820px){
  .aed__body{flex-direction:column;gap:calc(.6rem*var(--sc))}
  .aed__side{width:100%;flex:none}
  /* Kdyby se štítky zalamovaly, snědí celou výšku a na fotku nic nezbyde.
     Proto jedna vodorovná lišta na skupinu, s okrajovým stínem jako signálem. */
  .aed__grp{flex-direction:row;flex-wrap:nowrap;gap:calc(.3rem*var(--sc));
    overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;
    scrollbar-width:none;padding-bottom:2px;
    -webkit-mask-image:linear-gradient(to right,#000 88%,transparent 100%);
            mask-image:linear-gradient(to right,#000 88%,transparent 100%)}
  .aed__grp::-webkit-scrollbar{display:none}
  .aed__row{width:auto;flex:none;border:1px solid var(--line);border-radius:999px;
    padding:calc(.28rem*var(--sc)) calc(.62rem*var(--sc));font-size:calc(.78rem*var(--sc));
    white-space:nowrap}
  .aed__row.on{border-color:var(--ac)}
  .aed__bul{display:none}
  .aed__skup{margin:calc(.3rem*var(--sc)) 0 calc(.18rem*var(--sc))}
  .aed__detail{min-height:calc(4.8rem*var(--sc));margin-top:calc(.5rem*var(--sc))}
}
@media (max-width:400px){
  .aed{padding:calc(.85rem*var(--sc)) calc(.9rem*var(--sc)) calc(.7rem*var(--sc))}
  .aed__head{padding-bottom:calc(.55rem*var(--sc))}
  .aed__row{font-size:calc(.73rem*var(--sc));padding:calc(.24rem*var(--sc)) calc(.55rem*var(--sc))}
  .aed__ico{width:calc(13px*var(--sc));height:calc(13px*var(--sc))}
  .aed__detail{min-height:calc(4.4rem*var(--sc))}
  .aed__popis{font-size:calc(.8rem*var(--sc))}
}
@media (prefers-reduced-motion:reduce){
  .aed__lit,.aed__zavoj,.aed__obr,.aed__cedule{transition:none}
}
</style>
</head>

<script>
(function(){
  var DATA = {"zelene": {"n": "Zelené tlačítko", "d": "Zapnete jím přístroj a ten vám obratem poví, jak správně postupovat dál.", "box": [0.8191, 0.3711, 0.8501, 0.4217]}, "navod": {"n": "Návod k použití", "d": "Nákres, který jasně ukazuje, kam na těle správně nalepit elektrody.", "box": [0.6264, 0.3748, 0.7818, 0.6354]}, "oranzove": {"n": "Oranžové tlačítko", "d": "Výboj lze aktivovat pouze potom, co přístroj registruje vhodný srdeční rytmus.", "box": [0.8073, 0.6575, 0.8398, 0.7127]}, "ibtn": {"n": "Tlačítko i", "d": "Zopakuje poslední pokyn a poradí i s masáží srdce.", "box": [0.7535, 0.453, 0.7762, 0.4908]}, "reproduktor": {"n": "Reproduktor", "d": "Instrukce dostáváte česky, nahlas a klidně, aby je bylo slyšet i v hlučné prodejně.", "box": [0.8771, 0.698, 0.9523, 0.7947]}, "elektrody": {"n": "Elektrody", "d": "Až vám přístroj řekne, stačí je rozbalit a nalepit podle obrázku na každé elektrodě.", "box": [0.1575, 0.2366, 0.4137, 0.7744]}, "kabel": {"n": "Kabel", "d": "Elektrody jsou k přístroji připojené napořád, nic sestavovat nemusíte.", "box": [0.2314, 0.2505, 0.5822, 0.4088]}, "prirucka": {"n": "Uživatelská příručka", "d": "Veškeré informace o přístroji na jedné kartě. Základ je zapnout, nalepit, zmáčknout.", "box": [0.2023, 0.2983, 0.3688, 0.7145]}, "karta155": {"n": "Volejte 155", "d": "Jedna věc, na kterou po zjištění vědomí a dýchání nesmíte zapomenout. Dispečer vám navíc se vším pomůže.", "box": [0.8916, 0.489, 0.9496, 0.7376]}, "nuzky": {"n": "Nůžky a holítko", "d": "Elektrody musí na holou kůži. Nůžkami rozstřihnete tričko, holítkem kůži připravíte."}, "klic": {"n": "Dětský klíč", "d": "Zasunete ho do přístroje, pokud zachraňujete dítě do 8 let / 25 kg."}, "baterie": {"n": "Baterie", "d": "Vydrží v pohotovosti celé roky. Přístroj každý den sám testuje její kapacitu."}}, PORADI = ["zelene", "navod", "oranzove", "ibtn", "reproduktor", "elektrody", "kabel", "prirucka", "karta155"];
  var CFG = {
    KROK: 560,        // jak dlouho svítí jedna část v klidovém průchodu
    PAUZA: 1500,      // pauza mezi průchody
    PRUCHODY: 2,      // kolik průchodů se přehraje, než prvek ztichne
    ZAVOJ_KLID: .42,  // ztmavení scény v klidovém náhledu
    ZAVOJ_HOVER: .78, // ztmavení scény při skutečném výběru
    OBRYS: 0          // 0 = jen prosvětlení, 1 = i tenká kontura po obrysu
  };

  var root = document.querySelector('[data-cc-aed]');
  if(!root) return;
  var $ = function(n){ return root.querySelector('[data-el='+n+']'); };
  var stage=$('stage'), zavoj=$('zavoj'), cedule=$('cedule'),
      jmeno=$('jmeno'), popis=$('popis'), pozn=$('pozn'), ibtn=$('ibtn');
  var lit=[$('litA'),$('litB')], obr=[$('obrA'),$('obrB')];
  var rows={}, hits={};
  root.querySelectorAll('.aed__row').forEach(function(b){ rows[b.dataset.k]=b; });
  root.querySelectorAll('.aed__hit').forEach(function(p){ hits[p.dataset.k]=p; });
  root.style.setProperty('--obrys', CFG.OBRYS);

  var slot=0, vybrano=null, klidBezi=true, timer=null, zacatek=0, pruchod=0;

  /* Klepnutí na mobilu vypadává, když se prst při ťuknutí pohne. */
  function bindTap(node, fn){
    var last=0;
    if(window.PointerEvent){
      node.addEventListener('pointerdown', function(e){ if(e.cancelable) e.preventDefault(); node.focus&&node.focus({preventScroll:true}); fn(); });
    } else {
      node.addEventListener('touchstart', function(e){ last=Date.now(); if(e.cancelable) e.preventDefault(); fn(); }, {passive:false});
      node.addEventListener('mousedown', function(){ if(Date.now()-last>700) fn(); });
    }
    node.addEventListener('keydown', function(e){ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); fn(); } });
    node.addEventListener('click', function(e){ e.preventDefault(); });
  }

  /* Vykreslení jednoho stavu. sila 0..1 pro klidový náhled, 1 pro výběr. */
  function vykresli(k, sila, hover){
    var it = DATA[k], naFotce = !!(it && it.box), n = slot^1;
    if(naFotce){
      lit[n].style.clipPath = 'url(#cp-'+k+')';
      obr[n].setAttribute('d', hits[k].getAttribute('d'));
      lit[n].style.opacity = sila;
      obr[n].classList.add('on'); obr[n].style.opacity = (CFG.OBRYS*sila).toFixed(3);
      lit[slot].style.opacity = 0; obr[slot].classList.remove('on');
      cedule.textContent = it.n;
      cedule.style.left = (100*(it.box[0]+it.box[2])/2)+'%';
      cedule.style.top  = Math.max(6, 100*it.box[1]-1.2)+'%';
      cedule.classList.toggle('on', sila>.25);
      slot = n;
    } else {
      lit[0].style.opacity=0; lit[1].style.opacity=0;
      obr[0].classList.remove('on'); obr[1].classList.remove('on');
      cedule.classList.remove('on');
    }
    zavoj.style.opacity = (hover?CFG.ZAVOJ_HOVER:CFG.ZAVOJ_KLID)*sila;
  }

  function vypni(){
    lit[0].style.opacity=0; lit[1].style.opacity=0;
    obr[0].classList.remove('on'); obr[1].classList.remove('on');
    cedule.classList.remove('on'); zavoj.style.opacity=0;
  }

  function vyber(k){
    stopKlid();
    vybrano = k;
    for(var id in rows) rows[id].classList.toggle('on', id===k);
    jmeno.textContent = DATA[k].n; popis.textContent = DATA[k].d;
    vykresli(k, 1, true);
  }

  /* ---- klidový náhled: prvek si sám projde části, než do něj někdo sáhne ---- */
  var CYKLUS = PORADI.length*CFG.KROK + CFG.PAUZA;
  function klidTick(t){
    if(!klidBezi) return;
    var c = t - zacatek;
    if(c >= CYKLUS){ zacatek = t; c = 0; pruchod++; if(pruchod >= CFG.PRUCHODY){ stopKlid(); return; } }
    var i = Math.floor(c/CFG.KROK);
    if(i < PORADI.length){
      var f = (c - i*CFG.KROK)/CFG.KROK;
      vykresli(PORADI[i], Math.sin(f*Math.PI), false);
    } else vypni();
    timer = requestAnimationFrame(klidTick);
  }
  function startKlid(){
    if(vybrano || klidBezi) return;
    klidBezi = true; pruchod = 0; zacatek = performance.now();
    timer = requestAnimationFrame(klidTick);
  }
  function stopKlid(){
    klidBezi = false;
    if(timer){ cancelAnimationFrame(timer); timer=null; }
    if(!vybrano) vypni();
  }

  /* Znovu se rozběhne, až se prvek vrátí do záběru. Uvnitř iframu to funguje,
     implicitním kořenem je viewport nejvyššího dokumentu. */
  if(window.IntersectionObserver){
    var vidno = true;
    new IntersectionObserver(function(e){
      var v = e[0].isIntersecting;
      if(v && !vidno && !vybrano) startKlid();
      if(!v) stopKlid();
      vidno = v;
    }, {threshold:.35}).observe(root);
  }

  /* ---- vazby ---- */
  Object.keys(rows).forEach(function(k){
    bindTap(rows[k], function(){ vyber(k); });
    rows[k].addEventListener('mouseenter', function(){ if(vybrano!==k) vyber(k); });
  });
  Object.keys(hits).forEach(function(k){
    bindTap(hits[k], function(){ vyber(k); });
    hits[k].addEventListener('mouseenter', function(){ if(vybrano!==k) vyber(k); });
  });

  bindTap(ibtn, function(){
    var open = pozn.classList.toggle('on');
    ibtn.setAttribute('aria-expanded', open?'true':'false');
  });
  document.addEventListener('keydown', function(e){
    if(e.key==='Escape'){ pozn.classList.remove('on'); ibtn.setAttribute('aria-expanded','false'); }
  });
  document.addEventListener('pointerdown', function(e){
    if(pozn.classList.contains('on') && !pozn.contains(e.target) && e.target!==ibtn){
      pozn.classList.remove('on'); ibtn.setAttribute('aria-expanded','false');
    }
  }, true);

  /* ---- vejít se do pevného rámu ---- */
  var sek = root.querySelector('.aed');
  function fit(){
    root.style.setProperty('--sc', 1);
    var volno = root.querySelector('[data-el=side]').clientHeight || 0;
    var pocet = root.querySelectorAll('.aed__row').length;
    if(volno && pocet && window.innerWidth>820){
      root.style.setProperty('--rowpad', Math.max(2, Math.min(7, (volno/pocet-19)*0.42)).toFixed(1)+'px');
    } else root.style.setProperty('--rowpad','5px');
    var sc = 1;
    for(var i=0;i<14;i++){
      if(sek.scrollHeight <= sek.clientHeight+1 &&
         document.documentElement.scrollHeight <= window.innerHeight+1) break;
      sc *= 0.94; root.style.setProperty('--sc', sc.toFixed(3));
    }
  }
  var t; function refit(){ clearTimeout(t); t=setTimeout(fit,90); }
  window.addEventListener('resize', refit);
  window.addEventListener('load', fit);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  if(window.ResizeObserver) new ResizeObserver(refit).observe(root);
  fit();

  zacatek = performance.now();
  timer = requestAnimationFrame(klidTick);
})();
</script>
