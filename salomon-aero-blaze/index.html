<!-- CzechCrunch – infobox „Aero Blaze 4 GRVL GTX“ místo textové tabulky specifikací.
     Cíl: nativní článek cc.cz se Salomonem „Je les šetrnější ke kloubům než asfalt? …“, za citací Jiřího Petra „…který model si pro trénink obujete“.
     Vložení: salomon-aero-blaze-vlozeni.html, obalový div s výškou podle šířky okna (vzorec a ověřené šířky jsou ve vložení).
     Nasazení: matyas-cloud/cc-embed/salomon-aero-blaze/ (index.html, pozadi-*.jpg, lupa-*.jpg), Poppins ze sdílené složky ../fonts/.
     Formát: tmavá karta jako Meander, akcent terakota. Nahoře bota v prostředí s kótami (35 mm pata, 27 mm špička, drop 8 mm,
       2,5 mm hloubka vzorku s lupou jen v širokém rámu). Pod ní schéma boty rozložené na vrstvy s názvy technologií,
       vedle hmotnost pánské a dámské boty (pruhy v poměru) a cena s membránou a bez ní.
       Přepínač Šotolina / Bláto / Sníh mění prostředí za botou a zvýrazní verzi, která se na povrch hodí (šotolina = bez membrány).
       Rám užší než 540 px: bližší výřez fotky, bez lupy, hloubka vzorku jako čtvrtá hodnota. Tělo pod sebou pod 620 px.
     Nástup: čáry se dokreslí, hodnoty se napočítají, vrstvy a pruhy naběhnou, až je část vidět. Žádný pohyb naprázdno.
       Bez IO, s omezeným pohybem nebo s ?static rovnou konečný stav. ?info otevře (i), ?s=sotolina|blato|snih zvolí povrch (jen pro náhledy).
     Data: tabulka a text článku (Salomon). Hmotnost platí pro velikost UK 8,5 a UK 5,5 (uvedeno v (i)). „O 26 g lehčí“ platí podle článku
       pro pánské provedení, na kartě zjednodušeno (Mattovo rozhodnutí), přesně v (i).
     Obrázky: fotka boty Salomon (vyříznutá, začištěný okraj), prostředí vygenerované v Gemini (ilustrační, uvedeno v (i)).
     Změny obsahu:
       2026-10-26  v1 produkční verze podle schváleného náhledu (salomon-aero-blaze-nahled.png). -->

<style>

    el.addEventListener('pointerdown', function(e){ if(e.button > 0) return; e.preventDefault(); last = Date.now(); try{ el.focus({preventScroll:true}); }catch(_){} fn(e); });
    el.addEventListener('click', function(e){ e.preventDefault(); if(Date.now() - last > 600) fn(e); });
    el.addEventListener('keydown', function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); last = Date.now(); fn(e); } });
  }
  [].slice.call(root.querySelectorAll('.sa-sw button')).forEach(function(b){ bindTap(b, function(){ setSurf(b.getAttribute('data-s')); }); });
  setSurf(surf);

  /* ===== počítání čísel (šířka zamčená na konečnou) ===== */
  function ease(k){ return 1 - Math.pow(1 - k, 3); }
  function fmt(v, dec){ if(dec) return v.toFixed(1).replace('.', ','); var s = String(Math.round(v)); return s.length > 3 ? s.slice(0, -3) + ' ' + s.slice(-3) : s; }
  function count(scope, delay){
    [].slice.call(scope.querySelectorAll('[data-cnt]')).forEach(function(el){
      var n = parseFloat(el.dataset.cnt), dec = n % 1 !== 0, t0 = null, fin = el.textContent;
      el.style.display = 'inline-block'; el.style.minWidth = el.offsetWidth ? el.offsetWidth + 'px' : '';
      el.textContent = fmt(0, dec);
      setTimeout(function(){
        function step(t){ if(t0 === null) t0 = t; var k = Math.min(1, (t - t0)/1100); el.textContent = k < 1 ? fmt(n*ease(k), dec) : fin; if(k < 1) requestAnimationFrame(step); else el.style.minWidth = ''; }
        requestAnimationFrame(step);
      }, delay || 0);
    });
  }

  /* ===== panel (i) ===== */
  var info = root.querySelector('[data-info]'), panel = root.querySelector('[data-panel]'), closeBtn = root.querySelector('[data-close]');
  function openP(){ panel.hidden = false; info.setAttribute('aria-expanded', 'true'); closeBtn.focus({preventScroll:true}); }
  function closeP(){ if(panel.hidden) return; panel.hidden = true; info.setAttribute('aria-expanded', 'false'); info.focus({preventScroll:true}); }
  bindTap(info, function(){ panel.hidden ? openP() : closeP(); });
  bindTap(closeBtn, closeP);
  panel.addEventListener('pointerdown', function(e){ if(e.target === panel) closeP(); });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape') closeP();
    if(e.key === 'Tab' && !panel.hidden){ e.preventDefault(); closeBtn.focus(); }
  });

  /* ===== vyplnění rámu: tělo se zmenší, když se nevejde ===== */
  function over(){
    var rb = root.getBoundingClientRect().bottom - 6, mx = 0;
    [].slice.call(body.querySelectorAll('.sa-ly, .sa-it, .sa-wr, .sa-layers')).forEach(function(m){ mx = Math.max(mx, m.getBoundingClientRect().bottom); });
    return mx > rb;
  }
  function fit(){
    if(root.style.height === 'auto') return;
    var sc = 1; body.style.zoom = 1;
    for(var k = 0; k < 14 && over() && sc > .8; k++){ sc *= .97; body.style.zoom = sc.toFixed(3); }
  }
  var rt;
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  if(window.ResizeObserver) new ResizeObserver(function(){ clearTimeout(rt); rt = setTimeout(fit, 90); }).observe(root);
  fit();

  /* ===== nástup ===== */
  function playHero(anim){
    if(hero.classList.contains('is-on')) return;
    hero.classList.add('is-on');
    if(!anim) return;
    [].slice.call(hero.querySelectorAll('.ln-s')).forEach(function(l, i){ l.style.transitionDelay = (250 + i*180)+'ms'; });
    [].slice.call(hero.querySelectorAll('.ln-d, .sa-dot')).forEach(function(l, i){ l.style.transitionDelay = (550 + i*70)+'ms'; });
    [].slice.call(hero.querySelectorAll('.sa-lupa')).forEach(function(l){ l.style.transitionDelay = '900ms'; });
    [].slice.call(hero.querySelectorAll('.sa-lab')).forEach(function(l, i){ l.style.transitionDelay = (700 + (i % 4)*110)+'ms'; });
    count(hero, 700);
  }
  function playBody(anim){
    if(body.classList.contains('is-on')) return;
    body.classList.add('is-on');
    if(anim) count(body.querySelector('.sa-facts'), 250);
  }
  if(!ANIM){ playHero(false); playBody(false); }
  else {
    var alive = false;
    var io = new IntersectionObserver(function(en){
      alive = true;
      en.forEach(function(x){
        if(!x.isIntersecting) return;
        io.unobserve(x.target);
        if(x.target === hero) playHero(true); else playBody(true);
      });
    }, {threshold:.35});
    io.observe(hero); io.observe(body);
    setTimeout(function(){ if(!alive){ playHero(false); playBody(false); } }, 6000);   // záloha pro nefunkční IO
  }
  if(/[?&]info\b/.test(Q)) openP();
})();
</script>
