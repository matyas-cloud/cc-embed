<meta name="robots" content="noindex">
<!-- CzechCrunch × Mavie Work – infografika „Mavie Stress Study 2026“ místo textového infoboxu.
     Cíl: článek cc.cz s partnerem Mavie Work (premium/nativ), sourozenec prvku visa-ai-nakupovani.
     Vložení: mavie-stress-study-vlozeni.html, obalový div s výškou podle šířky okna.
     Nasazení: matyas-cloud/cc-embed/mavie-stress-study/index.html, Poppins ze sdílené složky ../fonts/.
     Formát: bílá plocha se stínem uvnitř rámu, nahoře titulek a (i) se zdroji. Každý údaj je číslo + věta z podkladu.
       1 stres (61 %, lidičky s legendou „1 postavička = 10 %“), 2 vyčerpání a výkon (tři prstence 76 / 62 / 69 %),
       3 náklady 16 mld. Kč (s poznámkou o zdroji) | 4 pomoc a mlčení (tmavá karta, žlutá = pomoc),
       5 šéf ve stresu (23 %). Na desktopu 3 a 4 vedle sebe, na mobilu pod sebou.
     Barvy podle e-a.as: petrolejová #025450 jako barva dat (gradient), žlutá #f9e54f jen jako akcent u pomoci.
     Nástup po kapitolách přes IntersectionObserver. Bez IO, s omezeným pohybem nebo s ?static rovnou konečný stav;
       ?info otevře panel (i) – jen pro náhledy.
     Data: podklad redakce (Mavie Stress Study 2026, 394 pracujících v Česku ve věku 18 až 64 let; 16 mld. Kč
       Masarykova univerzita, Tachezyová, Špalková, Hlávka, 2025). Texty a čísla jsou v bloku D, z něj se skládá i shrnutí pro čtečky.
     Změny obsahu:
       2026-11-05  v1 infografika v pěti kapitolách.
       2026-11-05  v2 titulek zkrácen na „Mavie Stress Study 2026“ (feedback redakce), úklid nepoužitých proměnných.
       2026-11-05  v3 u 61 % legenda „1 postavička = 10 %“ pod lidičkami, u 23 % lidičky pryč (číslo s větou stačí), věta o postavičce z (i) pryč, je v legendě.
       2026-11-10  v4 změny klienta přes redakci: pryč Rakousko a 40 % (zhoršení za rok), nově 69 % (práce i přes vyčerpání
                   z finančních důvodů) a 16 mld. Kč (MU); věty u čísel 1:1 z podkladu včetně „zaměstnanců“, proto pryč popisky kapitol;
                   „3 ze 4“ → „3/4“ podle podkladu; zdroj v (i) podle podkladu. -->

<style>

  --cc-surface:#f8f9fa;   --cc-white:#fff;

  --cc-pad:clamp(16px,3vw,26px);
  --cc-gap:12px;

<style>
.cc-mavie{
  --ink:#13201f; --ink2:#566664; --line:#e5ebe9;
  --teal:#025450; --track:#e8efed; --yel:#f9e54f;
  --sc:1; --ease:cubic-bezier(.2,.7,.2,1);
  --vf:max(14px, calc(clamp(15px,3vw,18px)*var(--sc)));        /* hodnota v prstenci */
  --hf:max(26px, calc(clamp(30px,6.4vw,40px)*var(--sc)));      /* velké číslo */
  --lf:max(14px, calc(clamp(14px,2.5vw,15px)*var(--sc)));      /* věta u čísla */
  --tf:max(12px, calc(clamp(12px,2.3vw,13px)*var(--sc)));      /* drobné popisky */
  --gap:calc(clamp(8px,1.8vw,12px)*var(--sc));                 /* věta → graf */
  --pw:calc(clamp(18px,3.4vw,22px)*var(--sc)); --pwb:calc(clamp(24px,4.6vw,30px)*var(--sc));
  --ring:calc(clamp(76px,14vw,92px)*var(--sc));
  box-sizing:border-box;height:100%;display:flex;flex-direction:column;overflow:hidden;position:relative;
  padding:clamp(16px,4.2vw,28px) clamp(16px,4.2vw,30px) clamp(16px,3.6vw,24px);
  background:radial-gradient(120% 55% at 100% 0%, rgba(162,204,140,.16), rgba(162,204,140,0) 62%), #fff;
  border:1px solid #e3e9e7;border-radius:var(--cc-radius);color:var(--ink);
  box-shadow:0 1px 2px rgba(2,84,80,.06), 0 14px 32px -20px rgba(2,60,56,.42);
  font-family:var(--cc-display);
}
.cc-mavie *{box-sizing:border-box;}
.cc-mavie button{font:inherit;color:inherit;margin:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}

/* záhlaví */
.cc-mavie__hd{flex:0 0 auto;display:flex;align-items:flex-start;gap:12px;}
.cc-mavie .cc-mavie__title{margin:0;color:#000;letter-spacing:-.01em;font-size:max(17px, calc(clamp(19px,4.4vw,24px)*var(--sc)));line-height:1.2;}
.cc-mavie .info{margin-left:auto;flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid #b3c0bd;background:#fff;color:var(--ink2);
  cursor:pointer;display:grid;place-items:center;font:600 13px/1 var(--cc-display);transition:border-color .15s,color .15s;}
.cc-mavie .info:hover{border-color:var(--teal);color:var(--teal);}

/* jednotný styl čísel */
.val{display:inline-block;white-space:nowrap;color:var(--ink);font:600 var(--vf)/1 var(--cc-display);letter-spacing:-.01em;transition:opacity .3s;}
.val.hero{font-size:var(--hf);letter-spacing:-.02em;}
.val [data-c]{display:inline-block;}
.val .u{display:inline-block;font-size:.7em;margin-left:.2em;letter-spacing:0;transition:opacity .3s;}
.val .u--frac{font-size:1em;margin-left:0;}
.is-count .u{opacity:0;}

/* číslo + věta z podkladu */
.st{display:flex;align-items:center;gap:clamp(12px,3vw,20px);}
.st .val.hero{flex:none;}
.cc-mavie .st__t{margin:0;min-width:0;flex:1 1 auto;color:var(--ink);font:500 var(--lf)/1.32 var(--cc-display);letter-spacing:-.005em;text-wrap:balance;}

/* mřížka kapitol */
.cc-mavie__grid{flex:1 1 auto;min-height:0;display:grid;margin-top:calc(clamp(8px,2vw,14px)*var(--sc));
  grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);grid-template-areas:"str str" "dop dop" "kc pom" "sef sef";
  align-content:space-between;column-gap:clamp(18px,4vw,30px);row-gap:calc(12px*var(--sc));}
.vs{min-width:0;padding-top:calc(clamp(12px,2.6vw,16px)*var(--sc));border-top:1px solid var(--line);}
.vs--str{grid-area:str;border-top:0;padding-top:0;}
.vs--dop{grid-area:dop;} .vs--kc{grid-area:kc;display:flex;flex-direction:column;} .vs--pom{grid-area:pom;} .vs--sef{grid-area:sef;}
.vs__viz{margin-top:var(--gap);position:relative;}
.vs--sef{padding-bottom:4px;}   /* rezerva pro přesah písma velkého čísla */

/* lidičky (1 = 10 %) */
.ppl{display:flex;justify-content:space-between;align-items:flex-end;gap:2px;}
.pp{position:relative;flex:0 0 auto;width:var(--pw);height:calc(var(--pw)*1.333);}
.pp svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible;}
.pp__off{fill:var(--track);}
.pp__on{fill:url(#mv-g);clip-path:inset(0 var(--cut,100%) 0 0);transition:clip-path .28s linear;transition-delay:var(--d,0ms);}
.cc-mavie.is-pre .vs:not(.is-on) .pp__on,.cc-mavie.is-pre .pom__i:not(.is-on) .pp__on{clip-path:inset(0 100% 0 0);transition:none;}
.ppl--fit .pp{flex:1 1 0;width:auto;max-width:var(--pw);height:auto;aspect-ratio:.75;}

/* 1 stres */
.str__p{display:flex;flex-direction:column;}
.str__p .ppl{--pw:var(--pwb);}
.str__p .pp__on{filter:drop-shadow(0 4px 5px rgba(2,84,80,.22));}
.lgd{align-self:flex-end;margin-top:calc(6px*var(--sc));color:var(--ink2);font:400 calc(var(--tf)*.95)/1.2 var(--cc-display);transition:opacity .5s var(--ease) .7s;}
.cc-mavie.is-pre .vs:not(.is-on) .lgd{opacity:0;}

/* 2 prstence */
.vs--dop .vs__viz{margin-top:0;}
.rgs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:clamp(10px,3vw,24px);}
.rg{display:flex;flex-direction:column;align-items:center;text-align:center;gap:calc(10px*var(--sc));min-width:0;}
.rg__ring{position:relative;flex:none;width:var(--ring);height:var(--ring);}
.rg__ring svg{display:block;width:100%;height:100%;transform:rotate(-90deg);overflow:visible;}
.rg__tr{fill:none;stroke:var(--track);stroke-width:9;}
.rg__v{fill:none;stroke:url(#mv-r);stroke-width:9;stroke-linecap:round;stroke-dasharray:263.89;stroke-dashoffset:var(--o);
  filter:drop-shadow(0 3px 4px rgba(2,84,80,.28));transition:stroke-dashoffset 1.2s var(--ease);transition-delay:var(--d,0ms);}
.cc-mavie.is-pre .vs:not(.is-on) .rg__v{stroke-dashoffset:263.89;}
.rg__ring .val{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:calc(var(--vf)*1.15);}
.cc-mavie .rg__t{margin:0;max-width:22ch;color:var(--ink);font:400 var(--tf)/1.35 var(--cc-display);text-wrap:balance;}

/* 3 náklady */
.vs--kc .st{flex-direction:column;align-items:flex-start;gap:calc(8px*var(--sc));}
.cc-mavie .kc__fn{margin:auto 0 0;padding-top:calc(10px*var(--sc));color:var(--ink2);font:400 max(12px, calc(12px*var(--sc)))/1.35 var(--cc-display);}

/* 4 pomoc – tmavá karta, žlutá = pomoc */
.vs--pom{border-top:0;padding:calc(clamp(14px,2.8vw,18px)*var(--sc)) clamp(14px,3vw,20px);border-radius:14px;color:#fff;
  background:radial-gradient(90% 70% at 100% 0%, rgba(26,141,122,.55), rgba(26,141,122,0) 70%), linear-gradient(160deg,#03625d 0%,#025450 50%,#013c39 100%);
  box-shadow:0 18px 30px -18px rgba(1,50,47,.75), inset 0 1px 0 rgba(255,255,255,.08);}
.vs--pom .st__t{color:rgba(255,255,255,.94);}
.vs--pom .val{color:#fff;}
.vs--pom .st .val.hero{min-width:calc(var(--hf)*1.55);}
.pom__i + .pom__i{margin-top:calc(12px*var(--sc));padding-top:calc(12px*var(--sc));border-top:1px solid rgba(255,255,255,.14);}
.pom__i .vs__viz{display:flex;}
.vs--pom .pp__off{fill:rgba(255,255,255,.14);}
.vs--pom .pp__on{fill:var(--yel);filter:drop-shadow(0 0 6px rgba(249,229,79,.35));}
.vs--pom .ppl{flex:1 1 auto;min-width:0;}
.bub{flex:1 1 auto;min-width:0;display:flex;justify-content:flex-start;gap:clamp(6px,1.6vw,10px);}
.bub svg{display:block;flex:0 1 auto;min-width:0;width:calc(clamp(28px,4.8vw,36px)*var(--sc));height:auto;overflow:visible;
  transition:opacity .35s var(--ease),transform .45s var(--ease);transition-delay:var(--d,0ms);}
.bub__mute{fill:rgba(255,255,255,.92);filter:drop-shadow(0 4px 6px rgba(0,0,0,.18));}
.bub__talk{fill:rgba(255,255,255,.06);stroke:rgba(255,255,255,.42);stroke-width:1.4;}
.bub__dot{fill:var(--yel);}
.cc-mavie.is-pre .pom__i:not(.is-on) .bub svg{opacity:0;transform:translateY(6px) scale(.8);}

/* hodnoty se ukážou, až se kapitola rozehraje */
.cc-mavie.is-pre .vs:not(.is-on) .val,.cc-mavie.is-pre .pom__i:not(.is-on) .val{opacity:0;}

/* panel (i) */
.panel{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:clamp(12px,3vw,24px);
  background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);border-radius:var(--cc-radius);}
.panel[hidden]{display:none;}
.panel__box{position:relative;width:100%;max-width:470px;max-height:100%;display:flex;flex-direction:column;background:#fff;border:1px solid #e0e6e4;
  border-radius:14px;box-shadow:0 18px 40px -18px rgba(2,50,47,.4);padding:clamp(16px,3.6vw,22px) clamp(16px,3.6vw,24px);}
.panel__hd{display:flex;align-items:flex-start;gap:12px;}
.cc-mavie .panel__t{margin:0;font:600 15px/1.3 var(--cc-display);color:var(--ink);}
.cc-mavie .panel__x{margin-left:auto;flex:none;width:28px;height:28px;border:0;border-radius:50%;background:#eef3f1;cursor:pointer;font:400 18px/1 var(--cc-display);color:var(--ink);}
.panel__body{margin-top:10px;overflow-y:auto;min-height:0;}
.cc-mavie .panel__body p{margin:0 0 9px;font:400 13px/1.5 var(--cc-display);color:#3c3c3c;}
.cc-mavie .panel__body p:last-child{margin-bottom:0;}

/* užší než 600 px: kapitoly pod sebou */
@media (max-width:599px){
  .cc-mavie__grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"str" "dop" "kc" "pom" "sef";}
  .cc-mavie{--pwb:calc(min(30px, (100vw - 76px)/10)*var(--sc));}
  .vs--kc .st{flex-direction:row;align-items:center;}
  .rgs{grid-template-columns:minmax(0,1fr);row-gap:calc(10px*var(--sc));}
  .rg{flex-direction:row;text-align:left;gap:clamp(12px,4vw,18px);}
  .cc-mavie .rg__t{max-width:none;font-size:var(--lf);font-weight:500;}
  .cc-mavie{--ring:calc(clamp(64px,19vw,76px)*var(--sc));}
}
@media (prefers-reduced-motion:reduce){.cc-mavie *,.cc-mavie *::after{transition:none!important;}}
.cc-mavie.is-static *,.cc-mavie.is-static *::after{transition:none!important;}
</style>

  <defs>
    <symbol id="mv-person" viewBox="0 0 24 32"><circle cx="12" cy="7" r="5.6"/><path d="M2.5 31v-7.5a9.5 9.5 0 0 1 19 0V31z"/></symbol>
    <linearGradient id="mv-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a8d7a"/><stop offset="1" stop-color="#025450"/></linearGradient>
    <linearGradient id="mv-r" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#025450"/><stop offset="1" stop-color="#22a089"/></linearGradient>
  </defs>
</svg>

<div class="cc-embed cc-mavie" data-cc-mavie>
  <p class="cc-sr" data-sr></p>
  <div class="cc-mavie__hd">
    <h3 class="cc-title cc-mavie__title">Mavie Stress Study 2026</h3>
    <button type="button" class="info" data-info aria-label="Zdroj a vysvětlivky" aria-expanded="false" aria-controls="mv-panel">i</button>
  </div>
  <div class="cc-mavie__grid" data-grid></div>
  <div class="panel" id="mv-panel" role="dialog" aria-modal="true" aria-labelledby="mv-panel-t" data-panel hidden>
    <div class="panel__box">
      <div class="panel__hd"><p class="panel__t" id="mv-panel-t">Zdroj a vysvětlivky</p><button type="button" class="panel__x" data-close aria-label="Zavřít">×</button></div>
      <div class="panel__body" data-pbody></div>
    </div>
  </div>
</div>


<script>
(function(){
  var root = document.querySelector('[data-cc-mavie]');
  if(!root || root.dataset.ccInit) return;
  root.dataset.ccInit = '1';
  var Q = location.search;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var canIO = 'IntersectionObserver' in window;
  var STATIC = /[?&]static\b/.test(Q);
  var ANIM = !reduce && canIO && !STATIC;
  if(ANIM) root.classList.add('is-pre');                            // skrytý výchozí stav hned, žádné probliknutí
  if(STATIC) root.classList.add('is-static');

  /* ===== D: čísla a věty 1:1 z podkladu redakce, texty panelu (i) ===== */
  var D = {
    str: {v:61, t:'zaměstnanců je často nebo velmi často ve stresu', lgd:'1 postavička = 10 %'},
    dop: {items:[[76,'chodí do práce navzdory vyčerpání'],[62,'zaměstnanců vnímá kvůli stresu pokles výkonu'],[69,'pracuje i přes vyčerpání z finančních důvodů']]},
    kc:  {v:16, u:'mld. Kč', t:'stála v roce 2024 pracovní neschopnost kvůli duševním onemocněním*', fn:'* Masarykova univerzita (Tachezyová, Špalková, Hlávka, 2025)'},
    pom: {v1:9, t1:'zaměstnanců vyhledá odbornou pomoc', n:3, of:4, t2:'lidí o duševním zdraví v práci nemluví'},
    sef: {v:23, t:'zaměstnanců častěji uvažuje o odchodu, když je jejich šéf dlouhodobě ve stresu'},
    info:['Mavie Stress Study 2026, 394 pracujících v Česku ve věku 18 až 64 let.',
          '* Masarykova univerzita (Tachezyová, Špalková, Hlávka, 2025)']
  };

  var NB = ' ', C = 263.89;
  var nb = function(t){ return t.replace(/(^| )([vzsaoikuVZSAOIKU]) /g, '$1$2'+NB).replace(/(\d) (let|%|mld\.|Kč)/g, '$1'+NB+'$2').replace(/(mld\.) (Kč)/g, '$1'+NB+'$2'); };
  var val = function(n, unit, cls, cd, ucls){ return '<span class="val'+(cls?' '+cls:'')+'"'+(cd!=null?' data-cd="'+cd+'"':'')+'><span data-c="'+n+'">'+n+'</span><span class="u'+(ucls?' '+ucls:'')+'">'+(unit||'%')+'</span></span>'; };
  var grid = root.querySelector('[data-grid]');
  var st = function(v, t){ return '<div class="st">'+v+'<p class="st__t">'+nb(t)+'</p></div>'; };

  /* shrnutí pro čtečky (vizuální části mají aria-hidden) */
  var pc = function(n, t){ return n+' procent '+t+'.'; };
  root.querySelector('[data-sr]').textContent = [
    'Mavie Stress Study 2026.',
    pc(D.str.v, D.str.t),
    D.dop.items.map(function(r){ return pc(r[0], r[1]); }).join(' '),
    D.kc.v+' miliard korun '+D.kc.t.replace('*', '')+'.',
    pc(D.pom.v1, D.pom.t1),
    'Tři čtvrtiny '+D.pom.t2+'.',
    pc(D.sef.v, D.sef.t),
    'Zdroj: '+D.info[0]+' Údaj o pracovní neschopnosti: '+D.info[1].replace('* ', '')+'.'
  ].join(' ');
  root.querySelector('[data-pbody]').innerHTML = D.info.map(function(t){ return '<p>'+nb(t)+'</p>'; }).join('');

  function sec(key, inner){
    var s = document.createElement('section');
    s.className = 'vs vs--'+key; s.dataset.sec = key; s.setAttribute('aria-hidden', 'true');
    s.innerHTML = inner;
    grid.appendChild(s); return s;
  }
  function people(v, d0, step, cls){
    var h = '';
    for(var k=0; k<10; k++){
      var f = Math.max(0, Math.min(1, v/10 - k));                     // 61 % = 6 celých a 0,1 sedmého
      h += '<span class="pp"><svg class="pp__off"><use href="#mv-person"/></svg><svg class="pp__on" style="--cut:'+((1-f)*100).toFixed(1)+'%;--d:'+(d0 + k*step)+'ms"><use href="#mv-person"/></svg></span>';
    }
    return '<span class="ppl'+(cls?' '+cls:'')+'">'+h+'</span>';
  }

  /* 1 stres */
  sec('str', st(val(D.str.v, '%', 'hero'), D.str.t)
    + '<div class="vs__viz str__p">'+people(D.str.v, 0, 60)+'<span class="lgd">'+D.str.lgd.replace(/ /g, NB)+'</span></div>');

  /* 2 prstence */
  sec('dop', '<div class="vs__viz"><div class="rgs">' + D.dop.items.map(function(r, i){
    return '<div class="rg"><div class="rg__ring"><svg viewBox="0 0 100 100"><circle class="rg__tr" cx="50" cy="50" r="42"/>'
      + '<circle class="rg__v" cx="50" cy="50" r="42" style="--o:'+(C*(1 - r[0]/100)).toFixed(2)+';--d:'+(i*250)+'ms"/></svg>'+val(r[0], '%', '', i*250)+'</div>'
      + '<p class="rg__t">'+nb(r[1])+'</p></div>';
  }).join('') + '</div></div>');

  /* 3 náklady */
  sec('kc', st(val(D.kc.v, D.kc.u.replace(' ', NB), 'hero'), D.kc.t) + '<p class="kc__fn">'+nb(D.kc.fn)+'</p>');

  /* 4 pomoc – dvě části, každá se rozehraje sama */
  var BUB = 'M6 1h20a5 5 0 0 1 5 5v11a5 5 0 0 1-5 5H14l-6.5 5.2V22H6a5 5 0 0 1-5-5V6a5 5 0 0 1 5-5z';
  var bubs = '';
  for(var b=0; b<D.pom.of; b++){
    var talk = b >= D.pom.n;
    bubs += '<svg viewBox="0 0 32 28" style="--d:'+(b*120)+'ms"><path class="'+(talk?'bub__talk':'bub__mute')+'" d="'+BUB+'"/>'
      + (talk ? '<circle class="bub__dot" cx="10" cy="11.5" r="1.9"/><circle class="bub__dot" cx="16" cy="11.5" r="1.9"/><circle class="bub__dot" cx="22" cy="11.5" r="1.9"/>' : '') + '</svg>';
  }
  var sPom = sec('pom',
      '<div class="pom__i" data-sub>'+st(val(D.pom.v1, '%', 'hero'), D.pom.t1)+'<div class="vs__viz">'+people(D.pom.v1, 200, 0, 'ppl--fit')+'</div></div>'
    + '<div class="pom__i" data-sub>'+st(val(D.pom.n, '/'+D.pom.of, 'hero', null, 'u--frac'), D.pom.t2)+'<div class="vs__viz"><span class="bub">'+bubs+'</span></div></div>');
  sPom.classList.add('is-on');   // karta sama nenastupuje, nastupují její dvě části

  /* 5 šéf */
  sec('sef', st(val(D.sef.v, '%', 'hero'), D.sef.t));

  /* ===== pomocníci ===== */
  var all = [].slice.call(grid.children);
  var secs = all.filter(function(s){ return s !== sPom; });
  var subs = [].slice.call(sPom.querySelectorAll('[data-sub]'));
  var ease = function(k){ return 1 - Math.pow(1-k, 3); };
  function tween(dur, delay, fn, done){
    var t0 = performance.now() + delay;
    (function f(t){ var k = (t - t0)/dur; if(k < 0){ requestAnimationFrame(f); return; } k = Math.min(1, k); fn(k); if(k < 1) requestAnimationFrame(f); else if(done) done(); })(performance.now());
  }
  function counts(scope, play){
    [].forEach.call(scope.querySelectorAll('[data-c]'), function(el){
      var n = +el.dataset.c, host = el.parentNode, delay = +(host.dataset.cd || 0);
      if(!play){ el.textContent = n; host.classList.remove('is-count'); return; }
      host.classList.add('is-count'); el.textContent = '0';
      tween(n < 10 ? 600 : 900, delay + 150, function(k){ el.textContent = Math.round(n*ease(k)); }, function(){ host.classList.remove('is-count'); });
    });
  }
  function bindTap(el, fn){   // pointerdown kvůli mobilu, click jen pro čtečky, klávesy zvlášť
    var last = 0;
    el.addEventListener('pointerdown', function(e){ if(e.button > 0) return; e.preventDefault(); last = Date.now(); fn(e); });
    el.addEventListener('click', function(e){ e.preventDefault(); if(Date.now() - last > 600) fn(e); });
    el.addEventListener('keydown', function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); last = Date.now(); fn(e); } });
  }

  /* ===== panel (i) ===== */
  var info = root.querySelector('[data-info]'), panel = root.querySelector('[data-panel]'), closeBtn = root.querySelector('[data-close]');
  function openP(){ panel.hidden = false; info.setAttribute('aria-expanded', 'true'); closeBtn.focus({preventScroll:true}); }
  function closeP(){ if(panel.hidden) return; panel.hidden = true; info.setAttribute('aria-expanded', 'false'); info.focus({preventScroll:true}); }
  bindTap(info, function(){ panel.hidden ? openP() : closeP(); });
  bindTap(closeBtn, closeP);
  panel.addEventListener('pointerdown', function(e){ if(e.target === panel) closeP(); });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape') closeP();
    if(e.key === 'Tab' && !panel.hidden){ e.preventDefault(); closeBtn.focus(); }   // v otevřeném panelu je jediný ovládací prvek
  });

  /* ===== vyplnění rámu ===== */
  function over(){   // měří se rozložení kapitol vůči mřížce, ne scrollHeight
    var gb = grid.getBoundingClientRect().bottom, mx = 0;
    all.forEach(function(s){ mx = Math.max(mx, s.getBoundingClientRect().bottom); });
    return mx > gb + 1;
  }
  function fit(){
    var sc = 1; root.style.setProperty('--sc', 1);
    for(var k=0; k<18 && over() && sc > .66; k++){ sc *= .95; root.style.setProperty('--sc', sc.toFixed(3)); }
  }
  var rt;
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  if(window.ResizeObserver) new ResizeObserver(function(){ clearTimeout(rt); rt = setTimeout(fit, 90); }).observe(root);
  fit();

  /* ===== nástup po kapitolách ===== */
  function play(s, anim){
    if(s.classList.contains('is-on')) return;
    s.classList.add('is-on');
    counts(s, anim);
  }
  var targets = secs.concat(subs);
  if(!ANIM){ targets.forEach(function(s){ play(s, false); }); }
  else {
    var alive = false;
    var io = new IntersectionObserver(function(en){
      alive = true;
      en.forEach(function(x){ if(x.isIntersecting){ io.unobserve(x.target); play(x.target, true); } });
    }, {threshold:.45});
    targets.forEach(function(s){ io.observe(s); });
    setTimeout(function(){ if(!alive) targets.forEach(function(s){ play(s, false); }); }, 6000);   // záloha pro nefunkční IO
  }
  if(/[?&]info\b/.test(Q)) openP();
})();
</script>
</body>
</html>
