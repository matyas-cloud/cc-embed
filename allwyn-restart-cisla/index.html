<!-- ============================================================
     TIPUJ ČÍSLA (TRYCHTÝŘ) — speciál Allwyn „Restart po úrazu nebo vážné nemoci“ (ParaRestart)
     ============================================================
     Umístění v repu:  cc-embed/allwyn-restart-cisla/index.html
     Vložení:          komponenta Iframe ve speciálu, celý tag <iframe src="…" title="…">
     Místo v textu:    AI INTERAKTIVNÍ PRVEK „tipuj čísla“ (Blok 1, za „…s realitou všedního dne.“)
     Formát:           svislý trychtýř lidí (logaritmická osa 10–100 000, dole jeden člověk, nahoře tisíce).
                       Čtenář přetáhne (nebo klepne na štítek a pak do trychtýře) tři barevné štítky,
                       při tažení vidí u štítku číslo, na které míří; štítek obarví svou hladinu a z přihrádky
                       zmizí. V prázdném trychtýři je čárkované pole, kam štítek patří. „Vyhodnotit“ štítky
                       otočí a přesune na skutečná čísla (u netrefených zůstane čárkovaná značka tipu): zelený rub = tip se liší
                       nejvýš o 10 % (CFG.tolerance), červený rub = o kolik byl tip vyšší nebo nižší.
                       Zdroje pod „i“.
     Rám:              na výšku nadpis / trychtýř / přihrádka / tlačítko (výška přihrádky a nápovědy se
                       rezervuje, aby trychtýř neskákal). Na šířku je nadpis, nápověda, přihrádka a tlačítko
                       v jednom svisle vystředěném bloku vlevo, široký trychtýř přes celou výšku vpravo
                       a položené štítky se přimykají k jeho stěně. Zmenšovací smyčka --sc; šířka prvku je
                       nejvýš 1,5násobek výšky (při otevření mimo rám).
     Texty a čísla:    objekt CFG ve skriptu. value:null = číslo chybí (štítek ukáže „Skutečné číslo doplníme.“).
     Data:             přibližně 18 500 lidí žije v Česku s poraněním míchy (Česká asociace paraplegiků,
                       czepa.cz/projekt-prace, bez uvedeného roku), kolem 300 nových poranění míchy ročně
                       (Centrum Paraple), kolem 5 300 registrovaných sportovců s handicapem (Český
                       paralympijský výbor).
     Barvy:            Allwyn – černá #14181a, sytá tyrkysová #0f9e8d, tyrkysová #27e2cc.
     Fonty:            sdílený Poppins z repa (../fonts/), neblokující, přeměření na document.fonts.ready
     Pohyb:            nápověda – průsvitná kopie prvního štítku doletí do trychtýře (nejvýš 3×, jen dokud
                       čtenář na nic nesáhl); po vyhodnocení otočení štítků a přesun hladin (0,6 s);
                       reduced-motion bez pohybu.
     Historie:         10. 11. 2026 první ostrá verze podle mockupu v7
                       10. 11. 2026 desktop: ovládání vlevo, širší trychtýř; nápověda pohybem; doplněno
                       číslo 18 500 (CZEPA); vyhodnocení otočením štítku, zelená do 10 %, jinak červená
                       s rozdílem; z textů pryč vlnovky a tečky mezi údaji
                       10. 11. 2026 srozumitelnost: nadpis jako pokyn, kratší nápověda, jednotka „lidí“ na
                       koncích osy a u tipu, čárkované pole „sem pusťte štítek“ v prázdném trychtýři,
                       počítadlo zbývajících štítků, po vyhodnocení čárkovaná značka původního tipu
     ============================================================ -->

<!-- 1) sdílený základ .cc-embed (verbatim z assets/cc-embed-base.html) -->
<style>
.cc-embed{
  /* --- barvy --- */
  --cc-blue:#087eeb;      --cc-blue-dark:#0668c2;
  --cc-red:#d40b3e;
  --cc-ink:#222;          --cc-ink-soft:#3c3c3c;
  --cc-muted:#84929b;
  --cc-line:#ececec;
  --cc-surface:#f8f9fa;   --cc-white:#fff;
  --cc-ok:#29cc6a;        --cc-warn:#f58a18;
  /* --- shape --- */
  --cc-radius:15px;       --cc-radius-sm:10px;
  --cc-pad:clamp(16px,3vw,26px);
  --cc-gap:12px;
  /* --- font --- */
  --cc-serif:Georgia,Times,"Times New Roman",serif;
  --cc-display:Poppins,-apple-system,"Segoe UI",sans-serif;
  --cc-ui:Inter,-apple-system,"Segoe UI",sans-serif;
  display:block;
  margin:2.4rem 0;
  padding:var(--cc-pad);
  background:var(--cc-surface);
  border:1px solid var(--cc-line);
  border-radius:var(--cc-radius);
  color:var(--cc-ink);
  font:18px/1.66667 var(--cc-serif);
  -webkit-tap-highlight-color:transparent;
}
.cc-embed *{box-sizing:border-box;}
.cc-embed--flush{padding:0;overflow:hidden;}      /* prvek do krajů (fotka, mapa) */
.cc-embed--bare{background:none;border:0;padding:0;} /* bez rámečku */
/* --- typo --- */
.cc-embed .cc-kicker{margin:0 0 6px;font:700 12px/1.25 var(--cc-ui);
  letter-spacing:.08em;text-transform:uppercase;color:var(--cc-red);}
.cc-embed h2,.cc-embed h3,.cc-embed h4,.cc-embed .cc-title{
  margin:0 0 8px;font-family:var(--cc-display);font-weight:700;line-height:1.25;color:#000;}
.cc-embed h3,.cc-embed .cc-title{font-size:clamp(20px,3.4vw,26px);}
.cc-embed h4{font-size:19px;}
.cc-embed p{margin:0 0 10px;}
.cc-embed .cc-lede{font-size:clamp(16px,2.2vw,18px);line-height:1.6;color:var(--cc-ink-soft);}
.cc-embed .cc-note{margin:12px 0 0;font:400 13px/1.5 var(--cc-ui);color:var(--cc-muted);}
.cc-embed .cc-label{font:500 12px/1.2 var(--cc-ui);color:var(--cc-muted);
  letter-spacing:.02em;text-transform:uppercase;}
.cc-embed .cc-num{font-family:var(--cc-display);font-weight:700;
  font-size:clamp(22px,4vw,32px);color:var(--cc-blue);font-variant-numeric:tabular-nums;}
.cc-embed a{color:var(--cc-blue);}
/* --- UI --- */
.cc-embed .cc-btn{
  display:inline-block;padding:10px 20px;
  border:1px solid var(--cc-blue);border-radius:var(--cc-radius);
  background:var(--cc-blue);color:#fff;text-decoration:none;
  font:700 18px/26px var(--cc-display);cursor:pointer;
  transition:background .18s,color .18s;}
.cc-embed .cc-btn:hover{background:var(--cc-blue-dark);border-color:var(--cc-blue-dark);}
.cc-embed .cc-btn--ghost{background:#fff;color:var(--cc-blue);}
.cc-embed .cc-btn--ghost:hover{background:var(--cc-blue);color:#fff;}
.cc-embed .cc-btn--sm{padding:7px 14px;font-size:15px;line-height:22px;}
.cc-embed .cc-btn[aria-pressed="true"]{background:#fff;color:var(--cc-blue);}
.cc-embed .cc-card{background:var(--cc-white);border:1px solid var(--cc-line);
  border-radius:var(--cc-radius-sm);padding:14px 16px;}
.cc-embed .cc-badge{display:inline-block;padding:3px 10px;border-radius:999px;
  background:var(--cc-blue);color:#fff;font:700 12px/18px var(--cc-ui);}
.cc-embed .cc-badge--red{background:var(--cc-red);}
.cc-embed .cc-badge--soft{background:#eaf3fd;color:var(--cc-blue-dark);}
.cc-embed input,.cc-embed select,.cc-embed textarea{
  font:400 16px/24px var(--cc-ui);color:var(--cc-ink);
  padding:9px 12px;background:#fff;border:1px solid var(--cc-line);
  border-radius:var(--cc-radius-sm);}
.cc-embed input[type=range]{padding:0;border:0;background:none;accent-color:var(--cc-blue);width:100%;}
.cc-embed :focus-visible{outline:3px solid var(--cc-blue);outline-offset:2px;}
.cc-embed table{width:100%;border-collapse:collapse;font:400 15px/1.4 var(--cc-ui);}
.cc-embed th{text-align:left;font-weight:700;color:var(--cc-muted);
  text-transform:uppercase;font-size:12px;letter-spacing:.05em;padding:8px 10px;}
.cc-embed td{padding:10px;border-top:1px solid var(--cc-line);}
.cc-embed img,.cc-embed svg,.cc-embed canvas{max-width:100%;}
.cc-embed .cc-grid{display:grid;gap:var(--cc-gap);
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));}
.cc-embed .cc-row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--cc-gap);}
.cc-embed .cc-sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}
@media (prefers-reduced-motion:reduce){.cc-embed *{transition:none!important;animation:none!important;}}
</style>

<!-- 2) prvek -->
<div class="cc-embed cc-embed--bare cc-rc" data-cc-rc>
  <p class="cc-sr" data-sr></p>
  <div class="cc-rc__head" data-head>
    <h3 class="cc-rc__title" data-title></h3>
    <button type="button" class="cc-rc__info" data-info aria-expanded="false" aria-controls="cc-rc-src" aria-label="Zdroje čísel">i</button>

    <p class="cc-rc__srclabel">Zdroje</p>
    <div class="cc-rc__srcbody" data-srcbody></div>
  </div>
</div>

<style>
.cc-embed.cc-rc{
  --ink:#14181a; --tq:#27e2cc; --tq-ink:#07302c; --muted:#6b6f70; --line:#e4e4e1; --ok:#15803d; --no:#c8322b; --sc:1;
  box-sizing:border-box;position:relative;height:100vh;max-width:150vh;margin:0 auto;padding:12px 6px 10px;overflow:hidden;
  display:flex;flex-direction:column;gap:8px;
  font-family:var(--cc-display);color:var(--ink);-webkit-font-smoothing:antialiased;
}
.cc-rc .cc-rc__head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.cc-rc .cc-rc__title{margin:0;font:700 max(17px,calc(20px*var(--sc)))/1.25 var(--cc-display);color:var(--ink);text-wrap:balance;}
.cc-rc .cc-rc__info{flex:0 0 26px;width:26px;height:26px;margin-top:1px;padding:0;border:1.5px solid #b9bbb8;border-radius:50%;background:#fff;
  color:var(--muted);font:700 12px/1 var(--cc-display);cursor:pointer;position:relative;touch-action:manipulation;}
.cc-rc .cc-rc__info::after{content:"";position:absolute;inset:-8px;border-radius:50%;}
.cc-rc .cc-rc__info[aria-expanded="true"],.cc-rc .cc-rc__info:hover{border-color:var(--ink);color:var(--ink);}
.cc-rc .cc-rc__stage{flex:1 1 auto;min-height:0;position:relative;touch-action:none;user-select:none;-webkit-user-select:none;}
.cc-rc .cc-rc__svg{position:absolute;inset:0;display:block;width:100%;height:100%;max-width:none;}
.cc-rc .cc-rc__zone{position:absolute;top:0;bottom:0;cursor:crosshair;outline:none;}
.cc-rc .cc-rc__mk{position:absolute;height:3px;border-radius:2px;pointer-events:none;transition:top .6s cubic-bezier(.3,.8,.3,1),left .6s cubic-bezier(.3,.8,.3,1),width .6s cubic-bezier(.3,.8,.3,1),background-color .3s;}
.cc-rc .cc-rc__cn{position:absolute;height:2px;pointer-events:none;transform-origin:0 50%;transition:top .6s cubic-bezier(.3,.8,.3,1),left .6s cubic-bezier(.3,.8,.3,1),width .6s,transform .6s,background-color .3s;}
/* štítek v trychtýři: líc = tip, rub (po vyhodnocení) = výsledek */
.cc-rc .cc-rc__tag{position:absolute;box-sizing:border-box;padding:6px 9px;border-radius:9px;cursor:grab;touch-action:none;
  font:600 max(10.5px,calc(12px*var(--sc)*var(--ts,1)))/1.25 var(--cc-display);box-shadow:0 2px 6px rgba(20,24,26,.14);outline:none;
  transition:top .6s cubic-bezier(.3,.8,.3,1),left .6s cubic-bezier(.3,.8,.3,1),transform .22s ease-in;}
.cc-rc .cc-rc__tag small{display:block;margin-top:2px;font-weight:500;font-size:max(10px,calc(11px*var(--sc)*var(--ts,1)));opacity:.92;}
.cc-rc .cc-rc__tag small b,.cc-rc .ghost small b{font-weight:700;font-size:1.12em;}
.cc-rc .cc-rc__tag.is-turn{transform:perspective(500px) rotateX(90deg);}
.cc-rc .cc-rc__tag.is-back{cursor:default;color:#fff;transition:top .6s cubic-bezier(.3,.8,.3,1),left .6s cubic-bezier(.3,.8,.3,1),transform .32s cubic-bezier(.2,.8,.3,1) var(--d,0ms);}
.cc-rc .cc-rc__tag.is-hit{background:var(--ok);}
.cc-rc .cc-rc__tag.is-miss{background:var(--no);}
.cc-rc .cc-rc__tag.is-none{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink);}
.cc-rc .cc-rc__rl{display:flex;align-items:flex-start;gap:6px;font-weight:600;}
.cc-rc .cc-rc__rl svg{flex:0 0 auto;width:1.15em;height:1.15em;margin-top:.05em;}
.cc-rc .cc-rc__rv{display:block;margin:3px 0 1px;font:700 max(17px,calc(22px*var(--sc)*var(--ts,1)))/1.1 var(--cc-display);font-variant-numeric:tabular-nums;}
.cc-rc .cc-rc__preview{position:absolute;z-index:5;height:3px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--ink) 0 6px,transparent 6px 10px);pointer-events:none;}
/* při ovládání klávesnicí nese čárkovaná hladina i číslo, na které míří */
.cc-rc.is-kbd .cc-rc__preview::after{content:attr(data-v);position:absolute;left:100%;top:-10px;margin-left:6px;padding:1px 7px;border-radius:6px;background:var(--ink);color:#fff;font:700 11px/1.6 var(--cc-display);white-space:nowrap;}
.cc-rc .cc-rc__side{display:flex;flex-direction:column;gap:8px;}
.cc-rc .cc-rc__hint{margin:0;font:500 max(12px,calc(12.5px*var(--sc)))/1.35 var(--cc-display);color:var(--muted);}
.cc-rc .cc-rc__tray{display:flex;flex-direction:column;gap:6px;}
.cc-rc .cc-rc__chip{display:block;width:100%;margin:0;padding:9px 12px;border:0;border-radius:9px;cursor:grab;text-align:left;
  font:600 max(12px,calc(13px*var(--sc)))/1.25 var(--cc-display);box-shadow:0 2px 6px rgba(20,24,26,.14);touch-action:none;}
.cc-rc .cc-rc__chip.is-sel{outline:3px solid var(--ink);outline-offset:2px;}
.cc-rc .cc-rc__chip.is-gone{display:none;}
.cc-rc .cc-rc__foot{display:flex;justify-content:flex-end;}
.cc-rc .cc-rc__go{margin:0;padding:10px 22px;border:0;border-radius:32px;background:var(--ink);color:#fff;font:600 max(13px,calc(14px*var(--sc)))/1.2 var(--cc-display);cursor:pointer;touch-action:manipulation;}
.cc-rc .cc-rc__go[disabled]{opacity:.35;cursor:default;}
.cc-rc .cc-rc__go:focus,.cc-rc .cc-rc__chip:focus,.cc-rc .cc-rc__info:focus{outline:none;}
.cc-rc.is-kbd .cc-rc__go:focus-visible,.cc-rc.is-kbd .cc-rc__chip:focus-visible,.cc-rc.is-kbd .cc-rc__info:focus-visible,.cc-rc.is-kbd .cc-rc__tag:focus-visible,.cc-rc.is-kbd .cc-rc__close:focus-visible{outline:3px solid var(--ink);outline-offset:2px;}
.cc-rc.is-kbd .cc-rc__zone:focus-visible{box-shadow:inset 0 0 0 2px var(--ink);border-radius:8px;}
/* tažený štítek jede vpravo od ukazatele, aby bylo vidět místo v trychtýři */
.cc-rc .ghost{position:fixed;left:0;top:0;z-index:20;pointer-events:none;opacity:.95;transform:translateY(-50%) rotate(-1.5deg);box-shadow:0 10px 22px rgba(0,0,0,.25);margin:0;transition:none;}
.cc-rc .ghost small{display:block;margin-top:2px;font-weight:500;font-size:11px;opacity:.92;}
/* nápověda pohybem: průsvitná kopie štítku jednou doletí do trychtýře */
.cc-rc .cc-rc__demo{position:absolute;z-index:6;margin:0;pointer-events:none;opacity:0;box-shadow:0 8px 18px rgba(0,0,0,.2);}
.cc-rc .tk{font:600 9.5px var(--cc-display);fill:var(--muted);}
.cc-rc .tk.end{font-weight:700;fill:var(--ink);}
/* prázdný trychtýř: čárkované pole, kam štítek patří (po prvním štítku zmizí) */
.cc-rc .drop{font:600 11.5px var(--cc-display);fill:var(--ink);}
/* po vyhodnocení: čárkovaná značka původního tipu u netrefených štítků */
.cc-rc .cc-rc__was{position:absolute;height:0;border-top:2px dashed var(--ink);opacity:.6;pointer-events:none;}
.cc-rc .cc-rc__was span{position:absolute;right:100%;top:-8px;margin-right:6px;padding:0 4px;border-radius:4px;background:#fff;white-space:nowrap;font:600 10px/1.5 var(--cc-display);color:var(--ink);}
.cc-rc .cc-rc__was.is-up span{top:-19px;}
.cc-rc .cc-rc__was.is-in span{right:auto;left:50%;margin:0;transform:translateX(-50%);}
/* zdroje: panel přes celý prvek (v pevném rámu nic neroste) */
.cc-rc .cc-rc__src{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;padding:18px 18px 16px;background:var(--ink);color:#fff;border-radius:14px;}
.cc-rc .cc-rc__src[hidden]{display:none;}
.cc-rc .cc-rc__close:focus{outline:none;}
.cc-rc .cc-rc__close{position:absolute;top:10px;right:10px;width:34px;height:34px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;font:400 22px/1 var(--cc-display);cursor:pointer;}
.cc-rc .cc-rc__src .cc-rc__srclabel{margin:0 0 10px;font:600 11px/1.2 var(--cc-display);letter-spacing:.08em;text-transform:uppercase;color:var(--tq);}
.cc-rc .cc-rc__srcbody{flex:1 1 auto;min-height:0;overflow-y:auto;padding-right:30px;}
.cc-rc .cc-rc__srcbody p{margin:0 0 12px;font:400 13.5px/1.45 var(--cc-display);color:#d9dcda;}
.cc-rc .cc-rc__srcbody b{color:#fff;font-weight:600;}
.cc-rc .cc-rc__srcbody a{color:var(--tq);}
/* na šířku: nadpis, nápověda, štítky a tlačítko v jednom bloku vlevo, široký trychtýř přes celou výšku vpravo */
@media (min-aspect-ratio:1/1){
  .cc-embed.cc-rc{display:grid;grid-template-columns:minmax(0,.68fr) minmax(0,1.32fr);grid-template-rows:auto minmax(0,1fr);column-gap:28px;row-gap:12px;padding:16px 14px 14px;}
  .cc-rc .cc-rc__head{grid-column:1;grid-row:1;display:block;}
  .cc-rc .cc-rc__info{position:absolute;top:14px;right:14px;z-index:7;margin:0;}
  .cc-rc .cc-rc__title{font-size:max(19px,calc(27px*var(--sc)));}
  .cc-rc .cc-rc__stage{grid-column:2;grid-row:1/3;}
  .cc-rc .cc-rc__side{grid-column:1;grid-row:2;align-self:start;justify-content:flex-start;gap:12px;}
  .cc-rc .cc-rc__tray{gap:8px;}
  .cc-rc .cc-rc__foot{justify-content:flex-start;margin-top:4px;}
  .cc-rc .cc-rc__hint{font-size:max(12px,calc(14px*var(--sc)));line-height:1.45;}
  .cc-rc .cc-rc__chip{padding:12px 14px;font-size:max(12px,calc(14px*var(--sc)));}
  .cc-rc .cc-rc__go{padding:12px 26px;font-size:max(13px,calc(15px*var(--sc)));}
  .cc-rc .cc-rc__tag{font-size:max(10.5px,calc(12.5px*var(--sc)*var(--ts,1)));padding:8px 11px;}
  .cc-rc .cc-rc__tag small{font-size:max(10px,calc(11.5px*var(--sc)*var(--ts,1)));}
  .cc-rc .tk{font-size:10.5px;}
  .cc-rc .drop{font-size:12.5px;}
}
@media (prefers-reduced-motion:reduce){.cc-rc .cc-rc__mk,.cc-rc .cc-rc__cn,.cc-rc .cc-rc__tag,.cc-rc .cc-rc__tag.is-back{transition:none;}}
</style>

<script>
/* =====================================================================
   CFG – texty a čísla prvku. Měň jen hodnoty.
   facts: štítky. text = co je na štítku, value = skutečné číslo
          (null = zatím chybí, štítek po otočení ukáže resUnknown),
          color / ink = barva štítku a písma na něm.
   tolerance: o kolik se tip smí lišit, aby byl zelený (0.10 = 10 %).
   unit: jednotka u konců osy; dropHere: text v prázdném trychtýři;
   wasTip: popisek čárkované značky původního tipu po vyhodnocení.
   Texty po otočení štítku: {g} = tip, {d} = rozdíl.
   Typografie: české uvozovky „…“, pomlčka –, nedělitelná mezera  .
   ===================================================================== */
var CFG = {
  title: 'Tipněte si, kolik je to lidí',
  hint: 'Chytněte štítek a pusťte ho v trychtýři tak vysoko, kolik lidí tipujete.',
  hintSome: 'Zbývá umístit {n}. Položený štítek můžete ještě posunout.',
  hintLeft: ['poslední štítek', '{n} štítky'],
  hintDone: 'Všechny štítky jsou v trychtýři. Můžete je ještě posunout, nebo vyhodnotit.',
  hintResult: 'Štítky se otočily a přesunuly na skutečná čísla. Zelený je tip, který se liší nejvýš o 10 %.',
  dropHere: 'sem pusťte štítek',
  unit: 'lidí',
  btnCheck: 'Vyhodnotit',
  btnAgain: 'Zkusit znovu',
  axis: { min: 10, max: 100000 },
  tolerance: 0.10,
  facts: [
    { id: 'zije',  text: 'Žijí v Česku s poraněním míchy',          value: 18500, color: '#14181a', ink: '#ffffff' },
    { id: 'sport', text: 'Registrovaně sportují (všechny handicapy)',          value: 5300,  color: '#0f9e8d', ink: '#ffffff' },
    { id: 'novi',  text: 'Poraní si míchu každý rok',                          value: 300,   color: '#27e2cc', ink: '#07302c' }
  ],
  tagTip:  'váš tip {g} lidí',
  wasTip:  'váš tip {g}',
  resHit:  'Trefa. Váš tip byl {g}.',
  resMore: 'Váš tip {g} byl o {d} vyšší.',
  resLess: 'Váš tip {g} byl o {d} nižší.',
  resNone: 'Bez tipu.',
  resUnknown: 'Skutečné číslo doplníme.',
  sources: [
    '<b>Lidé s poraněním míchy:</b> Česká asociace paraplegiků (CZEPA), přibližně 18 500 lidí.',
    '<b>Nové případy:</b> Centrum Paraple, kolem 300 lidí ročně, zhruba polovina po úrazu.',
    '<b>Sportovci s handicapem:</b> Český paralympijský výbor, kolem 5 300 registrovaných sportovců.'
  ],
  /* text pro odečítače obrazovky – při změně čísel uprav i tady */
  sr: 'Tipovačka o lidech s poraněním míchy v Česku. Osa trychtýře jde od 10 do 100 000 lidí. S poraněním míchy tu žije přibližně 18 500 lidí. Každý rok si míchu poraní kolem 300 lidí. Registrovaně sportuje kolem 5 300 lidí s handicapem.'
};
</script>

<script>
(function(){
  var root = document.querySelector('[data-cc-rc]');
  if(!root || root.dataset.ccInit) return; root.dataset.ccInit = '1';
  var stage = root.querySelector('[data-stage]'), svg = root.querySelector('[data-svg]'), zone = root.querySelector('[data-zone]');
  var head = root.querySelector('[data-head]'), side = root.querySelector('[data-side]');
  var tray = root.querySelector('[data-tray]'), hint = root.querySelector('[data-hint]'), go = root.querySelector('[data-go]');
  var preview = root.querySelector('[data-preview]');
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var LO = Math.log10(CFG.axis.min), HI = Math.log10(CFG.axis.max);
  var DROP_P = .62;   /* výška nápovědného pole a cíl nápovědy pohybem */
  var G = {}, sel = null, done = false, busy = false, seq = 0, kbP = 0.5, touched = false;
  var F = CFG.facts.map(function(f){ return {f:f, p:null, tip:null, chip:null, mk:null, cn:null, tag:null, was:null, wasP:null}; });
  var ICON = {
    hit:  '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="8" fill="#fff"/><path d="M4.4 8.3l2.4 2.4 4.8-5" fill="none" stroke="#15803d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    miss: '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="8" fill="#fff"/><path d="M5.2 5.2l5.6 5.6M10.8 5.2l-5.6 5.6" fill="none" stroke="#c8322b" stroke-width="2" stroke-linecap="round"/></svg>'
  };

  root.querySelector('[data-title]').textContent = CFG.title;
  root.querySelector('[data-sr]').textContent = CFG.sr;
  root.querySelector('[data-srcbody]').innerHTML = CFG.sources.map(function(s){ return '<p>'+s+'</p>'; }).join('');

  /* ---------- čísla ---------- */
  function cz(v){ return Math.round(v).toLocaleString('cs-CZ'); }
  function val(p){ return Math.pow(10, LO + p*(HI-LO)); }
  function pos(v){ return (Math.log10(v)-LO)/(HI-LO); }
  function roundTip(v){ var s = v<100?10:v<1000?50:v<10000?500:5000; return Math.max(s, Math.round(v/s)*s); }
  function tipAt(p){ return roundTip(val(Math.max(0, Math.min(1, p)))); }
  function fill(s, o){ return s.replace(/\{(\w)\}/g, function(m,k){ return o[k]; }); }
  /* text tipu na štítku: číslo s jednotkou tučně */
  function tipHTML(g){ return fill(CFG.tagTip, {g:'\u0001'+cz(g)}).replace(/\u0001(.*)$/, '<b>$1</b>'); }
  function tipText(g){ return fill(CFG.tagTip, {g:cz(g)}); }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  function land(){ return root.clientWidth > root.clientHeight; }

  /* ---------- geometrie trychtýře z rozměru plochy ---------- */
  function geom(){
    var w = stage.clientWidth, h = stage.clientHeight, L = land();
    /* na šířku: štítky mají pevnou šířku a trychtýř si bere zbytek (jen u tipů úplně nahoře se štítek dotkne jeho hrany) */
    var lab = L ? 78 : 66, tw = L ? Math.max(140, Math.min(210, w*.31)) : 0;
    var fw = L ? Math.max(120, Math.min(w - lab - tw - 2, 420)) : Math.min(w*.37, 250), top = 8, bot = h-8;
    G = {w:w, h:h, L:L, T:top, B:bot, FL:lab, FR:lab+fw, BL:lab+fw/2-8, BR:lab+fw/2+8, TX:lab+fw+16};
    G.tw = L ? tw : Math.max(110, w - G.TX);
  }
  function Y(p){ return G.B - p*(G.B-G.T); }
  function P(y){ return Math.max(0, Math.min(1, (G.B-y)/(G.B-G.T))); }
  function xl(y){ return G.BL + (G.FL-G.BL)*(G.B-y)/(G.B-G.T); }
  function xr(y){ return G.BR + (G.FR-G.BR)*(G.B-y)/(G.B-G.T); }

  var MAN = '<circle cx="5" cy="3.2" r="3"/><rect x="1" y="7" width="8" height="13" rx="3.6"/>';
  function drawFunnel(){
    var s = '<defs><linearGradient id="cc-rc-fg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#f4f4f2"/><stop offset="1" stop-color="#d9f7f2"/></linearGradient></defs>';
    s += '<polygon points="'+G.FL+','+G.T+' '+G.FR+','+G.T+' '+G.BR+','+G.B+' '+G.BL+','+G.B+'" fill="url(#cc-rc-fg)" stroke="#14181a" stroke-width="1.5"/>';
    for(var y=G.B-22; y>G.T+4; y-=19){
      var cx = (xl(y+10)+xr(y+10))/2, wd = xr(y+10)-xl(y+10), n = Math.max(1, Math.floor((wd-6)/10)), x0 = cx - n*5;
      for(var i=0;i<n;i++) s += '<g transform="translate('+(x0+i*10+.5).toFixed(1)+','+y.toFixed(1)+') scale(.85)" fill="#14181a" opacity=".2">'+MAN+'</g>';
    }
    s += '<g transform="translate('+((G.BL+G.BR)/2-4.2).toFixed(1)+','+(G.B-21)+') scale(.85)" fill="#14181a" opacity=".55">'+MAN+'</g>';
    for(var e=Math.ceil(LO); e<=HI; e++){
      var yy = Y(pos(Math.pow(10,e)));
      s += '<line x1="'+(xl(yy)-5)+'" y1="'+yy+'" x2="'+xl(yy)+'" y2="'+yy+'" stroke="#14181a" stroke-width="1.5"/>';
      var endT = (e === Math.ceil(LO) || e === Math.floor(HI));   /* konce osy nesou jednotku */
      s += '<text class="tk'+(endT ? ' end' : '')+'" x="'+(xl(yy)-8)+'" y="'+(yy+3.5)+'" text-anchor="end">'+cz(Math.pow(10,e))+(endT ? '\u00a0'+CFG.unit : '')+'</text>';
    }
    if(!done && placedCount() === 0){
      /* na šířku je pole uvnitř trychtýře; v úzkém trychtýři na výšku čárkovaná hladina a pole vedle, kde bude štítek */
      var dy = Y(DROP_P), dl = xl(dy)+10, dr = xr(dy)-10, box = 'fill="#fff" fill-opacity=".9" stroke="#14181a" stroke-width="1.5" stroke-dasharray="5 4"';
      if(G.L && dr - dl >= 130){
        s += '<rect x="'+dl+'" y="'+(dy-15)+'" width="'+(dr-dl)+'" height="30" rx="8" '+box+'/>';
        s += '<text class="drop" x="'+((dl+dr)/2)+'" y="'+(dy+4)+'" text-anchor="middle">'+CFG.dropHere+'</text>';
      } else {
        var bx = xr(dy)+14, bw = Math.min(G.w - bx - 2, 150);
        s += '<line x1="'+xl(dy)+'" y1="'+dy+'" x2="'+bx+'" y2="'+dy+'" stroke="#14181a" stroke-width="2" stroke-dasharray="5 4"/>';
        s += '<rect x="'+bx+'" y="'+(dy-15)+'" width="'+bw+'" height="30" rx="8" '+box+'/>';
        s += '<text class="drop" x="'+(bx+bw/2)+'" y="'+(dy+4)+'" text-anchor="middle">'+CFG.dropHere+'</text>';
      }
    }
    svg.setAttribute('viewBox','0 0 '+G.w+' '+G.h); svg.innerHTML = s;
    zone.style.left = G.FL+'px'; zone.style.width = (G.FR-G.FL)+'px';
  }

  /* ---------- štítky ---------- */
  function chipEl(o, i){
    var b = document.createElement('button'); b.type = 'button'; b.className = 'cc-rc__chip';
    b.style.background = o.f.color; b.style.color = o.f.ink; b.textContent = o.f.text;
    b.setAttribute('aria-label', o.f.text+'. Přetáhněte do trychtýře, nebo stiskněte Enter a vyberte místo šipkami.');
    b.addEventListener('pointerdown', function(e){ startDrag(e, i, b, false); });
    b.addEventListener('keydown', function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); pick(i); zone.tabIndex = 0; zone.focus(); kbP = .5; showPreview(kbP); } });
    tray.appendChild(b); o.chip = b;
  }
  function pick(i){ sel = (sel === i ? null : i); F.forEach(function(o,j){ o.chip.classList.toggle('is-sel', j === sel); }); }
  function place(i, p){
    var o = F[i]; o.p = Math.max(0, Math.min(1, p)); o.tip = tipAt(o.p);
    if(!o.tag){
      o.mk = div('cc-rc__mk', o.f.color); o.cn = div('cc-rc__cn', o.f.color);
      o.tag = document.createElement('div'); o.tag.className = 'cc-rc__tag'; o.tag.tabIndex = 0;
      o.tag.style.background = o.f.color; o.tag.style.color = o.f.ink; stage.appendChild(o.tag);
      o.tag.addEventListener('pointerdown', function(e){ if(!done) startDrag(e, i, o.tag, true); });
      o.tag.addEventListener('keydown', function(e){
        if(done) return;
        if(e.key === 'ArrowUp' || e.key === 'ArrowDown'){ e.preventDefault(); place(i, o.p + (e.key === 'ArrowUp' ? .02 : -.02)); }
      });
      o.chip.classList.add('is-gone');
    }
    o.tag.setAttribute('aria-label', o.f.text+', '+tipText(o.tip));
    o.tag.innerHTML = esc(o.f.text)+'<small>'+tipHTML(o.tip)+'</small>';
    if(placedCount() === 1) drawFunnel();   /* první štítek: nápovědné pole zmizí */
    layout(); sync();
  }
  function div(cls, color){ var d = document.createElement('div'); d.className = cls; d.style.background = color; stage.appendChild(d); return d; }
  function layout(){
    var ts = 1, tw = G.tw, top0 = G.L ? 34 : 0; stage.style.setProperty('--ts', 1);
    for(var k=0;k<6;k++){ var tot = 0, n = 0; F.forEach(function(o){ if(o.tag){ o.tag.style.width = tw+'px'; tot += o.tag.offsetHeight + 6; n++; } });
      if(!n || tot <= G.h - top0) break; ts *= .92; stage.style.setProperty('--ts', ts.toFixed(3)); }
    var list = F.filter(function(o){ return o.tag; }).sort(function(a,b){ return b.p - a.p; });
    var last = top0 - 6;
    list.forEach(function(o){
      var y = Y(o.p);
      o.mk.style.left = xl(y)+'px'; o.mk.style.width = (xr(y)-xl(y))+'px'; o.mk.style.top = (y-1.5)+'px';
      o.tag.style.width = tw+'px';
      var th = o.tag.offsetHeight, ty = Math.max(y - th/2, last + 6, top0);
      o._ty = ty; o._th = th; last = ty + th;
    });
    /* když se štítky dole nevejdou, posuň sloupec nahoru (bez překryvu, nejvýš k hornímu okraji) */
    var over = last - G.h;
    if(over > 0){
      var lim = G.h;
      for(var k=list.length-1;k>=0;k--){ var o2 = list[k]; var nt = Math.min(o2._ty, lim - o2._th); o2._ty = nt; lim = nt - 6; }
      if(list.length && list[0]._ty < 0){ var gap = 0; list.forEach(function(o3){ o3._ty = Math.max(o3._ty, gap); gap = o3._ty + o3._th + 2; }); }
    }
    F.forEach(function(o){
      if(!o.was) return;
      var wy = Y(o.wasP), wl = xl(wy), ww = xr(wy) - wl, near = false;
      for(var e=Math.ceil(LO); e<=HI; e++){ if(Math.abs(Y(pos(Math.pow(10,e))) - wy) < 11) near = true; }
      o.was.style.left = wl+'px'; o.was.style.width = ww+'px'; o.was.style.top = wy+'px';
      o.was.classList.toggle('is-in', ww >= o.was.firstChild.offsetWidth + 16);   /* v širokém místě je popisek uvnitř trychtýře */
      o.was.classList.toggle('is-up', near && !o.was.classList.contains('is-in'));
    });
    list.forEach(function(o){
      /* na šířku se štítek přimyká ke stěně trychtýře, na výšku stojí ve sloupci */
      var x = G.L ? Math.min(xr(Math.max(G.T, o._ty)) + 12, G.w - tw) : G.TX;
      o._tx = x; o.tag.style.top = o._ty+'px'; o.tag.style.left = x+'px';
      var y = Y(o.p), x0 = xr(y), cy = o._ty + o._th/2, dx = x - x0, dy = cy - y;
      o.cn.style.left = x0+'px'; o.cn.style.top = (y-1)+'px'; o.cn.style.width = Math.max(0, Math.hypot(dx,dy))+'px';
      o.cn.style.transform = 'rotate('+Math.atan2(dy,dx)+'rad)';
    });
  }
  function leftText(k){ return k === 1 ? CFG.hintLeft[0] : fill(CFG.hintLeft[1], {n:k}); }
  function placedCount(){ return F.filter(function(o){ return o.tag; }).length; }
  function sync(){
    if(done){ hint.textContent = CFG.hintResult; go.textContent = CFG.btnAgain; go.disabled = busy; return; }
    var n = placedCount();
    hint.textContent = n === F.length ? CFG.hintDone : n === 0 ? CFG.hint : fill(CFG.hintSome, {n: leftText(F.length - n)});
    go.textContent = CFG.btnCheck; go.disabled = n === 0;
  }

  /* ---------- přetahování (myš i prst), klepnutí, klávesnice ---------- */
  function showPreview(p){
    if(p === null){ preview.hidden = true; return; }
    var y = Y(p); preview.hidden = false; preview.style.left = xl(y)+'px'; preview.style.width = (xr(y)-xl(y))+'px'; preview.style.top = (y-1.5)+'px';
    zone.setAttribute('aria-valuetext', cz(tipAt(p))); preview.dataset.v = cz(tipAt(p));
  }
  function startDrag(e, i, node, isTag){
    if(e.button > 0) return;
    stopDemo();
    var sx = e.clientX, sy = e.clientY, ghost = null, live = null, moved = false;
    function inStage(ev){ var r = stage.getBoundingClientRect(); return ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom ? r : null; }
    function mv(ev){
      if(!moved && Math.hypot(ev.clientX-sx, ev.clientY-sy) < 6) return;
      moved = true;
      if(!ghost){
        ghost = document.createElement('div'); ghost.className = (isTag ? 'cc-rc__tag' : 'cc-rc__chip')+' ghost';
        ghost.style.background = F[i].f.color; ghost.style.color = F[i].f.ink; ghost.style.width = Math.min(node.offsetWidth, 230)+'px';
        ghost.innerHTML = esc(F[i].f.text)+'<small></small>'; live = ghost.querySelector('small');
        root.appendChild(ghost); node.style.opacity = isTag ? .25 : .3;
      }
      var gw = ghost.offsetWidth, vw = document.documentElement.clientWidth;
      ghost.style.left = Math.max(4, Math.min(ev.clientX + 16, vw - gw - 4))+'px'; ghost.style.top = ev.clientY+'px';
      var r = inStage(ev);
      if(r){ var p = P(ev.clientY - r.top); live.innerHTML = tipHTML(tipAt(p)); showPreview(p); }
      else { live.textContent = ''; showPreview(null); }
    }
    function up(ev){
      window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
      if(ghost) ghost.remove(); node.style.opacity = ''; showPreview(null);
      if(!moved){ if(!isTag) pick(i); return; }
      var r = ev.type === 'pointerup' ? inStage(ev) : null;
      if(r){ place(i, P(ev.clientY - r.top)); sel = null; F.forEach(function(o){ o.chip.classList.remove('is-sel'); }); }
    }
    window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
  }
  stage.addEventListener('pointerdown', function(e){
    if(sel === null || done || e.target.closest('.cc-rc__tag')) return;
    var r = stage.getBoundingClientRect(); var i = sel; sel = null; F[i].chip.classList.remove('is-sel'); place(i, P(e.clientY - r.top));
  });
  zone.addEventListener('keydown', function(e){
    if(sel === null) return;
    if(e.key === 'ArrowUp' || e.key === 'ArrowDown'){ e.preventDefault(); kbP = Math.max(0, Math.min(1, kbP + (e.key === 'ArrowUp' ? .02 : -.02))); showPreview(kbP); }
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); var i = sel; sel = null; showPreview(null); place(i, kbP); zone.tabIndex = -1; F[i].tag.focus(); }
    if(e.key === 'Escape'){ sel = null; showPreview(null); F.forEach(function(o){ o.chip.classList.remove('is-sel'); }); }
  });
  zone.addEventListener('blur', function(){ showPreview(null); });

  /* ---------- vyhodnocení: štítky se otočí, rub ukáže výsledek ---------- */
  function back(o){
    var v = o.f.value, g = o.tip, res, msg;
    if(v === null){ res = 'none'; msg = (g !== null ? tipText(g)+'. ' : '') + CFG.resUnknown; }
    else if(g === null){ res = 'none'; msg = CFG.resNone; }
    else if(Math.abs(g - v) <= v*CFG.tolerance + 1e-9){ res = 'hit'; msg = fill(CFG.resHit, {g:cz(g)}); }
    else { res = 'miss'; msg = fill(g > v ? CFG.resMore : CFG.resLess, {g:cz(g), d:cz(Math.abs(g - v))}); }
    if(res === 'miss'){ o.wasP = o.p; o.was = document.createElement('div'); o.was.className = 'cc-rc__was'; o.was.setAttribute('aria-hidden','true');
      o.was.innerHTML = '<span>'+fill(CFG.wasTip, {g:cz(g)})+'</span>'; stage.appendChild(o.was); }
    if(v !== null) o.p = pos(v);
    o.tag.className = 'cc-rc__tag is-turn is-back is-'+res; o.tag.style.background = ''; o.tag.style.color = '';
    o.tag.innerHTML = '<span class="cc-rc__rl">'+(ICON[res] || '')+'<span>'+esc(o.f.text)+'</span></span>'+(v !== null ? '<b class="cc-rc__rv">'+cz(v)+'</b>' : '')+'<small>'+msg+'</small>';
    o.tag.setAttribute('aria-label', o.f.text+(v !== null ? ': '+cz(v)+'. ' : '. ')+msg);
    var col = res === 'hit' ? 'var(--ok)' : res === 'miss' ? 'var(--no)' : 'var(--ink)';
    o.mk.style.background = col; o.cn.style.background = col;
  }
  function evaluate(){
    if(busy || done) return;
    stopDemo(); sel = null; showPreview(null);
    F.forEach(function(o, i){ if(o.p === null){ place(i, o.f.value === null ? .5 : pos(o.f.value)); o.tip = null; o.tag.innerHTML = esc(o.f.text); } });
    done = true; busy = !reduce; var my = ++seq; sync();
    function swap(){
      if(my !== seq) return;
      F.forEach(back); fit();            /* přihrádka je prázdná, trychtýř dostane její místo */
      void stage.offsetWidth;
      F.slice().sort(function(a,b){ return b.p - a.p; }).forEach(function(o, k){ o.tag.style.setProperty('--d', (k*90)+'ms'); o.tag.classList.remove('is-turn'); });
      busy = false; sync();
    }
    if(reduce){ swap(); return; }
    F.forEach(function(o){ o.tag.classList.add('is-turn'); });
    setTimeout(swap, 240);
  }
  function reset(){
    done = false; busy = false; sel = null; seq++;
    F.forEach(function(o){ if(o.tag){ o.tag.remove(); o.mk.remove(); o.cn.remove(); } if(o.was) o.was.remove(); o.tag = o.mk = o.cn = o.was = null; o.wasP = null; o.p = null; o.tip = null; o.chip.classList.remove('is-gone','is-sel'); });
    fit();
  }
  function bindTap(node, fn){
    if(window.PointerEvent) node.addEventListener('pointerdown', function(e){ if(e.button > 0) return; e.preventDefault(); node.focus({preventScroll:true}); fn(); });
    else { node.addEventListener('touchstart', function(e){ e.preventDefault(); fn(); }, {passive:false}); node.addEventListener('mousedown', fn); }
    node.addEventListener('keydown', function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); fn(); } });
  }
  bindTap(go, function(){ if(go.disabled) return; done ? reset() : evaluate(); });

  /* ---------- zdroje (panel přes prvek) ---------- */
  var info = root.querySelector('[data-info]'), src = root.querySelector('#cc-rc-src'), close = root.querySelector('[data-close]');
  function openSrc(){ src.hidden = false; info.setAttribute('aria-expanded','true'); close.focus({preventScroll:true}); }
  function closeSrc(back){ if(src.hidden) return; src.hidden = true; info.setAttribute('aria-expanded','false'); if(back) info.focus({preventScroll:true}); }
  bindTap(info, function(){ src.hidden ? openSrc() : closeSrc(true); });
  bindTap(close, function(){ closeSrc(true); });
  document.addEventListener('keydown', function(e){ stopDemo(); if(e.key === 'Escape') closeSrc(true); if(e.key === 'Tab') root.classList.add('is-kbd'); });
  document.addEventListener('pointerdown', function(e){ root.classList.remove('is-kbd'); if(root.contains(e.target)) stopDemo(); if(!src.hidden && !src.contains(e.target) && e.target !== info) closeSrc(false); }, true);

  /* ---------- nápověda pohybem: kopie prvního štítku doletí do trychtýře ----------
     Nejvýš třikrát, jen dokud čtenář na nic nesáhl; při reduced-motion vůbec. */
  var demoRuns = 0, demoTimer = null, demoNode = null;
  function stopDemo(){ touched = true; clearTimeout(demoTimer); if(demoNode){ demoNode.remove(); demoNode = null; } }
  function demo(){
    if(touched || done || reduce || demoRuns >= 3 || !src.hidden) return;
    var o = F.filter(function(x){ return !x.tag; })[0]; if(!o || !o.chip.animate) return;
    demoRuns++;
    var rr = root.getBoundingClientRect(), rc = o.chip.getBoundingClientRect(), rs = stage.getBoundingClientRect();
    var p = DROP_P, ty = rs.top + Y(p), tx = rs.left + (xl(Y(p)) + xr(Y(p)))/2;
    var dx = tx - (rc.left + rc.width/2), dy = ty - (rc.top + rc.height/2), k = Math.min(1, 170/rc.width);
    var g = document.createElement('div'); g.className = 'cc-rc__chip cc-rc__demo'; g.setAttribute('aria-hidden','true');
    g.style.background = o.f.color; g.style.color = o.f.ink; g.textContent = o.f.text;
    g.style.left = (rc.left - rr.left)+'px'; g.style.top = (rc.top - rr.top)+'px'; g.style.width = rc.width+'px';
    root.appendChild(g); demoNode = g;
    var end = 'translate('+dx.toFixed(1)+'px,'+dy.toFixed(1)+'px) scale('+k.toFixed(2)+')';
    var an = g.animate([
      {transform:'translate(0,0) scale(1)', opacity:0, offset:0},
      {transform:'translate(0,0) scale(1)', opacity:.8, offset:.14},
      {transform:end, opacity:.8, offset:.72},
      {transform:end, opacity:0, offset:1}
    ], {duration:1900, easing:'cubic-bezier(.45,0,.2,1)'});
    an.onfinish = function(){ if(demoNode === g){ g.remove(); demoNode = null; } demoTimer = setTimeout(demo, 4200); };
  }

  /* ---------- vyplnění rámu ---------- */
  F.forEach(chipEl);
  function reserve(){
    /* změř plný stav (všechny štítky v přihrádce): na výšku se podle něj rezervuje místo, aby trychtýř neskákal,
       na šířku se podle něj blok vlevo svisle vystředí a při mizení štítků se už jen zkracuje zdola */
    var gone = F.map(function(o){ return o.chip.classList.contains('is-gone'); });
    F.forEach(function(o){ o.chip.classList.remove('is-gone'); });
    tray.hidden = false; tray.style.minHeight = ''; hint.style.minHeight = ''; head.style.paddingTop = '';
    var keep = hint.textContent, hmax = 0;
    [CFG.hint, fill(CFG.hintSome, {n: leftText(Math.max(2, F.length - 1))}), fill(CFG.hintSome, {n: leftText(1)}), CFG.hintDone, CFG.hintResult].forEach(function(s){ hint.textContent = s; hmax = Math.max(hmax, hint.offsetHeight); });
    hint.textContent = keep;
    var L = land(), cs = getComputedStyle(root);
    if(L){
      hint.style.minHeight = hmax+'px';
      var full = head.offsetHeight + parseFloat(cs.rowGap || 0) + side.offsetHeight;
      var room = root.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
      head.style.paddingTop = Math.max(0, Math.round((room - full)/2))+'px';
    } else if(!done){
      hint.style.minHeight = hmax+'px'; tray.style.minHeight = tray.offsetHeight+'px';
    }
    F.forEach(function(o,i){ if(gone[i]) o.chip.classList.add('is-gone'); });
    tray.hidden = done;
  }
  function fit(){
    /* ve velkém rámu na šířku roste písmo s výškou (výchozí je rám 786 × 560) */
    var sc = land() ? Math.max(1, Math.min(1.45, root.clientHeight/560)) : 1; root.style.setProperty('--sc', sc.toFixed(3)); reserve(); sync();
    for(var k=0; k<20; k++){
      if(root.scrollHeight <= root.clientHeight + 1 && stage.clientHeight >= Math.min(root.clientHeight*.42, 320)) break;
      sc *= .94; root.style.setProperty('--sc', sc.toFixed(3)); reserve(); sync();
    }
    geom(); drawFunnel(); layout(); if(sel !== null && document.activeElement === zone) showPreview(kbP);
  }
  var t;
  window.addEventListener('resize', function(){ clearTimeout(t); t = setTimeout(fit, 60); });
  window.addEventListener('load', fit);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  if(window.ResizeObserver) new ResizeObserver(function(){ clearTimeout(t); t = setTimeout(fit, 90); }).observe(root);
  fit();

  /* nápověda se spustí, až je prvek vidět (bez IntersectionObserveru hned po načtení) */
  if(!reduce){
    if('IntersectionObserver' in window){
      var io = new IntersectionObserver(function(es){ if(es.some(function(e){ return e.isIntersecting; })){ io.disconnect(); demoTimer = setTimeout(demo, 900); } }, {threshold:.4});
      io.observe(root);
    } else demoTimer = setTimeout(demo, 1200);
  }
})();
</script>
