<style>
  html,body{margin:0;padding:0;background:transparent;height:100%;}
  body{overflow-x:hidden;}

<style>
.cc-embed{
  --cc-blue:#087eeb;      --cc-blue-dark:#0668c2;
  --cc-red:#d40b3e;
  --cc-ink:#222;          --cc-ink-soft:#3c3c3c;
  --cc-muted:#84929b;
  --cc-line:#ececec;
  --cc-surface:#f8f9fa;   --cc-white:#fff;
  --cc-radius:15px;       --cc-radius-sm:10px;
  --cc-pad:clamp(16px,3vw,26px);
  --cc-gap:12px;
  --cc-serif:Georgia,Times,"Times New Roman",serif;
  --cc-display:Poppins,-apple-system,"Segoe UI",sans-serif;
  --cc-ui:Inter,-apple-system,"Segoe UI",sans-serif;
  display:block;
  margin:2.4rem 0;
  padding:var(--cc-pad);
  background:var(--cc-surface);
  border:1px solid var(--cc-line);
  border-radius:var(--cc-radius);
  color:var(--cc-ink);
  font:18px/1.66667 var(--cc-serif);
  -webkit-tap-highlight-color:transparent;
}
.cc-embed *{box-sizing:border-box;}
.cc-embed h2,.cc-embed h3,.cc-embed h4,.cc-embed .cc-title{
  margin:0 0 8px;font-family:var(--cc-display);font-weight:700;line-height:1.25;color:#000;}
.cc-embed h3,.cc-embed .cc-title{font-size:clamp(20px,3.4vw,26px);}
.cc-embed p{margin:0 0 10px;}
.cc-embed img,.cc-embed svg,.cc-embed canvas{max-width:100%;}
.cc-embed :focus-visible{outline:3px solid #000;outline-offset:3px;}
.cc-embed .cc-sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}
@media (prefers-reduced-motion:reduce){.cc-embed *{transition:none!important;animation:none!important;}}
</style>

<style>

.cc-ki{
  box-sizing:border-box;
  display:flex;flex-direction:column;min-height:100vh;
  --ab-lime:#b4d335;
  --ab-lime-ink:#6f8c10;
  --k-plocha:#e9e9e9;
  --k-line:#d4d4d4;
  --k-muted:#6b7076;
  --k-ghost:#bcbcbc;
  --k-ink:#222;
  background:var(--k-plocha);
  border:0;border-radius:15px;
  padding:clamp(20px,3.4vw,44px) clamp(18px,3.2vw,48px);
  margin:0;
  font:18px/1.667 var(--cc-serif);
}
.cc-ki h3{font-size:clamp(19px,2.7vw,30px);line-height:1.17;letter-spacing:-.012em;
  margin:0 0 clamp(6px,1vw,10px);max-width:28ch;}
.cc-ki .cc-ki__lede{margin:0 0 clamp(16px,2.4vw,24px);max-width:62ch;
  font:400 clamp(13.5px,1.3vw,16px)/1.55 var(--cc-serif);color:#3c3c3c;}
.cc-ki .cc-ki__foot{display:flex;gap:7px;align-items:flex-start;
  margin:clamp(16px,2.4vw,26px) 0 0;font:400 12px/1.5 var(--cc-ui);color:var(--k-muted);}
.cc-ki__i{width:13px;height:13px;flex:0 0 auto;margin-top:2px;}

/* přepínač kategorií — černý pill jako tlačítka na cc.cz */
.cc-ki__tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 clamp(14px,2.2vw,24px);}
.cc-ki__tabs button{
  padding:7px 15px;border:0;border-radius:32px;cursor:pointer;
  font:500 12px/1.35 var(--cc-ui);background:transparent;color:var(--k-muted);
  box-shadow:inset 0 0 0 1px var(--k-line);
  transition:background .16s,color .16s,box-shadow .16s;}
.cc-ki__tabs button:hover{color:var(--k-ink);box-shadow:inset 0 0 0 1px #adadad;}
.cc-ki__tabs button[aria-pressed="true"]{background:#000;color:#fff;box-shadow:none;}
@media (max-width:619px){
  /* v úzkém rámu není místo na dva řádky pilulek — jeden posuvný */
  .cc-ki__tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
  /* náznak, že se dá posunout — mizí, jakmile je čtenář na konci */
  .cc-ki__tabs.is-more{-webkit-mask-image:linear-gradient(to right,#000 78%,rgba(0,0,0,.15));
    mask-image:linear-gradient(to right,#000 78%,rgba(0,0,0,.15));}
  .cc-ki__tabs::-webkit-scrollbar{display:none;}
  .cc-ki__tabs button{flex:0 0 auto;}
  .cc-ki h3{font-size:19px;}
  .cc-ki .cc-ki__lede{margin-bottom:13px;}
  .cc-ki__long{display:none;}
}
@media (max-width:379px){
  .cc-ki{padding:15px 14px;}
  .cc-ki h3{font-size:17.5px;}
  .cc-ki .cc-ki__lede{font-size:12.5px;line-height:1.45;margin-bottom:10px;}
  .cc-ki__tabs{margin-bottom:10px;gap:5px;}
  .cc-ki__tabs button{padding:6px 12px;font-size:11.5px;}
  .cc-ki .cc-ki__foot{font-size:10.5px;margin-top:10px;gap:5px;}
  .cc-ki__i{width:11px;height:11px;}
}

@keyframes ki-pop{from{opacity:0;transform:translateY(4px) scale(.86);}to{opacity:1;transform:none;}}
@keyframes ki-fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
@keyframes ki-take{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:none;}}
@keyframes ki-dot{from{opacity:0;transform:scale(.2);}to{opacity:1;transform:none;}}

/* Pointa kategorie — věta, která se mění s přepnutím. Pevná minimální výška,
   aby se článek nehýbal, když je text jednou o řádek delší. */
.cc-ki .cc-ki__take{display:flex;gap:10px;align-items:stretch;
  margin:clamp(10px,1.5vw,16px) 0 0;min-height:2.7em;
  font:400 clamp(12.5px,1.3vw,15.5px)/1.45 var(--cc-ui);color:var(--k-ink);}
.cc-ki__take::before{content:"";flex:0 0 auto;width:3px;border-radius:2px;
  background:var(--ab-lime);}
.cc-ki__take b{font-weight:600;}
.cc-ki__take span{display:block;align-self:center;animation:ki-take .34s ease backwards;}
@media (max-width:619px){ .cc-ki .cc-ki__take{min-height:3.2em;gap:8px;} }
</style>

<style>
.cc-ki--a .cc-ki__rows{display:flex;flex-direction:column;flex:1 1 0;min-height:0;}
.cc-ki--a .cc-ki__row{flex:1 1 0;min-height:0;}
.cc-ki__row{display:grid;grid-template-columns:minmax(104px,.72fr) minmax(0,2.6fr) 74px;
  align-items:center;gap:clamp(8px,1.6vw,20px);
  padding:var(--rowpad,clamp(5px,0.75vw,11px)) 0;border-top:1px solid var(--k-line);
  transition:opacity .18s ease;}
@media (min-width:620px) and (max-width:1023px){ .cc-ki__row{--rowpad:4px;} }
.cc-ki__row:first-child{border-top:0;}
.cc-ki__row--avg{border-top:1px solid #b3b3b3;border-bottom:1px solid #b3b3b3;}
/* ztlumení ostatních řádků při najetí — oko jde po jednom, ne po všech */
.cc-ki--a .cc-ki__rows:hover .cc-ki__row{opacity:.42;}
.cc-ki--a .cc-ki__rows:hover .cc-ki__row--avg{opacity:.7;}
.cc-ki--a .cc-ki__rows .cc-ki__row:hover,
.cc-ki--a .cc-ki__rows .cc-ki__row:focus-within{opacity:1;}
.cc-ki__name{font:400 var(--namesize,clamp(12.5px,1.4vw,16px))/1.25 var(--cc-serif);color:var(--k-ink);}
.cc-ki__row--avg .cc-ki__name{font-family:var(--cc-ui);font-weight:600;
  font-size:clamp(11px,1.15vw,13px);text-transform:uppercase;letter-spacing:.05em;
  color:var(--k-muted);}
.cc-ki__cups{display:flex;flex-wrap:wrap;gap:clamp(1.5px,.5vw,5px);align-items:center;}
.cc-ki__cups svg{width:var(--cupw,clamp(9px,1.85vw,25px));height:auto;display:block;flex:0 0 auto;}
/* Mezera za čtvrtým šálkem: v řádku zůstává jen jako odsazení, samotná
   ryska se kreslí jednou přes celý blok (viz .cc-ki__avg), aby šla popsat. */
.cc-ki__mark{flex:0 0 auto;width:1px;align-self:stretch;background:transparent;
  margin:0 clamp(3px,.6vw,7px);}
.cc-ki__rows{position:relative;margin-top:13px;}
/* přebytek nad osmi šálky — čitelná značka místo drobků */
.cc-ki__more{flex:0 0 auto;margin-left:clamp(3px,.6vw,7px);font-style:normal;
  font:700 calc(var(--numsize,16px) * .62)/1 var(--cc-ui);color:var(--ab-lime-ink);
  font-variant-numeric:tabular-nums;}
.cc-ki__avg{position:absolute;top:0;bottom:0;left:0;width:1px;background:#a2a2a2;
  pointer-events:none;opacity:0;transition:opacity .3s ease .25s;}
.is-poured .cc-ki__avg{opacity:1;}
.cc-ki__avg b{position:absolute;top:-1px;left:50%;transform:translate(-50%,-100%);
  padding:0 5px;background:var(--k-plocha);white-space:nowrap;
  font:600 9.5px/1.3 var(--cc-ui);letter-spacing:.07em;text-transform:uppercase;
  color:var(--k-muted);}
@media (max-width:379px){ .cc-ki__avg b{font-size:8.5px;padding:0 3px;} }
.cup .g{fill:none;stroke:var(--k-ghost);stroke-width:1.3;}
.cup .gh{fill:none;stroke:var(--k-ghost);stroke-width:1.6;}
.cup .b{fill:var(--ab-lime);stroke:var(--ab-lime-ink);stroke-width:1.3;}
.cup .h{fill:none;stroke:var(--ab-lime-ink);stroke-width:1.9;}
/* nalévání: ořezový obdélník sjede zdola nahoru na cílovou hladinu */
.cup .lq{transform:translateY(15.4px);
  transition:transform .55s cubic-bezier(.22,.75,.3,1);
  transition-delay:calc(var(--i,0) * 45ms);}
.is-poured .cup .lq{transform:translateY(var(--dy,0px));}
/* Čísla jdou v Interu, ne v Poppins: Poppins nemá tabulární číslice, takže
   při odpočítávání skákala šířka. Inter tabulární sadu má. */
.cc-ki__n{justify-self:end;text-align:right;
  font:700 var(--numsize,clamp(15px,2.1vw,24px))/1 var(--cc-ui);
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;
  letter-spacing:-.01em;color:var(--k-ink);}
.cc-ki__n small{display:block;margin-top:2px;font:500 10px/1.2 var(--cc-ui);
  letter-spacing:.05em;text-transform:uppercase;color:var(--k-muted);}
.cc-ki__row--avg .cc-ki__n{font-size:calc(var(--numsize,20px) * .84);color:var(--k-muted);}
@media (max-width:619px){
  /* jednořádkové řádky — v rámu na mobilu není na dvouřádkové místo */
  .cc-ki__row{grid-template-columns:84px minmax(0,1fr) 42px;gap:6px;}
  .cc-ki__n small{display:none;}
  .cc-ki__n{font-size:var(--numsize,16px);}
  .cc-ki__cups{flex-wrap:nowrap;}
}
@media (max-width:379px){
  .cc-ki__row{grid-template-columns:74px minmax(0,1fr) 38px;gap:5px;}
  .cc-ki__name{font-size:var(--namesize,11.5px);}
  .cc-ki__row--avg .cc-ki__name{font-size:calc(var(--namesize,11.5px) * .83);letter-spacing:0;}
  .cc-ki__n{font-size:var(--numsize,14px);}
}
@media (max-width:339px){
  .cc-ki__row{grid-template-columns:68px minmax(0,1fr) 34px;}
  .cc-ki__name{font-size:var(--namesize,11px);}
  .cc-ki__n{font-size:var(--numsize,13px);}
}
</style>

<div class="cc-embed cc-ki cc-ki--a" data-ki-a>
  <h3>Kolik kávy týdně pijí ženy, Pražáci nebo manažeři?</h3>
  <p class="cc-ki__lede">Podívejte se, jaké rozdíly jsou mezi jednotlivými skupinami.</p>
  <div class="cc-ki__tabs" role="group" aria-label="Kategorie" data-tabs></div>
  <div class="cc-ki__rows" data-rows></div>
  <p class="cc-ki__take" data-take></p>
  <p class="cc-sr" aria-live="polite" data-sr></p>
  <p class="cc-ki__foot"><svg class="cc-ki__i" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8 7.2v4.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="4.7" r=".95" fill="currentColor"/></svg>Barometr finanční pohody Air Bank, 2026.</p>
</div>

<script>
(function(){

  "use strict";

  /* ---- DATA ---------------------------------------------------------------
     [název, šálky týdně (sloupec F), Barometr finanční pohody (sloupec C)]
     SWAP-POINT: při aktualizaci průzkumu se přepisuje jen tenhle blok.
     Zdroj: Barometr finanční pohody Air Bank, 2026.
  ------------------------------------------------------------------------- */
  var CELKEM = ["Češi celkem", 4.003, 46.65];
  /* Pointa ke každé kategorii — text, který se mění s přepnutím.
     A = řádky se šálky, C = bodový graf. SWAP-POINT pro editora. */
  var TAKE_A = {
    pohlavi:"Muž si týdně dopřeje skoro <b>o dvě kávy víc</b> než žena.",
    vek:"Věk na spotřebu kávy nemá výrazný vliv. Všechny generace se drží kolem čtyř šálků.",
    vzdelani:"Vysokoškolák vypije <b>dvakrát tolik káv</b> co člověk se základním vzděláním.",
    prijem:"Pod 15 tisíci 2,4 kávy, nad 40 tisíci 6,5. Spotřeba kávy roste s výplatou.",
    prace:"Manažer vypije 11,4 kávy týdně, nezaměstnaný 2,9. Nikde jinde není propast takhle hluboká.",
    region:"Praha si dá skoro <b>o celou kávu</b> víc než Morava."
  };
  var TAKE_C = {
    pohlavi:"Muži jsou finančně v pohodě a také víc pijí kávu. Najdeme je vpravo nahoře.",
    vek:"Průměry věkových skupin se mačkají u sebe.",
    vzdelani:"Vzdělání zvyšuje spotřebu kávy i finanční pohodu.",
    prijem:"Nejostřejší schod v celém grafu. Ze 2,4 kávy na 6,5.",
    prace:"Manažeři se utrhli do vedení — jedenáct šálků týdně.",
    region:"Praha zbytku republiky utíká i ve spotřebě kávy."
  };

  var GROUPS = [
    {k:"pohlavi", n:"Pohlaví", rows:[
      ["Muži",4.888,50.74],["Ženy",3.048,42.24]]},
    {k:"vek", n:"Věk", rows:[
      ["do 25 let",3.437,47.94],["26–45 let",4.191,46.92],
      ["46–60 let",3.929,45.86],["nad 60 let",3.919,46.89]]},
    {k:"vzdelani", n:"Vzdělání", rows:[
      ["Základní",2.127,34.96],["Vyučen/a",3.306,39.62],
      ["Středoškolské",4.113,47.45],["Vysokoškolské",4.962,54.89]]},
    {k:"prijem", n:"Příjem", rows:[
      ["do 15 000 Kč",2.388,36.62],["15–25 000 Kč",2.618,37.46],
      ["25–40 000 Kč",3.895,47.25],["nad 40 000 Kč",6.501,60.75]]},
    {k:"prace", n:"Povolání", rows:[
      ["Manažeři",11.444,73.94],["Podnikatelé",4.863,48.75],
      ["Zaměstnanci",4.158,47.97],["Studenti",3.336,49.08],
      ["Nezaměstnaní",2.902,33.14],["Důchodci",2.812,35.25],
      ["V domácnosti",2.731,38.44]]},
    {k:"region", n:"Region", rows:[
      ["Praha",4.927,53.11],["Čechy",4.007,46.15],["Morava",3.642,45.00]]}
  ];

  var SVGNS = "http://www.w3.org/2000/svg";
  function el(t,c){var e=document.createElement(t); if(c)e.className=c; return e;}
  function sv(t,a){var e=document.createElementNS(SVGNS,t);
    for(var k in a) e.setAttribute(k,a[k]); return e;}
  function cz(v,d){ return v.toFixed(d===undefined?1:d).replace(".",","); }
  function salku(n){ return n===1?"šálek":(n>=2&&n<=4?"šálky":"šálků"); }
  /* Celé číslo, když je k celému blízko, jinak jedno desetinné místo.
     Jednotka se skloňuje — čeština chce u desetinného čísla genitiv „2,7 šálku". */
  function num(v){ return Math.abs(v-Math.round(v))<0.05 ? String(Math.round(v)) : cz(v,1); }
  function unit(v){ return Math.abs(v-Math.round(v))<0.05 ? salku(Math.round(v)) : "šálku"; }

  /* Kořen se hledá bez id — fragment může na stránce být i dvakrát. */
  function findRoot(cls){
    var n = document.currentScript && document.currentScript.previousElementSibling;
    while(n && !(n.classList && n.classList.contains(cls))) n = n.previousElementSibling;
    return n;
  }

  function tabs(host, onPick){
    var box = host.querySelector("[data-tabs]"), cur = GROUPS[0].k;
    GROUPS.forEach(function(g){
      var b = el("button"); b.type="button"; b.textContent=g.n;
      b.setAttribute("aria-pressed", g.k===cur?"true":"false");
      b.addEventListener("click", function(){
        cur = g.k;
        Array.prototype.forEach.call(box.children,function(x){
          x.setAttribute("aria-pressed", x===b?"true":"false"); });
        onPick(g);
      });
      box.appendChild(b);
    });
    onPick(GROUPS[0]);
  }

  var root = findRoot("cc-ki--a"); if(!root || root.dataset.ccInit) return;
  root.dataset.ccInit = "1";
  var rows = root.querySelector("[data-rows]"), sr = root.querySelector("[data-sr]");
  var take = root.querySelector("[data-take]");
  var UID = 0;   /* prefixované id pro clipPath — fragment padá na cizí stránku */
  var still = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* Šálek: pod ním obrys, nad ním limetková náplň oříznutá obdélníkem.
     Obdélník se v CSS posune zdola na hladinu odpovídající fill (0..1),
     takže se káva „nalije". */
  function dy(f){ return (15.4*(1-Math.max(0,Math.min(1,f)))).toFixed(2)+"px"; }
  function cup(fill, i, fromFill){
    var s = sv("svg",{viewBox:"0 0 27 25","aria-hidden":"true","class":"cup"});
    s.style.setProperty("--i", i);
    s.style.setProperty("--dy", dy(fill));
    /* výchozí hladina: buď prázdno (první vykreslení), nebo stav předchozí
       kategorie na stejném řádku — šálky pak „přelijí" místo aby skočily */
    s.dataset.from = String(fromFill === undefined ? 0 : fromFill);
    function body(cb,ch){
      var g = sv("g",{});
      g.appendChild(sv("path",{"class":cb,
        d:"M2.6 4.6h15.1v8.7a6.2 6.2 0 0 1-6.2 6.2H8.8a6.2 6.2 0 0 1-6.2-6.2V4.6Z"}));
      g.appendChild(sv("path",{"class":ch, d:"M18.1 7.7h2.5a3.4 3.4 0 0 1 0 6.8h-2.5"}));
      return g;
    }
    s.appendChild(body("g","gh"));
    if(fill > 0.02 || (fromFill||0) > 0.02){
      var id = "ki-cup-"+(++UID);
      var cp = sv("clipPath",{id:id});
      cp.appendChild(sv("rect",{"class":"lq",x:"-1",y:"4.1",width:"29",height:"21.4"}));
      s.appendChild(cp);
      var g = body("b","h");
      g.setAttribute("clip-path","url(#"+id+")");
      s.appendChild(g);
    }
    return s;
  }

  /* Číslo přejede ze staré hodnoty na novou. Všechny řádky dobíhají ve stejný
     okamžik — liší se jen rozjezd, takže to má rytmus, ale ne chaos. */
  var DUR = 620;
  function countUp(node, from, target, unitTxt, delay){
    if(still || !armed){ node.innerHTML = num(target)+"<small>"+unitTxt+"</small>"; return; }
    var t0 = null;
    node.innerHTML = num(from)+"<small>"+unitTxt+"</small>";
    function step(ts){
      if(t0===null) t0 = ts;
      var pr = (ts - t0 - delay) / DUR;
      if(pr < 0){ requestAnimationFrame(step); return; }
      if(pr > 1) pr = 1;
      var e = 1 - Math.pow(1-pr, 3);
      node.innerHTML = num(from + (target-from)*e)+"<small>"+unitTxt+"</small>";
      if(pr < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  /* Víc než osm slotů se v řádku scvrkne na drobky, takže se přebytek
     schová pod značku „+N" a pointa (manažer je mimo mísu) zůstane. */
  var MAXSLOT = 8;
  function row(name, cups, slots, isAvg, fromCups, idx){
    var r = el("div","cc-ki__row"+(isAvg?" cc-ki__row--avg":""));
    var n = el("div","cc-ki__name"); n.textContent = name; r.appendChild(n);
    var c = el("div","cc-ki__cups");
    var vis = Math.min(slots, MAXSLOT);
    for(var i=0;i<vis;i++){
      c.appendChild(cup(cups-i, i, fromCups===undefined?undefined:fromCups-i));
      if(i===3 && slots>4) c.appendChild(el("i","cc-ki__mark"));
    }
    if(slots > MAXSLOT){
      var extra = Math.max(0, Math.round(cups) - MAXSLOT);
      var p = el("i","cc-ki__more");
      p.textContent = extra > 0 ? "+"+extra : "";
      c.appendChild(p);
    }
    r.appendChild(c);
    var v = el("div","cc-ki__n"); r.appendChild(v);
    countUp(v, fromCups===undefined?0:Math.max(0,fromCups), cups, unit(cups),
            isAvg ? 0 : 60 + Math.min(idx||0,9)*45);
    return r;
  }

  /* ---- rozměry podle dostupné VÝŠKY ------------------------------------
     Rám iframu má pevný poměr stran, takže o tom, kolik se toho vejde,
     nerozhoduje šířka (na tu byly navěšené media queries), ale výška.
     Sedm řádků povolání se dřív na desktopu nevešlo o 41 px. */
  var zmenseni = 1;
  function fit(){
    var pocet = rows.children.length;
    if(!pocet) return;
    var volno = rows.clientHeight;
    if(!volno) return;
    rozmery(volno / pocet * zmenseni);
    /* Pojistka: když se to i tak nevejde (dlouhá jména, jiné fonty, sedm
       řádků na nízkém rámu), zmenšuj po pěti procentech, dokud to nesedne. */
    for(var k=0; k<14; k++){
      if(document.documentElement.scrollHeight <= window.innerHeight + 1) break;
      zmenseni *= 0.92;
      rozmery(rows.clientHeight / pocet * zmenseni);
    }
    umistiRysku();
  }
  function rozmery(naRadek){
    var cupw = Math.max(6, Math.min(25, (naRadek - 10) * 0.78));
    var velCisla = Math.max(9, Math.min(24, naRadek * 0.42));
    var velJmena = Math.max(8.5, Math.min(16, naRadek * 0.30));
    var pad  = Math.max(0, Math.min(11, naRadek * 0.11));
    root.style.setProperty("--cupw", cupw.toFixed(1)+"px");
    root.style.setProperty("--numsize", velCisla.toFixed(1)+"px");
    root.style.setProperty("--namesize", velJmena.toFixed(1)+"px");
    root.style.setProperty("--rowpad", pad.toFixed(1)+"px");
  }

  /* Ryska průměru: jedna čára přes celý blok, umístěná podle skutečné pozice
     mezery za čtvrtým šálkem v prvním řádku. */
  var avg = null;
  function umistiRysku(){
    var mark = rows.querySelector(".cc-ki__mark");
    if(!avg){
      avg = el("div","cc-ki__avg");
      var b = document.createElement("b"); b.textContent = "průměr 4";
      avg.appendChild(b);
    }
    if(!mark){ if(avg.parentNode) avg.parentNode.removeChild(avg); return; }
    if(avg.parentNode !== rows) rows.appendChild(avg);
    var r1 = mark.getBoundingClientRect(), r0 = rows.getBoundingClientRect();
    avg.style.left = (r1.left - r0.left + r1.width/2).toFixed(1)+"px";
  }

  /* Animace se pouští, až je prvek v záběru — jinak probliknou šálky ještě
     dřív, než k nim čtenář doscrolluje. */
  var armed = still, cekaNaZabery = null;
  function spust(){
    armed = true;
    if(cekaNaZabery){ var f = cekaNaZabery; cekaNaZabery = null; f(); }
  }
  if(!still){
    if(window.IntersectionObserver){
      var io = new IntersectionObserver(function(e){
        if(e.some(function(x){ return x.isIntersecting; })){ io.disconnect(); spust(); }
      }, {threshold:0.25});
      io.observe(root);
      setTimeout(spust, 4000);   /* pojistka, kdyby observer mlčel */
    } else spust();
  }

  var predchozi = null;   /* hodnoty minulé kategorie podle pořadí řádku */

  function vykresli(g){
    var slots = Math.max(Math.ceil(CELKEM[1]), Math.ceil(Math.max.apply(null,
      g.rows.map(function(r){ return r[1]; }))));
    var stare = predchozi;
    rows.classList.remove("is-poured");
    rows.innerHTML = ""; avg = null;
    var hodnoty = [CELKEM[1]].concat(g.rows.map(function(r){ return r[1]; }));

    rows.appendChild(row("Průměr Čechů", CELKEM[1], slots, true,
      stare ? stare[0] : undefined, 0));
    g.rows.forEach(function(r, i){
      rows.appendChild(row(r[0], r[1], slots, false,
        stare && stare[i+1] !== undefined ? stare[i+1] : undefined, i+1));
    });
    predchozi = hodnoty;

    fit();
    /* startovní hladina se nasadí do prvního rámce, cílová do druhého */
    var cups = rows.querySelectorAll(".cup");
    if(!still){
      Array.prototype.forEach.call(cups, function(c){
        var lq = c.querySelector(".lq");
        if(lq) lq.style.transform = "translateY("+dy(+c.dataset.from)+")";
      });
    }
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        Array.prototype.forEach.call(cups, function(c){
          var lq = c.querySelector(".lq");
          if(lq) lq.style.transform = "";
        });
        rows.classList.add("is-poured");
        umistiRysku();
      });
    });

    take.innerHTML = ""; var sp = el("span");
    sp.innerHTML = TAKE_A[g.k] || ""; take.appendChild(sp);

    sr.textContent = g.n + ": " + g.rows.map(function(r){
      return r[0]+" "+num(r[1])+" "+unit(r[1]); }).join(", ") +
      ". Průměr populace 4 šálky týdně.";
  }

  tabs(root, function(g){
    if(armed) vykresli(g);
    else { vykresli(g); cekaNaZabery = function(){ vykresli(g); }; }
  });

  /* přepočet při změně rámu (otočení telefonu, změna okna) */
  if(window.ResizeObserver){
    var t, ro = new ResizeObserver(function(){ clearTimeout(t); t = setTimeout(fit, 90); });
    ro.observe(root);
  } else window.addEventListener("resize", fit);
  window.addEventListener("load", fit);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

  /* náznak posuvných záložek na mobilu */
  (function(){
    var box = root.querySelector("[data-tabs]");
    function stav(){
      box.classList.toggle("is-more",
        box.scrollWidth - box.clientWidth - box.scrollLeft > 8);
    }
    box.addEventListener("scroll", stav);
    window.addEventListener("resize", stav);
    setTimeout(stav, 60); setTimeout(stav, 800);
  })();
})();
</script>

</body>
</html>
