<!-- CzechCrunch × Somfy – infografika „Stínění a chytrá domácnost v číslech“ místo textového bloku s výzkumem.
     Cíl: nativ cc.cz s partnerem Somfy (venkovní stínění), sourozenec prvků visa-ai-nakupovani a mavie-stress-study.
     Vložení: somfy-chytra-domacnost-vlozeni.html, obalový div s výškou podle šířky okna.
     Nasazení: matyas-cloud/cc-embed/somfy-chytra-domacnost/index.html, Poppins ze sdílené složky ../fonts/.
     Formát: bílá plocha se stínem uvnitř rámu, nahoře titulek a (i) se zdrojem. Pět kapitol:
       A stínění (panelák na výšku, 10 pater po 10 oknech, roletu má 26; vedle výřez 26 oken se stíněním: 18 ručně, 1 automaticky, 7 jinak),
       B mobil (4,7 z 10 s deseti telefony) a první nákup na obrazovce telefonu (tři dlaždice s ikonou a lamelou), C novostavby (tři okna, roleta sjede na podíl),
       D horko (slunce svítí na 64,4 % podlahy, stín žaluzie pokryje 21,9 %), E nezájem podle příjmu (tři sloupce: do 25 000 Kč, všichni, vysoké příjmy).
       Desktop A přes celou šířku, B|C a D|E vedle sebe; pod 600 px vše pod sebou.
     Barvy podle somfy.cz: tmavá petrolejová #25485a jako barva dat (lamely), písek #e3dbd1 a krém #f6f3ef pro dráhy,
       jantarová #fab800 jen jako akcent u automatického ovládání (pointa titulku) a jako sluneční světlo v horku.
     Nástup po kapitolách přes IntersectionObserver: lamely se rozjedou, rolety v oknech sjedou dolů, čísla se jen jemně objeví.
       Bez IO, s omezeným pohybem nebo s ?static rovnou konečný stav; ?info otevře panel (i) – jen pro náhledy.
     Data: podklad redakce (průzkum STEM/MARK pro Somfy, březen 2026, N = 511; novostavby podle Somfy).
       Chytré vytápění 18,9 % je z textu článku (týž průzkum). Vynecháno: TaHoma (produkt, ne výzkum), úspora 10–30 % (tvrzení firmy).
       Texty a čísla jsou v bloku D, z něj se skládá i shrnutí pro čtečky.
     Změny obsahu:
       2026-11-20  v1 návrh.
       2026-11-23  v2 podle Matta: A přidán pruh všech lidí (74 % nemá), „ostatní“ → „jinak“ (co to je, doplní klient);
                   B 47,4 % jako 4,7 z 10 s telefony; D horko jako slunce a stín žaluzie; E příjmy jako dva sloupce s čárou celku.
       2026-11-23  v3 podle Matta: A jako bytový dům a patro s okny podle ovládání (počty oken přepočtené z procent, popisky v procentech);
                   B první nákup na obrazovce telefonu, nadpis „Jako první by v chytré domácnosti pořídili“; C nadpis na střed a blíž oknům.
       2026-11-23  v4: dům na výšku se vchodem místo širokého, výřez oken se stíněním vedle; „pořídili“ → „řešili“.
       2026-11-23  v5 podle Matta: titulek „Stínění a chytrá domácnost v číslech“; pryč 74 % a „skoro“ (70 % ručně);
                   ovládání jako legenda pod okny; horko „lidí má v létě doma aspoň občas horko“; příjmy jako tři sloupce
                   (do 25 000 Kč / všichni / vysoké) místo čáry průměru; bez dopočítávání čísel, hodnoty jen jemně naběhnou.
       2026-11-23  v6 připomínka klienta: u „jinak“ doplněno 26,2 % (dopočet do 100 %, uvedeno v (i)); čísla v legendě
                   zarovnaná pod sebe podle desetinné čárky. -->

<!-- CC sdílený designový základ pro embedy. Vlož jako PRVNI style blok prvku.

<style>
.cc-embed{
  /* --- barvy --- */
  --cc-blue:#087eeb;      --cc-blue-dark:#0668c2;
  --cc-red:#d40b3e;
  --cc-ink:#222;          --cc-ink-soft:#3c3c3c;
  --cc-muted:#84929b;
  --cc-line:#ececec;
  --cc-surface:#f8f9fa;   --cc-white:#fff;
  --cc-ok:#29cc6a;        --cc-warn:#f58a18;
  /* --- shape --- */
  --cc-radius:15px;       --cc-radius-sm:10px;
  --cc-pad:clamp(16px,3vw,26px);
  --cc-gap:12px;
  /* --- font --- */
  --cc-serif:Georgia,Times,"Times New Roman",serif;
  --cc-display:Poppins,-apple-system,"Segoe UI",sans-serif;
  --cc-ui:Inter,-apple-system,"Segoe UI",sans-serif;
  display:block;
  margin:2.4rem 0;
  padding:var(--cc-pad);
  background:var(--cc-surface);
  border:1px solid var(--cc-line);
  border-radius:var(--cc-radius);
  color:var(--cc-ink);
  font:18px/1.66667 var(--cc-serif);
  -webkit-tap-highlight-color:transparent;
}
.cc-embed *{box-sizing:border-box;}
.cc-embed--flush{padding:0;overflow:hidden;}      /* prvek do krajů (fotka, mapa) */
.cc-embed--bare{background:none;border:0;padding:0;} /* bez rámečku */
/* --- typo --- */
.cc-embed .cc-kicker{margin:0 0 6px;font:700 12px/1.25 var(--cc-ui);
  letter-spacing:.08em;text-transform:uppercase;color:var(--cc-red);}
.cc-embed h2,.cc-embed h3,.cc-embed h4,.cc-embed .cc-title{
  margin:0 0 8px;font-family:var(--cc-display);font-weight:700;line-height:1.25;color:#000;}
.cc-embed h3,.cc-embed .cc-title{font-size:clamp(20px,3.4vw,26px);}
.cc-embed h4{font-size:19px;}
.cc-embed p{margin:0 0 10px;}
.cc-embed .cc-lede{font-size:clamp(16px,2.2vw,18px);line-height:1.6;color:var(--cc-ink-soft);}
.cc-embed .cc-note{margin:12px 0 0;font:400 13px/1.5 var(--cc-ui);color:var(--cc-muted);}
.cc-embed .cc-label{font:500 12px/1.2 var(--cc-ui);color:var(--cc-muted);
  letter-spacing:.02em;text-transform:uppercase;}
.cc-embed .cc-num{font-family:var(--cc-display);font-weight:700;
  font-size:clamp(22px,4vw,32px);color:var(--cc-blue);font-variant-numeric:tabular-nums;}
.cc-embed a{color:var(--cc-blue);}
/* --- UI --- */
.cc-embed .cc-btn{
  display:inline-block;padding:10px 20px;
  border:1px solid var(--cc-blue);border-radius:var(--cc-radius);
  background:var(--cc-blue);color:#fff;text-decoration:none;
  font:700 18px/26px var(--cc-display);cursor:pointer;
  transition:background .18s,color .18s;}
.cc-embed .cc-btn:hover{background:var(--cc-blue-dark);border-color:var(--cc-blue-dark);}
.cc-embed .cc-btn--ghost{background:#fff;color:var(--cc-blue);}
.cc-embed .cc-btn--ghost:hover{background:var(--cc-blue);color:#fff;}
.cc-embed .cc-btn--sm{padding:7px 14px;font-size:15px;line-height:22px;}
.cc-embed .cc-btn[aria-pressed="true"]{background:#fff;color:var(--cc-blue);}
.cc-embed .cc-card{background:var(--cc-white);border:1px solid var(--cc-line);
  border-radius:var(--cc-radius-sm);padding:14px 16px;}
.cc-embed .cc-badge{display:inline-block;padding:3px 10px;border-radius:999px;
  background:var(--cc-blue);color:#fff;font:700 12px/18px var(--cc-ui);}
.cc-embed .cc-badge--red{background:var(--cc-red);}
.cc-embed .cc-badge--soft{background:#eaf3fd;color:var(--cc-blue-dark);}
.cc-embed input,.cc-embed select,.cc-embed textarea{
  font:400 16px/24px var(--cc-ui);color:var(--cc-ink);
  padding:9px 12px;background:#fff;border:1px solid var(--cc-line);
  border-radius:var(--cc-radius-sm);}
.cc-embed input[type=range]{padding:0;border:0;background:none;accent-color:var(--cc-blue);width:100%;}
.cc-embed :focus-visible{outline:3px solid var(--cc-blue);outline-offset:2px;}
.cc-embed table{width:100%;border-collapse:collapse;font:400 15px/1.4 var(--cc-ui);}
.cc-embed th{text-align:left;font-weight:700;color:var(--cc-muted);
  text-transform:uppercase;font-size:12px;letter-spacing:.05em;padding:8px 10px;}
.cc-embed td{padding:10px;border-top:1px solid var(--cc-line);}
.cc-embed img,.cc-embed svg,.cc-embed canvas{max-width:100%;}
.cc-embed .cc-grid{display:grid;gap:var(--cc-gap);
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));}
.cc-embed .cc-row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--cc-gap);}
.cc-embed .cc-sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}
@media (prefers-reduced-motion:reduce){.cc-embed *{transition:none!important;animation:none!important;}}
</style>


<style>
.cc-somfy{
  --ink:#1c2f39; --ink2:#5d6e76; --line:#ebe5dd;
  --navy:#25485a; --navy-d:#1b3746; --sand:#e3dbd1; --track:#f1ece5; --cream:#f6f3ef; --amber:#fab800;
  --sc:1; --ease:cubic-bezier(.2,.7,.2,1);
  --hf:max(26px, calc(clamp(30px,6.2vw,40px)*var(--sc)));      /* velké číslo */
  --mf:max(20px, calc(clamp(22px,4.4vw,27px)*var(--sc)));      /* střední číslo */
  --lf:max(14px, calc(clamp(14px,2.5vw,15px)*var(--sc)));      /* věta u čísla */
  --tf:max(12px, calc(clamp(12px,2.2vw,13px)*var(--sc)));      /* popisky lamel */
  --cf:max(13px, calc(clamp(13px,2.4vw,14px)*var(--sc)));      /* nadpis grafu */
  --gap:calc(clamp(10px,2vw,14px)*var(--sc));
  --bh:calc(clamp(9px,1.6vw,10px)*var(--sc));                   /* výška lamely */
  box-sizing:border-box;height:100%;display:flex;flex-direction:column;overflow:hidden;position:relative;
  padding:clamp(16px,4.2vw,28px) clamp(16px,4.2vw,30px) clamp(16px,3.6vw,24px);
  background:radial-gradient(110% 50% at 100% 0%, rgba(250,184,0,.10), rgba(250,184,0,0) 60%), #fff;
  border:1px solid #e7e1d9;border-radius:var(--cc-radius);color:var(--ink);
  box-shadow:0 1px 2px rgba(37,72,90,.06), 0 14px 32px -20px rgba(27,55,70,.45);
  font-family:var(--cc-display);
}
.cc-somfy *{box-sizing:border-box;}
.cc-somfy button{font:inherit;color:inherit;margin:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}

/* záhlaví */
.cc-somfy__hd{flex:0 0 auto;display:flex;align-items:flex-start;gap:12px;}
.cc-somfy .cc-somfy__title{margin:0;color:#000;letter-spacing:-.01em;font-size:max(17px, calc(clamp(19px,4.4vw,24px)*var(--sc)));line-height:1.2;}
.cc-somfy .info{margin-left:auto;flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid #c3bbb1;background:#fff;color:var(--ink2);
  cursor:pointer;display:grid;place-items:center;font:600 13px/1 var(--cc-display);transition:border-color .15s,color .15s;}
.cc-somfy .info:hover{border-color:var(--navy);color:var(--navy);}

/* čísla */
.val{display:inline-block;white-space:nowrap;color:var(--ink);font:600 var(--mf)/1 var(--cc-display);letter-spacing:-.01em;font-variant-numeric:tabular-nums;transition:opacity .6s var(--ease) .15s;}
.val.hero{font-size:var(--hf);letter-spacing:-.02em;}
.val.sm{font-size:var(--lf);letter-spacing:0;}
.val .u{display:inline-block;font-size:.7em;margin-left:.18em;letter-spacing:0;}

/* číslo + věta */
.st{display:flex;align-items:center;gap:clamp(12px,3vw,18px);}
.st .val{flex:none;}
.cc-somfy .st__t{margin:0;min-width:0;flex:1 1 auto;color:var(--ink);font:500 var(--lf)/1.32 var(--cc-display);letter-spacing:-.005em;text-wrap:balance;}
.cc-somfy .cap{margin:0 0 calc(10px*var(--sc));color:var(--ink);font:600 var(--cf)/1.3 var(--cc-display);}

/* mřížka kapitol */
.cc-somfy__grid{flex:1 1 auto;min-height:0;display:grid;margin-top:calc(clamp(10px,2.4vw,16px)*var(--sc));
  grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr);grid-template-areas:"a a" "b c" "d e";
  align-content:space-between;column-gap:clamp(20px,4.4vw,32px);row-gap:calc(14px*var(--sc));}
.vs{min-width:0;padding-top:calc(clamp(12px,2.6vw,16px)*var(--sc));border-top:1px solid var(--line);display:flex;flex-direction:column;}
.vs--a{grid-area:a;border-top:0;padding-top:0;} .vs--b{grid-area:b;} .vs--c{grid-area:c;} .vs--d{grid-area:d;} .vs--e{grid-area:e;}
.vs__viz{margin-top:var(--gap);}

/* lamela = vodorovný pruh s jemnými svislými spárami */
.slat{--fill:var(--navy);
  background:linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,0) 55%, rgba(0,0,0,.10)),
             repeating-linear-gradient(90deg, rgba(255,255,255,0) 0 9px, rgba(255,255,255,.13) 9px 10px), var(--fill);}
.bar{position:relative;height:var(--bh);border-radius:99px;background:var(--track);overflow:hidden;}
.bar__f{position:absolute;inset:0 auto 0 0;width:var(--w);border-radius:99px;clip-path:inset(0 0 0 0 round 99px);
  transition:clip-path 1s var(--ease);transition-delay:var(--d,0ms);}
.cc-somfy.is-pre .vs:not(.is-on) .bar__f{clip-path:inset(0 100% 0 0 round 99px);}
.row + .row{margin-top:calc(11px*var(--sc));}
.row__hd{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:calc(5px*var(--sc));}
.cc-somfy .row__t{margin:0;min-width:0;color:var(--ink);font:400 var(--tf)/1.3 var(--cc-display);}
.row--soft .bar__f{--fill:#7d97a4;}

/* A stínění – panelák na výšku a výřez oken se stíněním */
.cc-somfy .ctl__w{margin:0;font:400 var(--tf)/1.2 var(--cc-display);color:var(--ink2);}
.hs{display:grid;grid-template-columns:calc(clamp(170px,32vw,206px)*var(--sc)) minmax(0,1fr);grid-template-areas:"b n" "b c";
  column-gap:clamp(20px,4.4vw,32px);row-gap:calc(14px*var(--sc));align-items:start;}
.hs__n{grid-area:n;} .hs .ctl{grid-area:c;align-self:end;}
.bld{grid-area:b;position:relative;padding:0 calc(6px*var(--sc));}
.bld__f{position:relative;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:calc(5px*var(--sc)) calc(4px*var(--sc));
  padding:calc(9px*var(--sc)) calc(8px*var(--sc)) calc(7px*var(--sc));background:#f3ede5;border:1.5px solid var(--sand);border-bottom:0;}
.bld__f::before{content:"";position:absolute;left:-6px;right:-6px;top:-6px;height:6px;border-radius:2px;background:#cbc0b2;}       /* atika */
.bld__gf{position:relative;height:calc(26px*var(--sc));background:#e8e0d5;border:1.5px solid var(--sand);border-top:0;}            /* přízemí */
.bld__door{position:absolute;left:50%;bottom:0;width:calc(20px*var(--sc));height:calc(19px*var(--sc));margin-left:calc(-10px*var(--sc));
  background:linear-gradient(170deg,#3a6075,var(--navy-d));border-radius:2px 2px 0 0;}
.bld__door::before{content:"";position:absolute;left:-5px;right:-5px;top:-4px;height:3px;border-radius:2px;background:var(--navy);}    /* stříška nad vchodem */
.bld__gf i{position:absolute;bottom:calc(7px*var(--sc));width:22%;height:calc(10px*var(--sc));border-radius:1.5px;background:linear-gradient(170deg,#fafcfd,#e2eaee);box-shadow:0 0 0 1px #d6cdc1;}
.bld__gf i:first-child{left:8%;} .bld__gf i:last-child{right:8%;}
.bld::after{content:"";display:block;height:3px;margin:0 calc(-4px*var(--sc));border-radius:2px;background:#d9d0c4;}            /* chodník */
.w{position:relative;display:block;aspect-ratio:1.15;overflow:hidden;border-radius:1.5px;background:linear-gradient(170deg,#fafcfd,#e2eaee);box-shadow:0 0 0 1px #ddd4c8;}
.w__bl{position:absolute;inset:0;transform:translateY(-105%);background:repeating-linear-gradient(180deg,#2d5568 0 2.5px,#20404f 2.5px 3.5px);
  transition:transform .55s var(--ease);transition-delay:var(--d,0ms);}
.w.is-sh .w__bl{transform:translateY(-20%);}
.flr{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:calc(5px*var(--sc)) calc(4px*var(--sc));padding:calc(9px*var(--sc));background:var(--cream);border-radius:8px;}
.flr .w{aspect-ratio:.85;}
.flr .w__bl{transform:translateY(-12%);}
.flr .w--auto .w__bl{background:repeating-linear-gradient(180deg,#fbc531 0 2.5px,#e3a300 2.5px 3.5px);}
.flr .w--auto{box-shadow:0 0 0 1px #e3a300, 0 0 0 4px rgba(250,184,0,.25);}
.flr .w--oth .w__bl{background:repeating-linear-gradient(180deg,#a9bcc5 0 2.5px,#8ea4ae 2.5px 3.5px);}
.cc-somfy .lg{display:grid;grid-template-columns:auto auto auto auto minmax(0,1fr);align-items:baseline;column-gap:0;row-gap:calc(5px*var(--sc));margin:calc(10px*var(--sc)) 0 0;transition:opacity .6s var(--ease) .9s;}
.lg__i{display:contents;color:var(--ink);font:400 var(--lf)/1.2 var(--cc-display);}
.lg__i b{font-weight:600;white-space:nowrap;}
.lg__i .lg__int{text-align:right;}            /* celá část doprava, desetinná doleva: čísla stojí pod sebou podle čárky */
.lg__i .lg__pc{padding:0 9px 0 .22em;}
.lg__i span{white-space:nowrap;}
.lg__i i{flex:none;display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:9px;align-self:center;}
.cc-somfy.is-pre .vs:not(.is-on) .w__bl{transform:translateY(-105%);}
.cc-somfy.is-pre .vs:not(.is-on) .lg{opacity:0;}

/* C novostavby – okna s roletou */
.vs--c{justify-content:center;}
.vs--c .cap{text-align:center;margin-bottom:calc(16px*var(--sc));}
.wins{flex:none;margin-top:calc(14px*var(--sc));display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:clamp(12px,3vw,20px);align-items:center;}
.win{display:flex;flex-direction:column;align-items:center;min-width:0;}
.win__f{position:relative;width:100%;max-width:calc(84px*var(--sc));aspect-ratio:.78;border:3px solid var(--sand);border-top-width:0;border-radius:0 0 5px 5px;
  background:linear-gradient(170deg,#f4f7f8 0%,#e7eef1 60%,#dfe8ec 100%);}
.win__f::before{content:"";position:absolute;left:-3px;right:-3px;top:calc(-1*clamp(9px,1.8vw,11px));height:clamp(9px,1.8vw,11px);border-radius:3px 3px 1px 1px;
  background:linear-gradient(180deg,#3a6075,var(--navy-d));z-index:2;}   /* kastlík */
.win__f::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--sand);}
.win__clip{position:absolute;inset:0;overflow:hidden;z-index:1;}
.win__bl{position:absolute;left:0;right:0;top:0;height:100%;transform:translateY(calc(var(--v) - 100%));
  background:repeating-linear-gradient(180deg,#2d5568 0 6px,#20404f 6px 7px);
  box-shadow:0 2px 0 #142a35, 0 6px 8px -4px rgba(20,42,53,.45);
  transition:transform 1.3s var(--ease);transition-delay:var(--d,0ms);}
.cc-somfy.is-pre .vs:not(.is-on) .win__bl{transform:translateY(-100%);}
.win .val{margin-top:calc(10px*var(--sc));}
.cc-somfy .win__n{margin:calc(4px*var(--sc)) 0 0;font:400 var(--tf)/1.2 var(--cc-display);color:var(--ink2);}
.win--cz .win__n{color:var(--ink);font-weight:600;}

/* A nahoře: všichni (má / nemá) */
.tot__l{display:flex;align-items:center;gap:clamp(12px,3vw,18px);min-width:0;}
.val.mute{color:var(--ink2);}

/* B 4,7 z 10 s telefony */
.mob{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;column-gap:clamp(12px,3vw,18px);row-gap:calc(8px*var(--sc));}
.mob .phs{grid-column:1 / -1;}
.val .u--of{font-size:.5em;font-weight:500;margin-left:.28em;color:var(--ink2);}
.phs{display:flex;justify-content:space-between;gap:4px;}
.ph{flex:1 1 0;min-width:0;max-width:calc(20px*var(--sc));}
.ph svg{display:block;width:100%;height:auto;}
.ph__off{fill:var(--track);}
.ph__on{fill:var(--navy);clip-path:inset(var(--cut) 0 0 0);transition:clip-path .5s var(--ease);transition-delay:var(--d,0ms);}
.cc-somfy.is-pre .vs:not(.is-on) .ph__on{clip-path:inset(100% 0 0 0);}
.ph__btn{fill:#ddd5ca;} .ph__btn.is-full{fill:#7d97a4;}

/* B první nákup jako obrazovka telefonu */
.scr{position:relative;margin-top:calc(12px*var(--sc));padding:calc(20px*var(--sc)) calc(9px*var(--sc)) calc(9px*var(--sc));
  border:calc(4px*var(--sc)) solid var(--navy-d);border-radius:calc(20px*var(--sc));background:var(--cream);}
.scr::before{content:"";position:absolute;left:50%;top:calc(7px*var(--sc));width:calc(46px*var(--sc));height:calc(6px*var(--sc));margin-left:calc(-23px*var(--sc));border-radius:99px;background:var(--navy-d);}
.scr .cap{margin:0 0 calc(7px*var(--sc)) calc(3px*var(--sc));}
.tile{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;column-gap:9px;row-gap:calc(4px*var(--sc));
  padding:calc(6px*var(--sc)) calc(9px*var(--sc));background:#fff;border-radius:calc(10px*var(--sc));box-shadow:0 1px 2px rgba(27,55,70,.08);}
.tile + .tile{margin-top:calc(5px*var(--sc));}
.tile__ic{grid-row:1 / 3;width:calc(26px*var(--sc));height:calc(26px*var(--sc));border-radius:8px;background:#e9eef0;display:grid;place-items:center;}
.tile__ic svg{width:62%;height:62%;fill:none;stroke:var(--navy);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.cc-somfy .tile .row__t{font-weight:500;}
.tile .bar{grid-column:2 / 4;height:calc(5px*var(--sc));}

/* D horko: slunce a stín */
.sun{position:relative;margin:calc(30px*var(--sc)) 0 calc(12px*var(--sc));}
.sun__strip{position:relative;height:calc(clamp(26px,4.6vw,30px)*var(--sc));border-radius:8px;overflow:hidden;background:#e9eef0;}
.sun__lit{position:absolute;inset:0 auto 0 0;width:var(--lit);
  background:repeating-linear-gradient(115deg, rgba(255,255,255,0) 0 16px, rgba(255,255,255,.32) 16px 22px), linear-gradient(90deg,#ffd65c,#ffe7a3);
  clip-path:inset(0 0 0 0);transition:clip-path 1s var(--ease);}
.sun__sh{position:absolute;inset:0 auto 0 0;width:var(--sh);overflow:hidden;}
.sun__sh span{position:absolute;inset:0;transform:translateX(0);
  background:repeating-linear-gradient(180deg, rgba(32,64,79,.9) 0 5px, rgba(32,64,79,.55) 5px 7px);
  box-shadow:2px 0 6px -1px rgba(20,42,53,.35);transition:transform .9s var(--ease) 1.1s;}
.sun__br{position:relative;display:block;width:var(--lit);height:7px;border:1.5px solid #e3a300;border-bottom:0;margin-bottom:5px;transition:opacity .4s var(--ease) .9s;}
.sun__br--sh{width:var(--sh);border-color:var(--navy);border-top:0;border-bottom:1.5px solid var(--navy);margin:5px 0 0;transition-delay:1.9s;}
.sun__ic{position:absolute;right:-11px;top:-23px;width:20px;height:20px;}
.sun__ic svg{display:block;width:100%;height:100%;}
.cc-somfy.is-pre .vs:not(.is-on) .sun__lit{clip-path:inset(0 100% 0 0);}
.cc-somfy.is-pre .vs:not(.is-on) .sun__sh span{transform:translateX(-102%);}
.cc-somfy.is-pre .vs:not(.is-on) .sun__br{opacity:0;}
.vs--d > .st:first-child{padding-right:16px;}

/* E sloupce a čára celku */
.cols{flex:1 1 auto;display:flex;flex-direction:column;justify-content:flex-end;min-height:calc(110px*var(--sc));}
.cols__in{position:relative;height:calc(clamp(104px,18vw,122px)*var(--sc));display:flex;align-items:flex-end;gap:clamp(12px,3vw,18px);padding:0 4px;border-bottom:1.5px solid var(--sand);}
.col{position:relative;flex:1 1 0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;}
.col .val{position:absolute;left:50%;bottom:calc(var(--h)*.82 + 5px);transform:translateX(-50%);}
.col__b{display:block;width:100%;height:calc(var(--h)*.82);border-radius:6px 6px 0 0;transform-origin:bottom;transition:transform 1s var(--ease);transition-delay:var(--d,0ms);}
.col--soft .col__b{--fill:#7d97a4;}
.col--all .col__b{--fill:#d9d0c4;}
.col--all .val{color:var(--ink2);}
.cc-somfy.is-pre .vs:not(.is-on) .col__b{transform:scaleY(0);}
.cols__lb{display:flex;gap:clamp(12px,3vw,18px);padding:calc(6px*var(--sc)) 4px 0;}
.cc-somfy .cols__lb p{flex:1 1 0;margin:0;text-align:center;font:400 var(--tf)/1.25 var(--cc-display);color:var(--ink2);text-wrap:balance;}

/* hodnoty se ukážou, až se kapitola rozehraje */
.cc-somfy.is-pre .vs:not(.is-on) .val{opacity:0;}

/* panel (i) */
.panel{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:clamp(12px,3vw,24px);
  background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);border-radius:var(--cc-radius);}
.panel[hidden]{display:none;}
.panel__box{position:relative;width:100%;max-width:470px;max-height:100%;display:flex;flex-direction:column;background:#fff;border:1px solid #e3ddd5;
  border-radius:14px;box-shadow:0 18px 40px -18px rgba(27,55,70,.4);padding:clamp(16px,3.6vw,22px) clamp(16px,3.6vw,24px);}
.panel__hd{display:flex;align-items:flex-start;gap:12px;}
.cc-somfy .panel__t{margin:0;font:600 15px/1.3 var(--cc-display);color:var(--ink);}
.cc-somfy .panel__x{margin-left:auto;flex:none;width:28px;height:28px;border:0;border-radius:50%;background:var(--cream);cursor:pointer;font:400 18px/1 var(--cc-display);color:var(--ink);}
.panel__body{margin-top:10px;overflow-y:auto;min-height:0;}
.cc-somfy .panel__body p{margin:0 0 9px;font:400 13px/1.5 var(--cc-display);color:#3c3c3c;}
.cc-somfy .panel__body p:last-child{margin-bottom:0;}

/* užší než 600 px: kapitoly pod sebou */
@media (max-width:599px){
  .cc-somfy__grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"a" "b" "c" "d" "e";}
  .win__f{max-width:calc(74px*var(--sc));}
  .cols__in{height:calc(118px*var(--sc));}
  .hs{grid-template-columns:calc(clamp(128px,38vw,170px)*var(--sc)) minmax(0,1fr);grid-template-areas:"b n" "c c";column-gap:18px;align-items:center;}
  .hs__n .tot__l{flex-direction:column;align-items:flex-start;gap:6px;}
  .bld__f{gap:calc(4px*var(--sc)) calc(3px*var(--sc));padding:calc(7px*var(--sc)) calc(6px*var(--sc)) calc(5px*var(--sc));}
  .bld__gf{height:calc(20px*var(--sc));}
  .bld__door{width:14px;height:14px;margin-left:-7px;}
  .bld__gf i{bottom:5px;height:7px;}
}
@media (prefers-reduced-motion:reduce){.cc-somfy *,.cc-somfy *::after{transition:none!important;}}
.cc-somfy.is-static *,.cc-somfy.is-static *::after{transition:none!important;}
</style>

<div class="cc-embed cc-somfy" data-cc-somfy>

</div>

<script>
(function(){
  var root = document.querySelector('[data-cc-somfy]');
  if(!root || root.dataset.ccInit) return;
  root.dataset.ccInit = '1';
  var Q = location.search;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var canIO = 'IntersectionObserver' in window;
  var STATIC = /[?&]static\b/.test(Q);
  var ANIM = !reduce && canIO && !STATIC;
  if(ANIM) root.classList.add('is-pre');                            // skrytý výchozí stav hned, žádné probliknutí
  if(STATIC) root.classList.add('is-static');

  /* ===== D: čísla a věty z podkladu redakce, texty panelu (i) ===== */
  var D = {
    title: 'Stínění a chytrá domácnost v číslech',
    a: {v:26, t:'lidí má doma venkovní stínění', cap:'Jak ho ovládají',
        man:{v:70, t:'ručně', n:18}, auto:{v:3.8, t:'automaticky', n:1}, rest:{v:26.2, t:'jinak', n:7}},
    b: {v:4.7, of:10, f:4.74, t:'Čechů si pod chytrou domácností představí ovládání z mobilu', cap:'Jako první by v chytré domácnosti řešili',
        items:[['správu energií',28.3],['chytré vytápění a termostaty',18.9],['hlasové ovládání',8.1]]},
    c: {cap:'Novostavby se stíněním podle Somfy', items:[['Česko',38,1],['Polsko',10],['Francie',75]]},
    d: {v1:64.4, t1:'lidí má v létě doma aspoň občas horko', v2:21.9, t2:'plánuje opatření proti horku'},
    e: {cap:'Koho chytré technologie nezajímají', items:[['příjem do 25 000 Kč',38],['všichni',21.9,'all'],['vysoké příjmy',12.2]], max:40},
    info:['Průzkum STEM/MARK pro Somfy, březen 2026, 511 respondentů.',
          'Podíl „jinak“ (26,2 %) je dopočet do 100 % z podílů ručního (70 %) a automatického (3,8 %) ovládání.',
          '4,7 z 10 odpovídá 47,4 % dotázaných.',
          'Podíl novostaveb se stíněním je odhad Somfy (Česko zhruba 38 %, Polsko asi 10 %, Francie 75 %).']
  };

  var NB = ' ';
  var nb = function(t){ return t.replace(/(^| )([vzsaoikuVZSAOIKU]) /g, '$1$2'+NB).replace(/(\d) (%|Kč|z)/g, '$1'+NB+'$2').replace(/(\d) (\d{3})/g, '$1'+NB+'$2').replace(/z (10)/g, 'z'+NB+'$1'); };
  var fmt = function(n, dec){ return n.toFixed(dec).replace('.', ','); };
  var dec = function(n){ return n % 1 ? 1 : 0; };
  var val = function(n, cls, cd, pre, unit){ return '<span class="val'+(cls?' '+cls:'')+'">'+fmt(n, dec(n))+'<span class="u'+(unit?' u--of':'')+'">'+(unit||'%')+'</span></span>'; };
  var grid = root.querySelector('[data-grid]');
  var st = function(v, t){ return '<div class="st">'+v+'<p class="st__t">'+nb(t)+'</p></div>'; };
  var bar = function(w, d, cls){ return '<div class="bar"><span class="bar__f slat'+(cls?' '+cls:'')+'" style="--w:'+w+'%;--d:'+d+'ms"></span></div>'; };
  var row = function(t, v, d){ return '<div class="row"><div class="row__hd"><p class="row__t">'+nb(t)+'</p>'+val(v, 'sm', d)+'</div>'+bar(v, d)+'</div>'; };
  var SUN = '<svg viewBox="0 0 24 24" aria-hidden="true"><g stroke="#e3a300" stroke-width="1.8" stroke-linecap="round"><path d="M12 1.5v2.6M12 19.9v2.6M1.5 12h2.6M19.9 12h2.6M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></g><circle cx="12" cy="12" r="4.9" fill="#fbc531" stroke="#e3a300" stroke-width="1.2"/></svg>';

  root.querySelector('[data-title]').textContent = D.title;

  /* shrnutí pro čtečky (vizuální části mají aria-hidden) */
  var pc = function(n, t){ return fmt(n, dec(n))+' procent '+t+'.'; };
  root.querySelector('[data-sr]').textContent = [
    D.title,
    pc(D.a.v, D.a.t)+' Z těch, kdo ho mají, ho '+D.a.man.v+' procent ovládá ručně, '+fmt(D.a.auto.v, 1)+' procenta automaticky a '+fmt(D.a.rest.v, 1)+' procenta jinak.',
    fmt(D.b.v, 1)+' z 10 '+D.b.t+'. Jako první by ale pořídili '+D.b.items.map(function(r){ return r[0]+' '+fmt(r[1], 1)+' procenta'; }).join(', ')+'.',
    'Podle Somfy má stínění '+D.c.items.map(function(r){ return r[1]+' procent novostaveb v zemi '+r[0]; }).join(', ')+'.',
    pc(D.d.v1, D.d.t1), pc(D.d.v2, D.d.t2),
    'Chytré technologie nezajímají 21,9 procenta lidí, v domácnostech s příjmem do 25 000 Kč 38 procent a u vysokých příjmů 12,2 procenta.',
    'Zdroj: '+D.info.join(' ')
  ].join(' ');
  root.querySelector('[data-pbody]').innerHTML = D.info.map(function(t){ return '<p>'+nb(t)+'</p>'; }).join('');

  function sec(key, inner){
    var s = document.createElement('section');
    s.className = 'vs vs--'+key; s.setAttribute('aria-hidden', 'true');
    s.innerHTML = inner;
    grid.appendChild(s); return s;
  }

  /* A stínění: panelák s deseti patry po deseti oknech, roletu má 26; vedle výřez oken se stíněním podle ovládání */
  var A = D.a, seed = 11, rnd = function(){ seed = (seed*9301 + 49297) % 233280; return seed/233280; };
  var sh = {}, per = [3, 2, 3, 3, 2, 3, 2, 3, 3, 2];                 // 26 oken se stíněním rozprostřených po deseti patrech
  per.forEach(function(n, fl){ var c = 0; while(c < n){ var i = fl*10 + Math.floor(rnd()*10); if(!sh[i]){ sh[i] = 1; c++; } } });
  var order = Object.keys(sh).map(Number).sort(function(x, y){ return (x*37 % 26) - (y*37 % 26); });
  var bw = '';
  for(var i=0; i<100; i++) bw += sh[i] ? '<span class="w is-sh" style="--d:'+(order.indexOf(i)*28)+'ms"><span class="w__bl"></span></span>' : '<span class="w"></span>';
  var fw = '';
  for(var j=0; j<A.man.n + A.auto.n + A.rest.n; j++){
    var cls = j < A.man.n ? 'man' : j < A.man.n + A.auto.n ? 'auto' : 'oth';
    fw += '<span class="w w--'+cls+'" style="--d:'+(900 + j*35)+'ms"><span class="w__bl"></span></span>';
  }
  var chip = function(c){ return '<i style="background:'+c+'"></i>'; };
  sec('a', '<div class="hs">'
    + '<div class="bld"><div class="bld__f">'+bw+'</div><div class="bld__gf"><i></i><span class="bld__door"></span><i></i></div></div>'
    + '<div class="hs__n"><div class="tot__l">'+val(A.v, 'hero')+'<p class="st__t">'+nb(A.t)+'</p></div>'
    + '</div>'
    + '<div class="ctl"><p class="cap">'+A.cap+'</p><div class="flr">'+fw+'</div>'
    + '<div class="lg">'
    +   [[A.man, '#25485a'], [A.auto, '#fab800'], [A.rest, '#9fb3bd']].map(function(r){
          var t = fmt(r[0].v, dec(r[0].v)).split(',');
          return '<span class="lg__i">'+chip(r[1])+'<b class="lg__int">'+t[0]+'</b><b>'+(t[1] ? ','+t[1] : '')+'</b><b class="lg__pc">%</b><span>'+r[0].t+'</span></span>';
        }).join('')
    + '</div></div></div>');

  /* B mobil (4,7 z 10 s telefony) a první nákup na obrazovce telefonu */
  var IC = [
    '<svg viewBox="0 0 24 24"><path d="M13 2 4.5 13.5H12L11 22l8.5-11.5H12z"/></svg>',                                            // energie
    '<svg viewBox="0 0 24 24"><path d="M14 14.8V4.5a2 2 0 0 0-4 0v10.3a4 4 0 1 0 4 0z"/><path d="M12 9v7.5"/></svg>',                // vytápění
    '<svg viewBox="0 0 24 24"><rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>' // hlas
  ];
  var phones = '';
  for(var k=0; k<D.b.of; k++){
    var f = Math.max(0, Math.min(1, D.b.f - k));
    phones += '<span class="ph"><svg viewBox="0 0 22 36"><rect class="ph__off" x="1" y="1" width="20" height="34" rx="4.5"/>'
      + '<rect class="ph__on" x="1" y="1" width="20" height="34" rx="4.5" style="--cut:'+((1-f)*100).toFixed(1)+'%;--d:'+(k*90)+'ms"/>'
      + '<rect class="ph__btn'+(f >= 1 ? ' is-full' : '')+'" x="8" y="30.4" width="6" height="1.7" rx=".85"/></svg></span>';
  }
  sec('b', '<div class="mob">'+val(D.b.v, 'hero', null, null, 'z'+NB+D.b.of)+'<p class="st__t">'+nb(D.b.t)+'</p><div class="phs">'+phones+'</div></div>'
    + '<div class="scr"><p class="cap">'+nb(D.b.cap)+'</p>'+D.b.items.map(function(r, i){
        var d = 500 + i*180;
        return '<div class="tile"><span class="tile__ic">'+IC[i]+'</span><p class="row__t">'+nb(r[0])+'</p>'+val(r[1], 'sm', d)+bar(r[1], d)+'</div>';
      }).join('')+'</div>');

  /* C novostavby */
  sec('c', '<p class="cap">'+nb(D.c.cap)+'</p><div class="wins">' + D.c.items.map(function(r, i){
    return '<div class="win'+(r[2]?' win--cz':'')+'"><div class="win__f"><div class="win__clip"><span class="win__bl" style="--v:'+r[1]+'%;--d:'+(i*220)+'ms"></span></div></div>'
      + val(r[1], '', i*220)+'<p class="win__n">'+r[0]+'</p></div>';
  }).join('') + '</div>');

  /* D horko: slunce na podlaze, stín žaluzie jen na části */
  sec('d', st(val(D.d.v1), D.d.t1)
    + '<div class="sun" style="--lit:'+D.d.v1+'%;--sh:'+D.d.v2+'%">'
    +   '<span class="sun__br sun__br--lit"><span class="sun__ic">'+SUN+'</span></span>'
    +   '<div class="sun__strip"><span class="sun__lit"></span><span class="sun__sh"><span></span></span></div>'
    +   '<span class="sun__br sun__br--sh"></span>'
    + '</div>'
    + st(val(D.d.v2, '', 1100), D.d.t2));

  /* E nezájem podle příjmu: dva sloupce a čára celku */
  var E = D.e, pct = function(v){ return (v/E.max*100).toFixed(2)+'%'; };
  sec('e', '<p class="cap">'+E.cap+'</p>'
    + '<div class="cols"><div class="cols__in">'
    +   E.items.map(function(r, i){ return '<div class="col'+(r[2] ? ' col--all' : i ? ' col--soft' : '')+'" style="--h:'+pct(r[1])+';--d:'+(i*200)+'ms">'+val(r[1], 'sm')+'<span class="col__b slat"></span></div>'; }).join('')
    + '</div></div>'
    + '<div class="cols__lb">'+E.items.map(function(r){ return '<p>'+nb(r[0])+'</p>'; }).join('')+'</div>');

  /* ===== pomocníci ===== */
  var all = [].slice.call(grid.children);
  function bindTap(el, fn){   // pointerdown kvůli mobilu, click jen pro čtečky, klávesy zvlášť
    var last = 0;
    el.addEventListener('pointerdown', function(e){ if(e.button > 0) return; e.preventDefault(); last = Date.now(); fn(e); });
    el.addEventListener('click', function(e){ e.preventDefault(); if(Date.now() - last > 600) fn(e); });
    el.addEventListener('keydown', function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); last = Date.now(); fn(e); } });
  }

  /* ===== panel (i) ===== */
  var info = root.querySelector('[data-info]'), panel = root.querySelector('[data-panel]'), closeBtn = root.querySelector('[data-close]');
  function openP(){ panel.hidden = false; info.setAttribute('aria-expanded', 'true'); closeBtn.focus({preventScroll:true}); }
  function closeP(){ if(panel.hidden) return; panel.hidden = true; info.setAttribute('aria-expanded', 'false'); info.focus({preventScroll:true}); }
  bindTap(info, function(){ panel.hidden ? openP() : closeP(); });
  bindTap(closeBtn, closeP);
  panel.addEventListener('pointerdown', function(e){ if(e.target === panel) closeP(); });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape') closeP();
    if(e.key === 'Tab' && !panel.hidden){ e.preventDefault(); closeBtn.focus(); }   // v otevřeném panelu je jediný ovládací prvek
  });

  /* ===== vyplnění rámu ===== */
  function over(){   // měří se rozložení kapitol vůči mřížce, ne scrollHeight
    var gb = grid.getBoundingClientRect().bottom, mx = 0;
    all.forEach(function(s){ mx = Math.max(mx, s.getBoundingClientRect().bottom); });
    return mx > gb + 1;
  }
  function fit(){
    var sc = 1; root.style.setProperty('--sc', 1);
    for(var k=0; k<18 && over() && sc > .66; k++){ sc *= .95; root.style.setProperty('--sc', sc.toFixed(3)); }
  }
  var rt;
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  if(window.ResizeObserver) new ResizeObserver(function(){ clearTimeout(rt); rt = setTimeout(fit, 90); }).observe(root);
  fit();

  /* ===== nástup po kapitolách ===== */
  function play(s, anim){
    if(s.classList.contains('is-on')) return;
    s.classList.add('is-on');
  }
  if(!ANIM){ all.forEach(function(s){ play(s, false); }); }
  else {
    var alive = false;
    var io = new IntersectionObserver(function(en){
      alive = true;
      en.forEach(function(x){ if(x.isIntersecting){ io.unobserve(x.target); play(x.target, true); } });
    }, {threshold:.45});
    all.forEach(function(s){ io.observe(s); });
    setTimeout(function(){ if(!alive) all.forEach(function(s){ play(s, false); }); }, 6000);   // záloha pro nefunkční IO
  }
  if(/[?&]info\b/.test(Q)) openP();
})();
</script>
</body>
</html>
