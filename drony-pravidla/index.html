<!-- CSG × UpVision × CzechCrunch – interaktivní krajina „Jak se v Česku létá s dronem“.
     Cíl: nativní článek cc.cz o systému CIS+ pro ŘLP. Vkládá se kódem z drony-pravidla-vlozeni.html
       (obalový div s výškou 480 px na desktopu a 580 px na mobilu, uvnitř iframe).
     Nasazení: matyas-cloud/cc-embed/drony-pravidla/index.html, Poppins ze sdílené složky ../fonts/.
     Formát: bílá plocha s linkou (nativ). Uvnitř tmavomodrá pixelová krajina široká asi jako tři a půl rámu,
       sedm zastávek, nahoře roletky ze štítků, dole posuvník se zobáčkem. Krajina se táhne myší nebo prstem
       a po puštění dosedne na nejbližší zastávku. Při ≤ 619 px šířky rámu mobilní formát (popisek jen v posuvníku).
     Data: EASA FAQ k otevřené kategorii (A1 do 250 g, A2 třída C2 do 4 kg a 30 m od lidí, A3 do 25 kg a 150 m od zástavby,
       do 120 m a na dohled), BVLOS = specifická kategorie s povolením ÚCL (nařízení EU 2019/947);
       Remote ID (nařízení EU 2019/945), zóny a DroneMap (ÚCL), U-space (nařízení EU 2021/664), CIS+ (TZ CSG 9. 11. 2026).
       Stav k 14. 11. 2026. Scéna je ilustrační, vzdálenosti nejsou v měřítku.
     Texty jsou v bloku OBSAH na začátku skriptu.
     Parametry pro náhledy: ?static (bez pohybu a nástupu), ?sel=s250|s4|s25|bv|rid|apt|us, ?info (otevřené (i)).
     Log změn:
       2026-11-10  první ostrá verze podle makety A1 v2 a Mattových připomínek: posuvník jako okýnko tachometru se zobáčkem,
                   roletka nad scénou, krajina vykreslená jednou, drony jako samostatné sprity, paralaxa ve dvou vrstvách,
                   nástup až po zobrazení, opravy z nezávislé UX revize.
       2026-11-10  podle designové banky: okýnko se zobáčkem jako fyzický jezdec (zamáčkne se), světlo vybraného dronu na zemi,
                   přechody v oklch, roletka bez přestřelu s textem, který zaostří, bez dýchajícího majáku a hover zvětšování.
       2026-11-10  sjednocení s ostatními prvky CC v článcích: ploché karty bez přechodů, okraje, záhlaví, (i) a panel jako u Visa a Mavie,
                   popisky pod okýnkem se schovají, nízký široký rám ukáže víc oblohy.
       2026-11-10  nápověda před první interakcí (šipka se zmáčkne, okraj se rozsvítí, krajina s okýnkem popojede, nejvýš 4×),
                   texty jako krátké věty s třídou v nadpisu roletky, dav i lidé jako panáčci. -->

<style>
.cc-embed.cc-drony-pravidla{
  --navy:#2b3046; --org:#fb7d0f; --ink:#16181c; --ink2:#5b616b; --ink3:#3c3c3c; --line:#e0e0e0;
  --pop:0 12px 28px -14px rgba(8,10,20,.8),0 2px 6px -2px rgba(8,10,20,.35);
  --ease-cam:cubic-bezier(.65,0,.35,1); --ease-spring:cubic-bezier(.34,1.42,.64,1); --ease-out:cubic-bezier(.22,1,.36,1); --ease-expo:cubic-bezier(.16,1,.3,1);
  box-sizing:border-box;position:relative;display:flex;flex-direction:column;height:100vh;margin:0!important;overflow:hidden;
  padding:clamp(16px,4.2vw,28px) clamp(16px,4.2vw,30px) clamp(14px,3.2vw,22px);background:#fff;border:1px solid var(--line);border-radius:var(--cc-radius);color:var(--ink);
  font-family:var(--cc-display);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;}
.cc-drony-pravidla.is-static *,.cc-drony-pravidla.is-static *::before,.cc-drony-pravidla.is-static *::after{transition:none!important;animation:none!important;}
.cc-drony-pravidla button{font-family:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation;cursor:pointer;}
/* záhlaví stejně jako u ostatních prvků v článcích CC */
.cc-drony-pravidla .dp-head{flex:0 0 auto;display:flex;align-items:flex-start;gap:12px;margin:0 0 14px;}
.cc-drony-pravidla .dp-title{margin:0;font:700 clamp(19px,4.4vw,24px)/1.2 var(--cc-display);letter-spacing:-.01em;color:var(--ink);}
.cc-drony-pravidla .dp-i{position:relative;margin-left:auto;flex:none;width:26px;height:26px;padding:0;border-radius:50%;border:1.5px solid #b4bac4;background:#fff;color:var(--ink2);
  display:grid;place-items:center;font:600 13px/1 var(--cc-display);transition:border-color .15s,color .15s;}
.cc-drony-pravidla .dp-i::after{content:"";position:absolute;inset:-9px;}
@media (hover:hover){ .cc-drony-pravidla .dp-i:hover{border-color:var(--ink);color:var(--ink);} }

/* ===== scéna ===== */
.cc-drony-pravidla .dp-stage{position:relative;flex:1 1 auto;min-height:0;border-radius:var(--cc-radius-sm);overflow:hidden;overflow:clip;touch-action:pan-y;cursor:grab;
  background:radial-gradient(120% 70% at 50% 108%,rgba(251,125,15,.2),rgba(251,125,15,0) 58%),linear-gradient(180deg,#1b1f33 0%,#242941 48%,#2b3046 100%);
  background:radial-gradient(120% 70% at 50% 108% in oklch,rgba(251,125,15,.22),rgba(251,125,15,0) 60%),linear-gradient(180deg in oklch,#191c30 0%,#232840 46%,#2d3249 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);}
.cc-drony-pravidla .dp-stage.is-drag{cursor:grabbing;}
.cc-drony-pravidla .dp-stage::before,.cc-drony-pravidla .dp-stage::after{content:"";position:absolute;top:0;bottom:0;width:44px;z-index:6;pointer-events:none;transition:opacity .35s;}
.cc-drony-pravidla .dp-stage::before{left:0;background:linear-gradient(to right,rgba(24,27,43,.88),rgba(24,27,43,0));}
.cc-drony-pravidla .dp-stage::after{right:0;background:linear-gradient(to left,rgba(24,27,43,.88),rgba(24,27,43,0));}
.cc-drony-pravidla.is-m .dp-stage::before,.cc-drony-pravidla.is-m .dp-stage::after{width:26px;}
.cc-drony-pravidla .dp-stage.at-start::before,.cc-drony-pravidla .dp-stage.at-end::after{opacity:0;}
.cc-drony-pravidla .dp-lay{position:absolute;left:0;top:0;will-change:transform;transition:transform var(--dur,.8s) var(--ease-cam);}
.cc-drony-pravidla .dp-stage.is-drag .dp-lay,.cc-drony-pravidla .dp-lay.no-tr{transition:none!important;}
.cc-drony-pravidla .dp-lay svg{display:block;max-width:none;}
.cc-drony-pravidla .dp-ceil{position:absolute;left:12px;z-index:2;font:400 12px/1 var(--cc-display);color:rgba(255,255,255,.5);pointer-events:none;transition:opacity .3s;}
.cc-drony-pravidla .dp-ceil.is-hid{opacity:0;}

/* svět: značky vybrané zastávky se dokreslí po dosednutí kamery */
.cc-drony-pravidla .mk{opacity:0;transition:opacity .2s;}
.cc-drony-pravidla .dp-world.is-marks[data-k="s250"] .mk-s250,
.cc-drony-pravidla .dp-world.is-marks[data-k="s4"] .mk-s4,
.cc-drony-pravidla .dp-world.is-marks[data-k="s25"] .mk-s25,
.cc-drony-pravidla .dp-world.is-marks[data-k="bv"] .mk-bv,
.cc-drony-pravidla .dp-world.is-marks[data-k="apt"] .mk-apt,
.cc-drony-pravidla .dp-world.is-marks[data-k="us"] .mk-us{opacity:1;transition:opacity .45s var(--ease-out) .05s;}
.cc-drony-pravidla .mk-x{transform-box:fill-box;transform-origin:center;transform:scale(1.6);transition:transform .4s var(--ease-spring) .25s;}
.cc-drony-pravidla .dp-world.is-marks[data-k="bv"] .mk-x{transform:none;}
.cc-drony-pravidla .mk-us .gd{opacity:0;transition:opacity .2s;}
.cc-drony-pravidla .dp-world.is-marks[data-k="us"] .mk-us .gd{opacity:.8;transition:opacity .35s ease var(--d,0ms);}
.cc-drony-pravidla .dp-b{transform-box:fill-box;transition:transform .8s var(--ease-spring) var(--d,0ms);}
.cc-drony-pravidla.is-pre .dp-b{transform:translateY(105%);}

/* drony jako samostatné sprity: animace běží mimo vykreslování krajiny */
.cc-drony-pravidla .dp-spr{position:absolute;pointer-events:none;--r:#a3abbb;--b:#7a849a;--p:#7a849a;transition:opacity .5s var(--ease-out) var(--d,0ms),transform .7s var(--ease-spring) var(--d,0ms);}
.cc-drony-pravidla .dp-spr::before{content:"";position:absolute;left:50%;top:50%;width:var(--gw,90px);height:var(--gw,90px);margin:calc(var(--gw,90px)/-2) 0 0 calc(var(--gw,90px)/-2);border-radius:50%;
  background:radial-gradient(closest-side,rgba(251,125,15,.34),rgba(251,125,15,.11) 45%,rgba(251,125,15,0));opacity:.25;transition:opacity .6s var(--ease-out);}
.cc-drony-pravidla .dp-spr svg{position:relative;display:block;}
/* jediné světlo ve scéně: vybraný dron rozsvítí zem pod sebou */
.cc-drony-pravidla .dp-pool{position:absolute;pointer-events:none;border-radius:50%;opacity:0;mix-blend-mode:screen;
  background:radial-gradient(closest-side,rgba(253,160,70,.5),rgba(251,125,15,.16) 55%,rgba(251,125,15,0));transform:scaleX(.6);transition:opacity .25s,transform .25s;}
.cc-drony-pravidla .dp-pool.is-on{opacity:1;transform:none;transition:opacity .9s var(--ease-out) .25s,transform 1.1s var(--ease-expo) .25s;}
.cc-drony-pravidla.is-pre .dp-pool{opacity:0;}
.cc-drony-pravidla .dp-spr .r{fill:var(--r);} .cc-drony-pravidla .dp-spr .b{fill:var(--b);} .cc-drony-pravidla .dp-spr .p{fill:var(--p);}
.cc-drony-pravidla .dp-spr .rb{opacity:0;}
.cc-drony-pravidla .dp-spr.is-on{--r:#fb7d0f;--b:#ffffff;--p:#fdb24c;}
.cc-drony-pravidla .dp-spr.is-on::before{opacity:1;}
.cc-drony-pravidla.is-live .dp-spr.is-on svg{animation:cdparrive .6s var(--ease-out),cdpbob 3.4s ease-in-out .6s infinite;}
.cc-drony-pravidla.is-live .dp-spr.is-on .ra{animation:cdprot .14s steps(1) infinite;}
.cc-drony-pravidla.is-live .dp-spr.is-on .rb{animation:cdprot .14s steps(1) infinite reverse;}
.cc-drony-pravidla.is-pre .dp-spr{opacity:0;transform:translateY(-12px);}
@keyframes cdparrive{0%{transform:none;}35%{transform:translateY(3px);}100%{transform:none;}}
@keyframes cdpbob{0%,100%{transform:none;}50%{transform:translateY(-2px);}}
@keyframes cdprot{0%{opacity:1;}50%{opacity:0;}}
.cc-drony-pravidla .dp-mini{position:absolute;pointer-events:none;animation:cdplane var(--t,26s) linear var(--dl,0s) infinite;animation-play-state:paused;}
.cc-drony-pravidla .dp-cam.is-us .dp-mini{animation-play-state:running;}
.cc-drony-pravidla.is-off .dp-mini,.cc-drony-pravidla.is-off *{animation-play-state:paused!important;}
@keyframes cdplane{from{transform:translateX(0);}to{transform:translateX(var(--len));}}
.cc-drony-pravidla .dp-waves path{opacity:.3;}
.cc-drony-pravidla .dp-waves.is-on path{stroke:#fb7d0f;opacity:0;}
.cc-drony-pravidla.is-live .dp-waves.is-on path{animation:cdpwave 1.8s ease-out infinite;}
.cc-drony-pravidla.is-live .dp-waves.is-on path:nth-child(2){animation-delay:.3s;}

    var cx = Math.max(0, Math.min(Gm.maxX, camX));
    if(!thumbDrag){ var rx = railFromCam(cx); setThumb(rx, (dragging ? nearest(rx) : cur)); }
    tags.forEach(function(t,i){ var l = t.offsetLeft - camX, cut = l < 4 || Gm.SW - l < 56; t.classList.toggle('is-cut', cut); stems[i].classList.toggle('is-cut', cut && !hudOpen); });
  }
  /* roletka nad scénou: vyjede ze štítku a vrátí se do něj */
  var hudOpen = false, hudT = 0;
  function hudShow(){
    var i=cur, tag=tags[i], c=camF[i], tl = tag.offsetLeft - c, wc = tag.offsetWidth, WO = Gm.WO;
    hudH.innerHTML = icon(ICOF[i], true)+'<span>'+nb(STOPS[i].head||STOPS[i].tag)+'</span>'+(STOPS[i].badge?'<em>'+nb(STOPS[i].badge)+'</em>':'');
    var ms = document.createElement('span'); ms.className = 'dp-hud__h dp-meas'; ms.innerHTML = hudH.innerHTML; stage.appendChild(ms);   // nadpis se musí vejít celý
    WO = Math.min(Gm.SW - 16, Math.max(WO, ms.offsetWidth + 2)); stage.removeChild(ms);
    hudB.textContent = nb(STOPS[i].d); hudB.style.width = WO+'px';
    var cap = mobile ? Math.min(330, Gm.SW-20) : 360, max3 = 22 + 13.5*1.5*3 + 2;   // delší text dostane širší roletku, ať má nejvýš tři řádky
    while(WO < cap && hudB.offsetHeight > max3){ WO = Math.min(cap, WO+12); hudB.style.width = WO+'px'; }
    var openL = Math.max(8, Math.min(Gm.SW - WO - 8, tl)), hTop = Gm.top - Math.round(Gm.y0*Gm.u);
    hud.style.top = hTop+'px';
    var cT = parseFloat(ceil.style.top)||0; ceil.classList.toggle('is-hid', openL < 12 + ceil.offsetWidth + 8 && hTop + 34 + hudB.offsetHeight > cT - 4);
    if(MOVE){ hud.classList.add('no-tr'); hud.style.transition='none'; hud.style.left = f(tl)+'px'; hud.style.width = wc+'px'; hud.offsetWidth; hud.style.transition=''; hud.classList.remove('no-tr'); }
    hud.style.left = f(openL)+'px'; hud.style.width = WO+'px'; hud.classList.add('is-on'); tag.classList.add('is-hud'); hudOpen = true;
    worldEl.classList.add('is-marks');
  }
  function hudHide(){
    if(!hudOpen){ return; } hudOpen = false; clearTimeout(hudT);
    var tag=tags[cur]; ceil.classList.remove('is-hid'); hud.classList.remove('is-on'); hud.style.left = f(tag.offsetLeft - camX)+'px'; hud.style.width = tag.offsetWidth+'px';
    hudT = setTimeout(function(){ tags.forEach(function(t){ t.classList.remove('is-hud'); }); }, MOVE ? 180 : 0);
  }
  var selT = 0;
  function select(i, opt){
    opt = opt || {}; if(i<0 || i>6) return;
    stopAttract();
    var from = camX; cur = i; seen[i] = true; camX = camF[i];
    clearTimeout(selT); hudHide(); worldEl.classList.remove('is-marks');
    var dist = Math.abs(camX - from), dur = MOVE ? Math.max(420, Math.min(1100, 420 + dist*.22)) : 0;
    [cam,farEl,midEl,thumb].forEach(function(el){ el.style.setProperty('--dur', dur+'ms'); });
    paint(); place(!MOVE);
    thumb.classList.remove('is-drag');
    if(MOVE) selT = setTimeout(hudShow, dist < 4 ? 60 : dur*.82); else hudShow();
  }

  /* ===================== ovládání ===================== */
  function bindTap(el, fn){   // tap = puštění bez tažení (kvůli posouvání krajiny), click jen pro klávesnici a čtečky
    var last = 0, sx = 0, sy = 0, st = 0, armed = false;
    el.addEventListener('pointerdown', function(e){ if(e.button > 0) return; armed = true; sx = e.clientX; sy = e.clientY; st = Date.now(); });
    el.addEventListener('pointerup', function(e){ if(!armed) return; armed = false; if(Math.abs(e.clientX-sx) < 8 && Math.abs(e.clientY-sy) < 8 && Date.now()-st < 600){ last = Date.now(); fn(e); } });
    el.addEventListener('pointercancel', function(){ armed = false; });
    el.addEventListener('click', function(e){ e.preventDefault(); if(Date.now() - last > 600) fn(e); });
  }
  bindTap(cam, function(e){ var t=e.target.closest('[data-go]'); if(t){ var i=+t.getAttribute('data-go'); if(i!==cur || !hudOpen) select(i); } });
  bindTap(stopsEl, function(e){ var t=e.target.closest('[data-go]'); if(t) select(+t.getAttribute('data-go')); else if(e.clientX){ select(nearest(e.clientX - rail.getBoundingClientRect().left)); } });
  [].slice.call(root.querySelectorAll('[data-edge]')).forEach(function(b){ bindTap(b, function(){ var d=+b.getAttribute('data-edge'), n=cur;
    if(d>0){ while(n<6 && camF[n] <= camX+4) n++; } else { while(n>0 && camF[n] >= camX-4) n--; } select(n); }); });
  stage.addEventListener('scroll', function(){ stage.scrollLeft = 0; stage.scrollTop = 0; });

  // tažení krajiny: gumový odpor na krajích, po puštění dosedne na zastávku (setrvačnost nejvýš o jednu dál)
  var dragging=false, moved=false, decided=false, sx=0, sy=0, sc=0, lastX=0, lastT=0, vel=0, base=0;
  function rubber(v){ return v < 0 ? v*.3 : (v > Gm.maxX ? Gm.maxX + (v-Gm.maxX)*.3 : v); }
  stage.addEventListener('pointerdown', function(e){ if(e.button>0 || e.target.closest('.dp-edge')) return; dragging=true; moved=false; decided=false; sx=lastX=e.clientX; sy=e.clientY; sc=camX; lastT=performance.now(); vel=0; base=cur; });
  stage.addEventListener('pointermove', function(e){ if(!dragging) return; var dx=e.clientX-sx, dy=e.clientY-sy;
    if(!decided){ if(Math.abs(dx)<6 && Math.abs(dy)<6) return; decided=true; if(Math.abs(dy)>Math.abs(dx)){ dragging=false; return; } moved=true; stage.classList.add('is-drag'); try{ stage.setPointerCapture(e.pointerId); }catch(_){} hudHide(); worldEl.classList.remove('is-marks'); clearTimeout(selT); }
    var now=performance.now(); vel = .75*vel + .25*((e.clientX-lastX)/Math.max(1,now-lastT)); lastX=e.clientX; lastT=now;
    camX = rubber(sc-dx); place(true); });
  /* kam dosednout po puštění: jako listování, stačí kousek tahu nebo švih a přijede další zastávka ve směru pohybu */
  function snapTo(sc0, c, fwdV){
    var tol = Gm.SW*.15, d = c - sc0, b = nearest(railFromCam(sc0)), i;
    if(Math.abs(d) < 24 && Math.abs(fwdV) < .35) return nearest(railFromCam(c));
    if(d > 0 || (Math.abs(d) < 24 && fwdV > 0)){ for(i=0;i<6;i++) if(camF[i] >= c - tol) break; return Math.min(6, Math.max(i, b+1)); }
    for(i=6;i>0;i--) if(camF[i] <= c + tol) break; return Math.max(0, Math.min(i, b-1));
  }
  function endDrag(){ if(!dragging) return; dragging=false; stage.classList.remove('is-drag'); if(!moved) return;
    select(snapTo(sc, Math.max(0, Math.min(Gm.maxX, camX)), -vel), {drag:true}); }
  stage.addEventListener('pointerup', endDrag); stage.addEventListener('pointercancel', endDrag);
  var wheelT=0, wsc=null; stage.addEventListener('wheel', function(e){ if(Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return; e.preventDefault(); hudHide(); worldEl.classList.remove('is-marks'); clearTimeout(selT);
    if(wsc === null) wsc = camF[cur];
    camX = Math.max(0, Math.min(Gm.maxX, camX + e.deltaX)); place(true); clearTimeout(wheelT); wheelT = setTimeout(function(){ var s0=wsc; wsc=null; select(snapTo(s0, camX, 0)); }, 140); }, {passive:false});

  // posuvník: chytit zobáček a šoupnout, krajina jede s ním
  var thumbDrag=false, tOff=0, tLast=0, tVel=0, tLT=0;
  thumb.addEventListener('pointerdown', function(e){ if(e.button>0) return; e.preventDefault(); thumbDrag=true; thumb.classList.add('is-drag'); try{ thumb.setPointerCapture(e.pointerId); }catch(_){}
    var r=rail.getBoundingClientRect(); tOff = (e.clientX - r.left) - railFromCam(camX); tLast=e.clientX; tLT=performance.now(); tVel=0; hudHide(); worldEl.classList.remove('is-marks'); clearTimeout(selT); });
  thumb.addEventListener('pointermove', function(e){ if(!thumbDrag) return; var r=rail.getBoundingClientRect(), raw=e.clientX - r.left - tOff, lo=stopX[0], hi=stopX[6];
    var rx = raw < lo ? lo + (raw-lo)*.3 : (raw > hi ? hi + (raw-hi)*.3 : raw);
    var now=performance.now(); tVel=.75*tVel+.25*((e.clientX-tLast)/Math.max(1,now-tLT)); tLast=e.clientX; tLT=now;
    setThumb(rx, nearest(rx)); camX = camFromRail(Math.max(lo, Math.min(hi, rx))); place(true); });
  function endThumb(){ if(!thumbDrag) return; thumbDrag=false; var rx = railFromCam(camX), here=nearest(rx), proj=nearest(rx + tVel*90); select(Math.max(here-1, Math.min(here+1, proj)), {drag:true}); }
  thumb.addEventListener('pointerup', endThumb); thumb.addEventListener('pointercancel', endThumb);
  thumb.addEventListener('keydown', function(e){ var k=e.key, n=cur;
    if(k==='ArrowRight'||k==='ArrowUp') n=Math.min(6,cur+1); else if(k==='ArrowLeft'||k==='ArrowDown') n=Math.max(0,cur-1); else if(k==='Home') n=0; else if(k==='End') n=6; else return;
    e.preventDefault(); if(n!==cur) select(n); });

  // (i)
  var ov=$('[data-ov]'), openB=$('[data-open]'), closeB=$('[data-close]');
  function openP(){ ov.hidden=false; openB.setAttribute('aria-expanded','true'); closeB.focus({preventScroll:true}); }
  function closeP(){ if(ov.hidden) return; ov.hidden=true; openB.setAttribute('aria-expanded','false'); openB.focus({preventScroll:true}); }
  bindTap(openB, function(){ ov.hidden ? openP() : closeP(); });
  bindTap(closeB, closeP);
  ov.addEventListener('pointerdown', function(e){ if(e.target===ov) closeP(); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeP(); if(e.key==='Tab' && !ov.hidden){ e.preventDefault(); closeB.focus(); } });

  /* ===================== vyplnění rámu a přepočet ===================== */
  function layout(){ if(!build()) return; paint(); place(true); camX = camF[cur]; place(true); if(!root.classList.contains('is-pre')){ hudOpen=false; hudShow(); } }
  var rT=0, lastW=0, lastH=0;
  function relayout(){ clearTimeout(rT); rT=setTimeout(function(){ var w=root.clientWidth, h=root.clientHeight; if(w===lastW && h===lastH) return; lastW=w; lastH=h; layout(); }, 90); }
  window.addEventListener('resize', relayout);
  /* nástup čeká na písmo: přeměření po načtení Poppins překresluje scénu a nesmí spadnout doprostřed animace */
  var fontsOk = !(document.fonts && document.fonts.ready), wantIn = false;
  function fontsDone(){ if(fontsOk) return; fontsOk = true; lastW=root.clientWidth; lastH=root.clientHeight; layout(); if(wantIn) entrance(); }
  if(!fontsOk){ document.fonts.ready.then(fontsDone); setTimeout(fontsDone, 1500); }
  try{ new ResizeObserver(relayout).observe(root); }catch(_){}
  lastW=root.clientWidth; lastH=root.clientHeight; layout();
  if(/[?&]info/.test(Q)) openP();

  /* ===================== nástup: budovy vyrostou, drony přiletí, roletka se rozbalí, kamera jednou popojede ===================== */
  /* nápověda: dokud čtenář na nic nesáhne, šipka vpravo se zmáčkne, okraj se rozsvítí a krajina s okýnkem kus popojede a vrátí se. Nejvýš čtyřikrát. */
  var attractT = 0, attractN = 0, peek = null, edgeR = root.querySelector('.dp-edge--r'), glow = $('[data-glow]');
  function attract(){
    if(root.classList.contains('is-used') || dragging || thumbDrag) return;
    if(cur >= 6) return;
    if(root.classList.contains('is-off')){ attractT = setTimeout(attract, 1500); return; }
    attractN++;
    var c0 = camF[cur], d = Math.min(mobile ? 150 : 190, (camF[cur+1]-c0)*.34);
    glow.classList.add('is-on'); edgeR.classList.add('is-ring');
    setTimeout(function(){ edgeR.classList.add('is-press'); }, 120);
    setTimeout(function(){ edgeR.classList.remove('is-press'); }, 320);
    peek = setTimeout(function(){
      if(root.classList.contains('is-used')) return;
      hudHide(); worldEl.classList.remove('is-marks'); camX = c0 + d;
      [cam,farEl,midEl,thumb].forEach(function(el){ el.style.setProperty('--dur','760ms'); }); place(false);
      peek = setTimeout(function(){
        if(root.classList.contains('is-used')) return;
        glow.classList.remove('is-on'); edgeR.classList.remove('is-ring'); camX = c0;
        [cam,farEl,midEl,thumb].forEach(function(el){ el.style.setProperty('--dur','680ms'); }); place(false);
        peek = setTimeout(function(){ peek = null; if(!root.classList.contains('is-used') && !hudOpen) hudShow(); }, 620);
        if(attractN < 4) attractT = setTimeout(attract, 5200);
      }, 1100);
    }, 260);
  }
  function stopAttract(){
    if(root.classList.contains('is-used') && !peek && !attractT) return;
    root.classList.add('is-used'); clearTimeout(attractT); attractT = 0;
    glow.classList.remove('is-on'); edgeR.classList.remove('is-ring','is-press');
    if(peek){ clearTimeout(peek); peek = null;   // zastaví krajinu tam, kde zrovna je, ať tah nezačne skokem
      var m = new DOMMatrixReadOnly(getComputedStyle(cam).transform); camX = Math.max(0, Math.min(Gm.maxX, -m.m41)); place(true);
      var settle = function(){ if(!dragging && !thumbDrag && Math.abs(camX - camF[cur]) > 2) select(nearest(railFromCam(camX))); };   // jen ťuknutí bez tahu: dojet na zastávku
      var up = function(){ window.removeEventListener('pointerup', up, true); setTimeout(settle, 40); };
      window.addEventListener('pointerup', up, true); setTimeout(settle, 1500); }
  }
  root.addEventListener('pointerdown', stopAttract, true);
  root.addEventListener('keydown', stopAttract, true);
  root.addEventListener('wheel', stopAttract, {capture:true, passive:true});

  function entrance(){
    if(!root.classList.contains('is-pre')) return;
    if(!fontsOk){ wantIn = true; return; }
    var x0=camX/Gm.u, vw=Gm.vw;
    [].slice.call(cam.querySelectorAll('.dp-b')).forEach(function(g){ var x=+g.getAttribute('data-x'); g.style.setProperty('--d', Math.round(Math.max(0, Math.min(620, (x-x0)/vw*520)))+'ms'); });
    sprs.forEach(function(g){ var x=+g.getAttribute('data-x'); g.style.setProperty('--d', Math.round(560 + Math.max(0, Math.min(400, (x-x0)/vw*300)))+'ms'); });
    root.offsetWidth;
    root.classList.remove('is-pre'); root.classList.add('is-live');
    setTimeout(function(){ if(!hudOpen && !dragging && !thumbDrag) hudShow(); }, 1150);
    attractT = setTimeout(attract, 2300);
  }
  if(MOVE && HAS_IO){
    var played=false, io=new IntersectionObserver(function(es){ es.forEach(function(en){ root.classList.toggle('is-off', !en.isIntersecting); if(en.isIntersecting && en.intersectionRatio >= .4 && !played){ played=true; entrance(); } }); }, {threshold:[0,.4]});
    io.observe(root);
    setTimeout(function(){ if(!played){ played=true; entrance(); } }, 6000);
  } else if(MOVE){ root.classList.add('is-live'); }

  window.__dronyPravidla = function(){ return {cur:cur, key:STOPS[cur].k, camX:Math.round(camX), mobile:mobile, hud:hudOpen, live:root.classList.contains('is-live'), pre:root.classList.contains('is-pre')}; };
})();
</script>
</body>
