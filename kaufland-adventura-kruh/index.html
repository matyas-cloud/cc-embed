<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adventura v kruhu</title>
<meta name="robots" content="noindex">
<!--
  Adventura v kruhu
  Určení: nativní speciál Kaufland „Z lásky k srdci“, drop 2, komponenta Iframe (rám 150 / 85 / 73,5 %).
  Formát: textová adventura ve statických scénách, čtyři rozhodnutí, masáž, elektrody, výboj, vysvětlivky.
  Texty a pořadí kroků: všechno je v bloku OBSAH ADVENTURA V KRUHU hned pod touhle poznámkou, včetně návodu, jak vynechat krok.
  Zbytek stránky je zkompilovaný kód a obrázky scén, ten se ručně nemění.
  Změny obsahu: 2026-11-06 Divadlo, texty podle storyboardu Adventura v Divadle, směr D silueta s obálkou z prvního pohledu,
  skutečné AED, konec na černém. 2026-11-10 texty a flow vytažené do bloku OBSAH.
-->
<script>
/* ================================================================
   OBSAH PRVKU ADVENTURA V KRUHU
   Tady jsou všechny texty a pořadí kroků. Měňte jen text mezi
   apostrofy '…'. Apostrof uvnitř textu napište jako \' nebo ’.

   JAK SE MĚNÍ FLOW
   Každý krok má jméno (s2, s3, …) a v poli dal: říká, kam se jde dál.
   - Vynechat krok: předchozímu kroku přepište dal: na krok, který
     následuje po vynechaném. Příklad: bez kroku s3 („Dav se rozhýbal“)
     dejte v s2 u druhé možnosti dal: 's4'. Vynechaný krok může v souboru
     zůstat, nikdo se k němu nedostane.
   - Zrušit špatnou odbočku: smažte celý řádek té možnosti z moznosti.
     Když zbude jen jedna možnost, krok ji ukáže jako jediné tlačítko.
   - Počet stlačení: pole pocet u kroků typu 'stlaceni'.
   - Obrázek scény a efekty patří ke jménu kroku a jsou v kódu.
     Nový krok s novým jménem proto převezme obrázek předchozího kroku.

   TYPY KROKŮ
   volba     popis, otázka v červeném rámečku, dvě nebo víc možností
   chyba     červený nadpis, vysvětlení, tlačítko se šipkou zpět
   vysledek  bílý nadpis, vysvětlení, tlačítko dál
   stlaceni  popis, tečky a tlačítko, které se mačká pocet-krát
   pristroj  bublina s hlasem AED, popis, tlačítko dál
   vyboj     bublina s hlasem AED, popis, oranžový knoflík s bleskem
   konec     překonané obavy, citace a odkaz Zkusit znovu
   ================================================================ */
window.OBSAH_ADVENTURA = {

  obalka: {
    titulek: 'Kolem ležícího člověka stojí deset lidí.',
    tlacitko: 'Protlačit se dopředu',
  },

  prvniKrok: 's2',

  kroky: {
    s2: {
      typ: 'volba',
      text: 'Jste v obchodě u pokladen. Všichni koukají, dva drží mobil a nikdo se nehýbe.',
      otazka: 'Co zakřičíte?',
      moznosti: [
        { text: '„Zavolejte někdo záchranku!“', dal: 's2a' },
        { text: '„Vy v modré bundě, volejte 155, vy běžte na informace pro defibrilátor!“', dal: 's3' },
      ],
    },
    s2a: {
      typ: 'chyba',
      nadpis: 'Nikdo se nepohnul.',
      text: 'Každý čeká, že záchranku zavolá ten vedle.',
      tlacitko: 'Zkusit to jinak', dal: 's2',
    },
    s3: {
      typ: 'vysledek',
      nadpis: 'Dav se rozhýbal.',
      text: 'Přímá výzva člověka okamžitě vytrhne z anonymity.',
      tlacitko: 'Kleknout si k ležícímu', dal: 's4',
    },
    s4: {
      typ: 'volba',
      text: 'Je to žena. Nereaguje a nedýchá. Muž vedle ní se bojí odhalit jí hrudník.',
      otazka: 'Co uděláte?',
      moznosti: [
        { text: 'Počkám, až přijde nějaká žena', dal: 's4a' },
        { text: 'Vyhrnu jí tričko i podprsenku', dal: 's5' },
      ],
    },
    s4a: {
      typ: 'chyba',
      nadpis: 'Žádná žena nepřichází a čas běží.',
      text: 'Na holém hrudníku visí její šance na přežití, ne společenská etiketa.',
      tlacitko: 'Zkusit to jinak', dal: 's4',
    },
    s5: {
      typ: 'stlaceni',
      text: 'Hrudník je volný. Kleknete si a začínáte masáž srdce.',
      tlacitko: 'Stlačovat', pocet: 4, dal: 's5b',
    },
    s5b: {
      typ: 'volba',
      zvolani: 'KŘUP',                 /* velký nápis přes scénu; krok se zvoláním přijde bez zhasnutí a s křupnutím */
      text: 'Pod rukama to křupne.',
      otazka: 'Co uděláte?',
      moznosti: [
        { text: 'Vždyť jí ublížím!', dal: 's5a' },
        { text: 'Stlačuji hrudník dál', dal: 's6' },
      ],
    },
    s5a: {
      typ: 'stlaceni',
      bublina: '„Nepřestávejte! Zlomené žebro se zahojí.“',   /* mluví dispečerka z mobilu */
      text: 'Dispečerka vás slyší na hlasitém odposlechu. Křupnutí je běžné i u resuscitací, které dělají záchranáři.',
      tlacitko: 'Stlačovat dál', pocet: 4, dal: 's6',
    },
    s6: {
      typ: 'volba',
      text: 'Žena se vrátila z informací a přinesla AED. Bojí se ho zapnout, prý by ho měl použít zdravotník.',
      otazka: 'Co odpovíte?',
      moznosti: [
        { text: '„Počkejme na záchranáře“', dal: 's6a' },
        { text: '„Zapněte ho, povede vás“', dal: 's7' },
      ],
    },
    s6a: {
      typ: 'chyba',
      nadpis: 'Přístroj leží zavřený a sanitka je daleko.',
      text: 'Přitom je AED navržený pro laiky a nelze jím ublížit.',
      tlacitko: 'Zkusit to jinak', dal: 's6',
    },
    s7: {
      typ: 'pristroj',
      bublina: '„Nalepte elektrody na holý hrudník.“',
      text: 'Přístroj mluví klidnou češtinou a vede vás krok za krokem.',
      tlacitko: 'Nalepit elektrody', dal: 's8',
    },
    s8: {
      typ: 'vyboj',
      bublina: '„Nedotýkejte se pacientky. Stiskněte blikající tlačítko.“',
      text: 'AED vyhodnotil srdeční rytmus a doporučuje výboj. Stiskněte tlačítko.',
      tlacitko: 'Stisknout tlačítko',   /* na knoflíku není vidět, čte ho čtečka obrazovky */
      dal: 's9',
    },
    s9: {
      typ: 'vysledek',
      nadpis: 'Slyšíte sirénu.',
      text: 'Dav se rozestoupí a záchranáři vás u pacientky vystřídají.',
      tlacitko: 'Co jste právě překonali', dal: 's10',
    },
    s10: {
      typ: 'konec',
      nadpis: 'Co jste právě překonali',   /* ukazuje se jen na počítači, na telefon se nevejde */
      myty: [
        { obava: 'Určitě pomůže někdo jiný', vysvetleni: 'Ukažte prstem a rozdejte úkoly. „Vy v modré bundě, volejte 155.“' },
        { obava: 'Bojím se dotknout cizí ženy', vysvetleni: 'Na holém hrudníku visí její šance na přežití, ne společenská etiketa.' },
        { obava: 'Co když jí ublížím?', vysvetleni: 'Zlomené žebro se zahojí, odumřelé mozkové buňky bez přísunu kyslíku už nikdo nevrátí.' },
        { obava: 'Ten přístroj není pro mě', vysvetleni: 'AED je vyrobený pro laiky a nelze jím ublížit.' },
      ],
      citace: {
        text: '„Jediná fatální chyba, kterou můžete na ulici udělat, je nečinnost.“',
        autor: 'MUDr. Jana Djakow, předsedkyně České resuscitační rady',
      },
      znovu: 'Zkusit znovu',
    },
  },

  /* celý prvek jednou větou pro čtečky obrazovky */
  popis: 'Interaktivní příběh o tom, co dělat, když se před vámi někdo zhroutí v obchodě. Čtenář vybírá, co zakřičí a co udělá, a překoná čtyři nejčastější obavy při první pomoci.',
};
</script>
<style>@font-face{font-family:Poppins;font-weight:400;font-display:swap;src:url(../fonts/poppins-latin-ext-400.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+2C60-2C7F}

@font-face{font-family:Poppins;font-weight:700;font-display:swap;src:url(../fonts/poppins-latin-ext-700.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+2C60-2C7F}
@font-face{font-family:Poppins;font-weight:700;font-display:swap;src:url(../fonts/poppins-latin-700.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+2122,U+20AC}
html,body{height:100%;margin:0;padding:0;background:#050101}body{overflow:hidden}

.ad{
  --ink:#0b0506; --pearl:#f6f0ea; --signal:#ff4343; --lip:#a99f9a; --void:#030101;
  --disp:Poppins,"Helvetica Neue",Arial,sans-serif; --body:Georgia,"Times New Roman",serif;
  position:relative; box-sizing:border-box; width:100%; height:100vh; height:100dvh; overflow:hidden; container-type:size;
  background:var(--void); color:var(--pearl); font-family:var(--disp); -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  user-select:none; -webkit-user-select:none;
}
.ad *{box-sizing:border-box}
.ad p,.ad h2,.ad h3,.ad ul,.ad blockquote{margin:0}
.ad button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.ad button:focus-visible{outline:3px solid var(--pearl);outline-offset:2px}
.ad .cc-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ad__scene{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;display:block}
.ad__fx{position:absolute;inset:0;pointer-events:none;container-type:size}
.ad__black{position:absolute;inset:0;z-index:8;background:#000;opacity:0;pointer-events:none;transition:opacity .17s linear}
.ad.is-dark .ad__black{opacity:1}
.ad__flash{position:absolute;inset:0;z-index:4;background:#fff;opacity:0;pointer-events:none;mix-blend-mode:screen}
.ad__flash.is-on{animation:ad-beat .34s ease-out}
.ad__flash.is-hard{mix-blend-mode:normal;animation:ad-hard .9s ease-out}
@keyframes ad-beat{from{opacity:.42}to{opacity:0}}
@keyframes ad-hard{0%{opacity:0}6%{opacity:1}100%{opacity:0}}


.ad__cover{position:absolute;inset:0;z-index:7;background:var(--void)}
.ad__coverImg{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;display:block}
.ad__title{position:absolute;left:28px;right:28px;top:30px;text-align:center;color:var(--ink);font-weight:700;font-size:clamp(20px,6.13cqw,24px);line-height:1.22;text-transform:uppercase;text-wrap:balance}
.ad .ad__start{position:absolute;left:20px;right:20px;bottom:24px;height:60px;padding:0;color:#fff;background:var(--signal);border:0;border-radius:14px;font-weight:700;font-size:19px;box-shadow:0 10px 28px rgba(255,67,67,.38);transition:transform .1s}

.ad .ad__start::after{content:"";position:absolute;inset:0;border-radius:inherit;animation:ad-call 1.8s ease-out infinite;pointer-events:none}
@keyframes ad-call{0%{box-shadow:0 0 0 0 rgba(255,67,67,.55)}70%,100%{box-shadow:0 0 0 14px rgba(255,67,67,0)}}
.ad .ad__start:active,.ad .ad__start.is-down{transform:scale(.98)}
.ad .ad__start:focus-visible{outline-offset:4px}
.ad.is-reduced .ad__start::after{animation:none}
.ad:not(.is-cover) .ad__cover{display:none}


.ad__panel{position:absolute;inset:0;z-index:3;pointer-events:none}
.ad__stack{position:absolute;left:12px;right:12px;bottom:16px;display:flex;flex-direction:column;gap:12px;pointer-events:auto}
.ad__panel.is-in .ad__stack>*,.ad__panel.is-in .ad__bub--top{animation:ad-up .32s cubic-bezier(.2,.8,.2,1) both}
.ad__panel.is-in .ad__stack>*:nth-child(2){animation-delay:.05s}
.ad__panel.is-in .ad__stack>*:nth-child(3){animation-delay:.1s}
@keyframes ad-up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ad__cap{padding:13px 15px;background:rgba(11,5,6,.86);color:var(--pearl);border-radius:14px;font:400 clamp(14.5px,4.27cqw,16px)/1.34 var(--body);text-wrap:pretty}
.ad__res{padding:13px 15px 14px;background:rgba(11,5,6,.86);border-radius:14px;display:flex;flex-direction:column;gap:4px}
.ad__res p{color:var(--pearl);font:400 clamp(14.5px,4.27cqw,16px)/1.34 var(--body);text-wrap:pretty}
.ad__head{color:var(--pearl);font-weight:700;font-size:clamp(15.5px,4.53cqw,17px);line-height:1.25}
.ad__head--no{color:var(--signal)}
.ad__tab{align-self:flex-start;margin:0 0 8px 2px;padding:5px 10px;color:var(--ink);background:var(--signal);border-radius:4px;font-weight:700;font-size:clamp(12.5px,3.6cqw,13.5px);line-height:1.2;text-transform:uppercase;letter-spacing:.03em}
.ad__ask{position:relative;display:flex;flex-direction:column}
.ad__opts{display:flex;flex-direction:column;gap:8px}
.ad .ad__opt{min-height:48px;padding:12px 16px;text-align:left;color:var(--ink);background:var(--pearl);border:0;border-radius:14px;font-weight:600;font-size:clamp(13.5px,3.87cqw,14.5px);line-height:1.25;transition:transform .08s,background .15s}
.ad .ad__opt:active{transform:scale(.985);background:#fff}
.ad .ad__cta{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0;color:var(--ink);background:var(--pearl);border:0;border-radius:14px;font-weight:700;font-size:16px;transition:transform .08s}
.ad .ad__cta--no{color:var(--pearl);background:rgba(11,5,6,.6);box-shadow:inset 0 0 0 1.5px rgba(247,242,238,.7)}
.ad .ad__cta:active{transform:scale(.985)}
.ad__press{display:flex;flex-direction:column;gap:8px}
.ad__back{flex:none;margin-left:-4px}

.ad .ad__knob{position:relative;align-self:center;width:88px;height:88px;padding:0;border:0;border-radius:50%;display:grid;place-items:center;background:#1a2736;box-shadow:0 0 0 3px #2b3f55,0 10px 28px rgba(0,0,0,.5);transition:transform .08s}
.ad__knob span{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 38% 32%,#ffb06a,#f37a22 55%,#d9600f);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.35)}
.ad__knob::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:3px solid #ff8a2a;animation:ad-knob 1s ease-out infinite;pointer-events:none}
@keyframes ad-knob{from{transform:scale(.92);opacity:.95}to{transform:scale(1.35);opacity:0}}
.ad .ad__knob:active{transform:scale(.94)}
.ad .ad__knob:focus-visible{outline:2px solid var(--pearl);outline-offset:8px}
.ad.is-reduced .ad__knob::before{animation:none;opacity:.6;transform:scale(1.1)}
.ad__pips{display:flex;gap:6px;justify-content:center}
.ad__pips i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--pearl);transition:background .12s}
.ad__pips i.is-on{background:var(--pearl)}
.ad__bub{position:relative;padding:12px 15px;color:var(--ink);background:var(--pearl);border-radius:16px;font-weight:600;font-size:clamp(14.5px,4.27cqw,16px);line-height:1.28;text-wrap:balance}
.ad__bub::after{content:"";position:absolute;width:16px;height:16px;background:var(--pearl);left:var(--tx,50%);top:-7px;transform:rotate(45deg);border-radius:3px}
.ad__bub--top{position:absolute;left:4.3%;right:30%;top:18.5%}
.ad__bub--top::after{left:auto;right:18px;top:auto;bottom:-7px}
.ad__krup{position:absolute;left:0;right:0;top:9%;text-align:center;color:var(--pearl);font-weight:700;font-size:13cqw;line-height:1;letter-spacing:.06em;text-shadow:0 0 24px rgba(255,67,67,.8);animation:ad-slam .3s ease-out both}
@keyframes ad-slam{from{opacity:0;transform:scale(1.25)}to{opacity:1;transform:none}}



.ad.is-bare .ad__scene,.ad.is-bare .ad__fx{visibility:hidden}
.ad__end{position:absolute;left:16px;right:16px;top:12px;bottom:8px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;pointer-events:auto}
.ad__list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;color:var(--pearl)}
.ad__list li{margin:0;padding:10px 0;border-bottom:1px solid rgba(247,242,238,.14);animation:ad-up .36s cubic-bezier(.2,.8,.2,1) both}
.ad__list li:last-child{border-bottom:0}
.ad__list li:nth-child(2){animation-delay:.28s}.ad__list li:nth-child(3){animation-delay:.56s}.ad__list li:nth-child(4){animation-delay:.84s}
.ad__list h3{display:flex;align-items:flex-start;gap:9px;margin:0 0 3px;font-weight:700;font-size:clamp(14.5px,4.4cqw,17px);line-height:1.25}
.ad__x{flex:none;width:18px;height:18px;margin-top:1px}
.ad__list p{padding-left:27px;font:400 clamp(14px,4.2cqw,16px)/1.32 var(--body);color:rgba(247,242,238,.84);text-wrap:pretty}
.ad__quote{padding:14px 16px 13px;color:#fff;background:var(--signal);border-radius:14px;animation:ad-up .4s 1.2s cubic-bezier(.2,.8,.2,1) both}
.ad__quote blockquote{margin:0 0 8px;color:#fff;font-weight:700;font-size:clamp(19px,6.13cqw,23px);line-height:1.22;text-wrap:balance}
.ad__quote p{font-weight:600;font-size:13px;line-height:1.3;color:var(--ink)}
.ad__endHead{display:none}
.ad .ad__again{align-self:center;min-height:44px;padding:0 14px;color:var(--pearl);background:none;border:0;font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}


.fx{position:absolute;transform:translate(-50%,-50%);border-radius:50%;mix-blend-mode:screen}
.fx-dot{width:30cqw;height:30cqw;background:radial-gradient(circle,rgba(255,50,50,.95),rgba(255,50,50,.35) 26%,transparent 66%);animation:fx-beat 1.15s ease-out infinite}
.fx-dot.is-weak{animation-duration:1.9s;opacity:.7}
.fx-dot.is-white{background:radial-gradient(circle,#fff,rgba(255,255,255,.45) 26%,transparent 66%)}
@keyframes fx-beat{0%{transform:translate(-50%,-50%) scale(.62);opacity:.35}12%{transform:translate(-50%,-50%) scale(1.05);opacity:1}60%,100%{transform:translate(-50%,-50%) scale(.62);opacity:.35}}
.fx-pulse{width:24cqw;height:24cqw;background:radial-gradient(circle,rgba(255,60,60,.8),transparent 62%);animation:fx-glow 1.2s ease-in-out infinite alternate}
.fx-pulse.is-big{width:56cqw;height:56cqw;background:radial-gradient(circle,rgba(255,110,100,.85),transparent 62%);animation-duration:.5s}
.fx-pulse.is-small{width:14cqw;height:14cqw}
.fx-orange{width:16cqw;height:16cqw;background:radial-gradient(circle,rgba(255,150,60,.95),rgba(255,120,40,.35) 30%,transparent 66%);animation:fx-glow .5s ease-in-out infinite alternate}
.fx-pulse.is-soft{width:62cqw;height:62cqw;background:radial-gradient(circle,rgba(255,255,255,.26),transparent 62%);animation-duration:2.2s}
@keyframes fx-glow{from{opacity:.25}to{opacity:1}}
.fx-pop{width:10cqw;height:10cqw;border:3px solid #fff;animation:fx-pop .9s cubic-bezier(.2,.8,.3,1) both;mix-blend-mode:normal}
.fx-pop.b{animation-delay:.28s}
@keyframes fx-pop{from{transform:translate(-50%,-50%) scale(.3);opacity:1}to{transform:translate(-50%,-50%) scale(2.4);opacity:0}}
.fx-ring{width:12cqw;height:12cqw;border:2.5px solid #fff;animation:fx-ring 1.5s linear infinite;mix-blend-mode:normal}
.fx-ring.b{animation-delay:.5s}.fx-ring.c{animation-delay:1s}
@keyframes fx-ring{from{transform:translate(-50%,-50%) scale(.3);opacity:.95}to{transform:translate(-50%,-50%) scale(2.1);opacity:0}}

.fx-strobe i:first-child{background:radial-gradient(70% 46% at 80% 22%,rgba(255,30,30,.5),transparent)}

@keyframes fx-st{0%{opacity:1}50%{opacity:0}}

@container (max-width:559px) and (max-height:600px){

}

@container (min-width:560px){

  .ad__press .ad__cta{width:420px}

@container (min-width:560px) and (max-width:699px){
