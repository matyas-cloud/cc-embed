<!DOCTYPE html>
<html lang="cs">

<title>Tyrolský slovníček</title>
<meta name="robots" content="noindex">
<!-- CzechCrunch × IDM Südtirol – „Tyrolský slovníček“ místo tabulky v textu.
     Cíl: nativní článek cc.cz „Do Jižního Tyrolska se bude létat z Prahy. Na sjezdovkách, kde získali Češi medaile, si zalyžujete i vy“,
       na místo mezihlavičky „Tyrolský slovníček“ a tabulky Německy / Italsky.
     Vložení: suedtirol-slovnicek-vlozeni.html, obalový div s výškou podle šířky okna (vzorec a ověřené šířky jsou ve vložení).
     Nasazení: matyas-cloud/cc-embed/suedtirol-slovnicek/index.html, Poppins ze sdílené složky ../fonts/.
     Formát: směr D „Sklo nad sněhem“ (suedtirol-slovnicek-5-smeru.png). Podklad je přechod od nebe do sněhu
       s obrysem hřebene, výška horizontu se dopočítá podle dlaždice regionu. Titulek, perex a 14 dvojjazyčných dlaždic
       z matného skla, nahoře německý název, pod ním italský. Celý region (Südtirol / Alto Adige) je velká dlaždice
       přes celou šířku s vlaječkami u názvů – slouží jako klíč k ostatním.
       Desktop 3 dlaždice v řadě, rám užší než 490 px 2 v řadě; poslední osamělá dlaždice je uprostřed.
       Dlaždice mají vrstvené stíny do modra, na hover (jen zařízení s myší) se mírně zvednou a zvětší, barva se nemění.
     Barvy: odečtené z fotek v náhledu článku (nebe #2f66ad → #b9d7f1, sníh #e4eef8 → #eef4fa). Zelená z loga Südtirol vypadla.
     Data: tabulka „Tyrolský slovníček“ z draftu článku. Pořadí podle tabulky. Ladinská jména zatím ne.
       Texty a dvojice jsou v bloku D, z něj se skládá i shrnutí pro čtečky.
     Změny obsahu:
       2026-10-23  v1 podle schváleného náhledu varianty 1 Cedule (jizni-tyrolsko-slovnicek-2-varianty.png),
                   oproti tabulce v draftu doplněno Graun / Curon (Mattův pokyn).
       2026-10-23  v2 větší cedule regionu přes celou šířku s vlaječkami DE / IT, stín cedulí a zvednutí na hover.
       2026-10-23  v3 perex podle Matta („…německý a italský. V ladinských údolích mnohdy i třetí, čistě místní.“),
                   vlaječky ve společném sloupci, názvy zarovnané za nimi.
       2026-10-26  v4 vzhled podle směru D „Sklo nad sněhem“ (feedback: zelená v článku bije do očí, sladit s modrým nebem
                   na fotkách, plastičtější). Obsah, rozložení a výška beze změny, kód pro vložení platí dál. -->
<style>
  @font-face{font-family:Poppins;font-style:normal;font-weight:400;font-display:swap;src:url(../fonts/poppins-latin-400.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC;}
  @font-face{font-family:Poppins;font-style:normal;font-weight:400;font-display:swap;src:url(../fonts/poppins-latin-ext-400.woff2) format('woff2');unicode-range:U+0100-024F,U+1E00-1EFF;}
  @font-face{font-family:Poppins;font-style:normal;font-weight:600;font-display:swap;src:url(../fonts/poppins-latin-600.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC;}
  @font-face{font-family:Poppins;font-style:normal;font-weight:600;font-display:swap;src:url(../fonts/poppins-latin-ext-600.woff2) format('woff2');unicode-range:U+0100-024F,U+1E00-1EFF;}
  html,body{margin:0;padding:0;background:transparent;height:100%;overflow:hidden;}
  .cc-embed{margin:0!important;}
</style>
</head>
<body>
<!-- .cc-embed základ (verbatim ze skillu) -->
<style>
.cc-embed{
  /* --- barvy --- */
  --cc-blue:#087eeb;      --cc-blue-dark:#0668c2;
  --cc-red:#d40b3e;
  --cc-ink:#222;          --cc-ink-soft:#3c3c3c;
  --cc-muted:#84929b;
  --cc-line:#ececec;
  --cc-surface:#f8f9fa;   --cc-white:#fff;
  --cc-ok:#29cc6a;        --cc-warn:#f58a18;
  /* --- shape --- */
  --cc-radius:15px;       --cc-radius-sm:10px;
  --cc-pad:clamp(16px,3vw,26px);
  --cc-gap:12px;
  /* --- font --- */
  --cc-serif:Georgia,Times,"Times New Roman",serif;
  --cc-display:Poppins,-apple-system,"Segoe UI",sans-serif;
  --cc-ui:Inter,-apple-system,"Segoe UI",sans-serif;
  display:block;
  margin:2.4rem 0;
  padding:var(--cc-pad);
  background:var(--cc-surface);
  border:1px solid var(--cc-line);
  border-radius:var(--cc-radius);
  color:var(--cc-ink);
  font:18px/1.66667 var(--cc-serif);
  -webkit-tap-highlight-color:transparent;
}
.cc-embed *{box-sizing:border-box;}
.cc-embed--flush{padding:0;overflow:hidden;}      /* prvek do krajů (fotka, mapa) */
.cc-embed--bare{background:none;border:0;padding:0;} /* bez rámečku */
/* --- typo --- */
.cc-embed .cc-kicker{margin:0 0 6px;font:700 12px/1.25 var(--cc-ui);
  letter-spacing:.08em;text-transform:uppercase;color:var(--cc-red);}
.cc-embed h2,.cc-embed h3,.cc-embed h4,.cc-embed .cc-title{
  margin:0 0 8px;font-family:var(--cc-display);font-weight:700;line-height:1.25;color:#000;}
.cc-embed h3,.cc-embed .cc-title{font-size:clamp(20px,3.4vw,26px);}
.cc-embed h4{font-size:19px;}
.cc-embed p{margin:0 0 10px;}
.cc-embed .cc-lede{font-size:clamp(16px,2.2vw,18px);line-height:1.6;color:var(--cc-ink-soft);}
.cc-embed .cc-note{margin:12px 0 0;font:400 13px/1.5 var(--cc-ui);color:var(--cc-muted);}
.cc-embed .cc-label{font:500 12px/1.2 var(--cc-ui);color:var(--cc-muted);
  letter-spacing:.02em;text-transform:uppercase;}
.cc-embed .cc-num{font-family:var(--cc-display);font-weight:700;
  font-size:clamp(22px,4vw,32px);color:var(--cc-blue);font-variant-numeric:tabular-nums;}
.cc-embed a{color:var(--cc-blue);}
/* --- UI --- */
.cc-embed .cc-btn{
  display:inline-block;padding:10px 20px;
  border:1px solid var(--cc-blue);border-radius:var(--cc-radius);
  background:var(--cc-blue);color:#fff;text-decoration:none;
  font:700 18px/26px var(--cc-display);cursor:pointer;
  transition:background .18s,color .18s;}
.cc-embed .cc-btn:hover{background:var(--cc-blue-dark);border-color:var(--cc-blue-dark);}
.cc-embed .cc-btn--ghost{background:#fff;color:var(--cc-blue);}
.cc-embed .cc-btn--ghost:hover{background:var(--cc-blue);color:#fff;}
.cc-embed .cc-btn--sm{padding:7px 14px;font-size:15px;line-height:22px;}
.cc-embed .cc-btn[aria-pressed="true"]{background:#fff;color:var(--cc-blue);}
.cc-embed .cc-card{background:var(--cc-white);border:1px solid var(--cc-line);
  border-radius:var(--cc-radius-sm);padding:14px 16px;}
.cc-embed .cc-badge{display:inline-block;padding:3px 10px;border-radius:999px;
  background:var(--cc-blue);color:#fff;font:700 12px/18px var(--cc-ui);}
.cc-embed .cc-badge--red{background:var(--cc-red);}
.cc-embed .cc-badge--soft{background:#eaf3fd;color:var(--cc-blue-dark);}
.cc-embed input,.cc-embed select,.cc-embed textarea{
  font:400 16px/24px var(--cc-ui);color:var(--cc-ink);
  padding:9px 12px;background:#fff;border:1px solid var(--cc-line);
  border-radius:var(--cc-radius-sm);}
.cc-embed input[type=range]{padding:0;border:0;background:none;accent-color:var(--cc-blue);width:100%;}
.cc-embed :focus-visible{outline:3px solid var(--cc-blue);outline-offset:2px;}
.cc-embed table{width:100%;border-collapse:collapse;font:400 15px/1.4 var(--cc-ui);}
.cc-embed th{text-align:left;font-weight:700;color:var(--cc-muted);
  text-transform:uppercase;font-size:12px;letter-spacing:.05em;padding:8px 10px;}
.cc-embed td{padding:10px;border-top:1px solid var(--cc-line);}
.cc-embed img,.cc-embed svg,.cc-embed canvas{max-width:100%;}
.cc-embed .cc-grid{display:grid;gap:var(--cc-gap);
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));}
.cc-embed .cc-row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--cc-gap);}
.cc-embed .cc-sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}
@media (prefers-reduced-motion:reduce){.cc-embed *{transition:none!important;animation:none!important;}}
</style>

<style>
.cc-tsl{
  --ink:#13253d; --ink2:#4f6f92; --sc:1; --hs:1; --ease:cubic-bezier(.2,.7,.2,1);
  --rt:190px; --rh:110px;   /* rt = horizont (výška hřebene od horního okraje), dopočítá ho JS podle cedule regionu */
  /* velikosti na desktopu, úzký rám je přepíše níž (jen proměnné, ať fit() funguje všude) */
  --pad:26px 26px 28px; --t:22px; --l:14.5px; --b:16px; --s:15px; --rb:22px; --rs:20px; --mh:64px; --rmh:88px; --fw:26px; --gap:10px;
  box-sizing:border-box;height:100vh;display:flex;flex-direction:column;overflow:hidden;position:relative;
  padding:var(--pad);
  border:0;border-radius:var(--cc-radius);color:var(--ink);font-family:var(--cc-display);
  /* nebe z fotek článku, nahoře tmavší kvůli kontrastu bílého titulku a perexu */
  background:linear-gradient(180deg,#2f66ad 0px,#4580c6 calc(var(--rt)*.62),#8fbde6 calc(var(--rt)*1.25),#b9d7f1 calc(var(--rt)*1.7));
  box-shadow:inset 0 0 0 1px rgba(19,45,85,.06);
}
.cc-tsl *{box-sizing:border-box;}

/* hřeben a sníh za mřížkou */
.cc-tsl__ridge{position:absolute;left:0;right:0;top:var(--rt);bottom:0;pointer-events:none;}
.cc-tsl__ridge svg{display:block;width:100%;height:var(--rh);}
.cc-tsl__ridge i{position:absolute;left:0;right:0;top:calc(var(--rh) - 1px);bottom:0;background:linear-gradient(180deg,#e4eef8 0%,#eef4fa 100%);}

.cc-tsl .cc-tsl__t{position:relative;flex:0 0 auto;margin:0;color:#fff;font:600 max(17px, calc(var(--t)*var(--sc)))/1.25 var(--cc-display);letter-spacing:-.01em;}
.cc-tsl .cc-tsl__l{position:relative;flex:0 0 auto;margin:calc(6px*var(--sc)) 0 0;max-width:56ch;color:rgba(255,255,255,.93);font:400 max(14px, calc(var(--l)*var(--sc)))/1.55 var(--cc-display);}
.cc-tsl.is-nolede .cc-tsl__l{display:none;}

/* mřížka: 6 stop, dlaždice přes dvě (3 v řadě), region přes celou šířku, poslední osamělá dlaždice doprostřed */
.cc-tsl__g{position:relative;flex:1 1 auto;min-height:0;display:grid;margin:calc(20px*var(--sc)) 0 0;padding:0;list-style:none;
  grid-template-columns:repeat(6,minmax(0,1fr));
  grid-template-rows:minmax(min-content,1.3fr);grid-auto-rows:minmax(min-content,1fr);gap:calc(var(--gap)*var(--sc));}
.cc-tsl.is-nolede .cc-tsl__g{margin-top:calc(12px*var(--sc));}

/* dlaždice z matného skla: průsvitná bílá s rozmazaným pozadím, horní odlesk a vrstvené stíny do modra; na hover se zvedne */
.cc-tsl__c{
  --sh:0 1px 2px rgba(20,50,90,.08),0 10px 24px -12px rgba(20,60,120,.35);
  --up:scale(1.04);
  position:relative;grid-column:span 2;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1px;
  min-width:0;min-height:calc(var(--mh)*var(--sc));margin:0;
  padding:calc(12px*var(--sc)) 12px;border-radius:14px;text-align:center;color:var(--ink);
  background:rgba(255,255,255,.62);
  -webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 0 0 1px rgba(255,255,255,.55),var(--sh);
  transition:transform .3s var(--ease),box-shadow .3s var(--ease);}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){ .cc-tsl__c{background:rgba(255,255,255,.82);} }
.cc-tsl__c b{display:block;max-width:100%;font:600 max(13px, calc(var(--b)*var(--sc)*var(--hs)))/1.25 var(--cc-display);letter-spacing:-.005em;}
.cc-tsl__c span{display:block;max-width:100%;color:var(--ink2);font:400 max(13px, calc(var(--s)*var(--sc)*var(--hs)))/1.25 var(--cc-display);}
.cc-tsl__c:last-child:nth-child(3n+2){grid-column:3 / span 2;}

/* region: velká, méně průsvitná dlaždice s vlaječkami, slouží zároveň jako klíč (nahoře německy, dole italsky) */
.cc-tsl__c--reg{
  --sh:0 2px 4px rgba(20,50,90,.08),0 18px 34px -16px rgba(20,60,120,.45);
  --up:scale(1.015);
  grid-column:1 / -1;min-height:calc(var(--rmh)*var(--sc));gap:calc(3px*var(--sc));background:rgba(255,255,255,.82);
  box-shadow:inset 0 1px 0 #fff,inset 0 0 0 1px rgba(255,255,255,.7),var(--sh);}
.cc-tsl__k{display:grid;grid-template-columns:auto auto;justify-content:center;align-items:center;
  column-gap:calc(10px*var(--sc));row-gap:calc(3px*var(--sc));}
.cc-tsl__c--reg b,.cc-tsl__c--reg span{text-align:left;}
.cc-tsl__c--reg b{font-size:max(15px, calc(var(--rb)*var(--sc)*var(--hs)));}
.cc-tsl__c--reg span{color:#3d5f86;font-size:max(14px, calc(var(--rs)*var(--sc)*var(--hs)));}
.cc-tsl__f{display:block;width:calc(var(--fw)*var(--sc));height:calc(var(--fw)*var(--sc)*2/3);border-radius:3px;overflow:hidden;
  box-shadow:0 0 0 1px rgba(19,37,61,.12);}
.cc-tsl__f svg{display:block;width:100%;height:100%;}

@media (hover:hover){
  .cc-tsl__c:hover{z-index:1;transform:translateY(-2px) var(--up);
    --sh:0 2px 4px rgba(20,50,90,.08),0 18px 30px -14px rgba(20,60,120,.48);}
}

/* úzký rám: 4 stopy, dlaždice po dvou, region přes celou šířku, poslední osamělá dlaždice doprostřed */
@media (max-width:489px){
  .cc-tsl{--rt:230px; --rh:80px; --pad:18px 16px; --t:20px; --l:14px; --b:15px; --s:14px; --rb:18px; --rs:16px; --mh:60px; --rmh:76px; --fw:21px; --gap:8px;}
  .cc-tsl .cc-tsl__l{margin-top:calc(5px*var(--sc));}
  .cc-tsl__g{grid-template-columns:repeat(4,minmax(0,1fr));margin-top:calc(16px*var(--sc));}
  .cc-tsl__c:last-child:nth-child(3n+2){grid-column:span 2;}
  .cc-tsl__c:last-child:nth-child(2n){grid-column:2 / span 2;}
}
</style>

<div class="cc-embed cc-tsl" data-cc-tsl>
  <div class="cc-tsl__ridge" aria-hidden="true"><svg viewBox="0 0 650 110" preserveAspectRatio="none"><path d="M0 70 L55 46 L90 58 L140 22 L178 44 L222 30 L262 4 L300 34 L338 20 L382 52 L425 34 L468 10 L506 40 L548 28 L592 58 L650 40 L650 110 L0 110Z" fill="rgba(240,246,252,.55)"/><path d="M0 92 L60 70 L112 82 L170 58 L232 76 L292 54 L352 78 L414 60 L482 82 L552 64 L650 80 L650 110 L0 110Z" fill="#e4eef8"/></svg><i></i></div>
  <h3 class="cc-title cc-tsl__t" data-t></h3>
  <p class="cc-tsl__l" data-l></p>
  <p class="cc-sr" data-sr></p>
  <ul class="cc-tsl__g" data-g aria-hidden="true"></ul>
</div>

<script>
(function(){
  var root = document.querySelector('[data-cc-tsl]');
  if(!root || root.dataset.ccInit) return;
  root.dataset.ccInit = '1';

  /* ===== D: texty a dvojice (německy, italsky), první je celý region ===== */
  var D = {
    title: 'Tyrolský slovníček',
    lede:  'Většina míst v Jižním Tyrolsku má dva oficiální názvy, německý a italský. V ladinských údolích mnohdy i třetí, čistě místní.',
    sr:    'Německé a italské názvy míst v Jižním Tyrolsku.',
    pairs: [
      ['Südtirol','Alto Adige'],
      ['Bozen','Bolzano'],
      ['Brixen','Bressanone'],
      ['Gröden','Val Gardena'],
      ['Wolkenstein','Selva'],
      ['Seiser Alm','Alpe di Siusi'],
      ['Hochabtei','Alta Badia'],
      ['Kronplatz','Plan de Corones'],
      ['Antholz','Anterselva'],
      ['Drei Zinnen','Tre Cime'],
      ['Vinschgau','Val Venosta'],
      ['Sulden','Solda'],
      ['Schnalstal','Val Senales'],
      ['Graun','Curon']
    ]
  };

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  var grid = root.querySelector('[data-g]');
  root.querySelector('[data-t]').textContent = D.title;
  root.querySelector('[data-l]').textContent = D.lede;
  // vlaječky jen na velké ceduli regionu (klíč k ostatním), kreslené v SVG, protože emoji vlajky Windows nevykreslí
  var FLAG = {
    de: '<i class="cc-tsl__f"><svg viewBox="0 0 3 2" preserveAspectRatio="none"><rect width="3" height=".667" fill="#000"/><rect y=".667" width="3" height=".667" fill="#dd0000"/><rect y="1.333" width="3" height=".667" fill="#ffce00"/></svg></i>',
    it: '<i class="cc-tsl__f"><svg viewBox="0 0 3 2" preserveAspectRatio="none"><rect width="1" height="2" fill="#009246"/><rect x="1" width="1" height="2" fill="#fff"/><rect x="2" width="1" height="2" fill="#ce2b37"/></svg></i>'
  };
  grid.innerHTML = D.pairs.map(function(p, i){
    var reg = i === 0;
    if(reg) return '<li class="cc-tsl__c cc-tsl__c--reg"><div class="cc-tsl__k">' + FLAG.de + '<b lang="de">' + esc(p[0]) + '</b>' + FLAG.it + '<span lang="it">' + esc(p[1]) + '</span></div></li>';
    return '<li class="cc-tsl__c"><b lang="de">' + esc(p[0]) + '</b><span lang="it">' + esc(p[1]) + '</span></li>';
  }).join('');
  root.querySelector('[data-sr]').innerHTML = esc(D.sr) + ' ' + D.pairs.map(function(p){
    return '<span lang="de">' + esc(p[0]) + '</span>, italsky <span lang="it">' + esc(p[1]) + '</span>.';
  }).join(' ');

  /* ===== vyplnění rámu: řady se roztáhnou, při nedostatku místa nejdřív zmizí perex, pak se zmenšuje písmo k podlahám ===== */
  // název na cedulích má být na jednom řádku: když se zalomí (Plan de Corones), písmo všech cedulí se o kousek zmenší,
  // nejvýš o 10 %; když ani to nestačí, zůstane plná velikost a cedule s dvouřádkovým názvem se zvýší
  function lines(e){
    var rg = document.createRange(), tops = {};
    rg.selectNodeContents(e);
    Array.prototype.forEach.call(rg.getClientRects(), function(r){ tops[Math.round(r.top)] = 1; });
    return Object.keys(tops).length;
  }
  function wraps(){
    var bad = false;
    grid.querySelectorAll('b,span').forEach(function(e){ if(e.scrollWidth > e.clientWidth + 0.5 || lines(e) > 1) bad = true; });
    return bad;
  }
  // měří se rozložení (offset), ne getBoundingClientRect: zvednutá cedule pod myší by hlásila falešné přetečení
  function over(){
    var mx = 0;
    Array.prototype.forEach.call(grid.children, function(c){
      mx = Math.max(mx, c.offsetTop + c.offsetHeight);
      if(c.scrollHeight > c.clientHeight + 1) mx = Infinity;      // text přetéká z cedule
    });
    return mx > grid.clientHeight + 1;
  }
  // horizont: hřeben začíná kousek pod polovinou dlaždice regionu, nebe nad ním se podle toho natáhne
  function horizon(){
    var reg = grid.firstElementChild;
    if(!reg) return;
    root.style.setProperty('--rt', Math.round(grid.offsetTop + reg.offsetTop + reg.offsetHeight * .62) + 'px');
  }
  function fit(){
    var sc = 1;
    root.classList.remove('is-nolede');
    root.style.setProperty('--sc', 1);
    var hs = 1; root.style.setProperty('--hs', 1);
    for(var j = 0; j < 4 && wraps(); j++){ hs *= .975; root.style.setProperty('--hs', hs.toFixed(3)); }
    if(wraps()){ hs = 1; root.style.setProperty('--hs', 1); }
    if(over()) root.classList.add('is-nolede');
    for(var k = 0; k < 14 && over() && sc > .7; k++){ sc *= .95; root.style.setProperty('--sc', sc.toFixed(3)); }
    horizon();
  }
  var rt;
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  if(window.ResizeObserver) new ResizeObserver(function(){ clearTimeout(rt); rt = setTimeout(fit, 90); }).observe(root);
  fit();
})();
</script>
</body>
