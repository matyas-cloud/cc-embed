<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Počítadlo dat: platforma SentinelOne a mobilní sítě v Česku</title>
<meta name="robots" content="noindex">
<!-- CzechCrunch × SentinelOne – počítadlo dat do nativního článku (Google Doc „SentinelOne - draft NTV“).
     Místo: pod mezititulkem „Skoro dvakrát víc dat než české mobilní sítě“, za odstavcem „Její práce začíná tam,
       kde končí Kretovova…“, před odstavcem „Tým Militsyny staví…“. Nic nenahrazuje, doplňuje větu o 11 petabajtech.
     Vložení: sentinelone-data-vlozeni.html, obalový div (aspect-ratio + min-height) s iframem, loading="eager".
     Nasazení: matyas-cloud/cc-embed/sentinelone-data/index.html, Poppins ze sdílené složky ../fonts/.
     Formát: článkový standard, bílá karta s linkou #e0e0e0. Dvě běžící čísla (platforma SentinelOne, mobilní sítě v Česku),
       pod každým pruh ve stejném měřítku 127 : 68, těsně pod pruhy řádek s průměrnými rychlostmi. Od 480 px šířky vedle sebe,
       pod 480 px pod sebou, SentinelOne vždy první.
     Čas: performance.now() = čas od načtení prvku (snippet načítá iframe hned s článkem). Hodnota se počítá z uplynulého času,
       ne přičítáním. Mimo zorné pole a na skryté záložce se nepřekresluje, po návratu ukáže správnou hodnotu.
       S omezeným pohybem se číslo obnoví jednou za sekundu a pruhy jsou rovnou v konečném stavu.
     Čísla: TB na dvě desetinná místa, Poppins, každá číslice v buňce pevné šířky, celá část na tři místa s tlumenými nulami
       vpředu (pole nemění šířku do 999,99 TB, tj. 2 h 10 min u článku). Inter cc.cz nenačítá, proto Poppins.
     Data (zadání v2, 20. 11. 2026): SentinelOne 11 PB denně (údaj firmy, říjen 2026) → 127,3 GB/s;
       ČTÚ, výroční zpráva za rok 2025, str. 19: přibližně 2 160 PB za rok 2025 (odhad úřadu) → 68,5 GB/s.
       Kontrolní hodnoty: 60 s → 7,64 / 4,11 TB, 600 s → 76,39 / 41,10 TB.
     Jen pro náhledy: ?t=600 přičte k času 600 s, ?static zastaví počítání a ukáže pruhy hotové, ?info otevře (i).
     Změny obsahu:
       2026-11-20  v1 podle zadání v2 (varianta A). -->

  @font-face{font-family:Poppins;font-style:normal;font-weight:400;font-display:swap;src:url(../fonts/poppins-latin-ext-400.woff2) format('woff2');unicode-range:U+0100-024F,U+1E00-1EFF;}

  @font-face{font-family:Poppins;font-style:normal;font-weight:500;font-display:swap;src:url(../fonts/poppins-latin-ext-500.woff2) format('woff2');unicode-range:U+0100-024F,U+1E00-1EFF;}
  @font-face{font-family:Poppins;font-style:normal;font-weight:600;font-display:swap;src:url(../fonts/poppins-latin-600.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC;}
  @font-face{font-family:Poppins;font-style:normal;font-weight:600;font-display:swap;src:url(../fonts/poppins-latin-ext-600.woff2) format('woff2');unicode-range:U+0100-024F,U+1E00-1EFF;}

<body>
<!-- .cc-embed základ (verbatim ze skillu) -->
<!-- CC sdílený designový základ pro embedy. Vlož jako PRVNI style blok prvku.
     Pokud web .cc-embed nacita globalne ze sablony, tenhle blok se da vypustit.
     Nesahej do nej - vlastni styly patri do druheho style bloku, scopovane
     pod tridu konkretniho prvku (.cc-uv, .cc-calc, ...). -->
<style>
.cc-embed{
  /* --- barvy --- */
  --cc-blue:#087eeb;      --cc-blue-dark:#0668c2;
  --cc-red:#d40b3e;
  --cc-ink:#222;          --cc-ink-soft:#3c3c3c;
  --cc-muted:#84929b;
  --cc-line:#ececec;
  --cc-surface:#f8f9fa;   --cc-white:#fff;
  --cc-ok:#29cc6a;        --cc-warn:#f58a18;
  /* --- shape --- */
  --cc-radius:15px;       --cc-radius-sm:10px;
  --cc-pad:clamp(16px,3vw,26px);
  --cc-gap:12px;
  /* --- font --- */
  --cc-serif:Georgia,Times,"Times New Roman",serif;
  --cc-display:Poppins,-apple-system,"Segoe UI",sans-serif;
  --cc-ui:Inter,-apple-system,"Segoe UI",sans-serif;
  display:block;
  margin:2.4rem 0;
  padding:var(--cc-pad);
  background:var(--cc-surface);
  border:1px solid var(--cc-line);
  border-radius:var(--cc-radius);
  color:var(--cc-ink);
  font:18px/1.66667 var(--cc-serif);
  -webkit-tap-highlight-color:transparent;
}
.cc-embed *{box-sizing:border-box;}
.cc-embed--flush{padding:0;overflow:hidden;}      /* prvek do krajů (fotka, mapa) */
.cc-embed--bare{background:none;border:0;padding:0;} /* bez rámečku */
/* --- typo --- */
.cc-embed .cc-kicker{margin:0 0 6px;font:700 12px/1.25 var(--cc-ui);
  letter-spacing:.08em;text-transform:uppercase;color:var(--cc-red);}
.cc-embed h2,.cc-embed h3,.cc-embed h4,.cc-embed .cc-title{
  margin:0 0 8px;font-family:var(--cc-display);font-weight:700;line-height:1.25;color:#000;}
.cc-embed h3,.cc-embed .cc-title{font-size:clamp(20px,3.4vw,26px);}
.cc-embed h4{font-size:19px;}
.cc-embed p{margin:0 0 10px;}
.cc-embed .cc-lede{font-size:clamp(16px,2.2vw,18px);line-height:1.6;color:var(--cc-ink-soft);}
.cc-embed .cc-note{margin:12px 0 0;font:400 13px/1.5 var(--cc-ui);color:var(--cc-muted);}
.cc-embed .cc-label{font:500 12px/1.2 var(--cc-ui);color:var(--cc-muted);
  letter-spacing:.02em;text-transform:uppercase;}
.cc-embed .cc-num{font-family:var(--cc-display);font-weight:700;
  font-size:clamp(22px,4vw,32px);color:var(--cc-blue);font-variant-numeric:tabular-nums;}
.cc-embed a{color:var(--cc-blue);}
/* --- UI --- */
.cc-embed .cc-btn{
  display:inline-block;padding:10px 20px;
  border:1px solid var(--cc-blue);border-radius:var(--cc-radius);
  background:var(--cc-blue);color:#fff;text-decoration:none;
  font:700 18px/26px var(--cc-display);cursor:pointer;
  transition:background .18s,color .18s;}
.cc-embed .cc-btn:hover{background:var(--cc-blue-dark);border-color:var(--cc-blue-dark);}
.cc-embed .cc-btn--ghost{background:#fff;color:var(--cc-blue);}
.cc-embed .cc-btn--ghost:hover{background:var(--cc-blue);color:#fff;}
.cc-embed .cc-btn--sm{padding:7px 14px;font-size:15px;line-height:22px;}
.cc-embed .cc-btn[aria-pressed="true"]{background:#fff;color:var(--cc-blue);}
.cc-embed .cc-card{background:var(--cc-white);border:1px solid var(--cc-line);
  border-radius:var(--cc-radius-sm);padding:14px 16px;}
.cc-embed .cc-badge{display:inline-block;padding:3px 10px;border-radius:999px;
  background:var(--cc-blue);color:#fff;font:700 12px/18px var(--cc-ui);}
.cc-embed .cc-badge--red{background:var(--cc-red);}
.cc-embed .cc-badge--soft{background:#eaf3fd;color:var(--cc-blue-dark);}
.cc-embed input,.cc-embed select,.cc-embed textarea{
  font:400 16px/24px var(--cc-ui);color:var(--cc-ink);
  padding:9px 12px;background:#fff;border:1px solid var(--cc-line);
  border-radius:var(--cc-radius-sm);}
.cc-embed input[type=range]{padding:0;border:0;background:none;accent-color:var(--cc-blue);width:100%;}
.cc-embed :focus-visible{outline:3px solid var(--cc-blue);outline-offset:2px;}
.cc-embed table{width:100%;border-collapse:collapse;font:400 15px/1.4 var(--cc-ui);}
.cc-embed th{text-align:left;font-weight:700;color:var(--cc-muted);
  text-transform:uppercase;font-size:12px;letter-spacing:.05em;padding:8px 10px;}
.cc-embed td{padding:10px;border-top:1px solid var(--cc-line);}
.cc-embed img,.cc-embed svg,.cc-embed canvas{max-width:100%;}
.cc-embed .cc-grid{display:grid;gap:var(--cc-gap);
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));}
.cc-embed .cc-row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--cc-gap);}
.cc-embed .cc-sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}
@media (prefers-reduced-motion:reduce){.cc-embed *{transition:none!important;animation:none!important;}}
</style>


<style>
.cc-s1data{
  --ink:#0b0c0e; --ink2:#3c4247; --ink3:#5f6870; --line:#e0e0e0;
  --s1:#121417; --s1b:#3b4148; --mob:#b8c0c7; --mobb:#cdd3d8;
  --n1:#0b0c0e; --z1:#e3e6e9; --n2:#59636b; --z2:#eceef0;
  --sc:1; --ease:cubic-bezier(.2,.7,.2,1);
  --tf:max(16px, calc(clamp(18px,3.4vw,22px)*var(--sc)));      /* nadpis */
  --lf:max(13px, calc(clamp(13px,2.4vw,15px)*var(--sc)));      /* popisek nad číslem */
  --nf:max(28px, calc(clamp(36px,8.6vw,56px)*var(--sc)));      /* běžící číslo */
  --af:max(13px, calc(clamp(13px,2.2vw,14px)*var(--sc)));      /* řádek s rychlostmi */
  --bh:calc(clamp(8px,1.6vw,10px)*var(--sc));                  /* výška pruhu */
  --dw:.61em;                                                  /* šířka buňky číslice, dopočítá se z písma */
  box-sizing:border-box;height:100%;display:flex;flex-direction:column;overflow:hidden;position:relative;
  padding:clamp(18px,4vw,26px) clamp(18px,4.4vw,28px);
  background:#fff;border:1px solid var(--line);border-radius:var(--cc-radius);color:var(--ink);
  font-family:var(--cc-display);
}
.cc-s1data *{box-sizing:border-box;}
.cc-s1data button{font:inherit;color:inherit;margin:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}

/* záhlaví */
.cc-s1data .hd{flex:0 0 auto;display:flex;align-items:flex-start;gap:12px;}
.cc-s1data .cc-s1data__title{margin:0;color:#000;font:600 var(--tf)/1.25 var(--cc-display);letter-spacing:-.01em;text-wrap:balance;}
.cc-s1data .info{margin-left:auto;flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid #b9c0c6;background:#fff;color:var(--ink3);
  cursor:pointer;display:grid;place-items:center;font:600 13px/1 var(--cc-display);transition:border-color .15s,color .15s;}
@media (hover:hover){.cc-s1data .info:hover{border-color:var(--ink);color:var(--ink);}}

/* tělo: počítadla a řádek s rychlostmi drží spolu u spodní hrany, vzduch pod nadpisem */
.cc-s1data .bd{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;padding-top:calc(clamp(10px,2.4vw,16px)*var(--sc));}
.cc-s1data .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:clamp(20px,4.6vw,32px);}
.cc-s1data .ctr{min-width:0;}
/* vedle sebe: popisky, čísla a pruhy v jedné řadě, i když se jeden popisek zalomí */
@media (min-width:480px){
  .cc-s1data .cols{grid-template-rows:auto auto auto;}
  .cc-s1data .ctr{display:contents;}
  .cc-s1data .ctr--s1 > *{grid-column:1;} .cc-s1data .ctr--mob > *{grid-column:2;}
  .cc-s1data .lab{grid-row:1;align-self:end;} .cc-s1data .num{grid-row:2;} .cc-s1data .bar{grid-row:3;}
}
.cc-s1data .lab{margin:0;color:var(--ink2);font:500 var(--lf)/1.3 var(--cc-display);}
.cc-s1data .num{display:flex;align-items:baseline;white-space:nowrap;margin-top:calc(6px*var(--sc));
  font:600 var(--nf)/1.08 var(--cc-display);letter-spacing:0;color:var(--n1);}
.cc-s1data .ctr--mob .num{color:var(--n2);}
.cc-s1data .num .d{display:inline-block;width:var(--dw);text-align:center;}
.cc-s1data .num .k{display:inline-block;width:.27em;text-align:left;}
.cc-s1data .num .g{display:inline-block;width:.22em;}
.cc-s1data .num .z{color:var(--z1);}
.cc-s1data .ctr--mob .num .z{color:var(--z2);}
.cc-s1data .num .u{margin-left:.5em;font-size:.4em;font-weight:500;color:var(--ink3);}
.cc-s1data .bar{position:relative;height:var(--bh);margin-top:calc(clamp(10px,2vw,14px)*var(--sc));}
.cc-s1data .bar i{position:absolute;left:0;top:0;bottom:0;width:var(--w);border-radius:99px;transform-origin:0 50%;
  transition:transform 1.1s var(--ease);transition-delay:var(--d,0ms);}
.cc-s1data .ctr--s1 .bar i{background:linear-gradient(90deg,var(--s1),var(--s1b));}
.cc-s1data .ctr--mob .bar i{background:linear-gradient(90deg,var(--mob),var(--mobb));}
.cc-s1data.is-pre:not(.is-in) .bar i{transform:scaleX(0);transition:none;}
.cc-s1data .avg{margin:calc(clamp(12px,2.6vw,16px)*var(--sc)) 0 0;color:var(--ink3);font:400 var(--af)/1.4 var(--cc-display);}

/* panel (i) */
.cc-s1data .panel{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:clamp(12px,3vw,20px);
  background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);border-radius:var(--cc-radius);}
.cc-s1data .panel[hidden]{display:none;}
.cc-s1data .panel__box{position:relative;width:100%;max-width:480px;max-height:100%;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);
  border-radius:14px;box-shadow:0 18px 40px -18px rgba(0,0,0,.28);padding:clamp(14px,3.4vw,20px) clamp(16px,3.6vw,22px);}
.cc-s1data .panel__hd{display:flex;align-items:flex-start;gap:12px;}
.cc-s1data .panel__t{margin:0;font:600 15px/1.3 var(--cc-display);color:var(--ink);}
.cc-s1data .panel__x{margin-left:auto;flex:none;width:28px;height:28px;border:0;border-radius:50%;background:#f0f2f4;cursor:pointer;font:400 18px/1 var(--cc-display);color:var(--ink);}
.cc-s1data .panel__body{margin-top:8px;overflow-y:auto;min-height:0;}
.cc-s1data .panel__body p{margin:0 0 8px;font:400 13px/1.5 var(--cc-display);color:var(--ink2);}
.cc-s1data .panel__body p:last-child{margin-bottom:0;}
.cc-s1data .panel__body .src{color:var(--ink3);}

/* pod 480 px: počítadla pod sebou, SentinelOne nahoře */
@media (max-width:479px){
  .cc-s1data{--nf:max(28px, calc(clamp(36px,12.4vw,50px)*var(--sc)));}
  .cc-s1data .cols{grid-template-columns:minmax(0,1fr);row-gap:calc(clamp(14px,4vw,20px)*var(--sc));}
}
@media (prefers-reduced-motion:reduce){.cc-s1data *{transition:none!important;}}
.cc-s1data.is-static *{transition:none!important;}
</style>

<div class="cc-embed cc-s1data" data-cc-s1data>
  <p class="cc-sr" data-sr></p>
  <div class="hd">
    <h3 class="cc-s1data__title" data-title></h3>
    <button type="button" class="info" data-info aria-label="Jak počítáme a zdroje" aria-expanded="false" aria-controls="s1-panel">i</button>
  </div>
  <div class="bd" aria-hidden="true">
    <div class="cols">
      <div class="ctr ctr--s1">
        <p class="lab" data-l1></p>
        <div class="num" data-n1></div>
        <div class="bar"><i data-b1></i></div>
      </div>
      <div class="ctr ctr--mob">
        <p class="lab" data-l2></p>
        <div class="num" data-n2></div>
        <div class="bar"><i data-b2></i></div>
      </div>
    </div>
    <p class="avg" data-avg></p>
  </div>
  <div class="panel" id="s1-panel" role="dialog" aria-modal="true" aria-labelledby="s1-panel-t" data-panel hidden>
    <div class="panel__box">
      <div class="panel__hd"><p class="panel__t" id="s1-panel-t">Jak počítáme</p><button type="button" class="panel__x" data-close aria-label="Zavřít">×</button></div>
      <div class="panel__body" data-pbody></div>
    </div>
  </div>
</div>

<script>
(function(){
  var root = document.querySelector('[data-cc-s1data]');
  if(!root || root.dataset.ccInit) return;
  root.dataset.ccInit = '1';
  var Q = location.search;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var canIO = 'IntersectionObserver' in window;
  var STATIC = /[?&]static\b/.test(Q);
  var OFF = +((Q.match(/[?&]t=(\d+(?:\.\d+)?)/) || [])[1] || 0);      // jen pro náhledy
  var ANIM = !reduce && canIO && !STATIC;
  if(ANIM) root.classList.add('is-pre');                               // pruhy skryté hned, žádné probliknutí
  if(STATIC) root.classList.add('is-static');

  /* ===== D: texty a data podle zadání v2 (20. 11. 2026) ===== */
  var D = {
    title: 'Data od chvíle, kdy jste článek otevřeli',
    l1: 'Platforma SentinelOne zpracovala',
    l2: 'Mobilní sítě v Česku přenesly',
    avg: 'V průměru 127 GB za sekundu proti 68 GB za sekundu.',
    rate1: 11e6 / 86400,                 // GB za sekundu: 11 PB denně (SentinelOne, říjen 2026)
    rate2: 2160e6 / (365 * 86400),       // GB za sekundu: přibližně 2 160 PB za rok 2025 (ČTÚ)
    info: ['Počítáno z průměrů. Platforma SentinelOne zpracuje 11 petabajtů dat denně (údaj firmy, říjen 2026).',
           'Mobilní sítě v Česku přenesly za rok 2025 přibližně 2 160 petabajtů (odhad ČTÚ, bez provozu mezi stroji a bez pevného připojení přes LTE a 5G).'],
    src: 'Zdroje: SentinelOne, ČTÚ (výroční zpráva za rok 2025).',
    sr: 'Data od chvíle, kdy jste článek otevřeli. Počítáno z průměrů. Platforma SentinelOne zpracuje v průměru 11 petabajtů dat denně, tedy 127 GB za sekundu. '
      + 'Mobilní sítě v Česku přenesly za rok 2025 přibližně 2 160 petabajtů, tedy v průměru 68 GB za sekundu. '
      + 'Platforma SentinelOne tak zpracuje skoro dvakrát víc dat, než přenesou všechny mobilní sítě v Česku. Zdroje: SentinelOne, ČTÚ.'
  };

  var NB = ' ';
  var nb = function(t){ return t.replace(/(^| )([vzsaoikuVZSAOIKU]) /g, '$1$2'+NB).replace(/(\d) (GB|TB|PB|petabajt)/g, '$1'+NB+'$2').replace(/(\d) (\d{3})/g, '$1'+NB+'$2'); };
  var $ = function(s){ return root.querySelector(s); };
  $('[data-title]').textContent = nb(D.title);
  $('[data-l1]').textContent = nb(D.l1);
  $('[data-l2]').textContent = nb(D.l2);
  $('[data-avg]').textContent = nb(D.avg);
  $('[data-sr]').textContent = D.sr;
  $('[data-pbody]').innerHTML = D.info.map(function(t){ return '<p>'+nb(t)+'</p>'; }).join('') + '<p class="src">'+nb(D.src)+'</p>';

  /* pruhy ve stejném měřítku, delší = 100 % sloupce */
  var b1 = $('[data-b1]'), b2 = $('[data-b2]');
  b1.style.setProperty('--w', '100%');
  b2.style.setProperty('--w', (D.rate2 / D.rate1 * 100).toFixed(2) + '%');
  b2.style.setProperty('--d', '150ms');

  /* ===== běžící čísla: buňky pevné šířky, celá část aspoň na tři místa ===== */
  var n1 = $('[data-n1]'), n2 = $('[data-n2]');
  function build(el, intLen){
    var h = '';
    for(var k=0; k<intLen; k++){
      var fromRight = intLen - k;
      if(k > 0 && fromRight % 3 === 0) h += '<span class="g"></span>';
      h += '<span class="d"></span>';
    }
    h += '<span class="k">,</span><span class="d"></span><span class="d"></span><span class="u">TB</span>';
    el.innerHTML = h;
    el._cells = [].slice.call(el.querySelectorAll('.d'));
    el._len = intLen; el._last = '';
  }
  function show(el, tb){
    var s = tb.toFixed(2), p = s.split('.'), ip = p[0], len = Math.max(3, ip.length);
    if(el._len !== len) build(el, len);
    var full = new Array(len - ip.length + 1).join('0') + ip + p[1];
    if(full === el._last) return;
    var lead = len - ip.length;                  // nuly navíc vpředu jsou tlumené
    for(var k=0; k<full.length; k++){
      var c = el._cells[k];
      if(c.textContent !== full[k]) c.textContent = full[k];
      var z = k < lead;
      if(c._z !== z){ c.classList.toggle('z', z); c._z = z; }
    }
    el._last = full;
  }
  function secs(){ return STATIC ? OFF : performance.now() / 1000 + OFF; }
  function render(){
    var t = secs();
    show(n1, D.rate1 * t / 1000);
    show(n2, D.rate2 * t / 1000);
  }
  build(n1, 3); build(n2, 3); render();

  /* šířka buňky = nejširší číslice v Poppinsu (Poppins na cc.cz nemá tabulární číslice) */
  function measure(){
    var probe = document.createElement('span');
    probe.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;font:600 100px/1 '+getComputedStyle(n1).fontFamily;
    root.appendChild(probe);
    var mx = 0;
    for(var d=0; d<10; d++){ probe.textContent = String(d); mx = Math.max(mx, probe.getBoundingClientRect().width); }
    root.removeChild(probe);
    if(mx > 0) root.style.setProperty('--dw', (mx/100 - .05).toFixed(3) + 'em');   // bez bočního dovybavení písma, kresba se nedotkne
  }

  /* ===== smyčka: běží jen, když je prvek vidět a záložka aktivní ===== */
  var inView = !canIO, raf = 0, iv = 0;
  function running(){ return !STATIC && inView && !document.hidden; }
  function loop(){ render(); raf = requestAnimationFrame(loop); }
  function sync(){
    var on = running();
    if(reduce){
      if(on && !iv){ render(); iv = setInterval(render, 1000); }
      if(!on && iv){ clearInterval(iv); iv = 0; }
    } else {
      if(on && !raf){ loop(); }
      if(!on && raf){ cancelAnimationFrame(raf); raf = 0; }
    }
  }
  document.addEventListener('visibilitychange', sync);

  /* ===== nástup pruhů a viditelnost ===== */
  function enter(){ root.classList.add('is-in'); }
  if(canIO){
    var alive = false;
    new IntersectionObserver(function(en){
      alive = true;
      var e = en[en.length - 1];
      inView = e.isIntersecting;
      if(e.intersectionRatio >= .4) enter();
      sync();
    }, {threshold:[0, .4]}).observe(root);
    setTimeout(function(){ if(!alive){ inView = true; enter(); sync(); } }, 6000);   // záloha pro nefunkční IO
  } else { enter(); }
  if(!ANIM) enter();
  sync();

  /* ===== panel (i) ===== */
  function bindTap(el, fn){   // pointerdown kvůli mobilu, click jen pro čtečky, klávesy zvlášť
    var last = 0;
    el.addEventListener('pointerdown', function(e){ if(e.button > 0) return; e.preventDefault(); last = Date.now(); fn(e); });
    el.addEventListener('click', function(e){ e.preventDefault(); if(Date.now() - last > 600) fn(e); });
    el.addEventListener('keydown', function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); last = Date.now(); fn(e); } });
  }
  var info = $('[data-info]'), panel = $('[data-panel]'), closeBtn = $('[data-close]');
  function openP(){ panel.hidden = false; info.setAttribute('aria-expanded', 'true'); closeBtn.focus({preventScroll:true}); }
  function closeP(){ if(panel.hidden) return; panel.hidden = true; info.setAttribute('aria-expanded', 'false'); info.focus({preventScroll:true}); }
  bindTap(info, function(){ panel.hidden ? openP() : closeP(); });
  bindTap(closeBtn, closeP);
  panel.addEventListener('pointerdown', function(e){ if(e.target === panel){ e.preventDefault(); closeP(); } });   // preventDefault: fokus zůstane na (i)
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape') closeP();
    if(e.key === 'Tab' && !panel.hidden){ e.preventDefault(); closeBtn.focus(); }   // v otevřeném panelu je jediný ovládací prvek
  });

  /* ===== vyplnění rámu ===== */
  var avg = $('[data-avg]');
  function over(){
    var r = root.getBoundingClientRect(), pb = parseFloat(getComputedStyle(root).paddingBottom) || 0;
    return avg.getBoundingClientRect().bottom > r.bottom - pb + .5 || root.scrollWidth > root.clientWidth + 1
      || n1.scrollWidth > n1.clientWidth + 1 || n2.scrollWidth > n2.clientWidth + 1;
  }
  function fit(){
    measure();
    var sc = 1; root.style.setProperty('--sc', 1);
    for(var k=0; k<16 && over() && sc > .6; k++){ sc *= .95; root.style.setProperty('--sc', sc.toFixed(3)); }
  }
  var rt;
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  if(window.ResizeObserver) new ResizeObserver(function(){ clearTimeout(rt); rt = setTimeout(fit, 90); }).observe(root);
  fit();
  if(/[?&]info\b/.test(Q)) openP();
})();
</script>
</body>
</html>
