<title>Objem dat za jeden den: platforma SentinelOne a mobilní sítě v Česku</title>
<meta name="robots" content="noindex">
<!-- CzechCrunch × SentinelOne – animace „Objem dat za jeden den“ do nativního článku (Google Doc „SentinelOne - draft NTV“).
     Místo: pod mezititulkem „Skoro dvakrát víc dat než české mobilní sítě“, za odstavcem „Její práce začíná tam,
       kde končí Kretovova…“, před odstavcem „Tým Militsyny staví…“.
     Vložení: sentinelone-data-vlozeni.html, obalový div (aspect-ratio + min-height) s iframem.
     Nasazení: matyas-cloud/cc-embed/sentinelone-data/ (index.html, logo-sentinelone.svg), Poppins ze sdílené ../fonts/.
     Formát: bílá karta s linkou #e0e0e0. Za 8 s proběhne 24 hodin (počítadlo „0 / 24 h“ vpravo nahoře). Data padají do obrysů
       Česka. Jeden obrys = všechno, co za 24 hodin v průměru přenesou mobilní sítě v Česku (5,9 PB). SentinelOne zaplní
       jeden obrys a druhý z 86 %. Od 480 px šířky řádky vedle sebe, pod 480 px pod sebou, SentinelOne vždy první.
     Barvy SentinelOne podle sentinelone.com (23. 11. 2026): fialová #6100FF, tmavá #140D33, limetková #8FFF08 (padající data).
       Logo: sentinelone.com/next-assets/webui/logos/logo-sentinelone-dark.svg, beze změny.
     Spuštění: jednou při vstupu do zorného pole (IntersectionObserver, pre-stav hned, záloha 6 s = rovnou konečný stav).
       Pak zůstane konečný stav. S omezeným pohybem rovnou konečný stav.
     Data: SentinelOne 11 PB denně (údaj firmy, říjen 2026); ČTÚ, výroční zpráva za rok 2025, str. 19: přibližně 2 160 PB
       za rok 2025 (odhad úřadu) → dopočet 5,9 PB za 24 hodin, poměr 1,86 (v textu jen „skoro dvakrát“).
     Jen pro náhledy: ?static&t=0.5 (podíl dne 0–1, bez animace), ?info otevře (i).
     Změny obsahu:
       2026-11-20  v1 dvě běžící počítadla od otevření článku (zadání v2, varianta A).
       2026-11-23  v2 předěláno podle Matta: místo počítadel sypání dat do mapy Česka za 24 hodin (směr A), barvy a logo
                   SentinelOne s „celosvětově“, hodiny s popiskem „24 hodin“, legenda „Jeden obrys Česka = objem veškerých dat,
                   která mobilní sítě v Česku přenesou v průměru za 24 hodin.“, závěrečná věta přesunuta do (i).
       2026-11-23  v3 podle Matta: nadpis „Objem dat za jeden den“, místo ciferníku a popisku „24 hodin“ jen počítadlo
                   „16 / 24 h“, pryč přehrávání znovu, legenda vystředěná k obrysu Česka a na šířku horní mapy. -->

<style>
.cc-s1data{
  --ink:#0b0c0e; --ink2:#3c4247; --ink3:#5f6870; --line:#e0e0e0;
  --s1:#6100ff; --s1d:#140d33; --mob:#59636b;
  --sc:1;
  --tf:max(16px, calc(clamp(17px,3.4vw,21px)*var(--sc)));      /* nadpis */
  --nf:max(20px, calc(clamp(22px,4.6vw,30px)*var(--sc)));      /* číslo v PB */
  --lf:max(12px, calc(clamp(12px,2.2vw,13px)*var(--sc)));      /* popisky */
  --gf:max(11px, calc(clamp(11px,2vw,12px)*var(--sc)));        /* legenda */
  --lw:clamp(132px,26vw,168px);                                /* sloupec s popisky */
  box-sizing:border-box;height:100%;display:flex;flex-direction:column;overflow:hidden;position:relative;
  padding:clamp(14px,3.6vw,22px) clamp(16px,4.2vw,28px) clamp(12px,3vw,18px);
  background:#fff;border:1px solid var(--line);border-radius:var(--cc-radius);color:var(--ink);
  font-family:var(--cc-display);
}
.cc-s1data *{box-sizing:border-box;}
.cc-s1data button{font:inherit;color:inherit;margin:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}

/* záhlaví: nadpis, počítadlo hodin, (i) */
.cc-s1data .hd{flex:0 0 auto;display:flex;align-items:center;gap:12px;}
.cc-s1data .cc-s1data__title{flex:1 1 auto;min-width:0;margin:0;color:#000;font:600 var(--tf)/1.25 var(--cc-display);letter-spacing:-.01em;text-wrap:balance;}
.cc-s1data .hrs{flex:none;display:flex;align-items:baseline;white-space:nowrap;color:var(--s1d);}
.cc-s1data .hrs__v{display:inline-block;min-width:1.25em;text-align:right;font:600 calc(var(--tf)*1.15)/1 var(--cc-display);}
.cc-s1data .hrs__u{margin-left:.3em;font:500 var(--lf)/1 var(--cc-display);color:#8a8fa3;}
.cc-s1data .info{flex:none;align-self:flex-start;width:26px;height:26px;border-radius:50%;border:1.5px solid #b9c0c6;background:#fff;color:var(--ink3);
  cursor:pointer;display:grid;place-items:center;font:600 13px/1 var(--cc-display);transition:border-color .15s,color .15s;}
@media (hover:hover){.cc-s1data .info:hover{border-color:var(--ink);color:var(--ink);}}

/* tělo: dva řádky – popisky vlevo, obrysy Česka vpravo */
.cc-s1data .bd{flex:1 1 auto;min-height:0;display:grid;margin-top:calc(clamp(6px,1.6vw,12px)*var(--sc));
  grid-template-columns:var(--lw) minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr);
  grid-template-areas:"l1 m1 m2" "l2 m3 lg";column-gap:clamp(10px,2.6vw,16px);row-gap:calc(clamp(8px,2vw,14px)*var(--sc));}
.cc-s1data .lab{min-width:0;display:flex;flex-direction:column;justify-content:center;}
.cc-s1data .lab--s1{grid-area:l1;} .cc-s1data .lab--mob{grid-area:l2;}
.cc-s1data .lab__n{min-width:0;}
.cc-s1data .logo{display:block;width:clamp(104px,20vw,128px);height:auto;}
.cc-s1data .lab__t{margin:0;color:var(--ink3);font:500 var(--lf)/1.3 var(--cc-display);}
.cc-s1data .lab--s1 .lab__t{margin-top:5px;}
.cc-s1data .num{display:flex;align-items:baseline;white-space:nowrap;margin-top:calc(8px*var(--sc));font:600 var(--nf)/1.05 var(--cc-display);color:var(--s1d);}
.cc-s1data .lab--mob .num{color:var(--mob);}
.cc-s1data .num .d{display:inline-block;width:var(--dw,.61em);text-align:left;}
.cc-s1data .num .k{display:inline-block;width:.27em;text-align:left;}
.cc-s1data .num .u{margin-left:.24em;font-size:.6em;font-weight:500;}
.cc-s1data .map{position:relative;min-width:0;min-height:0;}
.cc-s1data .map canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
.cc-s1data .m1{grid-area:m1;} .cc-s1data .m2{grid-area:m2;} .cc-s1data .m3{grid-area:m3;}
.cc-s1data .leg{grid-area:lg;align-self:center;justify-self:center;max-width:var(--lgw,100%);margin:0;padding-top:var(--lgo,0px);text-align:center;text-wrap:balance;color:var(--ink3);font:400 var(--gf)/1.45 var(--cc-display);}
.cc-s1data .leg b{font-weight:600;color:var(--ink2);}

/* panel (i) */
.cc-s1data .panel{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:clamp(12px,3vw,20px);
  background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);border-radius:var(--cc-radius);}
.cc-s1data .panel[hidden]{display:none;}
.cc-s1data .panel__box{position:relative;width:100%;max-width:500px;max-height:100%;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);
  border-radius:14px;box-shadow:0 18px 40px -18px rgba(20,13,51,.3);padding:clamp(14px,3.4vw,20px) clamp(16px,3.6vw,22px);}
.cc-s1data .panel__hd{display:flex;align-items:flex-start;gap:12px;}
.cc-s1data .panel__t{margin:0;font:600 15px/1.3 var(--cc-display);color:var(--ink);}
.cc-s1data .panel__x{margin-left:auto;flex:none;width:28px;height:28px;border:0;border-radius:50%;background:#f0f2f4;cursor:pointer;font:400 18px/1 var(--cc-display);color:var(--ink);}
.cc-s1data .panel__body{margin-top:8px;overflow-y:auto;min-height:0;}
.cc-s1data .panel__body p{margin:0 0 8px;font:400 13px/1.5 var(--cc-display);color:var(--ink2);}
.cc-s1data .panel__body p:last-child{margin-bottom:0;}
.cc-s1data .panel__body .lead{font-weight:500;color:var(--ink);}
.cc-s1data .panel__body .src{color:var(--ink3);}

/* pod 480 px: popisek nad každým řádkem, dva obrysy vedle sebe */
@media (max-width:479px){
  .cc-s1data .hd{align-items:flex-start;}
  .cc-s1data .hrs{margin-top:2px;}
  .cc-s1data .bd{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto minmax(0,1fr);
    grid-template-areas:"l1 l1" "m1 m2" "l2 l2" "m3 lg";row-gap:calc(6px*var(--sc));}
  .cc-s1data .lab{flex-direction:row;align-items:flex-end;justify-content:space-between;gap:10px;}
  .cc-s1data .lab--mob{margin-top:calc(8px*var(--sc));}
  .cc-s1data .lab--mob .lab__n{align-self:flex-end;}
  .cc-s1data .num{margin-top:0;}
  .cc-s1data .logo{width:clamp(96px,30vw,112px);}
  .cc-s1data .panel{padding:10px;}
  .cc-s1data .panel__box{padding:14px 16px;}
  .cc-s1data .panel__body p{font-size:12px;line-height:1.45;margin-bottom:6px;}
}
</style>

<script>
(function(){
  var root = document.querySelector('[data-cc-s1data]');
  if(!root || root.dataset.ccInit) return;
  root.dataset.ccInit = '1';
  var Q = location.search;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var canIO = 'IntersectionObserver' in window;
  var STATIC = /[?&]static\b/.test(Q);
  var FIXT = +((Q.match(/[?&]t=([\d.]+)/) || [])[1] || 1);              // jen pro náhledy: podíl dne

  /* ===== D: texty a data (zadání v2 + úpravy 23. 11. 2026) ===== */
  var D = {
    title: 'Objem dat za jeden den',
    l1: 'celosvětově',
    l2: 'Mobilní sítě v Česku',
    leg: '<b>Jeden obrys Česka</b> = objem veškerých dat, která mobilní sítě v Česku přenesou v průměru za 24 hodin.',
    s1: 11,                               // PB za 24 hodin (SentinelOne, říjen 2026)
    mob: 2160 / 365,                      // PB za 24 hodin: přibližně 2 160 PB za rok 2025 (ČTÚ)
    info: ['<span class="lead">Platforma SentinelOne zpracuje za 24 hodin skoro dvakrát víc dat, než přenesou všechny mobilní sítě v Česku.</span>',
           'Počítáno z průměrů. Platforma SentinelOne zpracuje celosvětově 11 petabajtů dat denně (údaj firmy, říjen 2026).',
           'Mobilní sítě v Česku přenesly za rok 2025 přibližně 2 160 petabajtů (odhad ČTÚ, bez provozu mezi stroji a bez pevného připojení přes LTE a 5G), v průměru tedy 5,9 petabajtu za 24 hodin.',
           '<span class="src">Zdroje: SentinelOne, ČTÚ (výroční zpráva za rok 2025).</span>'],
    sr: 'Objem dat za jeden den. Animace s mapou Česka: jeden obrys Česka je objem veškerých dat, která mobilní sítě v Česku přenesou v průměru za 24 hodin, tedy 5,9 petabajtu. '
      + 'Platforma SentinelOne zpracuje celosvětově 11 petabajtů dat denně, zaplní tedy jeden obrys celý a druhý z 86 procent, skoro dvakrát víc. '
      + 'Počítáno z průměrů. Zdroje: SentinelOne (říjen 2026), ČTÚ (výroční zpráva za rok 2025).'
  };

  var NB = ' ';
  var nb = function(t){ return t.replace(/(^| )([vzsaoikuVZSAOIKU]) /g, '$1$2'+NB).replace(/(\d) (PB|petabajt|procent|hodin)/g, '$1'+NB+'$2').replace(/(\d) (\d{3})/g, '$1'+NB+'$2'); };
  var $ = function(s){ return root.querySelector(s); };
  $('[data-title]').textContent = nb(D.title);
  $('[data-l1]').textContent = D.l1;

  $('[data-leg]').innerHTML = nb(D.leg);
  $('[data-sr]').textContent = D.sr;
  $('[data-pbody]').innerHTML = D.info.map(function(t){ return '<p>'+nb(t)+'</p>'; }).join('');

  /* ===== pomocníci ===== */
  var cl = function(v,a,b){ return Math.max(a, Math.min(b, v)); };
  function rnd(s){ return function(){ s = (s*16807) % 2147483647; return (s-1)/2147483646; }; }
  function mix(a,b,t){ return [0,1,2].map(function(i){ return Math.round(a[i]+(b[i]-a[i])*t); }); }
  var P0=[58,0,170], P1=[97,0,255], P2=[150,92,255], LIME=[143,255,8], G0=[150,159,168], G1=[196,203,210];
  function purple(t){ return t<.5 ? mix(P0,P1,t*2) : mix(P1,P2,(t-.5)*2); }
  var css = function(c){ return 'rgb('+c[0]+','+c[1]+','+c[2]+')'; };
  function inPoly(x,y){ var c=false; for(var i=0,j=CZ.length-1;i<CZ.length;j=i++){ var a=CZ[i],b=CZ[j]; if(((a[1]>y)!=(b[1]>y))&&(x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])) c=!c; } return c; }

  /* ===== čísla s buňkami pevné šířky ===== */
  function setNum(el, v){
    var s = v.toFixed(1).replace('.', ','), h = '';
    if(el._s === s) return; el._s = s;
    var p = s.split(',');                                // celá část přirozeně, desetinná číslice v buňce pevné šířky (mění se nejrychleji)
    el.innerHTML = p[0] + '<span class="k">,</span><span class="d">'+p[1]+'</span><span class="u">PB</span>';
  }
  var hEl = $('[data-h]');
  function setHours(f){ var h = String(Math.floor(cl(f,0,1)*24 + 1e-9)); if(hEl.textContent !== h) hEl.textContent = h; }

  /* ===== mapy ===== */
  var DPR = Math.min(3, Math.max(1, window.devicePixelRatio || 1));
  var maps = [].slice.call(root.querySelectorAll('[data-map]')).map(function(c, i){ return {c:c, x:c.getContext('2d'), s1:i<2, seed:[7,11,13][i]}; });
  var HEAD = 14;                                         // místo nad obrysem, odkud padají data
  function layoutMap(m){
    var w = m.c.clientWidth, h = m.c.clientHeight;
    if(!w || !h){ m.ok = false; return; }

  function drawMap(m, f, rate){

  /* ===== ovládání ===== */
  function bindTap(el, fn){   // pointerdown kvůli mobilu, click jen pro čtečky, klávesy zvlášť
    var last = 0;
    el.addEventListener('pointerdown', function(e){ if(e.button > 0) return; e.preventDefault(); last = Date.now(); fn(e); });
    el.addEventListener('click', function(e){ e.preventDefault(); if(Date.now() - last > 600) fn(e); });
    el.addEventListener('keydown', function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); last = Date.now(); fn(e); } });

  var info = $('[data-info]'), panel = $('[data-panel]'), closeBtn = $('[data-close]');
