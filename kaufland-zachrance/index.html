<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jaký jste zachránce? | CzechCrunch × Kaufland</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;700&display=swap">
<noscript><link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;700&display=swap"></noscript>
<style>
  html,body{margin:0;padding:0;background:transparent;height:100%;}
  body{overflow-x:hidden;}
  .cc-embed{margin:0!important;}
</style>
</head>
<body>

<!-- ============================================================
     CC sdílený designový základ .cc-embed – nesahat, vlastní styly
     jsou ve druhém <style> bloku pod třídou .cc-aed.
     ============================================================ -->
<style>
.cc-embed{
  --cc-blue:#087eeb;      --cc-blue-dark:#0668c2;
  --cc-red:#d40b3e;
  --cc-ink:#222;          --cc-ink-soft:#3c3c3c;
  --cc-muted:#84929b;
  --cc-line:#ececec;
  --cc-surface:#f8f9fa;   --cc-white:#fff;
  --cc-ok:#29cc6a;        --cc-warn:#f58a18;
  --cc-radius:15px;       --cc-radius-sm:10px;
  --cc-pad:clamp(16px,3vw,26px);
  --cc-gap:12px;
  --cc-serif:Georgia,Times,"Times New Roman",serif;
  --cc-display:Poppins,-apple-system,"Segoe UI",sans-serif;
  --cc-ui:Inter,-apple-system,"Segoe UI",sans-serif;
  display:block;
  margin:2.4rem 0;
  padding:var(--cc-pad);
  background:var(--cc-surface);
  border:1px solid var(--cc-line);
  border-radius:var(--cc-radius);
  color:var(--cc-ink);
  font:18px/1.66667 var(--cc-serif);
  -webkit-tap-highlight-color:transparent;
}
.cc-embed *{box-sizing:border-box;}
.cc-embed--flush{padding:0;overflow:hidden;}
.cc-embed--bare{background:none;border:0;padding:0;}
.cc-embed .cc-kicker{margin:0 0 6px;font:700 12px/1.25 var(--cc-ui);
  letter-spacing:.08em;text-transform:uppercase;color:var(--cc-red);}
.cc-embed h2,.cc-embed h3,.cc-embed h4,.cc-embed .cc-title{
  margin:0 0 8px;font-family:var(--cc-display);font-weight:700;line-height:1.25;color:#000;}
.cc-embed h3,.cc-embed .cc-title{font-size:clamp(20px,3.4vw,26px);}
.cc-embed h4{font-size:19px;}
.cc-embed p{margin:0 0 10px;}
.cc-embed .cc-lede{font-size:clamp(16px,2.2vw,18px);line-height:1.6;color:var(--cc-ink-soft);}
.cc-embed .cc-note{margin:12px 0 0;font:400 13px/1.5 var(--cc-ui);color:var(--cc-muted);}
.cc-embed .cc-label{font:500 12px/1.2 var(--cc-ui);color:var(--cc-muted);
  letter-spacing:.02em;text-transform:uppercase;}
.cc-embed .cc-num{font-family:var(--cc-display);font-weight:700;
  font-size:clamp(22px,4vw,32px);color:var(--cc-blue);font-variant-numeric:tabular-nums;}
.cc-embed a{color:var(--cc-blue);}
.cc-embed .cc-btn{
  display:inline-block;padding:10px 20px;
  border:1px solid var(--cc-blue);border-radius:var(--cc-radius);
  background:var(--cc-blue);color:#fff;text-decoration:none;
  font:700 18px/26px var(--cc-display);cursor:pointer;
  transition:background .18s,color .18s;}
.cc-embed .cc-btn:hover{background:var(--cc-blue-dark);border-color:var(--cc-blue-dark);}
.cc-embed .cc-btn--ghost{background:#fff;color:var(--cc-blue);}
.cc-embed .cc-btn--ghost:hover{background:var(--cc-blue);color:#fff;}
.cc-embed .cc-btn--sm{padding:7px 14px;font-size:15px;line-height:22px;}
.cc-embed .cc-btn[aria-pressed="true"]{background:#fff;color:var(--cc-blue);}
.cc-embed .cc-card{background:var(--cc-white);border:1px solid var(--cc-line);
  border-radius:var(--cc-radius-sm);padding:14px 16px;}
.cc-embed .cc-badge{display:inline-block;padding:3px 10px;border-radius:999px;
  background:var(--cc-blue);color:#fff;font:700 12px/18px var(--cc-ui);}
.cc-embed .cc-badge--red{background:var(--cc-red);}
.cc-embed .cc-badge--soft{background:#eaf3fd;color:var(--cc-blue-dark);}
.cc-embed input,.cc-embed select,.cc-embed textarea{
  font:400 16px/24px var(--cc-ui);color:var(--cc-ink);
  padding:9px 12px;background:#fff;border:1px solid var(--cc-line);
  border-radius:var(--cc-radius-sm);}
.cc-embed input[type=range]{padding:0;border:0;background:none;accent-color:var(--cc-blue);width:100%;}
.cc-embed :focus-visible{outline:3px solid var(--cc-blue);outline-offset:2px;}
.cc-embed table{width:100%;border-collapse:collapse;font:400 15px/1.4 var(--cc-ui);}
.cc-embed th{text-align:left;font-weight:700;color:var(--cc-muted);
  text-transform:uppercase;font-size:12px;letter-spacing:.05em;padding:8px 10px;}
.cc-embed td{padding:10px;border-top:1px solid var(--cc-line);}
.cc-embed img,.cc-embed svg,.cc-embed canvas{max-width:100%;}
.cc-embed .cc-grid{display:grid;gap:var(--cc-gap);
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));}
.cc-embed .cc-row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--cc-gap);}
.cc-embed .cc-sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}
@media (prefers-reduced-motion:reduce){.cc-embed *{transition:none!important;animation:none!important;}}
</style>

<!-- ============================================================
     PRVEK – Jaký jste zachránce (Kaufland: Z lásky k srdci)
     Swap-pointy pro redakci jsou nahoře ve <script> v objektu CFG a QUIZ.
     ============================================================ -->
<div class="cc-embed cc-embed--bare cc-aed" data-cc-aed>
  <p class="cc-sr">Interaktivní test o první pomoci při zástavě srdce. Sedm úkolů složený z odhadů křivky přežití, trenažéru tempa masáže a čtyř otázek.</p>

  <div class="cc-aed__head">
    <div class="cc-aed__headtext">
      <p class="cc-aed__kicker" data-el="kicker">Odhadněte realitu</p>
      <h3 class="cc-aed__title" data-el="title">Jak rychle klesá šance na přežití, když nikdo nezasáhne?</h3>
    </div>
    <div class="cc-aed__dots" data-el="dots" role="group" aria-label="Postup testem"></div>
  </div>

  <div class="cc-aed__stage" data-el="stage">

    <!-- scéna: graf -->
    <div class="cc-aed__scene cc-aed__scene--chart" data-scene="chart">
      <div class="cc-aed__legend" data-el="legend"></div>
      <div class="cc-aed__canvaswrap" data-el="canvaswrap">
        <canvas data-el="canvas" tabindex="0" role="img"
                aria-label="Graf: vodorovně minuty od zástavy srdce, svisle šance na přežití. Nakreslete odhad tažením zleva doprava."></canvas>
      </div>
    </div>

    <!-- scéna: trenažér -->
    <div class="cc-aed__scene cc-aed__scene--tempo" data-scene="tempo" hidden>
      <div class="cc-aed__tapwrap">
        <button type="button" class="cc-aed__tap" data-el="tap">
          <span class="cc-aed__taplabel" data-el="taplabel">Začněte klikat</span>
        </button>
      </div>
      <div class="cc-aed__gauge">
        <div class="cc-aed__gaugebar">
          <div class="cc-aed__gaugezone" data-el="gaugezone"></div>
          <div class="cc-aed__gaugemark" data-el="gaugemark"></div>
        </div>
        <div class="cc-aed__gaugescale" data-el="gaugescale"></div>
      </div>
      <p class="cc-aed__tapstate" data-el="tapstate"></p>
    </div>

    <!-- scéna: otázka -->
    <div class="cc-aed__scene cc-aed__scene--quiz" data-scene="quiz" hidden>
      <div class="cc-aed__opts" data-el="opts"></div>
    </div>

    <!-- scéna: výsledek -->
    <div class="cc-aed__scene cc-aed__scene--result" data-scene="result" hidden>
      <ul class="cc-aed__list" data-el="list"></ul>
    </div>

  </div>

  <div class="cc-aed__say" data-el="say" role="status" aria-live="polite"></div>

  <div class="cc-aed__foot">
    <!-- poznámka pod „i“: leží mimo tok, takže nikdy nezvětší prvek -->
    <div class="cc-aed__disc" data-el="disc" role="note" hidden></div>
    <div class="cc-aed__footleft" data-el="footleft"></div>
    <button type="button" class="cc-aed__i" data-el="info" hidden
            aria-expanded="false" aria-label="Poznámka ke zdroji dat">i</button>
    <button type="button" class="cc-aed__next" data-el="next" disabled>Nakreslete křivku</button>
  </div>
</div>

<style>
.cc-aed{
  /* Paleta speciálu „Z lásky k srdci": černá plocha, bílý text, jedna červená. */
  --ac:#ff4343;
  --ok:#ffffff;
  --bad:#ff4343;
  --plocha:#050101;
  --ink:#ffffff;
  --ink2:#b9bfc4;
  --line:#2b2424;
  /* pásmo správného tempa: stejná čísla řídí pruh i popisky stupnice */
  --zone-a:42.86%;   /* 100/min podle bpmToPct */
  --zone-b:57.14%;   /* 120/min */
  --sc:1;
  box-sizing:border-box;
  position:relative;
  display:flex;flex-direction:column;
  min-height:100vh;
  padding:clamp(14px,2.6vw,28px);
  background:var(--plocha);
  color:var(--ink);
  border-radius:15px;
  overflow:hidden;
  -webkit-user-select:none;user-select:none;
}
/* paprsky z hlavičky speciálu – velmi jemné, nikdy nepřebijí obsah */
.cc-aed::before{
  content:"";position:absolute;inset:-20% -10% auto -10%;height:150%;pointer-events:none;
  background:repeating-conic-gradient(from 182deg at 50% 0%,
    #0f0a0a 0deg 4.2deg, #050101 4.2deg 11deg);
  -webkit-mask-image:radial-gradient(120% 90% at 50% 0%,#000 0%,rgba(0,0,0,.35) 55%,transparent 85%);
          mask-image:radial-gradient(120% 90% at 50% 0%,#000 0%,rgba(0,0,0,.35) 55%,transparent 85%);
}
.cc-aed > *{position:relative;z-index:1;}

/* ---------- hlavička ---------- */
.cc-aed__head{display:flex;align-items:flex-start;gap:14px;flex:0 0 auto;}
.cc-aed__headtext{flex:1 1 auto;min-width:0;}
.cc-aed .cc-aed__kicker{margin:0 0 calc(5px*var(--sc));font:700 calc(12.5px*var(--sc))/1.2 var(--cc-ui);
  letter-spacing:.1em;text-transform:uppercase;color:var(--ac);}
.cc-aed .cc-aed__title{margin:0;font-family:var(--cc-display);font-weight:700;color:var(--ink);
  font-size:calc(clamp(19px,3.1vw,30px)*var(--sc));line-height:1.2;}

/* tečky postupu */
.cc-aed__dots{display:flex;gap:7px;flex:0 0 auto;padding-top:6px;}
.cc-aed__dot{width:9px;height:9px;border-radius:50%;box-sizing:border-box;
  border:2px solid #5a5151;background:transparent;transition:background .2s,border-color .2s;}
.cc-aed__dot--done{background:#8d8383;border-color:#8d8383;}
.cc-aed__dot--now{background:var(--ac);border-color:var(--ac);}

/* ---------- scéna ---------- */
.cc-aed__stage{position:relative;flex:1 1 auto;min-height:0;margin-top:calc(12px*var(--sc));}
.cc-aed__scene{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0;}
.cc-aed__scene[hidden]{display:none;}

/* graf */
.cc-aed__legend{flex:0 0 auto;height:calc(20px*var(--sc));display:flex;gap:calc(18px*var(--sc));
  justify-content:flex-end;align-items:center;white-space:nowrap;overflow:hidden;
  font:600 calc(13px*var(--sc))/1.2 var(--cc-ui);color:#d3d8db;opacity:0;transition:opacity .3s;}
.cc-aed__legend--on{opacity:1;}
.cc-aed__legend i{display:inline-block;width:20px;height:0;border-top-width:3.5px;border-top-style:solid;
  vertical-align:middle;margin-right:7px;}
.cc-aed__legend i.dash{border-top-style:dashed;border-top-width:3px;}
.cc-aed__lgshort{display:none;}
.cc-aed__canvaswrap{position:relative;flex:1 1 auto;min-height:0;}
.cc-aed__canvaswrap canvas{position:absolute;inset:0;width:100%;height:100%;
  touch-action:pan-y;cursor:crosshair;border-radius:8px;}
.cc-aed__canvaswrap canvas:focus-visible{outline:3px solid var(--ac);outline-offset:2px;}

/* trenažér */
.cc-aed__scene--tempo{align-items:center;justify-content:center;gap:calc(16px*var(--sc));}
.cc-aed__tapwrap{flex:0 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;}
.cc-aed__tap{
  width:var(--tapd,150px);height:var(--tapd,150px);border-radius:50%;
  border:3px solid var(--ac);background:rgba(255,67,67,.10);color:var(--ink);cursor:pointer;
  font:700 calc(clamp(16px,2.1vw,21px)*var(--sc))/1.2 var(--cc-display);
  display:flex;align-items:center;justify-content:center;padding:0 6%;
  font-variant-numeric:tabular-nums;text-align:center;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;
  transition:background .12s,border-color .12s;}
.cc-aed__tap--pulse{animation:ccaedpulse .5454s linear infinite;}
@keyframes ccaedpulse{
  0%{transform:scale(1);border-color:var(--ac);}
  10%{transform:scale(1.055);border-color:#fff;}
  55%{transform:scale(1);border-color:var(--ac);}
  100%{transform:scale(1);border-color:var(--ac);}
}
.cc-aed__tap--live{background:var(--ac);color:#fff;}
.cc-aed__tap--hit{transform:scale(.955);}
.cc-aed__tap:disabled{opacity:.55;cursor:default;}
.cc-aed__gauge{flex:0 0 auto;width:min(460px,100%);}
.cc-aed__gaugebar{position:relative;height:calc(12px*var(--sc));border-radius:999px;background:#2b2424;overflow:hidden;}
.cc-aed__gaugezone{position:absolute;top:0;bottom:0;
  left:var(--zone-a);width:calc(var(--zone-b) - var(--zone-a));background:rgba(255,67,67,.55);}
.cc-aed__gaugemark{position:absolute;top:-4px;bottom:-4px;width:4px;border-radius:2px;background:#fff;
  left:0;opacity:0;transition:left .12s linear,opacity .2s;}
.cc-aed__gaugemark--on{opacity:1;}
/* popisky stupnice se pozicují ze stejných proměnných jako pruh, ať nedriftují */
.cc-aed__gaugescale{position:relative;height:calc(17px*var(--sc));margin-top:5px;
  font:600 calc(12px*var(--sc))/1.4 var(--cc-ui);color:#9aa1a6;font-variant-numeric:tabular-nums;}
.cc-aed__gaugescale span{position:absolute;top:0;transform:translateX(-50%);}
.cc-aed__gaugescale span[data-at="min"]{left:0;transform:none;}
.cc-aed__gaugescale span[data-at="max"]{right:0;left:auto;transform:none;}
.cc-aed__gaugescale span[data-at="a"]{left:var(--zone-a);}
.cc-aed__gaugescale span[data-at="b"]{left:var(--zone-b);}
.cc-aed .cc-aed__tapstate{flex:0 0 auto;margin:0;min-height:calc(22px*var(--sc));
  display:flex;justify-content:center;gap:calc(20px*var(--sc));
  font:600 calc(clamp(14px,1.8vw,17px)*var(--sc))/1.35 var(--cc-ui);color:#fff;
  font-variant-numeric:tabular-nums;}

/* otázka */
.cc-aed__opts{display:flex;flex-direction:column;justify-content:center;gap:calc(9px*var(--sc));
  flex:1 1 auto;min-height:0;}
.cc-aed__opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;
  background:#0e0909;border:1.5px solid #3a3232;border-radius:10px;color:var(--ink);
  padding:calc(13px*var(--sc)) calc(16px*var(--sc));touch-action:manipulation;
  font:500 calc(clamp(15px,2vw,19px)*var(--sc))/1.35 var(--cc-ui);
  transition:border-color .15s,background .15s;}
.cc-aed__opt:hover:not(:disabled){border-color:#8b8080;background:#171111;}
.cc-aed__opt:disabled{cursor:default;}
.cc-aed__opt--ok{border-color:#fff;background:#1b1515;}
.cc-aed__opt--bad{border-color:var(--bad);background:#1f0e10;}
.cc-aed__opt--dim{opacity:.42;}
.cc-aed__opt span{flex:1 1 auto;}
.cc-aed__mark{flex:0 0 auto;width:calc(21px*var(--sc));height:calc(21px*var(--sc));display:none;}
.cc-aed__mark svg{display:block;width:100%;height:100%;}
.cc-aed__opt--ok .cc-aed__mark,.cc-aed__opt--bad .cc-aed__mark{display:block;}

/* výsledek */
.cc-aed__scene--result{justify-content:center;}
.cc-aed__list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line);}
.cc-aed__list li{display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--line);
  padding:calc(8px*var(--sc)) 0;
  font:500 calc(clamp(14px,1.8vw,17px)*var(--sc))/1.3 var(--cc-ui);color:#e6e9eb;}
.cc-aed__list svg{flex:0 0 auto;width:calc(18px*var(--sc));height:calc(18px*var(--sc));}

/* ---------- slot vysvětlení (nikdy neroste) ---------- */
.cc-aed__say{flex:0 0 auto;position:relative;
  min-height:calc(var(--sayh,58px)*var(--sc));margin-top:calc(10px*var(--sc));
  font:400 calc(clamp(14.5px,1.9vw,18px)*var(--sc))/1.42 var(--cc-ui);color:#dfe3e6;
  -webkit-user-select:text;user-select:text;}
.cc-aed__say b{font-weight:700;color:#fff;}
.cc-aed__say .cc-aed__stat{display:block;margin-top:4px;color:#a5acb1;}
.cc-aed__shapes{display:none;gap:8px;flex-wrap:wrap;align-items:center;}
.cc-aed__shapes--on{display:flex;}
.cc-aed__shapes b{font:700 calc(13.5px*var(--sc))/1.3 var(--cc-ui);color:var(--ink2);}
.cc-aed__shape{cursor:pointer;background:transparent;border:1.5px solid #4d4444;border-radius:999px;color:#fff;
  padding:calc(6px*var(--sc)) calc(13px*var(--sc));touch-action:manipulation;
  font:600 calc(13.5px*var(--sc))/1.3 var(--cc-ui);}
.cc-aed__shape:hover{border-color:#fff;}

/* ---------- patička ---------- */
.cc-aed__foot{position:relative;flex:0 0 auto;display:flex;align-items:center;gap:10px;
  margin-top:calc(10px*var(--sc));}
.cc-aed__footleft{flex:1 1 auto;min-width:0;display:flex;gap:8px;flex-wrap:wrap;}
.cc-aed__next{flex:0 0 auto;cursor:pointer;border:0;border-radius:999px;background:var(--ac);color:#fff;
  padding:calc(11px*var(--sc)) calc(26px*var(--sc));
  font:700 calc(clamp(14px,1.6vw,16px)*var(--sc))/1.4 var(--cc-ui);letter-spacing:.01em;
  touch-action:manipulation;
  transition:background .15s,color .15s;}
.cc-aed__next:hover:not(:disabled){background:#fff;color:#0a0505;}
.cc-aed__next:disabled{background:#2b2424;color:#7b7373;cursor:default;}
.cc-aed__ghost{cursor:pointer;border:1.5px solid #4d4444;border-radius:999px;background:transparent;color:#fff;
  padding:calc(10px*var(--sc)) calc(20px*var(--sc));touch-action:manipulation;
  font:600 calc(clamp(13px,1.5vw,15px)*var(--sc))/1.4 var(--cc-ui);}
.cc-aed__ghost:hover{border-color:#fff;}
.cc-aed__i{flex:0 0 auto;cursor:pointer;touch-action:manipulation;
  width:calc(30px*var(--sc));height:calc(30px*var(--sc));border-radius:50%;
  border:1.5px solid #4d4444;background:transparent;color:#c8ced2;padding:0;
  font:700 calc(14px*var(--sc))/1 var(--cc-ui);}
.cc-aed__i:hover{border-color:#fff;color:#fff;}
.cc-aed__i[aria-expanded="true"]{background:#fff;color:#0a0505;border-color:#fff;}
.cc-aed__disc{position:absolute;left:0;right:0;bottom:100%;margin-bottom:calc(10px*var(--sc));z-index:6;
  background:#161010;border:1px solid #3a3232;border-radius:10px;
  padding:calc(12px*var(--sc)) calc(15px*var(--sc));max-height:34vh;overflow-y:auto;
  font:400 calc(clamp(12.5px,1.4vw,14.5px)*var(--sc))/1.45 var(--cc-ui);color:#c2c8cc;
  -webkit-user-select:text;user-select:text;}
.cc-aed__disc[hidden]{display:none;}

.cc-aed :focus-visible{outline:3px solid var(--ac);outline-offset:2px;}

@media (max-width:619px){
  .cc-aed__head{gap:10px;}
  .cc-aed__legend{gap:calc(12px*var(--sc));font-size:calc(12px*var(--sc));}
  .cc-aed__legend i{width:16px;margin-right:5px;}
  .cc-aed__lgfull{display:none;}
  .cc-aed__lgshort{display:inline;}
}
</style>

<script>
(function(){
  function init(root){
    if(!root || root.dataset.ccInit) return;
    root.dataset.ccInit = '1';

  /* ============================================================
     CFG – všechno, co může chtít redakce přepsat, je tady.
     ============================================================ */
  var CFG = {
    dropNone: 10,     // pokles šance v proc. bodech za minutu bez pomoci
    dropCpr:  4,      // pokles s okamžitou masáží srdce
    tolerance: 15,    // průměrná odchylka v p. b., do které je odhad trefa

  var el = {};

  /* ---------- univerzální „klepnutí" ----------
     click sám o sobě na mobilu vypadává: při rychlém ťukání se prst pohne
     a prohlížeč click zahodí. Bereme proto pointerdown, s fallbackem na
     touchstart/mousedown pro prohlížeče bez Pointer Events, a klávesnici. */
  function bindTap(node, fn){
    var lastTouch = 0, hasPtr = !!window.PointerEvent;
    function go(e){
      if(node.disabled) return;
      if(e && e.cancelable) e.preventDefault();
      try{ node.focus({preventScroll:true}); }catch(err){ try{ node.focus(); }catch(e2){} }
      fn();
    }
    if(hasPtr){
      node.addEventListener('pointerdown', go);
    } else {
      node.addEventListener('touchstart', function(e){ lastTouch = Date.now(); go(e); }, {passive:false});
      node.addEventListener('mousedown', function(e){ if(Date.now() - lastTouch > 700) go(e); });
    }
    node.addEventListener('keydown', function(e){
      if(e.key === ' ' || e.key === 'Enter' || e.key === 'Spacebar'){ e.preventDefault(); fn(); }
    });
    node.addEventListener('click', function(e){ e.preventDefault(); });
    node.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  }

    return '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="'+d+'" fill="none" stroke="'+c+

  /* ---------- stupnice trenažéru ---------- */

  /* ============================================================

  var cv = el.canvas, ctx = cv.getContext('2d');

  };

  function refCurve(drop){
    var a = new Float32Array(N);
    for(var i=0;i<N;i++) a[i] = Math.max(0, 100 - drop * (i/10));
    return a;
  }

  function newUser(){
    var a = new Float32Array(N);

    a[0] = 100;
    return a;
  }

  function sizeCanvas(){
    var w = el.canvaswrap.clientWidth, h = el.canvaswrap.clientHeight;
    if(w < 2 || h < 2) return false;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    var narrow = w < 400;
    var padL = narrow ? 50 : 58, padB = narrow ? 26 : 30, padT = 14, padR = narrow ? 12 : 18;
    plot = {x:padL, y:padT, w:Math.max(10, w-padL-padR), h:Math.max(10, h-padT-padB)};
    return true;
  }
  function px(t){ return plot.x + (t/10) * plot.w; }
  function py(v){ return plot.y + (1 - v/100) * plot.h; }

  function line(arr, from, to, color, width, dash){
    ctx.save();
    ctx.strokeStyle = color; ctx.lineWidth = width;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    if(dash) ctx.setLineDash(dash);
    ctx.beginPath();
    var started = false;
    for(var i=from;i<=to && i<N;i++){
      var v = arr[i];
      if(isNaN(v)){ started = false; continue; }
      var X = px(i/10), Y = py(v);
      if(!started){ ctx.moveTo(X,Y); started = true; } else ctx.lineTo(X,Y);
    }
    ctx.stroke(); ctx.restore();
  }

  function draw(){
    if(!sizeCanvas()) return;
    ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height); ctx.restore();

    var narrow = plot.w < 320;
    var fs = narrow ? 12 : 14;
    ctx.fillStyle = C.plocha;
    ctx.fillRect(plot.x, plot.y, plot.w, plot.h);

    // mřížka + osa Y
    ctx.font = '600 ' + fs + 'px Inter,-apple-system,"Segoe UI",sans-serif';
    ctx.fillStyle = C.tick; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    [0,25,50,75,100].forEach(function(v){
      var Y = py(v);
      ctx.strokeStyle = v===0 ? C.axis : C.grid; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(plot.x, Y+.5); ctx.lineTo(plot.x+plot.w, Y+.5); ctx.stroke();
      if(v%50===0) ctx.fillText(v + ' %', plot.x-8, Y);
    });
    // osa X
    ctx.textBaseline = 'top';
    for(var t=0;t<=10;t+=2){
      var X = px(t);
      if(t>0){ ctx.strokeStyle = C.grid; ctx.beginPath(); ctx.moveTo(X+.5,plot.y); ctx.lineTo(X+.5,plot.y+plot.h); ctx.stroke(); }
      ctx.fillStyle = C.tick;
      ctx.textAlign = t===10 ? 'right' : 'center';
      ctx.fillText(t===10 ? '10 min' : String(t), t===10 ? X+2 : X, plot.y+plot.h+8);
    }
    ctx.textAlign = 'center';
    ctx.strokeStyle = C.axis; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(plot.x+.5, plot.y); ctx.lineTo(plot.x+.5, plot.y+plot.h); ctx.stroke();

    // ve druhém kroku kotva: reálná křivka bez pomoci
    if(chartStep === 2) line(REF1, 0, N-1, C.anchor, 3, [7,6]);

    // odhalená reference
    if(revealT > 0){

    var done = revealT > 0;

      ctx.fillStyle = C.userLive;
      ctx.beginPath(); ctx.arc(px(0), py(100), 6.5, 0, Math.PI*2); ctx.fill();
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      var hx = plot.x + plot.w*0.42, hy = plot.y + plot.h*0.44;
      ctx.fillStyle = C.hint;
      ctx.font = '700 ' + (narrow ? 15 : 21) + 'px Inter,-apple-system,"Segoe UI",sans-serif';
      ctx.fillText('Nakreslete křivku zleva doprava', hx, hy);
      ctx.fillStyle = C.hint2;
      ctx.font = '400 ' + (narrow ? 12.5 : 16) + 'px Inter,-apple-system,"Segoe UI",sans-serif';
      ctx.fillText('Nápověda: šance v čase vždy klesá', hx, hy + (narrow?21:29));

    if(revealT >= .999){

      ctx.save();
      ctx.strokeStyle = '#857b7b'; ctx.lineWidth = 1.5; ctx.setLineDash([5,5]);
      ctx.beginPath(); ctx.moveTo(X4+.5, plot.y); ctx.lineTo(X4+.5, plot.y+plot.h); ctx.stroke();
      ctx.restore();
      ctx.font = '700 ' + fs + 'px Inter,-apple-system,"Segoe UI",sans-serif';
      ctx.fillStyle = '#cfd4d8'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';

  }

  /* ---------- kreslení ----------
     Čtenář kreslí volně, klidně na několik tahů a v libovolném pořadí.
     Za pochodu se nic nedopočítává; mezery i chybějící konec doplní až
     finishCurve() ve chvíli, kdy si nechá křivku zkontrolovat. */
  function countDrawn(){
    var n = 0;
    for(var i=1;i<N;i++) if(!isNaN(user[i])) n++;
    return n;
  }
  function fromPoint(clientX, clientY){
    var r = cv.getBoundingClientRect();
    return { t: ((clientX - r.left) - plot.x) / plot.w * 10,
             v: (1 - ((clientY - r.top) - plot.y) / plot.h) * 100 };
  }

  // ukotví start na 100 %, vyplní mezery mezi tahy a protáhne konec posledním sklonem
  function finishCurve(){
    var i, k, last = -1;
    if(isNaN(user[0])) user[0] = 100;
    for(i=N-1;i>=0;i--){ if(!isNaN(user[i])){ last = i; break; } }
    if(last <= 0){ for(i=0;i<N;i++) user[i] = 100; drawn = countDrawn(); return; }
    var prev = -1;
    for(i=0;i<=last;i++){
      if(isNaN(user[i])) continue;
      if(prev >= 0 && i - prev > 1){
        for(k=prev+1;k<i;k++) user[k] = user[prev] + (user[i]-user[prev])*(k-prev)/(i-prev);
      }
      prev = i;
    }
    if(last < N-1){
      var back = Math.min(15, last);
      var slope = back > 0 ? (user[last] - user[last-back]) / back : 0;
      for(i=last+1;i<N;i++) user[i] = Math.max(0, Math.min(100, user[last] + slope*(i-last)));
    }
    drawn = countDrawn();
  }

  var drawing = false, lastIx = -1, lastVal = 0, rafOn = false;
  function drawSoon(){
    if(rafOn) return;
    rafOn = true;
    requestAnimationFrame(function(){ rafOn = false; draw(); });
  }
  function paint(x, y){
    var p = fromPoint(x, y);
    var ix = Math.round(Math.max(0, Math.min(10, p.t)) * 10);
    var v = Math.max(0, Math.min(100, p.v));
    if(lastIx < 0 || ix === lastIx){
      user[ix] = v;
    } else {                                  // spoj s předchozím bodem téhož tahu
      var step = ix > lastIx ? 1 : -1, n = Math.abs(ix - lastIx);
      for(var k=1;k<=n;k++) user[lastIx + step*k] = lastVal + (v - lastVal) * k / n;
    }
    lastIx = ix; lastVal = v;
    drawn = countDrawn();
    drawSoon(); syncNext();
  }
  function startDraw(x,y){ if(revealT > 0) return; drawing = true; lastIx = -1; paint(x,y); }
  function moveDraw(x,y){ if(!drawing || revealT > 0) return; paint(x,y); }
  function endDraw(){ drawing = false; lastIx = -1; }

  if(window.PointerEvent){
    cv.addEventListener('pointerdown', function(e){
      startDraw(e.clientX, e.clientY);
      try{ cv.setPointerCapture(e.pointerId); }catch(err){}

    cv.addEventListener('touchstart', function(e){ var t=e.touches[0]; if(t) startDraw(t.clientX,t.clientY); }, {passive:true});

    cv.addEventListener('mousedown', function(e){ startDraw(e.clientX, e.clientY); });
    cv.addEventListener('mousemove', function(e){ moveDraw(e.clientX, e.clientY); });
    ['mouseup','mouseleave'].forEach(function(t){ cv.addEventListener(t, endDraw); });
  }

  // klávesová cesta: po zaostření canvasu se ve slotu nabídnou hotové tvary
  cv.addEventListener('focus', function(){

    try{ isKb = cv.matches(':focus-visible'); }catch(e){}
    if(isKb) showShapes();
  });
  function showShapes(){
    if(el.say.dataset.mode === 'shapes') return;
    el.say.dataset.mode = 'shapes';
    el.say.innerHTML = '<div class="cc-aed__shapes cc-aed__shapes--on"><b>Nebo vyberte tvar:</b>'+
      '<button type="button" class="cc-aed__shape" data-shape="steep">Prudký pokles</button>'+
      '<button type="button" class="cc-aed__shape" data-shape="lin">Rovnoměrný</button>'+
      '<button type="button" class="cc-aed__shape" data-shape="soft">Mírný pokles</button></div>';
    el.say.querySelectorAll('[data-shape]').forEach(function(b){
      b.addEventListener('click', function(){
        var s = b.dataset.shape;
        for(var i=0;i<N;i++){
          var t = i/10;
          user[i] = s==='steep' ? Math.max(0,100 - 16*t)
                  : s==='soft'  ? Math.max(0,100 - 5*t)
                                : Math.max(0,100 - 10*t);
        }
        drawn = countDrawn(); el.say.dataset.mode = ''; el.say.innerHTML = '';
        draw(); syncNext(); el.next.focus();
      });
    });
  }

  /* ---------- odhalení ----------
     Sekvence hlídá, aby doběhlá animace nepřepsala už přepnutou obrazovku. */
  function reveal(){
    var my = ++revealSeq;
    finishCurve();                     // teprve teď doplň mezery a chybějící konec
    revealT = 0; revealing = true;
    syncNext();                        // zamkni tlačítko hned, ne až po doběhnutí
    var t0 = performance.now(), dur = 700;
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
    if(reduce){ revealT = 1; draw(); afterReveal(my); return; }
    (function tick(now){
      if(my !== revealSeq) return;
      revealT = Math.min(1, (now - t0)/dur);
      draw();
      if(revealT < 1) requestAnimationFrame(tick);
      else afterReveal(my);
    })(performance.now());
  }
  function avgDiff(a,b){ var s=0,n=0; for(var i=10;i<N;i+=10){ if(!isNaN(a[i])){ s+=Math.abs(a[i]-b[i]); n++; } } return n?s/n:99; }
  function bias(a,b){ var s=0,n=0; for(var i=10;i<N;i+=10){ if(!isNaN(a[i])){ s+=(a[i]-b[i]); n++; } } return n?s/n:0; }

  function afterReveal(my){
    if(my !== revealSeq) return;
    revealing = false;
    var refA = chartStep === 1 ? REF1 : REF2;
    var d = avgDiff(user, refA), bi = bias(user, refA);
    var okay = d <= CFG.tolerance;
    pass[chartStep === 1 ? 'k1' : 'k2'] = okay;

    el.legend.innerHTML = chartStep === 1
      ? lg(C.userDone,false,'Váš odhad','Odhad','plná světlá čára') +
        lg(AC,false,'Realita','Realita','plná červená čára')
      : lg(C.anchor,true,'Bez pomoci','Bez pomoci','přerušovaná šedá čára') +
        lg(C.userDone,false,'Váš odhad s masáží','Váš odhad','plná světlá čára') +
        lg(AC,false,'Realita s masáží','S masáží','plná červená čára');
    el.legend.classList.add('cc-aed__legend--on');

    cv.setAttribute('aria-label', chartStep === 1
      ? 'Graf: bez pomoci klesá šance na přežití zhruba o deset procentních bodů za minutu, po deseti minutách je nulová. Váš odhad je vykreslen světle šedou čarou.'
      : 'Graf: s okamžitou masáží klesá šance zhruba o čtyři procentní body za minutu, po deseti minutách zbývá kolem šedesáti procent. Přerušovaně je průběh bez pomoci, světlou čarou váš odhad.');

    var lead = okay ? 'Trefa. '
             : (bi > 0 ? 'Tipovali jste mírnější pokles, než jak šance na přežití klesá ve skutečnosti. '
                       : 'Tipovali jste strmější pokles, než jak šance na přežití klesá ve skutečnosti. ');
    var body = chartStep === 1
      ? 'Bez zásahu mizí každou minutu zhruba deset procent naděje. Po čtyřech minutách začíná mozek nevratně odumírat, po deseti minutách se šance na přežití blíží nule.'
      : 'S okamžitou masáží klesá naděje zhruba 2,5krát pomaleji. Rozdíl mezi čarami je přesně to, co může změnit náhodný kolemjdoucí. Dávno předtím než dorazí sanitka.';
    say('<b>' + lead + '</b>' + body);
    syncNext();
  }
  function lg(color, dashed, full, short, sr){
    return '<span><i class="'+(dashed?'dash':'')+'" style="border-color:'+color+'"></i>'+
           '<span class="cc-sr">'+sr+': </span>'+
           '<span class="cc-aed__lgfull">'+full+'</span>'+
           '<span class="cc-aed__lgshort" aria-hidden="true">'+short+'</span></span>';
  }

  /* ============================================================
     TRENAŽÉR
     ============================================================ */
  var taps = [], tapRunning = false, tapEnd = 0, tapTimer = null;

  function tapState(a, b){
    el.tapstate.innerHTML = a ? ('<span>'+a+'</span>' + (b ? '<span>'+b+'</span>' : '')) : '';
  }

  function tapReset(){
    taps = []; tapRunning = false;
    clearInterval(tapTimer);
    el.taplabel.textContent = 'Začněte klikat';
    el.tap.classList.remove('cc-aed__tap--live');
    el.tap.classList.add('cc-aed__tap--pulse');
    el.tap.disabled = false;
    el.gaugemark.classList.remove('cc-aed__gaugemark--on');
    tapState('');
  }

  function tapHit(){
    var now = (window.performance && performance.now) ? performance.now() : Date.now();
    if(!tapRunning){
      tapRunning = true; taps = [now]; tapEnd = now + CFG.tapSeconds*1000;
      el.tap.classList.remove('cc-aed__tap--pulse');
      el.tap.classList.add('cc-aed__tap--live');
      el.taplabel.textContent = CFG.tapSeconds.toFixed(1).replace('.', ',');
      tapTimer = setInterval(function(){
        var t = (window.performance && performance.now) ? performance.now() : Date.now();
        var left = Math.max(0, tapEnd - t);
        el.taplabel.textContent = (left/1000).toFixed(1).replace('.', ',');
        if(left <= 0) tapFinish();
      }, 60);
      return;
    }
    if(now > tapEnd) return;
    taps.push(now);
    el.tap.classList.add('cc-aed__tap--hit');
    setTimeout(function(){ el.tap.classList.remove('cc-aed__tap--hit'); }, 70);

    var n = taps.length;
    if(n >= 3){
      var win = Math.min(3, n-1), sum = 0;
      for(var i=n-win;i<n;i++) sum += taps[i] - taps[i-1];
      var bpm = 60000 / (sum/win);
      el.gaugemark.style.left = (bpmToPct(bpm)*100).toFixed(1) + '%';
      el.gaugemark.classList.add('cc-aed__gaugemark--on');
      var streak = 0;
      for(var j=n-1;j>=1;j--){
        var b = 60000/(taps[j]-taps[j-1]);
        if(b >= CFG.tempoMin && b <= CFG.tempoMax) streak++; else break;
      }
      tapState(Math.round(bpm) + ' za minutu', streak >= 3 ? ('série ' + streak) : '');
    }
  }

  function tapFinish(){
    clearInterval(tapTimer);
    tapRunning = false; el.tap.disabled = true;
    el.tap.classList.remove('cc-aed__tap--live','cc-aed__tap--pulse');
    el.taplabel.textContent = 'Hotovo';

    var iv = [];
    for(var i=1;i<taps.length;i++) iv.push(60000/(taps[i]-taps[i-1]));
    iv = iv.slice(2);                       // první dvě klepnutí jsou rozjezd
    var inZone = iv.filter(function(b){ return b >= CFG.tempoMin && b <= CFG.tempoMax; }).length;
    var share = iv.length ? inZone/iv.length : 0;
    var med = iv.length ? iv.slice().sort(function(a,b){return a-b;})[Math.floor(iv.length/2)] : 0;
    var enough = iv.length >= CFG.tempoMinTaps - 1;
    var okay = enough && share >= CFG.tempoNeed;
    pass.tempo = okay;

    if(!enough){
      say('<b>Klepnutí bylo málo na to, aby se tempo dalo změřit.</b> Zkuste to ještě jednou, potřebujete zhruba dvě klepnutí za vteřinu.');
      tapState('Málo klepnutí na změření');
    } else {
      var lead = okay ? 'Sedí. ' : (med < CFG.tempoMin ? 'Bylo to pomalejší, než je potřeba. ' : 'Bylo to rychlejší, než je potřeba. ');
      say('<b>' + lead + '</b>Vaše tempo bylo ' + Math.round(med) + ' za minutu, v pásmu ' + CFG.tempoMin + ' až ' + CFG.tempoMax +
          ' jste strávili ' + Math.round(share*100) + ' % času. Na skutečném člověku k tomu patří hloubka 5 až 6 centimetrů a propnuté lokty.' +
          '<span class="cc-aed__stat">Pomůcka do reálné situace: dvě stlačení každou vteřinu.</span>');
      tapState(Math.round(med) + ' za minutu', Math.round(share*100) + ' % v pásmu');
    }
    footTempoButtons(true);
    syncNext();
  }

  bindTap(el.tap, tapHit);

  function footTempoButtons(withAgain){
    el.footleft.innerHTML = '';
    if(!withAgain) return;
    var again = document.createElement('button');
    again.type = 'button'; again.className = 'cc-aed__ghost'; again.textContent = 'Zkusit znovu';
    bindTap(again, function(){ tapReset(); say(''); footTempoButtons(false); delete pass.tempo; syncNext(); });
    el.footleft.appendChild(again);
  }

  /* ============================================================
     OTÁZKY
     ============================================================ */
  function renderQuiz(q){
    el.opts.innerHTML = '';
    q.opts.forEach(function(txt, i){
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'cc-aed__opt';
      b.innerHTML = '<span>' + txt + '</span><span class="cc-aed__mark"></span>';
      bindTap(b, function(){ answer(q, i); });
      el.opts.appendChild(b);
    });
  }
  function answer(q, i){
    if(pass[q.id] !== undefined) return;
    var right = (i === q.right), btns = el.opts.children;
    pass[q.id] = right;
    for(var k=0;k<btns.length;k++){
      btns[k].disabled = true;
      var mark = btns[k].querySelector('.cc-aed__mark');
      if(k === q.right){ btns[k].classList.add('cc-aed__opt--ok'); mark.innerHTML = icon(true); }
      else if(k === i){ btns[k].classList.add('cc-aed__opt--bad'); mark.innerHTML = icon(false); }
      else btns[k].classList.add('cc-aed__opt--dim');
    }
    var txt = '<b>' + (right ? 'Správně. ' : 'Není to tak. ') + '</b>' + (right ? q.ok : q.no);
    if(q.stat && !right) txt += '<span class="cc-aed__stat">' + q.stat + '</span>';
    say(txt);
    syncNext();
  }

  /* ============================================================
     VÝSLEDEK
     ============================================================ */
  function renderResult(){
    var score = 0;
    TASKS.forEach(function(t){ if(pass[t.id]) score++; });
    var v = VERDICTS.filter(function(x){ return score >= x.min; })[0];
    el.kicker.textContent = 'Splnili jste ' + score + ' ze 7';
    el.title.textContent = v.head;
    el.list.innerHTML = TASKS.map(function(t){
      return '<li>' + icon(!!pass[t.id]) + '<span>' + t.key + '</span></li>';
    }).join('');
    say(v.say);
    el.footleft.innerHTML = '';
    var again = document.createElement('button');
    again.type = 'button'; again.className = 'cc-aed__ghost'; again.textContent = 'Zkusit znovu';
    bindTap(again, restart);
    el.footleft.appendChild(again);
  }

  function restart(){
    pass = {}; stepIx = 0; chartStep = 1;
    user = newUser(); drawn = 0; lastIx = -1; revealT = 0; revealing = false; revealSeq++;
    tapReset(); enter();
  }

  /* ============================================================
     POZNÁMKA POD „i"
     ============================================================ */
  function setDisc(text){
    el.disc.textContent = text || '';
    var has = !!text;
    el.info.hidden = !has;
    if(!has) closeDisc();
  }
  function openDisc(){
    el.disc.hidden = false;
    el.info.setAttribute('aria-expanded','true');
  }
  function closeDisc(){
    el.disc.hidden = true;
    el.info.setAttribute('aria-expanded','false');
  }
  bindTap(el.info, function(){
    if(el.disc.hidden) openDisc(); else closeDisc();
  });
  root.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && !el.disc.hidden){ closeDisc(); el.info.focus(); }
  });
  document.addEventListener('pointerdown', function(e){
    if(el.disc.hidden) return;
    if(el.disc.contains(e.target) || el.info.contains(e.target)) return;
    closeDisc();
  }, true);

  /* ============================================================
     ŘÍZENÍ OBRAZOVEK
     ============================================================ */
  function say(html){ el.say.dataset.mode = ''; el.say.innerHTML = html || ''; }
  function showScene(name){
    Object.keys(scenes).forEach(function(k){ scenes[k].hidden = (k !== name); });
  }
  function syncNext(){
    var s = STEPS[stepIx], b = el.next;
    b.style.display = '';
    if(s === 'k1' || s === 'k2'){
      if(revealing || revealT > 0){
        // dokud animace odhalení neskončí, tlačítko nepustí dál
        b.disabled = revealing || revealT < 1;
        b.textContent = 'Pokračovat';
      } else {
        b.disabled = (drawn < CFG.minDrawn);
        b.textContent = !b.disabled ? 'Zkontrolovat'
                      : (drawn === 0 ? 'Nakreslete křivku' : 'Dokreslete křivku');
      }
    } else if(s === 'tempo'){
      b.disabled = (pass.tempo === undefined); b.textContent = 'Pokračovat';
    } else if(s === 'result'){
      b.style.display = 'none';
    } else {
      b.disabled = (pass[s] === undefined);
      b.textContent = stepIx === STEPS.length - 2 ? 'Zobrazit výsledek' : 'Pokračovat';
    }
  }

  function enter(){
    var s = STEPS[stepIx];
    revealSeq++;                       // zneplatní případnou doběhlou animaci
    paintDots();
    say(''); el.footleft.innerHTML = ''; closeDisc();
    el.legend.classList.remove('cc-aed__legend--on'); el.legend.innerHTML = '';

    if(s === 'k1' || s === 'k2'){
      chartStep = (s === 'k1') ? 1 : 2;
      user = newUser(); drawn = 0; lastIx = -1; revealT = 0; revealing = false;
      cv.setAttribute('aria-label', CANVAS_LABEL_BASE);
      el.kicker.textContent = 'Odhadněte realitu';
      el.title.textContent = chartStep === 1
        ? 'Jak rychle klesá šance na přežití, když nikdo nezasáhne?'
        : 'A jak šance na přežití klesá, když zachránce začne ihned stlačovat hrudník?';
      setDisc(CFG.discChart);
      showScene('chart');
      requestAnimationFrame(function(){ draw(); fit(); });
    }
    else if(s === 'tempo'){
      el.kicker.textContent = 'Trenažér';
      el.title.textContent = 'Zvládnete 10 vteřin udržet ideální tempo masáže srdce?';
      setDisc('');
      showScene('tempo'); tapReset(); delete pass.tempo; footTempoButtons(false);
    }
    else if(s === 'result'){
      setDisc(CFG.discResult);
      showScene('result'); renderResult();
    }
    else {
      var q = QUIZ.filter(function(x){ return x.id === s; })[0];
      el.kicker.textContent = 'Otázka ' + (QUIZ.indexOf(q)+1) + ' ze 4';
      el.title.textContent = q.title;
      setDisc(q.disc);
      showScene('quiz'); renderQuiz(q); delete pass[s];
    }
    syncNext(); fit();
  }

  bindTap(el.next, function(){
    var s = STEPS[stepIx];
    if(el.next.disabled || revealing) return;
    if((s === 'k1' || s === 'k2') && revealT === 0){ reveal(); return; }
    if(stepIx < STEPS.length - 1){ stepIx++; enter(); }
  });

  /* ============================================================
     FIT DO RÁMU
     Prvek se do rámu vejde sám (stage je elastická). Zmenšovací smyčka
     je jen pojistka pro delší texty nebo širší náhradní font – běžně
     se ani jednou neotočí.
     ============================================================ */
  var fitT = null, lastSc = 1;
  function overflow(){ return document.documentElement.scrollHeight - window.innerHeight; }
  function setSc(sc){
    if(sc === lastSc) return;
    lastSc = sc;
    root.style.setProperty('--sc', sc.toFixed(3));
    root.style.setProperty('--sayh', (58*sc).toFixed(1) + 'px');
  }
  function tapSize(){
    var st = el.stage.clientHeight, sw = el.stage.clientWidth;
    if(st <= 0) return;
    var d = Math.max(70, Math.min(285, Math.min(st * 0.6, sw * 0.66)));
    root.style.setProperty('--tapd', d.toFixed(0) + 'px');
  }
  function fit(){
    setSc(1);
    tapSize();
    if(overflow() <= 1){ if(!scenes.chart.hidden) draw(); return; }
    var sc = 1;
    for(var k=0;k<14 && overflow() > 1;k++){
      sc *= 0.93; setSc(sc); tapSize();
    }
    if(!scenes.chart.hidden) draw();
  }
  function fitSoon(){ clearTimeout(fitT); fitT = setTimeout(fit, 60); }

  window.addEventListener('resize', fitSoon);
  window.addEventListener('load', fit);
  window.addEventListener('orientationchange', fitSoon);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  if(window.ResizeObserver) new ResizeObserver(fitSoon).observe(root);

  (function(){
    var v = getComputedStyle(root).getPropertyValue('--ac').trim();
    if(v) AC = v;
  })();

  user = newUser();
  enter();
  }

  document.querySelectorAll('[data-cc-aed]').forEach(init);
})();
</script>
