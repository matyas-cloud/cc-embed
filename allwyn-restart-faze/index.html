<!-- ============================================================
     FÁZE PO ÚRAZU — speciál Allwyn „Restart po úrazu nebo vážné nemoci“ (ParaRestart)
     ============================================================
     Umístění v repu:  cc-embed/allwyn-restart-faze/index.html
     Vložení:          komponenta Iframe ve speciálu, celý tag <iframe src="…" title="…">
     Místo v textu:    INTERAKTIVNÍ PRVEK „Fáze po úrazu“ (za odstavec „…až k odpuštění sobě i okolí.“)
     Formát:           plochý graf. Nahoře uprostřed nadpis, věta s pointou a přepínač „V učebnici / Doopravdy“.
                       „V učebnici“ = 4 schody. „Doopravdy“ nakreslí přes schody čáru se smyčkami a propadem
                       (7 zastávek se jménem přímo v grafu, fáze z učebnice tyrkysově); zpět se vrací bez animace.
                       Klepnutí / najetí / Tab na bod ukáže kartu zastávky pod grafem.
     Rám:              pevný poměr šablony (≤619 px 150 %, 620–1023 px 85 %, ≥1024 px 73,5 %).
                       Všechno je na středu: nadpis / věta / přepínač / graf / karta. Na šířku má karta vlevo
                       název a větu, vpravo popis. Výšky nadpisu, věty i karty se rezervují podle delšího
                       stavu, aby graf při přepnutí neposkočil; zmenšovací smyčka --sc hlídá, aby graf neklesl
                       pod 40 % výšky, na nejmenších mobilech ustoupí věta pod nadpisem. Šířka prvku je
                       nejvýš 1,5násobek výšky (při otevření mimo rám).
     Texty:            všechny v objektu CFG (níže ve skriptu) – draft CC, klient je upraví.
     Data:             fáze podle psychologa Jindřicha Duška (text speciálu); nic se nepočítá.
     Fonty:            sdílený Poppins z repa (../fonts/), neblokující, přeměření na document.fonts.ready
     Pohyb:            kreslení čáry 2,4 s jen po kliknutí na „Doopravdy“ (během kreslení nejde spustit znovu);
                       při prefers-reduced-motion bez animace. Nic se nehýbe samo.
     Historie:         10. 11. 2026 první ostrá verze podle mockupu v7
                       10. 11. 2026 desktop: graf roztažený na šířku, karta a tlačítko pod grafem;
                       číslo zastávky v kartě jako kolečko (bez tečky mezi číslem a názvem)
                       10. 11. 2026 po připomínkách: vycentrovaná kompozice, místo tlačítka přepínač nahoře,
                       jména zastávek v grafu, věta s pointou pod nadpisem; pryč „4 fáze“ / „7 zastávek“,
                       popisek „předtím“ a legenda „fáze z učebnice“
     ============================================================ -->

<style>
.cc-embed.cc-rf{
  --ink:#14181a; --tq:#27e2cc; --tq-ink:#07302c; --tq-deep:#1aa594;
  --step:#ecebe7; --step-edge:#c9c7c0; --muted:#6b6f70; --sc:1;
  box-sizing:border-box;position:relative;height:100vh;max-width:150vh;margin:0 auto;padding:12px 4px 10px;overflow:hidden;
  display:flex;flex-direction:column;gap:8px;
  font-family:var(--cc-display);color:var(--ink);-webkit-font-smoothing:antialiased;
}
/* nahoře uprostřed: nadpis, věta s pointou a přepínač obou pohledů */
.cc-rf .cc-rf__top{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;}

.cc-rf .cc-rf__top .cc-rf__sub{margin:0;max-width:560px;font:500 max(12px,calc(13px*var(--sc)))/1.4 var(--cc-display);color:var(--muted);text-wrap:balance;}
.cc-rf .cc-rf__stage{flex:1 1 auto;min-height:0;position:relative;}
.cc-rf .cc-rf__svg{position:absolute;inset:0;display:block;width:100%;height:100%;max-width:none;overflow:visible;}
.cc-rf.is-tight .cc-rf__top .cc-rf__sub{display:none;}
.cc-rf .cc-rf__side{display:flex;flex-direction:column;align-items:center;}
/* karta zastávky: výška se rezervuje podle nejdelšího textu, aby graf při klikání neskákal */
.cc-rf .cc-rf__card{box-sizing:border-box;width:100%;max-width:640px;background:var(--ink);color:#fff;border-radius:14px;padding:13px 15px 14px;}
.cc-rf .cc-rf__st{display:flex;align-items:center;gap:8px;font:600 max(11px,calc(11px*var(--sc)))/1.2 var(--cc-display);letter-spacing:.08em;text-transform:uppercase;color:var(--tq);}
.cc-rf .cc-rf__st b{flex:0 0 22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-sizing:border-box;border:1.5px solid #fff;
  background:#fff;color:var(--ink);font:700 11px/1 var(--cc-display);letter-spacing:0;}
.cc-rf .cc-rf__st b.is-tq{background:var(--tq);border-color:var(--tq);color:var(--tq-ink);}
.cc-rf .cc-rf__card .cc-rf__q{margin:6px 0 6px;font:700 max(16px,calc(18px*var(--sc)))/1.25 var(--cc-display);}
.cc-rf .cc-rf__card .cc-rf__d{margin:0;font:400 max(13px,calc(13.5px*var(--sc)))/1.5 var(--cc-display);color:#c9cbc9;}
/* přepínač V učebnici / Doopravdy: zapnutá půlka je černá, „Doopravdy“ je před prvním kliknutím tyrkysová a zve ke kliknutí */
.cc-rf .cc-rf__seg{display:inline-flex;margin:4px 0 2px;padding:4px;border-radius:999px;background:#eeeeeb;}
.cc-rf .cc-rf__seg button{margin:0;padding:10px 22px;border:0;border-radius:999px;background:transparent;color:var(--ink);

.cc-rf .cc-rf__seg button[aria-pressed="true"]{background:var(--ink);color:#fff;cursor:default;}

.cc-rf .cc-rf__pt.is-on .pn{fill:#fff;}
.cc-rf .pn{font:700 calc(11px*var(--u,1)) var(--cc-display);fill:var(--ink);pointer-events:none;}
.cc-rf .lab{font:600 calc(10px*var(--u,1)) var(--cc-display);fill:var(--muted);}

.cc-rf .cc-rf__layer{transition:opacity .45s;}

.cc-rf .cc-rf__layer.is-quick{transition:none;}
/* na šířku (tablet a desktop, rám 85 % / 73,5 %): totéž na středu, karta má vlevo název a větu, vpravo popis */
@media (min-aspect-ratio:1/1){
  .cc-embed.cc-rf{padding:16px 14px 14px;gap:6px;}
  .cc-rf .cc-rf__title{padding:0;font-size:max(18px,calc(23px*var(--sc)));}
  .cc-rf .cc-rf__top .cc-rf__sub{font-size:max(12.5px,calc(13.5px*var(--sc)));}
  .cc-rf .cc-rf__card{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);grid-template-rows:auto auto;

  .cc-rf .cc-rf__st{grid-column:1;grid-row:1;}

@media (prefers-reduced-motion:reduce){.cc-rf .cc-rf__layer{transition:none;}}
</style>

<script>
/* =====================================================================
   CFG – všechny texty prvku. Měň jen hodnoty v uvozovkách.
   - Typografie: české uvozovky „…“, pomlčka –, nedělitelná mezera  .
   - steps  = schody „v učebnici“ (pořadí = pořadí schodů zdola nahoru).
   - stops  = zastávky na čáře „doopravdy“ (pořadí = číslování 1–N).
              id se páruje s texts; zastávka se stejným id jako schod
              se automaticky vybarví tyrkysově („fáze z učebnice“).
              at = poloha na čáře v souřadnicích grafu 376 × 250,
              při přidání zastávky ji vyber na čáře (viz GEOM.line).
              lab = kde stojí jméno zastávky vůči bodu: l vlevo, r vpravo,
              t nad, b pod, tl vlevo nahoře, br vpravo dole.
   - texts  = obsah karty: name (nadpis karty), quote (velká věta),
              text (popis, ~200 znaků, aby se karta vešla na mobil).
   - subBook / subReal = věta pod nadpisem, která říká pointu slovy.
   ===================================================================== */
var CFG = {
  title: {
    book: 'Takhle se vyrovnání s úrazem popisuje v učebnici.',
    real: 'A takhle to vypadá doopravdy.'
  },
  subBook: 'Čtyři fáze, jedna po druhé, schod po schodu.',
  subReal: 'Fáze nejdou popořadě. Vracejí se, přijde propad a nahoru často pomůže až pohyb.',
  segBook: 'V učebnici',
  segReal: 'Doopravdy',
  labelBook: 'v učebnici',
  steps: [
    { id: 'sok',  word: 'nevíra'  },
    { id: 'agr',  word: 'vztek'   },
    { id: 'poch', word: 'řešení'  },
    { id: 'odp',  word: 'smíření' }
  ],
  stops: [
    { id: 'uraz', at: [70, 130],  lab: 'l'  },
    { id: 'sok',  at: [72, 212],  lab: 'l'  },
    { id: 'agr',  at: [118, 158], lab: 't'  },
    { id: 'pad',  at: [158, 224], lab: 'r'  },
    { id: 'poh',  at: [186, 168], lab: 'br' },
    { id: 'poch', at: [256, 92],  lab: 'tl' },
    { id: 'odp',  at: [302, 62],  lab: 't'  }
  ],
  texts: {
    uraz: { name: 'Úraz',       quote: 'Zlomek vteřiny.',
            text: 'Skok do vody, smyk na mokrém asfaltu, mrtvice uprostřed obýváku. Život se v tu chvíli rozdělí na předtím a potom.' },
    sok:  { name: 'Šok',        quote: '„Proč já?“',
            text: 'První dny přichází otupělost a popírání. Člověk diagnózu slyší, ale nevěří jí. Ze všeho nejvíc potřebuje, aby u něj někdo byl.' },
    agr:  { name: 'Agrese',     quote: '„Kdo za to může?“',
            text: 'Vztek na lékaře, na rodinu i na sebe. Terapeut v té době funguje jako kontejner a unese to, co pacient sám neunese.' },
    pad:  { name: 'Propad',     quote: '„Zase jsem na začátku.“',
            text: 'Stačí jeden špatný den a člověk je zpátky dole. Fáze se vracejí, klidně i po letech. Neznamená to, že cesta selhala.' },
    poh:  { name: 'Pohyb',      quote: 'První disk. První pálka.',
            text: 'V té nejkřehčí chvíli často pomůže sport. Tělo ukáže, že i když přestalo poslouchat, pořád zvládne neuvěřitelné věci. Odsud čára stoupá.' },
    poch: { name: 'Pochopení',  quote: '„Co mi teď může pomoct?“',
            text: 'Místo viníka hledá řešení. Malé cíle, jako přesednout sám, vyjet obrubník nebo se vrátit k práci.' },
    odp:  { name: 'Odpuštění',  quote: '„Jsem pořád já. Jen jinak.“',
            text: 'Odpuštění sobě i okolí. Není to návrat do starého života, ale restart s novými cíli.' }
  },
  /* text pro odečítače obrazovky – při změně obsahu uprav i tady */
  sr: 'V učebnici má vyrovnání s úrazem čtyři fáze za sebou: šok, agrese, pochopení a odpuštění. Doopravdy je cesta delší a vrací se. Má sedm zastávek: úraz, šok, agrese, propad, kdy je člověk zase dole, pohyb, kdy často pomůže sport, pochopení a odpuštění.'
};

/* Geometrie grafu v souřadnicích 376 × 250 (měnit jen s rozmyslem). Schody jsou uprostřed šířky. */
var GEOM = {
  bounds: [4, 14, 372, 240],                       // x0, y0, x1, y1 obsahu
  stairs: [[72,196],[130,196],[130,160],[188,160],[188,124],[246,124],[246,88],[304,88]],
  floor: 232,
  start: [[10,40],[60,40],[66,32],[74,58],[68,84],[72,212]],   // „předtím“ a pád
  line: [[72,212],[98,206],[122,184],[118,158],[98,160],[96,184],[122,198],[148,196],[166,216],[150,228],
         [138,214],[160,192],[186,168],[204,140],[226,118],[246,132],[236,152],[214,140],[232,108],[256,92],[280,74],[302,62]],
  end: [302, 62], endTo: 362                      // tyrkysový konec cesty doprava
};
</script>

<script>
(function(){
  var root = document.querySelector('[data-cc-rf]');
  if(!root || root.dataset.ccInit) return; root.dataset.ccInit = '1';
  var NS = 'http://www.w3.org/2000/svg';
  var svg = root.querySelector('[data-svg]'), stage = root.querySelector('[data-stage]');
  var card = root.querySelector('[data-card]'), title = root.querySelector('[data-title]'), sub = root.querySelector('[data-sub]');
  var segB = root.querySelector('[data-to="book"]'), segR = root.querySelector('[data-to="real"]');
  segB.textContent = CFG.segBook; segR.textContent = CFG.segReal;
  root.querySelector('[data-seg]').setAttribute('aria-label', CFG.segBook+' / '+CFG.segReal);
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var real = false, sel = {book:'sok', real:'uraz'}, seq = 0, revealing = false, drawTimer = null;
  var inBook = {}; CFG.steps.forEach(function(s){ inBook[s.id] = true; });

  root.querySelector('[data-sr]').textContent = CFG.sr;

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  function el(tag, attrs, parent){ var e = document.createElementNS(NS, tag); for(var k in attrs) e.setAttribute(k, attrs[k]); if(parent) parent.appendChild(e); return e; }
  function txt(parent, x, y, s, cls, anchor){ var t = el('text', {x:x, y:y, 'class':cls, 'text-anchor':anchor || 'start'}, parent); t.textContent = s; return t; }

  /* Catmull-Rom → hladká čára přes body */
  function smooth(P){
    var d = '';
    for(var i=0;i<P.length-1;i++){
      var p0 = P[i-1] || P[i], p1 = P[i], p2 = P[i+1], p3 = P[i+2] || p2;
      var c1 = [p1[0]+(p2[0]-p0[0])/6, p1[1]+(p2[1]-p0[1])/6], c2 = [p2[0]-(p3[0]-p1[0])/6, p2[1]-(p3[1]-p1[1])/6];
      d += ' C'+c1[0].toFixed(1)+' '+c1[1].toFixed(1)+','+c2[0].toFixed(1)+' '+c2[1].toFixed(1)+','+p2[0].toFixed(1)+' '+p2[1].toFixed(1);
    }
    return d;
  }

  /* ---------- karta ---------- */
  function cardHTML(id, n){
    var t = CFG.texts[id] || {name:id, quote:'', text:''};
    return '<span class="cc-rf__st">'+(n ? '<b'+(inBook[id] ? ' class="is-tq"' : '')+'>'+n+'</b>' : '')+esc(t.name)+'</span><p class="cc-rf__q">'+esc(t.quote)+'</p><p class="cc-rf__d">'+esc(t.text)+'</p>';
  }
  function numberOf(id){
    var list = real ? CFG.stops : CFG.steps;
    for(var i=0;i<list.length;i++) if(list[i].id === id) return i+1;
    return 0;
  }
  function showCard(id){
    sel[real ? 'real' : 'book'] = id;
    card.innerHTML = cardHTML(id, numberOf(id));
    [].forEach.call(svg.querySelectorAll('.cc-rf__pt'), function(g){
      var mine = g.dataset.layer === (real ? 'real' : 'book');
      g.classList.toggle('is-on', g.dataset.id === id && mine);
      g.setAttribute('tabindex', mine ? '0' : '-1'); g.setAttribute('aria-hidden', mine ? 'false' : 'true');
    });
  }
  /* rezerva výšky karty = nejvyšší ze všech textů v aktuální šířce */
  function reserveCard(){
    card.style.height = 'auto';
    var cur = card.innerHTML, max = 0, ids = Object.keys(CFG.texts);
    for(var i=0;i<ids.length;i++){ card.innerHTML = cardHTML(ids[i], 7); max = Math.max(max, card.offsetHeight); }
    card.innerHTML = cur; card.style.height = max + 'px';
  }

  /* ---------- nadpis, věta a přepínač ---------- */
  function syncUI(){
    title.textContent = real ? CFG.title.real : CFG.title.book;
    sub.textContent = real ? CFG.subReal : CFG.subBook;
    segB.setAttribute('aria-pressed', real ? 'false' : 'true'); segR.setAttribute('aria-pressed', real ? 'true' : 'false');
    segR.classList.toggle('is-go', !real);
  }
  /* rezerva výšky nadpisu a věty = delší z obou stavů, aby graf při přepnutí neposkočil */
  function reserveTop(){
    title.style.minHeight = ''; sub.style.minHeight = ''; var th = 0, sh = 0;
    [[CFG.title.book, CFG.subBook], [CFG.title.real, CFG.subReal]].forEach(function(k){
      title.textContent = k[0]; sub.textContent = k[1]; th = Math.max(th, title.offsetHeight); sh = Math.max(sh, sub.offsetHeight); });
    title.style.minHeight = th+'px'; sub.style.minHeight = sh+'px'; syncUI();
  }

  /* ---------- kreslení grafu v pixelech rámu ---------- */
  var layers = {}, linePath = null, lineLen = 0, U = 1;
  function draw(){
    var w = stage.clientWidth, h = stage.clientHeight; if(!w || !h) return;
    var B = GEOM.bounds, bw = B[2]-B[0], bh = B[3]-B[1], m = 14*U;
    var sx = (w-2*m)/bw, sy = (h-2*m)/bh;
    if(sy > sx*1.9) sy = sx*1.9; if(sx > sy*2.3) sx = sy*2.3;
    var ox = (w - bw*sx)/2, oy = (h - bh*sy)/2;
    var X = function(x){ return +(ox + (x-B[0])*sx).toFixed(1); }, Y = function(y){ return +(oy + (y-B[1])*sy).toFixed(1); };
    var P = function(p){ return [X(p[0]), Y(p[1])]; };
    svg.setAttribute('viewBox', '0 0 '+w+' '+h);
    svg.innerHTML = '';
    /* schody (podklad v obou stavech) */
    var S = GEOM.stairs.map(P), fl = Y(GEOM.floor);
    var dS = 'M'+S[0][0]+' '+fl+' L'+S.map(function(p){return p[0]+' '+p[1];}).join(' L')+' L'+S[S.length-1][0]+' '+fl+' Z';
    el('path', {d:dS, fill:'#ecebe7'}, svg);
    el('path', {d:'M'+S.map(function(p){return p[0]+' '+p[1];}).join(' L'), fill:'none', stroke:'#c9c7c0', 'stroke-width':2}, svg);
    txt(svg, S[S.length-1][0]-6, fl-8, CFG.labelBook, 'lab', 'end');
    /* --- učebnice --- */
    var gb = layers.book = el('g', {'class':'cc-rf__layer'+(real?' is-off':'')}, svg);
    var colW = (S[1][0]-S[0][0]);
    CFG.steps.forEach(function(s, i){
      var a = S[i*2], b = S[i*2+1], cx = (a[0]+b[0])/2, cy = a[1];
      var fs = Math.max(9.5, Math.min(11.5*U, colW/5.4));
      var t1 = txt(gb, cx, cy+15*U+fs, (CFG.texts[s.id]||{}).name || s.id, 'stp', 'middle'); t1.style.fontSize = fs+'px';
      var t2 = txt(gb, cx, cy+15*U+2*fs+3, s.word || '', 'wrd', 'middle'); t2.style.fontSize = (fs-1)+'px';
      pin(gb, 'book', s.id, i+1, cx, cy, true);
    });
    /* --- doopravdy --- */
    var gr = layers.real = el('g', {'class':'cc-rf__layer'+(real?'':' is-off')}, svg);
    var st = GEOM.start.map(P), ln = GEOM.line.map(P);
    var d = 'M'+st.map(function(p){return p[0]+' '+p[1];}).join(' L') + smooth(ln);
    linePath = el('path', {d:d, fill:'none', stroke:'#14181a', 'stroke-width':4.5*U, 'stroke-linejoin':'round', 'stroke-linecap':'round'}, svg);
    svg.insertBefore(linePath, gr);
    lineLen = linePath.getTotalLength();
    linePath.style.strokeDasharray = lineLen; linePath.style.strokeDashoffset = real ? 0 : lineLen;
    var e = P(GEOM.end); el('path', {d:'M'+e[0]+' '+e[1]+' L'+X(GEOM.endTo)+' '+e[1], stroke:'#27e2cc', 'stroke-width':6*U, 'stroke-linecap':'round'}, gr);
    /* zastávky a jejich jména; v úzkém grafu se písmo jmen zmenší */
    svg.style.setProperty('--nf', Math.max(.86, Math.min(1, sx/1.5)).toFixed(2));
    CFG.stops.forEach(function(s, i){
      var p = P(s.at), L = s.lab || 't', o = 18*U;
      var dx = L === 'l' ? -o : L === 'r' ? o : L === 'tl' ? -o*.2 : L === 'br' ? o*.9 : 0;
      var dy = L === 't' || L === 'tl' ? -o : L === 'b' ? o + 8*U : L === 'br' ? o*.75 : 4*U;
      txt(gr, p[0]+dx, p[1]+dy, (CFG.texts[s.id]||{}).name || '', 'nm', L === 'l' || L === 'tl' ? 'end' : L === 'r' || L === 'br' ? 'start' : 'middle').setAttribute('aria-hidden','true');
      pin(gr, 'real', s.id, i+1, p[0], p[1], !!inBook[s.id]);
    });
    showCard(sel[real ? 'real' : 'book']);
  }
  function pin(parent, layer, id, n, x, y, tq){
    var t = CFG.texts[id] || {name:id};
    var g = el('g', {'class':'cc-rf__pt', tabindex:'0', role:'button', 'aria-label':n+'. '+t.name, 'data-id':id, 'data-layer':layer}, parent);
    el('circle', {'class':'ring', cx:x, cy:y, r:16*U}, g);
    el('circle', {'class':'hd', cx:x, cy:y, r:12*U, fill: tq ? '#27e2cc' : '#fff', stroke:'#14181a', 'stroke-width':2}, g);
    txt(g, x, y+4*U, String(n), 'pn', 'middle');
    el('circle', {cx:x, cy:y, r:20*U, fill:'transparent'}, g);
  }

  /* ---------- přepnutí učebnice ↔ doopravdy ---------- */
  function toReal(){
    if(revealing) return;
    real = true; var my = ++seq; revealing = !reduce; syncUI();
    layers.book.classList.add('is-off');
    if(reduce){ linePath.style.transition = 'none'; linePath.style.strokeDashoffset = 0; layers.real.classList.remove('is-off'); showCard(sel.real); return; }
    linePath.style.transition = 'none'; linePath.style.strokeDashoffset = lineLen;
    void linePath.getBoundingClientRect();
    linePath.style.transition = 'stroke-dashoffset 2.4s ease-in-out';
    linePath.style.strokeDashoffset = 0;
    clearTimeout(drawTimer);
    drawTimer = setTimeout(function(){
      if(my !== seq) return;
      layers.real.classList.remove('is-off'); revealing = false; syncUI(); showCard(sel.real);
    }, 2000);
  }
  function toBook(){
    real = false; seq++; revealing = false; clearTimeout(drawTimer);
    /* zpět bez animace: čára i zastávky zmizí hned */
    linePath.style.transition = 'none'; linePath.style.strokeDashoffset = lineLen;
    layers.real.classList.add('is-quick'); layers.book.classList.add('is-quick');
    layers.real.classList.add('is-off'); layers.book.classList.remove('is-off');
    void svg.getBoundingClientRect();
    layers.real.classList.remove('is-quick'); layers.book.classList.remove('is-quick');
    syncUI(); showCard(sel.book);
  }

  /* ---------- dotyk, myš, klávesnice ---------- */
  function bindTap(node, fn){
    if(window.PointerEvent){
      node.addEventListener('pointerdown', function(e){ if(e.button > 0) return; e.preventDefault(); if(node.focus) node.focus({preventScroll:true}); fn(e); });
    } else {
      node.addEventListener('touchstart', function(e){ e.preventDefault(); fn(e); }, {passive:false});
      node.addEventListener('mousedown', fn);
    }
    node.addEventListener('keydown', function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); fn(e); } });
  }
  bindTap(segB, function(){ if(real) toBook(); });
  bindTap(segR, function(){ if(!real) toReal(); });
  svg.addEventListener('pointerdown', function(e){
    var g = e.target.closest && e.target.closest('.cc-rf__pt'); if(!g) return;
    e.preventDefault(); g.focus({preventScroll:true}); showCard(g.dataset.id);
  });
  svg.addEventListener('keydown', function(e){
    var g = e.target.closest && e.target.closest('.cc-rf__pt'); if(!g) return;
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); showCard(g.dataset.id); }
  });
  svg.addEventListener('focusin', function(e){ var g = e.target.closest && e.target.closest('.cc-rf__pt'); if(g) showCard(g.dataset.id); });
  if(window.matchMedia && matchMedia('(hover:hover)').matches){
    svg.addEventListener('mouseover', function(e){ var g = e.target.closest && e.target.closest('.cc-rf__pt'); if(g) showCard(g.dataset.id); });
  }

  /* obrys fokusu jen při ovládání klávesnicí */
  document.addEventListener('keydown', function(e){ if(e.key === 'Tab') root.classList.add('is-kbd'); });
  document.addEventListener('pointerdown', function(){ root.classList.remove('is-kbd'); }, true);

  /* ---------- vyplnění rámu ---------- */
  function fit(){
    /* ve velkém rámu na šířku roste písmo i značky v grafu s výškou (výchozí je rám 786 × 560) */
    var land = root.clientWidth > root.clientHeight, sc0 = land ? Math.max(1, Math.min(1.45, root.clientHeight/560)) : 1;
    var minStage = function(){ return Math.min(root.clientHeight*0.4, 300); };
    var ok = function(){ return root.scrollHeight <= root.clientHeight + 1 && stage.clientHeight >= minStage(); };
    var pass = function(){
      var sc = sc0; root.style.setProperty('--sc', sc.toFixed(3)); reserveTop(); reserveCard();
      for(var k=0; k<20 && !ok(); k++){ sc *= .94; root.style.setProperty('--sc', sc.toFixed(3)); reserveTop(); reserveCard(); }
    };
    U = sc0; root.style.setProperty('--u', U.toFixed(3));
    /* když se graf nevejde ani po zmenšení písma (nejmenší mobily), ustoupí věta pod nadpisem */
    root.classList.remove('is-tight'); pass();
    if(!ok()){ root.classList.add('is-tight'); pass(); }
    draw();
  }
  var t;
  window.addEventListener('resize', function(){ clearTimeout(t); t = setTimeout(fit, 60); });
  window.addEventListener('load', fit);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  if(window.ResizeObserver) new ResizeObserver(function(){ clearTimeout(t); t = setTimeout(fit, 90); }).observe(root);
  fit();
})();
</script>
