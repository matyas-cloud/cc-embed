<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mozek vs. sanitka</title>
<meta name="robots" content="noindex">
<!--
  Mozek vs. sanitka
  Určení: nativní speciál Kaufland „Z lásky k srdci“, drop 2, komponenta Iframe (rám 150 / 85 / 73,5 %).
  Formát: po jednom klepnutí běží sám, přehrávač s kapitolami, po prvním průběhu volný pohyb.
  Data: bez pomoci −10 %/min, masáž od 2. minuty −4 %/min, AED v 5. minutě šanci drží, dojezd 10 minut
  (ERC 2021, Chaloupková, 3. LF UK 2024, modelový odhad).
  Texty: všechny jsou v bloku OBSAH MOZEK VS. SANITKA hned pod touhle poznámkou. Zbytek stránky je zkompilovaný kód, ten se ručně nemění.
  Změny obsahu: 2026-11-05 první verze podle storyboardu B2m. 2026-11-06 směr D silueta, plynulý čas, poznámky o šanci ve sloupci,
  závěrečné hodnocení. 2026-11-10 texty vytažené do bloku OBSAH.
-->
<script>
/* ================================================================
   OBSAH PRVKU MOZEK VS. SANITKA
   Tady jsou všechny texty prvku. Měňte jen text mezi apostrofy '…'.
   Apostrof uvnitř textu napište jako \' nebo použijte ’.

   - Prázdný text '' se nezobrazí. Takhle jde vypnout třeba poznámka
     ve sloupci nebo řádek shrnutí na konci.
   - Shrnutí na konci (hodnoceni.shrnuti) může mít libovolný počet
     řádků. Prázdný seznam [] ho schová celé.
   - Kdy který text naskočí, určuje příběh (minuty), ne tenhle soubor.
     Texty se drží zhruba stejně dlouhé, jako jsou teď: delší text
     zmenší sloupce.
   ================================================================ */
window.OBSAH_MOZEK = {

  /* úvodní plakát */
  plakat: {
    uvod: 'Srdce se právě zastavilo.',
    mozek: 'Mozek',
    sanitka: 'Sanitka',
    vs: 'VS.',
    start: 'Začít závod',
  },

  /* hlavička s odpočtem (číslo a „minut/minuty“ dopočítá prvek) */
  odpocet: {
    pred: 'Sanitka tu bude za',
    dorazila: 'Sanitka je tady',
  },

  /* první jeviště s jedním sloupcem */
  stupnice: {
    nahore: 'Vysoká',
    dole: 'Mizivá',
    veSloupci: 'Šance na přežití',
  },
  uvod: [
    'Srdce se zastavilo.',                                                                  /* hned po startu */
    'Druhá minuta a nikdo nezasáhl. Bez pomoci šance klesne do příjezdu sanitky až na nulu.', /* když odpočet ukáže 8 minut */
  ],

  /* dva sloupce: popisky pod nimi */
  sloupce: {
    levy: 'Bez vás',
    pravy: 'S vámi',
  },

  /* texty pod levým sloupcem, v pořadí, jak jdou za sebou */
  levy: {
    masaz: 'Nikdo nezasáhl.',                   /* 2. minuta, rozdělení na dva sloupce */
    bunky: 'Buňky v mozku začínají odumírat.',  /* 4. minuta */
    bunkyDal: 'Buňky dál odumírají.',           /* těsně před AED */
    sanitka: 'Šance je mizivá.',                /* příjezd sanitky */
  },

  /* texty pod pravým sloupcem, vždy chvíli po levém */
  pravy: {
    masaz: 'Začínáte masáž srdce.',
    stlacovani: 'Stlačujete hrudník 100krát za minutu.',
    aed: 'Přinesli jste AED. Výboj srdce znovu rozběhl.',
    sanitka: 'Srdce bije dál a mozek dostává kyslík.',
  },

  /* poznámky přímo v pravém sloupci (bez tečky na konci) */
  poznamky: {
    stlacovani: 'Šance na přežití klesá mnohem pomaleji',
    aed: 'Šance už neklesá',
  },

  /* kapitoly v přehrávači: Zástava 0–2 min, Masáž 2–4, Buňky 4–5, AED 5–6, Sanitka 6–10 */
  kapitoly: ['Zástava', 'Masáž srdce', 'Buňky odumírají', 'AED', 'Sanitka'],

  /* závěrečná červená plocha */
  hodnoceni: {
    shrnuti: ['Masáž srdce od 2. minuty', 'AED v 5. minutě'],
    veta: 'Díky vám má sanitka koho zachraňovat.',
  },

  /* popisky tlačítek pro čtečky obrazovky */
  ovladani: {
    pozastavit: 'Pozastavit',
    prehrat: 'Přehrát',
    znovu: 'Přehrát znovu',
    zvukZapnout: 'Zapnout zvuk',
    zvukVypnout: 'Vypnout zvuk',
    kapitola: 'Kapitola',
  },

  /* celý příběh jedním odstavcem pro čtečky obrazovky */
  popis: 'Šance na přežití při zástavě srdce klesá bez pomoci zhruba o deset procent za minutu a do příjezdu sanitky po deseti minutách spadne skoro na nulu. Když svědek začne ve druhé minutě s masáží srdce, klesá šance mnohem pomaleji. Když v páté minutě přinese AED a výboj srdce znovu rozběhne, šance už neklesá. Díky tomu má sanitka koho zachraňovat.',
};
</script>

html,body{height:100%;margin:0;padding:0;background:#050101}body{overflow:hidden}

.bm{
  --void:#030101; --ink:#0b0506; --pearl:#f7f2ee; --signal:#ff4343; --ember:#8c1414; --ash:rgba(247,242,238,.66); --hair:rgba(247,242,238,.16);
  --disp:Poppins,"Helvetica Neue",Arial,sans-serif; --body:Georgia,"Times New Roman",serif;
  position:relative; box-sizing:border-box; width:100%; height:100vh; height:100dvh; overflow:hidden; container-type:size;
  display:flex; flex-direction:column; background:var(--void); color:var(--pearl);
  font-family:var(--disp); -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  user-select:none; -webkit-user-select:none;
}
.bm *{box-sizing:border-box}
.bm p,.bm h2,.bm h3{margin:0}
.bm button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.bm button:focus-visible{outline:2px solid var(--pearl);outline-offset:2px}
.cc-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.bm__flash{position:absolute;inset:0;z-index:5;background:#fff;opacity:0;pointer-events:none}


.bm__poster{position:absolute;inset:0;z-index:7;pointer-events:none}
.bm__half{position:absolute;inset:0;transition:transform .62s cubic-bezier(.7,0,.3,1);will-change:transform}
.bm__half--a{background:var(--void);clip-path:polygon(0 0,100% 0,100% 30%,0 80%)}
.bm__half--b{background:linear-gradient(205deg,#fff8f0 18%,#ebe0d6 58%,#c9b9ab);clip-path:polygon(100% 30%,100% 100%,0 100%,0 80%)}
.bm__lead{position:absolute;left:20px;top:20px;font-size:clamp(15px,4.6cqw,17px);line-height:1.3;font-weight:600;color:var(--pearl)}
.bm__p1,.bm__p2{position:absolute;margin:0;font-weight:700;text-transform:uppercase;letter-spacing:-.01em;line-height:1;font-size:clamp(46px,15cqw,84px)}
.bm__p1{left:18px;top:44px;color:var(--pearl)}
.bm__p2{right:16px;bottom:calc(26px + 54px + 16px);color:var(--ink)}
.bm__art{position:absolute;display:block;height:auto;overflow:visible}
.bm__art--brain{left:2.1%;top:18.8%;width:52.8%}
.bm__art--amb{right:4.3%;top:53.3%;width:44%}
.bm__vs{position:absolute;left:40.5%;top:60%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;display:grid;place-items:center;background:var(--ink);box-shadow:0 0 0 2px var(--pearl);font-weight:700;font-size:16px;color:var(--pearl);transition:transform .3s cubic-bezier(.6,0,.8,.4)}
.bm .bm__start{position:absolute;left:20px;right:20px;bottom:26px;height:54px;pointer-events:auto;font-weight:700;font-size:17px;color:var(--pearl);background:var(--ink);border-radius:14px;transition:transform .1s}
.bm .bm__start:active,.bm .bm__start.is-down{transform:scale(.98)}
.bm .bm__start:focus-visible{outline-color:var(--ink)}
.bm:not(.is-poster) .bm__half--a{transform:translate(-26%,-104%)}
.bm:not(.is-poster) .bm__half--b{transform:translate(26%,104%)}
.bm:not(.is-poster) .bm__vs{transform:scale(0)}
.bm:not(.is-poster) .bm__poster{visibility:hidden;transition:visibility 0s .66s}
.bm.is-reduced .bm__half{transition:none}


.bm__eta{position:relative;z-index:3;flex:none;padding:0;text-align:center;transition:opacity .4s}
.bm__etaLine{position:relative;margin:40px 18px 0;height:2px;background:var(--hair);border-radius:2px}
.bm__etaLine i{position:absolute;inset:0;display:block;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,rgba(247,242,238,.35),var(--pearl))}
.bm__etaLine b{position:absolute;right:-1px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--signal);box-shadow:0 0 10px var(--signal);transition:background .4s,box-shadow .4s}
.bm__etaLine b.is-alive{background:#fff;box-shadow:0 0 10px #fff}
.bm__etaAmb{position:absolute;left:0;bottom:2px;width:52px;transform:translateX(-50%) scale(var(--pop,1));transform-origin:50% 100%}
.bm__etaAmb svg{display:block;width:100%;height:auto}
.bm__etaAmb .lb{animation:bm-blink .6s steps(1) infinite}
.bm.is-paused .bm__etaAmb .lb{animation-play-state:paused}
@keyframes bm-blink{50%{opacity:.18}}
.bm__etaTxt{position:relative;margin-top:6px;display:flex;flex-direction:column;align-items:center}
.bm__etaPre{font-size:clamp(13.5px,4cqw,15px);line-height:18px;font-weight:500;color:var(--ash)}
.bm__etaNow{font-size:clamp(36px,12.4cqw,50px);line-height:1.08;font-weight:700;letter-spacing:-.015em;white-space:nowrap}
.bm__num{display:inline-block;color:var(--signal)}
.bm__etaDone{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);font-size:clamp(28px,9.4cqw,40px);line-height:1.1;font-weight:700;white-space:nowrap;opacity:0}
.bm.is-arrived .bm__etaPre,.bm.is-arrived .bm__etaNow{opacity:0}
.bm.is-arrived .bm__etaDone{opacity:1}

.bm__snd{position:absolute;z-index:6;top:50px;right:8px;width:44px;height:44px;display:grid;place-items:center;color:var(--ash);border-radius:50%;transition:color .2s}
.bm__snd .on{display:none}.bm__snd[aria-pressed="true"]{color:var(--pearl)}
.bm__snd[aria-pressed="true"] .on{display:block}.bm__snd[aria-pressed="true"] .off{display:none}


.bm__stage{position:relative;z-index:2;flex:1 1 auto;min-height:0}
.bm__scale{position:absolute;font-size:13.5px;line-height:18px;font-weight:600;color:var(--ash);transition:opacity .35s}
.bm__scale{right:calc(50% + var(--tube-r,80px) + 12px);text-align:right}
.bm__scale--hi{top:var(--scale-hi,40px)}.bm__scale--lo{top:var(--scale-lo,250px)}
.bm__bar{position:absolute;left:0;top:0;border-radius:10px;background:rgba(247,242,238,.07);overflow:hidden}
.bm__bar i{position:absolute;left:0;right:0;bottom:0;height:0;border-radius:10px;background:var(--pearl)}
.bm__inl,.bm__note{position:absolute;left:0;right:0;bottom:10px;padding:0 8px;font-style:normal;text-align:center;font-size:13px;line-height:1.18;font-weight:700;color:var(--ink);text-wrap:balance}
.bm__inl{transition:opacity .35s}
.bm.is-duo .bm__inl{opacity:0}
.bm__brain{position:absolute;left:0;top:0}
.bm__brain svg{display:block;width:100%;height:auto;overflow:visible}
.bm__bw,.bm__br{position:absolute;left:0;top:0;width:100%}
.bm__br{opacity:0}
.bm__glow{position:absolute;left:50%;top:50%;width:215%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;opacity:0;background:radial-gradient(circle,rgba(255,67,67,.62) 0%,rgba(255,67,67,.3) 30%,rgba(255,67,67,.1) 50%,rgba(255,67,67,0) 70%)}
.bm__aed{position:absolute;left:0;top:0;opacity:0}
.bm__aed svg{display:block;width:100%;height:auto}
.bm__bolt{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none;opacity:0}
.bm__bolt polyline{fill:none;stroke:#fff;stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 0 6px #fff)}



.bm__copy{position:relative;z-index:3;flex:none;width:var(--copy-w,100%);max-width:100%;margin:0 auto;height:116px;display:flex}
.bm__solo{position:absolute;left:18px;right:18px;top:8px;text-align:center;font-size:clamp(17.5px,5.4cqw,20px);line-height:1.28;font-weight:600;text-wrap:balance}
.bm__col{position:relative;flex:1 1 50%;min-width:0;padding:6px 10px 0;text-align:center;opacity:0;transition:opacity .35s}
.bm__col h3{margin:0 0 6px;font-size:15px;line-height:1.2;font-weight:700;color:var(--pearl)}
.bm__col p{font-size:clamp(14px,4cqw,15px);line-height:1.3;font-weight:500;text-wrap:balance}
.bm.is-duo .bm__col--l,.bm.is-duoR .bm__col--r{opacity:1}
.bm.is-duo .bm__solo{display:none}
.bm.is-duo .bm__scale{opacity:0}


.bm__verdict{position:absolute;z-index:4;left:12px;right:12px;top:var(--v-top,124px);bottom:var(--v-bot,72px);display:flex;flex-direction:column;justify-content:space-between;gap:16px;
  padding:18px 18px 22px;color:#fff;background:var(--signal);border-radius:14px;opacity:0;transform:translateY(22px);pointer-events:none;
  transition:opacity .4s,transform .6s cubic-bezier(.2,.8,.2,1)}
.bm.is-verdict .bm__verdict{opacity:1;transform:none}
.bm__stage,.bm__copy{transition:opacity .4s}
.bm.is-verdict .bm__stage,.bm.is-verdict .bm__copy{opacity:0}
.bm__recap{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.bm__recap li{display:flex;align-items:center;gap:9px;font-size:clamp(14px,4.1cqw,16px);line-height:1.2;font-weight:600;color:var(--ink)}
.bm__recap svg{flex:none;width:20px;height:20px}
.bm__vtxt{max-width:13em;font-size:clamp(31px,11.2cqw,56px);line-height:1.05;font-weight:700;letter-spacing:-.015em;text-wrap:balance}
.bm.is-verdict .bm__recap li{animation:bm-in .45s cubic-bezier(.2,.8,.2,1) both}
.bm.is-verdict .bm__recap li+li{animation-delay:.12s}
.bm.is-verdict .bm__vtxt{animation:bm-in .5s .22s cubic-bezier(.2,.8,.2,1) both}


.bm__player{position:relative;z-index:4;flex:none;padding:3px 8px 6px;display:flex;flex-direction:column;
  background:linear-gradient(180deg,rgba(5,1,1,0),rgba(5,1,1,.72) 24%);transition:opacity .4s}
.bm__chap{position:relative;height:18px;margin:0 52px;font-size:12.5px;line-height:18px;font-weight:600}
.bm__chap span{position:absolute;left:0;white-space:nowrap;transition:left .55s cubic-bezier(.22,.9,.24,1),transform .55s cubic-bezier(.22,.9,.24,1)}
.bm__row{display:flex;align-items:center;gap:8px}
.bm__pp,.bm__re{flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;transition:transform .12s,background .2s,color .2s}
.bm__pp:active,.bm__re:active{transform:scale(.9)}
.bm__pp .i-play{display:none}.bm.is-paused .bm__pp .i-play,.bm.is-ended .bm__pp .i-play{display:block}
.bm.is-paused .bm__pp .i-pause,.bm.is-ended .bm__pp .i-pause{display:none}
.bm.is-ended .bm__pp{opacity:.4}
.bm.is-ended .bm__re{color:#120202;background:linear-gradient(180deg,#fff,#d9d2ce);box-shadow:inset 0 1px 0 #fff,0 6px 16px rgba(255,255,255,.18)}
.bm__segs{flex:1 1 auto;min-width:0;display:flex;gap:3px;height:44px;align-items:center}
.bm__seg{position:relative;height:44px;min-width:0;display:flex;align-items:center;pointer-events:none}
.bm__seg i{position:relative;display:block;width:100%;height:6px;border-radius:3px;overflow:hidden;background:rgba(247,242,238,.2);transition:height .22s cubic-bezier(.2,.9,.3,1.3),background .2s}
.bm__seg b{position:absolute;inset:0;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,#fff,var(--pearl))}
.bm.is-free .bm__seg{pointer-events:auto}
.bm.is-free .bm__seg i{background:rgba(247,242,238,.42)}
.bm.is-free .bm__seg.is-now i{height:12px;background:var(--signal)}
.bm.is-free .bm__seg.is-now b{display:none}
.bm.is-free .bm__seg:not(.is-now) b{display:none}


.bm.is-poster .bm__eta,.bm.is-poster .bm__stage>*,.bm.is-poster .bm__copy,.bm.is-poster .bm__player,.bm.is-poster .bm__snd{opacity:0;pointer-events:none}
@keyframes bm-in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}


.bm.is-wide .bm__half--a{clip-path:polygon(0 0,100% 0,100% 16%,16% 100%,0 100%)}
.bm.is-wide .bm__half--b{clip-path:polygon(100% 16%,100% 100%,16% 100%)}
.bm.is-wide .bm__lead{left:30px;top:24px}
.bm.is-wide .bm__p1{left:28px;top:50px;font-size:84px}
.bm.is-wide .bm__p2{right:28px;bottom:96px;font-size:84px}
.bm.is-wide .bm__art--brain{left:3%;top:27%;width:38%}
.bm.is-wide .bm__art--amb{right:3%;top:37%;width:26%}
.bm.is-wide .bm__vs{left:56%;top:60%;width:60px;height:60px;margin:-30px 0 0 -30px;font-size:18px}
.bm.is-wide .bm__start{left:auto;right:28px;bottom:24px;width:240px}
.bm.is-wide .bm__etaAmb{width:60px}
.bm.is-wide .bm__solo{font-size:21px}
.bm.is-wide .bm__col{padding:8px 14px 0}
.bm.is-wide .bm__col h3{font-size:17px;margin-bottom:6px}
.bm.is-wide .bm__col p{font-size:16.5px}
.bm.is-wide .bm__inl,.bm.is-wide .bm__note{font-size:14px;bottom:12px;padding:0 10px}
.bm.is-wide .bm__verdict{left:28px;right:28px;padding:26px 30px 30px}
.bm.is-wide .bm__player{padding:2px 16px 8px}


@container (min-width:560px) and (max-height:540px){
  .bm__etaLine{margin-top:30px}
  .bm__etaNow{font-size:40px}
  .bm__etaDone{font-size:32px}
  .bm.is-wide .bm__solo{font-size:18px}
  .bm.is-wide .bm__col h3{font-size:16px;margin-bottom:4px}
  .bm.is-wide .bm__col p{font-size:15px}
  .bm.is-wide .bm__inl,.bm.is-wide .bm__note{font-size:12.5px;bottom:8px}
}


@container (max-width:345px){
  .bm__etaLine{margin-top:34px}
  .bm__etaNow{font-size:31px}
  .bm__etaDone{font-size:25px}
  .bm__solo{font-size:16px}
  .bm__col h3{font-size:14px;margin-bottom:5px}
