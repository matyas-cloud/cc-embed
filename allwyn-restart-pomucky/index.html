<!-- ============================================================
     POMŮCKY (3D KOLOTOČ KARET) — speciál Allwyn „Restart po úrazu nebo vážné nemoci“ (ParaRestart)
     ============================================================
     Umístění v repu:  cc-embed/allwyn-restart-pomucky/index.html  +  obrázky v cc-embed/allwyn-restart-pomucky/img/
     Vložení:          komponenta Iframe ve speciálu, celý tag <iframe src="…" title="…">
     Místo v textu:    blok „Jak technika vrací soběstačnost“, za „…přesednout z postele na vozík.“
     Formát:           3D kolotoč bílých karet, nekonečný (za poslední kartou je zase první). Karta nese
                       všechno: barevnou hlavičku kategorie, ilustraci, název, jak pomůcka funguje, cenu
                       a kdo ji hradí. Listuje se tahem, šipkami, klávesami ← →, klepnutím na boční kartu;
                       štítky kategorií skočí na první kartu kategorie. Poznámka k cenám a zdroje pod „i“.
     Rám:              karta se počítá z výšky plochy. Na výšku 1 karta + okraje sousedních, kategorie pod
                       nadpisem, šipky po stranách. Na šířku tři celé karty s mezerou (v užším rámu jedna
                       a velké části sousedních), šipky a kategorie v jednom řádku pod kartami. Text na každé
                       kartě se zmenšuje vlastní smyčkou --cs, při nouzi se zmenší obrázek (vždy je vidět celý).
                       Šířka prvku je nejvýš 1,5násobek výšky (při otevření mimo rám).
     Texty a karty:    objekt CFG ve skriptu. Nová karta = nový blok v CFG.cards + obrázek do img/.
                       Hodnoty v [hranatých závorkách] se zobrazí šedě jako chybějící údaj.
     Data:             ceny a úhrady viz CFG.info; chybí ceny prkna, zvedáku, schodolezu, elektrostimulace,
                       úhrada prkna a elektrostimulace, limit pojišťovny u vozíku.
     Ilustrace:        3D clay, vygenerováno (Nano Banana 2); výřez 3 : 2 (900 × 600 px JPG) s celým předmětem,
                       chybějící šířka dokreslena pozadím. V kartě se vkládají celé (contain).
     Pohyb:            vstup – karty se jednou rozjedou ze středu (IntersectionObserver, pojistka 6 s,
                       reduced-motion bez animace); jinak jen přechod při listování.
     Historie:         10. 11. 2026 první ostrá verze podle mockupu v7
                       10. 11. 2026 opravená perspektiva (karty jsou opravdu natočené), karty s odstupem,
                       nekonečný kolotoč, ilustrace celé (nové výřezy 3 : 2), na šířku ovládání pod kartami
     ============================================================ -->

<style>
.cc-embed{

<style>
.cc-embed.cc-rp{

/* na šířku: nadpis nahoře, tři karty s odstupem uprostřed, kategorie vystředěné pod nimi */

<script>
/* =====================================================================
   CFG – texty a karty. Měň jen hodnoty.
   PŘIDÁNÍ KARTY: zkopíruj jeden blok { … } v cards, změň texty a nahraj
   obrázek do složky img/ (na šířku 3 : 2, 900 × 600 px, JPG, celý předmět
   uvnitř; jiný poměr se nezdeformuje, jen se vloží celý). Pořadí
   v poli = pořadí karet v kolotoči. cat = klíč z categories.
   Hodnota začínající „[“ se zobrazí jako šedý zástupný text (chybí údaj).
   Text pro odečítače obrazovky se skládá z karet sám.
   Typografie: české uvozovky „…“, pomlčka –, nedělitelná mezera  .
   ===================================================================== */
var CFG = {
  title: 'Co vrací soběstačnost',
  labelPrice: 'Cena',
  labelPayer: 'Kdo hradí',
  prev: 'Předchozí pomůcka',
  next: 'Další pomůcka',
  categories: {
    part: { name: 'Částečná hybnost',    color: '#27e2cc', ink: '#07302c' },
    full: { name: 'Úplné ochrnutí',      color: '#14181a', ink: '#ffffff' },
    limb: { name: 'Chybějící končetina', color: '#efe9dc', ink: '#14181a' }
  },
  cards: [
    { cat: 'part', img: 'img/elektrostimulace.jpg', name: 'Elektrostimulace',
      text: 'Malý přístroj pod kolenem posílá impulzy do svalu a při kroku zvedne špičku chodidla. Člověk nezakopává a zvládne chůzi s holemi.',
      price: '[doplnit cenu]', payer: '[doplnit]' },
    { cat: 'part', img: 'img/exoskelet.jpg', name: 'Exoskelet',
      text: 'Motorizovaná konstrukce na nohy. Motory v kyčlích a kolenou vedou pohyb a pomáhají nacvičit přirozený krok.',
      price: 'kolem 1,6 milionu Kč', payer: 'Používají ho hlavně rehabilitační centra, úhradu pro domácí použití [ověřit]' },
    { cat: 'full', img: 'img/vozik.jpg', name: 'Vozík na míru',
      text: 'Lehký aktivní vozík postavený přesně na tělo. Čím je lehčí, tím víc sil zbude na zbytek dne.',
      price: 'například 109 000 Kč', payer: 'Zdravotní pojišťovna na poukaz do limitu, zbytek doplácí člověk [doplnit limit]' },
    { cat: 'full', img: 'img/prkno.jpg', name: 'Přesedací prkno',
      text: 'Hladké prkno jako most mezi postelí a vozíkem. Člověk po něm přesedne sám, bez pomoci druhého.',
      price: '[doplnit cenu]', payer: '[doplnit]' },
    { cat: 'full', img: 'img/zvedak.jpg', name: 'Stropní zvedák',
      text: 'Kolejnice ve stropě a motor se závěsem. Přenese člověka z postele do koupelny bez zvedání.',
      price: '[doplnit cenu]', payer: 'Úřad práce přispívá až 90 % ceny, nejvýš 350 000 Kč' },
    { cat: 'full', img: 'img/schodolez.jpg', name: 'Schodolez',
      text: 'Elektrický pomocník, který vyveze vozík po schodech tam, kde chybí výtah.',
      price: '[doplnit cenu]', payer: 'Úřad práce přispívá až 90 % ceny, nejvýš 350 000 Kč' },
    { cat: 'limb', img: 'img/bionicka-ruka.jpg', name: 'Bionická ruka',
      text: 'Ovládá se jemnými svalovými impulzy v předloktí. Jonáš Kešnar s ní krájí, zapíná pásek a v tramvaji drží madlo.',
      price: 'kolem 750 000 Kč', payer: 'Pojišťovna jen výjimečně, když chybí obě ruce nebo druhá nefunguje' }
  ],
  infoLabel: 'Ceny a úhrady',
  info: [
    'Ceny jsou orientační a liší se podle modelu a výrobce. O úhradě rozhoduje zdravotní pojišťovna nebo úřad práce vždy individuálně.',
    '<b>Příspěvek na zvláštní pomůcku:</b> Ministerstvo práce a sociálních věcí, 2026.',
    '<b>Vozík:</b> konkrétní model Quickie Nitrum, veřejná sbírka na Donio.cz.',
    '<b>Exoskelet:</b> ReWalk, kolem 70 000 dolarů (New Mobility, 2014).',
    '<b>Bionická ruka:</b> text speciálu; úhrada podle Novinky.cz (2017).'
  ]
};
</script>

<script>
(function(){
  var root = document.querySelector('[data-cc-rp]');
  if(!root || root.dataset.ccInit) return; root.dataset.ccInit = '1';
  var stage = root.querySelector('[data-stage]'), deck = root.querySelector('[data-deck]'), catsBox = root.querySelector('[data-cats]');
  var prev = root.querySelector('[data-prev]'), next = root.querySelector('[data-next]');
  var C = CFG.cards, a = 0, cards = [];
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  function val(s){ s = String(s); return s.charAt(0) === '[' ? '<span class="is-ph">'+esc(s)+'</span>' : esc(s).replace(/\[([^\]]+)\]/g, '<span class="is-ph">[$1]</span>'); }

  root.querySelector('[data-title]').textContent = CFG.title;
  prev.innerHTML = '‹'; prev.setAttribute('aria-label', CFG.prev);
  next.innerHTML = '›'; next.setAttribute('aria-label', CFG.next);
  root.querySelector('[data-srclabel]').textContent = CFG.infoLabel;
  root.querySelector('[data-srcbody]').innerHTML = CFG.info.map(function(s){ return '<p>'+s+'</p>'; }).join('');
  root.querySelector('[data-sr]').innerHTML = '<p>Kompenzační pomůcky po úrazu nebo nemoci.</p><ul>' + C.map(function(c){
    return '<li>'+esc(c.name)+' ('+esc(CFG.categories[c.cat].name)+'). '+esc(c.text)+' '+CFG.labelPrice+': '+esc(c.price)+'. '+CFG.labelPayer+': '+esc(c.payer)+'.</li>';
  }).join('') + '</ul>';

  /* kategorie */
  Object.keys(CFG.categories).forEach(function(k){
    var cat = CFG.categories[k]; if(!C.some(function(c){ return c.cat === k; })) return;
    var b = document.createElement('button'); b.type = 'button'; b.className = 'cc-rp__cat'; b.dataset.k = k;
    b.innerHTML = '<i style="background:'+cat.color+'"></i>'+esc(cat.name);
    bindTap(b, function(){ go(C.findIndex(function(c){ return c.cat === k; })); });
    catsBox.appendChild(b);
  });
  /* karty */
  C.forEach(function(c, i){
    var cat = CFG.categories[c.cat], d = document.createElement('div');
    d.className = 'cc-rp__card'; d.style.setProperty('--i', i);
    d.setAttribute('role','group'); d.setAttribute('aria-roledescription','karta'); d.setAttribute('aria-label', (i+1)+' z '+C.length+': '+c.name);
    d.innerHTML = '<div class="cc-rp__band" style="background:'+cat.color+';color:'+cat.ink+'">'+esc(cat.name)+'</div>'
      + '<div class="cc-rp__img" style="background-image:url(\''+c.img+'\')" role="presentation"></div>'
      + '<div class="cc-rp__body"><p class="cc-rp__name">'+esc(c.name)+'</p><p class="cc-rp__text">'+esc(c.text)+'</p>'
      + '<div class="cc-rp__spec"><div class="cc-rp__row"><span class="cc-rp__lab">'+CFG.labelPrice+'</span><span class="cc-rp__price">'+val(c.price)+'</span></div>'
      + '<div class="cc-rp__row"><span class="cc-rp__lab">'+CFG.labelPayer+'</span><span class="cc-rp__payer">'+val(c.payer)+'</span></div></div></div>';
    d.addEventListener('click', function(){ if(i !== a) go(i); });
    deck.appendChild(d); cards.push(d);
  });

  /* poloha karty vůči aktivní: kolotoč je nekonečný, bere se kratší cesta dokola */
  function mode(){ var land = root.clientWidth > root.clientHeight; return !land ? 1 : stage.clientWidth >= 700 ? 3 : 2; }
  function rel(i){ var n = C.length, d = ((i - a) % n + n) % n; return d > n/2 ? d - n : d; }
  function lay(){
    var m = mode(), cw = parseFloat(root.style.getPropertyValue('--cw')) || 200;
    /* široký rám: tři celé karty s mezerou; užší na šířku: jedna a velké části sousedních; na výšku: jedna a okraje */
    var X = m === 3 ? [0, 1.13, 2.3] : m === 2 ? [0, 1.08, 2.2] : [0, .84, 1.6];
    var Z = m === 3 ? [0, -.42, -.9] : m === 2 ? [0, -.45, -.9] : [0, -.75, -1.1], R = m === 3 ? [0, 32, 40] : m === 2 ? [0, 34, 40] : [0, 38, 42];
    cards.forEach(function(c, i){
      var d = rel(i), ad = Math.abs(d), k = Math.min(ad, 2), sg = d < 0 ? -1 : 1;
      if(c._d !== undefined && Math.abs(d - c._d) > 2) c.classList.add('is-jump');   /* přeskok přes zadní stranu bez přeletu */
      c._d = d;
      c.style.transform = 'translateX('+(sg*X[k]*cw).toFixed(1)+'px) translateZ('+(Z[k]*cw).toFixed(1)+'px) rotateY('+(-sg*R[k])+'deg)';
      c.style.zIndex = 100 - ad; c.style.opacity = ad > 1 ? 0 : 1; c.style.filter = ad ? 'brightness(.95)' : 'none';
      c.classList.toggle('is-active', ad === 0); c.classList.toggle('is-off', ad > 1);
      c.setAttribute('aria-hidden', ad === 0 ? 'false' : 'true');
    });
    void deck.offsetWidth;
    cards.forEach(function(c){ c.classList.remove('is-jump'); });
    [].forEach.call(catsBox.children, function(b){ b.setAttribute('aria-pressed', b.dataset.k === C[a].cat ? 'true' : 'false'); });
  }
  function go(i){ var n = C.length; a = ((i % n) + n) % n; lay(); }

  function bindTap(node, fn){
    if(window.PointerEvent) node.addEventListener('pointerdown', function(e){ if(e.button > 0) return; e.preventDefault(); e.stopPropagation(); node.focus({preventScroll:true}); fn(); });
    else { node.addEventListener('touchstart', function(e){ e.preventDefault(); fn(); }, {passive:false}); node.addEventListener('mousedown', fn); }
    node.addEventListener('keydown', function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); fn(); } });
  }
  bindTap(prev, function(){ go(a-1); }); bindTap(next, function(){ go(a+1); });
  /* tah prstem / myší do strany */
  var x0 = null, moved = false;
  stage.addEventListener('pointerdown', function(e){ x0 = e.clientX; moved = false; });
  stage.addEventListener('pointermove', function(e){ if(x0 !== null && Math.abs(e.clientX - x0) > 8) moved = true; });
  stage.addEventListener('pointerup', function(e){ if(x0 === null) return; var dx = e.clientX - x0; x0 = null; if(Math.abs(dx) > 30) go(a + (dx < 0 ? 1 : -1)); });
  stage.addEventListener('click', function(e){ if(moved){ e.stopPropagation(); moved = false; } }, true);
  stage.addEventListener('keydown', function(e){
    if(e.key === 'ArrowRight'){ e.preventDefault(); go(a+1); } if(e.key === 'ArrowLeft'){ e.preventDefault(); go(a-1); }
    if(e.key === 'Home'){ e.preventDefault(); go(0); } if(e.key === 'End'){ e.preventDefault(); go(C.length-1); }
  });

  /* zdroje */
  var info = root.querySelector('[data-info]'), src = root.querySelector('#cc-rp-src'), close = root.querySelector('[data-close]');
  function openSrc(){ src.hidden = false; info.setAttribute('aria-expanded','true'); close.focus({preventScroll:true}); }
  function closeSrc(back){ if(src.hidden) return; src.hidden = true; info.setAttribute('aria-expanded','false'); if(back) info.focus({preventScroll:true}); }
  bindTap(info, function(){ src.hidden ? openSrc() : closeSrc(true); });
  bindTap(close, function(){ closeSrc(true); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeSrc(true); if(e.key === 'Tab') root.classList.add('is-kbd'); });
  document.addEventListener('pointerdown', function(e){ root.classList.remove('is-kbd'); if(!src.hidden && !src.contains(e.target) && e.target !== info) closeSrc(false); }, true);

  /* barva pozadí ilustrace = průměr jejích krajních sloupců; doplní pruh, když je obrázek užší než karta */
  cards.forEach(function(c, i){
    var im = new Image();
    im.onload = function(){
      try{
        var cv = document.createElement('canvas'); cv.width = 12; cv.height = 8;
        var cx = cv.getContext('2d'); cx.drawImage(im, 0, 0, 12, 8);
        var px = cx.getImageData(0, 0, 12, 8).data, r = 0, g = 0, b = 0, n = 0;
        for(var y=0;y<8;y++){ [0, 11].forEach(function(x){ var k = (y*12+x)*4; r += px[k]; g += px[k+1]; b += px[k+2]; n++; }); }
        c.querySelector('.cc-rp__img').style.backgroundColor = 'rgb('+Math.round(r/n)+','+Math.round(g/n)+','+Math.round(b/n)+')';
      }catch(e){ /* bez přístupu k bodům obrázku zůstane výchozí barva */ }
    };
    im.src = C[i].img;
  });

  /* velikost karty z plochy + zmenšení textu, aby se vešel na každou kartu */
  var IMG_AR = 1.5;   /* poměr stran ilustrací (3 : 2) */
  function fit(){
    var land = root.clientWidth > root.clientHeight;
    /* ve velkém rámu na šířku roste písmo s výškou (výchozí je rám 786 × 560) */
    var sc = land ? Math.max(1, Math.min(1.45, root.clientHeight/560)) : 1; root.style.setProperty('--sc', sc.toFixed(3));
    for(var k=0;k<14 && root.scrollHeight > root.clientHeight + 1;k++){ sc *= .94; root.style.setProperty('--sc', sc.toFixed(3)); }
    root.style.setProperty('--ay', (stage.offsetTop + stage.clientHeight/2).toFixed(0)+'px');
    var sw = stage.clientWidth, sh = stage.clientHeight - (land ? 30 : 8);
    var m = mode();
    var cw = m === 3 ? Math.min(sh / 1.74, sw * .315, 380) : m === 2 ? Math.min(sh / 1.5, sw * .44, 300) : Math.min(sh / 1.62, sw * .74, 300), ch = Math.min(sh, cw * 1.9);
    var cs0 = m === 3 ? Math.max(1, Math.min(1.5, cw/238)) : 1;
    var ih = Math.min(cw / IMG_AR, ch * .42);
    root.style.setProperty('--cw', cw.toFixed(1)+'px'); root.style.setProperty('--ch', ch.toFixed(1)+'px');
    root.style.setProperty('--ih', ih.toFixed(1)+'px');
    cards.forEach(function(c){
      var body = c.querySelector('.cc-rp__body'), cs = cs0; c.style.setProperty('--cs', cs.toFixed(3));
      for(var k=0;k<14 && body.scrollHeight > body.clientHeight + 1;k++){ cs *= .94; c.style.setProperty('--cs', cs.toFixed(3)); }
      var im = c.querySelector('.cc-rp__img'), h = ih; im.style.height = '';
      while(body.scrollHeight > body.clientHeight + 1 && h > ch * .2){ h -= ch * .02; im.style.height = h.toFixed(1)+'px'; }
    });
    lay();
  }
  var t;
  window.addEventListener('resize', function(){ clearTimeout(t); t = setTimeout(fit, 60); });
  window.addEventListener('load', fit);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  if(window.ResizeObserver) new ResizeObserver(function(){ clearTimeout(t); t = setTimeout(fit, 90); }).observe(root);
  fit();

  /* vstup: skrytý výchozí stav hned, IntersectionObserver ho jen odkryje (bez IO / reduced-motion rovnou hotové) */
  if(!reduce && 'IntersectionObserver' in window){
    root.classList.add('is-pre');
    var played = false, guard;
    var io = new IntersectionObserver(function(es){ if(es.some(function(e){ return e.isIntersecting; })) play(); }, {threshold:.25});
    function play(){ if(played) return; played = true; io.disconnect(); clearTimeout(guard); root.classList.remove('is-pre'); root.classList.add('is-in'); setTimeout(function(){ root.classList.remove('is-in'); }, 1400); }
    io.observe(root); guard = setTimeout(play, 6000);
  }
})();
</script>

</body>
</html>
