<!doctype html>
<html lang="cs"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>6 varovných signálů</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#14181A;--paper:#F8F5EF;--acc:#27E2CC;--deep:#07302c;--mut:#5b6360;--w:240px;
 --ui:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
 --dsp:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#fff;color:var(--ink);overflow:hidden;font:400 16px/1.45 Georgia,'Times New Roman',serif;
 -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.wrap{height:100vh;display:flex;flex-direction:column;gap:10px;padding:12px 14px}
.hd{flex:0 0 auto;text-align:center}
.hd h2{margin:0;font:800 clamp(17px,3.3vh,26px)/1.12 var(--dsp);letter-spacing:-.02em}
.hd p{margin:5px 0 0;font:400 clamp(13px,2.2vh,17px)/1.3 Georgia,serif;color:var(--mut)}
.stage{flex:1 1 auto;position:relative;min-height:0;overflow:hidden;cursor:grab;
 perspective:1600px;perspective-origin:50% 48%;touch-action:pan-y}
.stage.drag{cursor:grabbing}
.flow{position:absolute;inset:0;transform-style:preserve-3d;
 transition:transform .5s cubic-bezier(.3,.85,.3,1)}

/* box pod karuselem — jen při 3+ otočených */
.bar{flex:0 0 auto;background:var(--deep);color:var(--paper);border-radius:15px;padding:12px 18px;
 text-align:center;display:none;flex-direction:column;justify-content:center;gap:4px}
.bar.on{display:flex;animation:rise .38s cubic-bezier(.3,.9,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.bar b{display:flex;align-items:center;justify-content:center;gap:8px;
 font:800 clamp(15px,2.7vh,21px)/1.15 var(--dsp);color:var(--acc);letter-spacing:-.01em}
.bar b svg{width:1.05em;height:1.05em;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:2.2;
 stroke-linecap:round;stroke-linejoin:round}
.bar span{display:block;max-width:62ch;margin:0 auto;
 font:400 clamp(13px,2.15vh,17px)/1.34 Georgia,serif;color:rgba(248,245,239,.9)}
.bar strong{color:#fff}

/* karta */
.c{--flip:0deg;position:absolute;left:50%;top:50%;width:var(--w);height:calc(var(--w)*1.484375);
 margin-left:calc(var(--w)/-2);margin-top:calc(var(--w)*-0.7421875);
 border:0;padding:0;background:none;cursor:pointer;font:inherit;color:inherit;
 perspective:1300px;-webkit-tap-highlight-color:transparent;
 transition:transform .5s cubic-bezier(.3,.85,.3,1),opacity .4s,
  width .4s cubic-bezier(.3,.85,.3,1),height .4s cubic-bezier(.3,.85,.3,1),
  margin-left .4s cubic-bezier(.3,.85,.3,1),margin-top .4s cubic-bezier(.3,.85,.3,1)}
.c span,.c img{display:block}
.ci{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateY(var(--flip));
 transition:transform .6s cubic-bezier(.3,.85,.3,1)}
.c[aria-pressed="true"]{--flip:180deg}
.cb,.cf{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
 background:var(--ink);border-radius:calc(var(--w)*0.07187);overflow:hidden;
 box-shadow:0 1px 2px rgba(7,48,44,.22),0 12px 24px -8px rgba(7,48,44,.42),
            0 30px 48px -24px rgba(7,48,44,.5)}
.cf{transform:rotateY(180deg)}
.art{position:absolute;inset:0;width:100%;height:100%}
.ico{position:absolute;left:23.438%;top:5.474%;width:53.125%;height:35.789%;object-fit:contain}
.c .zone{position:absolute;display:flex;align-items:center;justify-content:center;
 text-align:center;text-wrap:balance}
.say{left:8.125%;top:20.632%;width:83.750%;height:50.526%;padding:0 7%;font:700 calc(var(--w)*.093)/1.28 Georgia,serif}
.name{left:9.688%;top:44.211%;width:80.625%;height:10.947%;padding:0 5%;overflow:hidden;
 font:800 calc(var(--w)*var(--nf,.068))/1.14 var(--dsp);
 letter-spacing:-.015em;color:var(--paper)}
.why{left:10.312%;top:58.526%;width:79.375%;height:34.737%;padding:0 2%;align-items:flex-start;
 font:400 calc(var(--w)*.058)/1.4 Georgia,serif;color:#31393a}
@keyframes peek{0%{transform:rotateY(0)}20%{transform:rotateY(-32deg)}
 46%{transform:rotateY(-32deg)}100%{transform:rotateY(0)}}
.c.peek .ci{animation:peek 2s .5s cubic-bezier(.35,.1,.3,1)}
@media (prefers-reduced-motion:reduce){.c,.ci,.flow{transition-duration:.01ms}
 .c.peek .ci{animation:none}.bar.on{animation:none}}
</style></head>

  var x=d===0?0:sg*(s1+(ad-1)*s2);xs.push(x);
  var zz=d===0?0:-(130+(ad-1)*58),ry=d===0?0:-sg*42,sc=d===0?1:0.9;
  e.style.zIndex=30-ad;e.style.opacity=ad>3?'.62':'1';
  e.style.transform='translateX('+x+'px) translateZ('+zz+'px) rotateY('+ry+'deg) scale('+sc+')';
 });
 var mid=(Math.min.apply(null,xs)+Math.max.apply(null,xs))/2;
 flow.style.transform='translateX('+(-mid*0.5)+'px)';
 fitNames();
}
/* pojistka: kdyby se název v pilulce nevešel (jiné písmo, delší titulek), zmenšíme ho */
function fitNames(){
 cards.forEach(function(e){
  var n=e.querySelector('.name');if(!n)return;
  var f=.068;n.style.setProperty('--nf',f);
  for(var g=0;g<7&&n.scrollHeight>n.clientHeight+1;g++){f-=.004;n.style.setProperty('--nf',f)}
 });
}
function cnt(){var n=0;st.forEach(function(v){if(v)n++});return n}
function updBar(){
 var n=cnt();
 if(n<3){bar.className='bar';bar.innerHTML='';return}
 bar.className='bar on';
 bar.innerHTML='<b>'+IC.warn+'Otočili jste '+n+' '+(n<5?'karty':'karet')+'</b>'
  +'<span><strong>Tři signály najednou už nebývají náhoda.</strong> Není to diagnóza. Je to důvod '
  +'nastavit si vlastní hranice dřív, než je nastaví někdo jiný.</span>';
}
function paint(){cards.forEach(function(e,i){e.setAttribute('aria-pressed',st[i]?'true':'false')});
 layout();updBar()}
function go(n){var v=Math.max(0,Math.min(5,n));if(v===act)return;act=v;paint()}

/* ---- ovládání: tažení myší, swipe, vodorovné kolečko, klávesnice ---- */
var px=null,moved=0,pid=null;
stage.addEventListener('pointerdown',function(e){
 if(e.pointerType==='mouse'&&e.button!==0)return;
 px=e.clientX;moved=0;pid=e.pointerId;stage.classList.add('drag');
});
stage.addEventListener('pointermove',function(e){
 if(px===null||e.pointerId!==pid)return;
 var dx=e.clientX-px;if(Math.abs(dx)>Math.abs(moved))moved=dx;
 var step=stage.clientWidth*0.14;
 if(Math.abs(dx)>step){go(act+(dx<0?1:-1));px=e.clientX}
});
function endDrag(){px=null;pid=null;stage.classList.remove('drag')}
stage.addEventListener('pointerup',endDrag);
stage.addEventListener('pointercancel',endDrag);
stage.addEventListener('pointerleave',endDrag);

var wlock=0;
stage.addEventListener('wheel',function(e){
 var hx=Math.abs(e.deltaX)>Math.abs(e.deltaY);
 if(!hx&&!e.shiftKey)return;                 /* svislé kolečko necháme stránce */
 e.preventDefault();
 var now=Date.now();if(now-wlock<260)return;wlock=now;
 var d=e.shiftKey&&!hx?e.deltaY:e.deltaX;
 if(Math.abs(d)>4)go(act+(d>0?1:-1));
},{passive:false});

stage.addEventListener('keydown',function(e){
 if(e.key==='ArrowRight'){go(act+1);e.preventDefault()}
 if(e.key==='ArrowLeft'){go(act-1);e.preventDefault()}
 if(e.key==='Enter'||e.key===' '){var t=document.activeElement;
  if(t&&t.classList.contains('c')&&+t.dataset.i===act){st[act]=!st[act];paint();e.preventDefault()}}
});

stage.addEventListener('click',function(ev){
 if(Math.abs(moved)>8){moved=0;return}
 var b=ev.target.closest('.c');if(!b)return;
 var i=+b.dataset.i;
 if(i===act){st[i]=!st[i]} else {act=i}
 paint();
});

addEventListener('resize',layout);
try{new ResizeObserver(function(){layout()}).observe(stage)}catch(e){}
addEventListener('load',layout);setTimeout(layout,60);setTimeout(layout,500);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(layout);
paint();
function arm(){if(armed)return;armed=true;var c=cards[act];c.classList.add('peek');
 setTimeout(function(){c.classList.remove('peek')},2800)}
try{new IntersectionObserver(function(en){en.forEach(function(x){if(x.isIntersecting)arm()})},
 {threshold:.4}).observe(stage)}catch(e){arm()}
</script></body></html>
