<!doctype html>
<html lang="cs"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>6 varovných signálů</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#14181A;--paper:#F8F5EF;--acc:#27E2CC;--deep:#07302c;--w:240px;
 --f:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#fff;color:var(--ink);overflow:hidden;font:400 16px/1.45 var(--f);
 -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.wrap{height:100vh;display:flex;flex-direction:column;gap:clamp(8px,1.6vh,14px);
 padding:clamp(10px,1.8vh,16px) 16px clamp(12px,2vh,18px)}

.hd{flex:0 0 auto;text-align:center}
.hd h2{margin:0 auto;max-width:34ch;
 font:800 clamp(17px,3.4vh,27px)/1.16 var(--f);letter-spacing:-.025em;text-wrap:balance}

.stage{flex:1 1 auto;position:relative;min-height:0;overflow:hidden;cursor:grab;
 perspective:1600px;perspective-origin:50% 48%;touch-action:pan-y;outline:none;
 -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.stage ::selection{background:transparent}
.stage.drag{cursor:grabbing}
@media (hover:hover){
 .c.is-active:hover .ci{transform:rotateY(var(--flip)) translateZ(26px)}
}
.c{cursor:pointer}
.stage:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:12px}
.flow{position:absolute;inset:0;transform-style:preserve-3d;
 transition:transform .5s cubic-bezier(.3,.85,.3,1)}

/* --- box: místo je rezervované vždy, karty se tedy nikdy nehýbou --- */
.slot{flex:0 0 auto;display:flex;justify-content:center;align-items:flex-start;
 padding-top:clamp(6px,1.2vh,12px)}
.bar{position:relative;width:min(100%,610px);display:flex;gap:clamp(13px,1.9vw,20px);
 align-items:flex-start;text-align:left;
 background:var(--deep);color:var(--paper);border:1px solid rgba(39,226,204,.22);
 border-radius:18px;padding:clamp(13px,2vh,19px) clamp(18px,2.6vw,26px);
 box-shadow:0 2px 6px rgba(7,48,44,.2),0 20px 44px -26px rgba(7,48,44,.75);
 opacity:0;visibility:hidden;transform:translateY(9px) scale(.985);
 transition:opacity .4s ease,transform .4s cubic-bezier(.25,.9,.3,1),visibility .4s}
.bar.on{opacity:1;visibility:visible;transform:none}
.bar::before{content:"";position:absolute;top:-7px;left:50%;margin-left:-7px;
 width:13px;height:13px;background:var(--deep);border-radius:3px 0 0 0;
 border-left:1px solid rgba(39,226,204,.22);border-top:1px solid rgba(39,226,204,.22);
 transform:rotate(45deg)}
.badge{flex:0 0 auto;width:clamp(30px,4.6vh,38px);height:clamp(30px,4.6vh,38px);
 border-radius:50%;display:grid;place-items:center;
 background:rgba(39,226,204,.14);box-shadow:0 0 0 1px rgba(39,226,204,.3) inset;
 margin-top:1px}
.badge svg{width:58%;height:58%;fill:var(--acc)}
.bar h3{margin:0;font:700 clamp(14px,2.3vh,19px)/1.25 var(--f);
 color:var(--acc);letter-spacing:-.022em}
.bar p{margin:clamp(5px,.9vh,8px) 0 0;max-width:54ch;
 font:400 clamp(12px,1.85vh,15px)/1.6 var(--f);color:rgba(248,245,239,.76)}
.bar p b{display:inline-block;margin-bottom:.3em;font-weight:600;color:#fff;letter-spacing:-.012em}

/* --- karta --- */
.c{--flip:0deg;position:absolute;left:50%;top:50%;width:var(--w);height:calc(var(--w)*1.484375);
 margin-left:calc(var(--w)/-2);margin-top:calc(var(--w)*-0.7421875);
 border:0;padding:0;background:none;cursor:pointer;font:inherit;color:inherit;
 perspective:1300px;-webkit-tap-highlight-color:transparent;
 transition:transform .5s cubic-bezier(.3,.85,.3,1),opacity .4s}
.c span,.c img{display:block}
.ci{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateY(var(--flip));
 transition:transform .6s cubic-bezier(.3,.85,.3,1)}
.c[aria-pressed="true"]{--flip:180deg}
.cb,.cf{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
 background:var(--ink);border-radius:calc(var(--w)*0.07187);overflow:hidden;
 box-shadow:0 1px 2px rgba(7,48,44,.22),0 12px 24px -8px rgba(7,48,44,.42),
            0 30px 48px -24px rgba(7,48,44,.5)}
.cf{transform:rotateY(180deg)}
.art{position:absolute;inset:0;width:100%;height:100%}
.ico{position:absolute;left:17.188%;top:8.211%;width:65.625%;height:44.211%;object-fit:contain}
.c .zone{position:absolute;display:flex;align-items:center;justify-content:center;
 text-align:center;text-wrap:balance}
.say{left:8.125%;top:20.632%;width:83.750%;height:50.526%;padding:0 8%;overflow:hidden;
 font:700 calc(var(--w)*var(--sf,.086))/1.32 var(--f);letter-spacing:-.022em}
.name{left:9.062%;top:60.211%;width:81.875%;height:10.947%;padding:0 6%;overflow:hidden;
 font:700 calc(var(--w)*var(--nf,.064))/1.16 var(--f);
 letter-spacing:-.022em;color:var(--paper)}
.why{left:9.688%;top:72.632%;width:80.625%;height:21.053%;padding:0 3%;align-items:flex-start;overflow:hidden;
 font:400 calc(var(--w)*var(--wf,.053))/1.5 var(--f);letter-spacing:-.008em;color:#3d4645}

@keyframes peek{0%{transform:rotateY(0)}20%{transform:rotateY(-32deg)}
 46%{transform:rotateY(-32deg)}100%{transform:rotateY(0)}}
.c.peek .ci{animation:peek 1.9s .45s cubic-bezier(.35,.1,.3,1)}
.flow.nudge{animation:nudge 1.25s 2.5s cubic-bezier(.4,.05,.3,1)}
@keyframes nudge{0%,100%{transform:translateX(var(--fx,0px))}
 30%{transform:translateX(calc(var(--fx,0px) - 26px))}
 62%{transform:translateX(calc(var(--fx,0px) + 12px))}}
@media (prefers-reduced-motion:reduce){.c,.ci,.flow{transition-duration:.01ms}
 .c.peek .ci,.flow.nudge{animation:none}.bar{transition:none}}
</style></head>

<script>
var D=[{"n": "I", "name": "Vytrácí se radost", "say": "Užiju si to až potom. Teď na to není čas.", "why": "Co vám dříve dodávalo energii, vás o ni obírá."}, {"n": "II", "name": "Ozývá se tělo", "say": "Je to jen únava. Nic víc v tom není.", "why": "Špatně spíte, jste unavení, bolí vás hlava."}, {"n": "III", "name": "Mizí psychická pohoda", "say": "Kdo by nebyl ve stresu. Doba je taková.", "why": "Jste podrážděnější, hůř snášíte změny."}, {"n": "IV", "name": "Není prostor na ostatní činnosti", "say": "Na lidi bude čas potom. Teď to nejde.", "why": "Jedna věc začne vytlačovat všechno kolem."}, {"n": "V", "name": "Ztrácíte svobodu volby", "say": "Přestanu, až budu chtít. Zatím nechci.", "why": "Máte pocit, že činnost nemůžete jen tak nechat."}, {"n": "VI", "name": "Narušení života ve všech oblastech", "say": "Zvládám to. Však ono to přejde.", "why": "Objevuje se úzkost, deprese nebo vyhoření."}];
var stage=document.getElementById('stage'),flow=document.getElementById('flow'),
    bar=document.getElementById('bar'),bh=document.getElementById('barh');
var cards=[].slice.call(stage.querySelectorAll('.c'));
var st=D.map(function(){return false}),act=0,armed=false,fx=0;


function layout(){
 var Hh=stage.clientHeight,Ww=stage.clientWidth,narrow=Ww<560;
 var w=Math.min(Hh*0.63,Ww*(narrow?0.56:0.46));
 stage.style.setProperty('--w',w+'px');
 var s1=w*(narrow?0.44:0.50),s2=w*(narrow?0.15:0.20),xs=[];
 cards.forEach(function(e,i){
  var d=i-act,ad=Math.abs(d),sg=d>0?1:-1;
  var x=d===0?0:sg*(s1+(ad-1)*s2);xs.push(x);
  var zz=d===0?0:-(130+(ad-1)*58),ry=d===0?0:-sg*42,sc=d===0?1:0.9;
  e.style.zIndex=30-ad;e.style.opacity=ad>3?'.62':'1';
  e.classList.toggle('is-active',d===0);
  e.style.transform='translateX('+x+'px) translateZ('+zz+'px) rotateY('+ry+'deg) scale('+sc+')';
 });
 var mid=(Math.min.apply(null,xs)+Math.max.apply(null,xs))/2;
 fx=-mid*0.38; flow.style.setProperty('--fx',fx+'px');
 flow.style.transform='translateX('+fx+'px)';
 fitText();
}
/* Kterou kartu má čtenář pod kurzorem.
   Chromium u karet s vlastní perspective neprovádí hit-test, takže se ptáme
   přímo na jejich obrysy: ze všech, které bod obsahují, bereme tu nejvýš
   ve vrstvení, tedy nejbližší aktivní. To přesně odpovídá tomu, co je vidět. */
function pickCard(cx,cy){
 var hit=-1,hitAd=1e9,near=-1,nearD=1e9,top=1e9,bot=-1e9;
 for(var i=0;i<cards.length;i++){
  var r=cards[i].getBoundingClientRect();
  if(r.top<top)top=r.top; if(r.bottom>bot)bot=r.bottom;
  var d=cx<r.left?r.left-cx:(cx>r.right?cx-r.right:0);
  if(d===0){var ad=Math.abs(i-act);if(ad<hitAd){hitAd=ad;hit=i}}
  else if(d<nearD){nearD=d;near=i}
 }
 if(cy<top-14||cy>bot+14)return -1;        /* klik nad/pod balíčkem neřešíme */
 return hit>=0?hit:near;
}
/* pojistka na delší texty i jiné písmo: zmenší, dokud se nevejde */
function fitText(){
 [['.say','--sf',.086,.004],['.name','--nf',.064,.0035],['.why','--wf',.053,.003]]
 .forEach(function(cfg){
  cards.forEach(function(e){
   var n=e.querySelector(cfg[0]);if(!n)return;
   var f=cfg[2];n.style.setProperty(cfg[1],f);
   for(var g=0;g<8&&(n.scrollHeight>n.clientHeight+1||n.scrollWidth>n.clientWidth+1);g++){
    f-=cfg[3];n.style.setProperty(cfg[1],f)}
  });
 });
}
function cnt(){var n=0;st.forEach(function(v){if(v)n++});return n}
function updBar(){
 var n=cnt();
 if(n>=3){bh.textContent='Otočili jste '+n+' '+(n<5?'karty':'karet');bar.classList.add('on')}
 else bar.classList.remove('on');
}
function paint(){cards.forEach(function(e,i){
  e.setAttribute('aria-pressed',st[i]?'true':'false');
  e.setAttribute('aria-label','Karta '+(i+1)+' ze 6: '+D[i].say+' '+
    (i!==act?'Zobrazit kartu.':(st[i]?'Otočit zpět.':'Otočit.')));
 });
 layout();updBar()}
function go(n){var v=Math.max(0,Math.min(5,n));if(v===act)return;act=v;paint()}

var px=null,moved=0,pid=null,dragged=false;
stage.addEventListener('pointerdown',function(e){
 if(e.pointerType==='mouse'&&e.button!==0)return;
 px=e.clientX;moved=0;dragged=false;pid=e.pointerId;
 stage.classList.add('drag');flow.classList.remove('nudge');
});
stage.addEventListener('pointermove',function(e){
 if(px===null||e.pointerId!==pid)return;
 var dx=e.clientX-px;if(Math.abs(dx)>Math.abs(moved))moved=dx;
 var step=stage.clientWidth*0.13;
 if(Math.abs(dx)>step){go(act+(dx<0?1:-1));px=e.clientX;dragged=true}
});
function endDrag(){px=null;pid=null;stage.classList.remove('drag')}
['pointerup','pointercancel','pointerleave'].forEach(function(t){stage.addEventListener(t,endDrag)});

/* trackpad: dvěma prsty do stran. Posun je úměrný gestu, ne po jedné kartě za tik. */
var acc=0,wt=0;
stage.addEventListener('wheel',function(e){
 var hx=Math.abs(e.deltaX)>Math.abs(e.deltaY);
 if(!hx&&!e.shiftKey)return;              /* svislé rolování patří stránce */
 e.preventDefault();
 var d=hx?e.deltaX:e.deltaY;
 if(e.deltaMode===1)d*=16; else if(e.deltaMode===2)d*=stage.clientWidth;
 var now=Date.now();
 if(now-wt>180||(acc>0)!==(d>0))acc=0;    /* nové gesto nebo obrat směru */
 wt=now;acc+=d;
 var need=58,guard=0;
 while(Math.abs(acc)>=need&&guard++<6){
  var dir=acc>0?1:-1,before=act;
  go(act+dir);acc-=dir*need;
  if(act===before){acc=0;break}           /* konec balíčku */
 }
},{passive:false});

stage.addEventListener('keydown',function(e){
 if(e.key==='ArrowRight'){go(act+1);e.preventDefault()}
 if(e.key==='ArrowLeft'){go(act-1);e.preventDefault()}
});
stage.addEventListener('click',function(ev){
 if(dragged){dragged=false;return}          /* spolkneme klik jen po skutečném listování */
 flow.classList.remove('nudge');
 /* klik z klávesnice nemá souřadnice — tam se řídíme zaměřenou kartou */
 var b=ev.target.closest('.c');
 var i=(ev.detail===0&&b)?+b.dataset.i:pickCard(ev.clientX,ev.clientY);
 if(i<0)return;
 if(i===act){st[i]=!st[i];paint();return}
 act=i;paint();
});


addEventListener('resize',layout);
try{new ResizeObserver(function(){layout()}).observe(stage)}catch(e){}
addEventListener('load',layout);setTimeout(layout,60);setTimeout(layout,500);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(layout);
paint();
function arm(){if(armed)return;armed=true;
 var c=cards[act];c.classList.add('peek');
 setTimeout(function(){c.classList.remove('peek')},2600);
 flow.classList.add('nudge');
 setTimeout(function(){flow.classList.remove('nudge')},4200);
}
try{new IntersectionObserver(function(en){en.forEach(function(x){if(x.isIntersecting)arm()})},
 {threshold:.4}).observe(stage)}catch(e){arm()}
</script></body></html>
