<style>
.cc-embed{
  --cc-blue:#087eeb;      --cc-blue-dark:#0668c2;
  --cc-red:#d40b3e;
  --cc-ink:#222;          --cc-ink-soft:#3c3c3c;
  --cc-muted:#84929b;
  --cc-line:#ececec;
  --cc-surface:#f8f9fa;   --cc-white:#fff;
  --cc-radius:15px;       --cc-radius-sm:10px;
  --cc-pad:clamp(16px,3vw,26px);
  --cc-gap:12px;
  --cc-serif:Georgia,Times,"Times New Roman",serif;
  --cc-display:Poppins,-apple-system,"Segoe UI",sans-serif;
  --cc-ui:Inter,-apple-system,"Segoe UI",sans-serif;
  display:block;margin:2.4rem 0;padding:var(--cc-pad);
  background:var(--cc-surface);border:1px solid var(--cc-line);
  border-radius:var(--cc-radius);color:var(--cc-ink);
  font:18px/1.66667 var(--cc-serif);-webkit-tap-highlight-color:transparent;
}
.cc-embed *{box-sizing:border-box;}
.cc-embed p{margin:0 0 10px;}
.cc-embed img{max-width:100%;}
.cc-embed :focus-visible{outline:3px solid var(--cc-blue);outline-offset:2px;}
.cc-embed .cc-sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}
@media (prefers-reduced-motion:reduce){.cc-embed *{transition:none!important;animation:none!important;}}
</style>

<!-- ============ Prvek: 6 varovných signálů ============ -->
<style>
html,body{height:100%;margin:0;}
body{background:var(--cc-surface,#f8f9fa);}

.cc-sig{
  --acc:#27E2CC; --acc-deep:#0a4b45; --ink:#14181A;
  --pad:clamp(14px,2.4vw,34px);
  box-sizing:border-box;
  display:flex;flex-direction:column;
  height:100vh;min-height:100vh;
  margin:0!important;padding:var(--pad);
  background:var(--cc-surface);border:0;border-radius:0;
  overflow:hidden;
}

/* ---------- hlavička ---------- */
.cc-sig__head{flex:0 0 auto;margin:0 0 clamp(8px,1.4vh,16px);max-width:54em;}
.cc-sig__title{margin:0 0 4px;font-family:var(--cc-display);font-weight:700;
  font-size:clamp(18px,2.6vw,28px);line-height:1.16;color:#000;}
.cc-sig__lede{margin:0;font-family:var(--cc-serif);
  font-size:clamp(12.5px,1.4vw,17px);line-height:1.45;color:var(--cc-ink-soft);}

/* ---------- pole karet ---------- */
.cc-sig__deck{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
  justify-content:center;}

.cc-sig__grid{
  display:grid;gap:var(--rowgap,16px) var(--colgap,16px);
  grid-template-columns:repeat(3, var(--colW, 260px));
  justify-content:center;align-content:center;
  perspective:1200px;
}
/* úzké obrazovky: vodorovně odsouvaná ruka karet */
.cc-sig--rail .cc-sig__grid{
  display:flex;grid-template-columns:none;
  gap:var(--colgap,10px);
  overflow-x:auto;overflow-y:visible;
  padding:8px 0 10px;margin:-8px 0 -10px;
  scroll-snap-type:x proximity;touch-action:pan-y;scrollbar-width:thin;
}
.cc-sig--rail .cc-sig__grid::-webkit-scrollbar{height:5px;}
.cc-sig--rail .cc-sig__grid::-webkit-scrollbar-thumb{background:#d6dade;border-radius:3px;}

.cc-sig__cell{display:flex;flex-direction:column;align-items:center;min-width:0;}
.cc-sig--rail .cc-sig__cell{flex:0 0 auto;width:var(--cw,150px);scroll-snap-align:center;}

/* ---------- karta ---------- */
.cc-sig__card{
  position:relative;display:block;
  width:var(--cw,170px);height:var(--ch,255px);
  padding:0;margin:0;border:0;background:none;
  font:inherit;color:inherit;cursor:pointer;
  transition:transform .26s cubic-bezier(.2,.7,.3,1);
}
@media (hover:hover){
  .cc-sig__card:hover{transform:translateY(-8px) scale(1.035);z-index:4;}
}
.cc-sig__card:focus-visible{outline:none;}
.cc-sig__card:focus-visible .cc-sig__inner{outline:3px solid var(--acc-deep);outline-offset:4px;}

.cc-sig__inner{
  display:block;position:relative;width:100%;height:100%;
  transform-style:preserve-3d;
  transition:transform .62s cubic-bezier(.3,.8,.3,1);
}
.cc-sig__card[aria-pressed="true"] .cc-sig__inner{transform:rotateY(180deg);}

.cc-sig__face{
  position:absolute;inset:0;overflow:hidden;
  -webkit-backface-visibility:hidden;backface-visibility:hidden;
  box-shadow:0 5px 13px rgba(12,20,26,.16);
  transition:box-shadow .26s;
}
@media (hover:hover){
  .cc-sig__card:hover .cc-sig__face{box-shadow:0 16px 30px rgba(12,20,26,.26);}
}
.cc-sig__face img{display:block;width:100%;height:100%;object-fit:fill;}
.cc-sig__face--lic{transform:rotateY(180deg);}

.cc-sig__slot{position:absolute;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:0 4%;}
.cc-sig__say{font-family:var(--cc-serif);font-size:var(--fs-say,12px);
  line-height:1.34;color:#171b1d;}
.cc-sig__name{font-family:var(--cc-display);font-weight:700;
  font-size:var(--fs-name,10px);line-height:1.15;letter-spacing:.055em;
  text-transform:uppercase;color:#f2f1ee;}
.cc-sig__num{position:absolute;left:0;right:0;text-align:center;
  font-family:var(--cc-display);font-weight:600;
  font-size:var(--fs-num,11px);letter-spacing:.1em;color:#f2f1ee;opacity:.92;}

/* ---------- popisek pod kartou ---------- */
.cc-sig__cap{
  margin:var(--capgap,10px) auto 0;width:100%;max-width:var(--capW,280px);
  height:var(--capH,54px);
  overflow:hidden;text-align:center;
  font-family:var(--cc-serif);font-size:var(--fs-cap,13px);line-height:1.38;
  color:#2a3033;
  opacity:0;transform:translateY(-4px);
  transition:opacity .28s ease .22s, transform .28s ease .22s;
}
.cc-sig__cell.is-on .cc-sig__cap{opacity:1;transform:none;}

/* ---------- tmavý box POZOR ---------- */
.cc-sig__box{
  flex:0 0 auto;margin-top:clamp(10px,1.8vh,22px);
  height:var(--boxH,120px);overflow:hidden;
  background:var(--ink);border-radius:var(--cc-radius);
  padding:clamp(10px,1.4vw,20px) clamp(14px,2vw,28px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;
  visibility:hidden;opacity:0;
  transition:opacity .34s ease;
}
.cc-sig--warn .cc-sig__box{visibility:visible;opacity:1;}
.cc-sig__boxtag{
  display:inline-block;margin:0 0 var(--tag-gap,9px);
  padding:4px 12px;border-radius:999px;background:var(--acc);
  font:700 var(--fs-tag,10.5px)/1.1 var(--cc-ui);letter-spacing:.15em;
  text-transform:uppercase;color:#07302c;}
.cc-sig__boxh{
  margin:0 0 var(--h-gap,7px);font-family:var(--cc-display);font-weight:700;
  font-size:var(--fs-boxh,26px);line-height:1.15;color:#F4F2EE;}
.cc-sig__boxtext{
  margin:0;max-width:78ch;
  font:400 var(--fs-rest,14px)/1.46 var(--cc-ui);color:#9AA4A9;}
.cc-sig__boxtext b{font-weight:700;color:#F4F2EE;}

/* ---------- úvodní animace ---------- */
.cc-sig__card{opacity:0;}
.cc-sig--static .cc-sig__card{opacity:1;}
.cc-sig--intro .cc-sig__card{
  animation:ccsigDeal .6s cubic-bezier(.2,.75,.3,1) both;
  animation-delay:calc(var(--i) * 85ms);}
@keyframes ccsigDeal{
  0%  {opacity:0;transform:translate(calc(var(--dx) * 1px), 24px) rotate(calc(var(--rot) * 1deg)) scale(.9);}
  60% {opacity:1;}
  100%{opacity:1;transform:none;}
}
.cc-sig--intro .cc-sig__peek .cc-sig__inner{
  animation:ccsigPeek 2.4s cubic-bezier(.3,.8,.3,1) both;
  animation-delay:calc(var(--peekAt) * 1ms);}
@keyframes ccsigPeek{
  0%{transform:rotateY(0deg);} 22%{transform:rotateY(180deg);}
  62%{transform:rotateY(180deg);} 86%{transform:rotateY(0deg);} 100%{transform:rotateY(0deg);}
}
@media (prefers-reduced-motion:reduce){ .cc-sig__card{opacity:1!important;} }
</style>

<div class="cc-embed cc-sig" data-cc-sig>
  <div class="cc-sig__head">
    <h3 class="cc-sig__title">Který z 6 varovných signálů znáte na vlastní kůži?</h3>
    <p class="cc-sig__lede">Jedna karta ještě mnoho neznamená. Co když jich otočíte ale více?</p>
  </div>
  <div class="cc-sig__deck"><div class="cc-sig__grid"></div></div>
  <div class="cc-sig__box" aria-live="polite">
    <span class="cc-sig__boxtag">Pozor</span>
    <p class="cc-sig__boxh"></p>
    <p class="cc-sig__boxtext"></p>
  </div>
</div>

  /* ---- texty ---- */
  var PRAH = 3;
  var BOX_TAG  = 'Pozor';
  var BOX_H    = 'Otočili jste {N} {KARTY}.';
  var BOX_LEAD = 'Možná ze zvědavosti, možná ne, to víte jen vy.';
  var BOX_REST = 'Když se vidíte ve vícero bodech, není to o tom, že se málo snažíte. Jen vám jedna oblast života zabírá víc místa, než jste ji chtěli dát.';
  function karty(n){ return n >= 5 ? 'karet' : 'karty'; }

  /* geometrie desky na rubu (naměřeno z obrázku) */
  var RUB_PLATE = {l:0.1309, t:0.3079, w:0.7383, h:0.3835};
  var RUB_NUM_T = 0.216;
  var RATIO = 1536/1024;

  var deck = root.querySelector('.cc-sig__deck');
  var grid = root.querySelector('.cc-sig__grid');
  var box  = root.querySelector('.cc-sig__box');
  var bTag = root.querySelector('.cc-sig__boxtag');
  var bH   = root.querySelector('.cc-sig__boxh');
  var bTx  = root.querySelector('.cc-sig__boxtext');

  function pct(v){ return (v*100).toFixed(3) + '%'; }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function clamp(a,v,b){ return Math.max(a, Math.min(v, b)); }

  /* ---- sestavení ---- */
  var html = '';
  DATA.forEach(function(c, i){
    var p = c.plate;
    html += '<div class="cc-sig__cell">'
         +  '<button type="button" class="cc-sig__card" aria-pressed="false"'
         +    ' style="--i:' + i + ';--dx:' + ((i % 3 - 1) * -16) + ';--rot:' + ((i % 3 - 1) * 1.8).toFixed(1) + '"'
         +    ' aria-label="' + esc(c.say + ' — ' + c.name) + '">'
         +    '<span class="cc-sig__inner">'
         +      '<span class="cc-sig__face cc-sig__face--rub">'
         +        '<img src="' + RUB + '" alt="">'
         +        '<span class="cc-sig__num" style="top:' + pct(RUB_NUM_T) + '">' + c.n + '</span>'
         +        '<span class="cc-sig__slot" style="left:' + pct(RUB_PLATE.l) + ';top:' + pct(RUB_PLATE.t)
         +          ';width:' + pct(RUB_PLATE.w) + ';height:' + pct(RUB_PLATE.h) + '">'
         +          '<span class="cc-sig__say">' + esc(c.say) + '</span></span>'
         +      '</span>'
         +      '<span class="cc-sig__face cc-sig__face--lic">'
         +        '<img src="' + c.img + '" alt="">'
         +        '<span class="cc-sig__slot" style="left:' + pct(p.l) + ';top:' + pct(p.t)
         +          ';width:' + pct(p.w) + ';height:' + pct(p.h) + '">'
         +          '<span class="cc-sig__name">' + esc(c.name) + '</span></span>'
         +      '</span>'
         +    '</span>'
         +  '</button>'
         +  '<p class="cc-sig__cap">' + esc(c.why) + '</p>'
         + '</div>';
  });
  grid.innerHTML = html;
  bTag.textContent = BOX_TAG;
  bTx.innerHTML = '<b>' + esc(BOX_LEAD) + '</b> ' + esc(BOX_REST);
  bH.textContent = BOX_H.replace('{N}', 6).replace('{KARTY}', karty(6));

  var cells = Array.prototype.slice.call(grid.querySelectorAll('.cc-sig__cell'));
  var cards = cells.map(function(c){ return c.querySelector('.cc-sig__card'); });
  var caps  = cells.map(function(c){ return c.querySelector('.cc-sig__cap'); });

  function update(){
    var n = 0;
    cards.forEach(function(c, i){
      var on = c.getAttribute('aria-pressed') === 'true';
      cells[i].classList.toggle('is-on', on);
      if(on) n++;
    });
    var warn = n >= PRAH;
    root.classList.toggle('cc-sig--warn', warn);
    if(warn) bH.textContent = BOX_H.replace('{N}', n).replace('{KARTY}', karty(n));
  }
  cards.forEach(function(c){
    c.addEventListener('click', function(){
      c.setAttribute('aria-pressed', c.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
      root.classList.remove('cc-sig--intro');
      root.classList.add('cc-sig--static');
      update();
      fit();
    });
  });

  /* ---- rozměry ---- */
  function fit(){
    var rootH = root.clientHeight;
    var wide  = root.clientWidth >= 1100;
    root.classList.toggle('cc-sig--rail', !wide);

    var boxH = Math.round(clamp(118, rootH * 0.155, 172));
    root.style.setProperty('--boxH', boxH + 'px');
    root.style.setProperty('--fs-boxh', clamp(17, boxH * 0.215, 30).toFixed(1) + 'px');
    root.style.setProperty('--fs-rest', clamp(11.5, boxH * 0.107, 15).toFixed(1) + 'px');
    root.style.setProperty('--fs-tag',  clamp(9, boxH * 0.082, 11.5).toFixed(1) + 'px');
    root.style.setProperty('--tag-gap', Math.round(clamp(4, boxH * 0.055, 10)) + 'px');
    root.style.setProperty('--h-gap',   Math.round(clamp(3, boxH * 0.045, 8)) + 'px');
    root.style.setProperty('--lead-gap',Math.round(clamp(2, boxH * 0.035, 6)) + 'px');

    var availW = grid.clientWidth;
    var availH = deck.clientHeight;
    if(availW <= 0 || availH <= 0) return;

    var colgap = wide ? Math.round(clamp(12, availW * 0.016, 22)) : 10;
    var rowgap = wide ? Math.round(clamp(10, availH * 0.030, 22)) : 0;
    root.style.setProperty('--colgap', colgap + 'px');
    root.style.setProperty('--rowgap', rowgap + 'px');

    var cellW, rows;
    if(wide){ cellW = (availW - 2 * colgap) / 3; rows = 2; }
    else    { cellW = clamp(112, availH * 0.46, 210); rows = 1; }

    var capW = Math.floor(Math.min(cellW, wide ? 258 : 230));
    root.style.setProperty('--capW', capW + 'px');
    var capGap = Math.round(clamp(5, availH * 0.016, 12));
    root.style.setProperty('--capgap', capGap + 'px');
    root.style.setProperty('--fs-cap', clamp(10.5, capW * 0.049, 14.5).toFixed(1) + 'px');
    root.style.setProperty('--capH', 'auto');
    var capH = 0;
    caps.forEach(function(p){
      p.style.width = capW + 'px';
      if(p.scrollHeight > capH) capH = p.scrollHeight;
    });
    caps.forEach(function(p){ p.style.width = ''; });
    capH = Math.ceil(capH) + 2;
    root.style.setProperty('--capH', capH + 'px');

    var rowH = (availH - (rows - 1) * rowgap) / rows;
    var byH  = (rowH - capH - capGap - 10) / RATIO;   /* 10 = prostor na stín a nadzvednutí */
    var cw   = Math.floor(Math.max(96, Math.min(cellW, byH)));
    var ch   = Math.round(cw * RATIO);
    root.style.setProperty('--cw', cw + 'px');
    root.style.setProperty('--ch', ch + 'px');
    if(wide) root.style.setProperty('--colW', Math.max(cw + 24, capW) + 'px');
    root.style.setProperty('--fs-say',  Math.max(9, cw * 0.072).toFixed(1) + 'px');
    root.style.setProperty('--fs-name', Math.max(7, cw * 0.058).toFixed(1) + 'px');
    root.style.setProperty('--fs-num',  Math.max(7.5, cw * 0.062).toFixed(1) + 'px');

    var fr = parseFloat(getComputedStyle(root).getPropertyValue('--fs-rest')) || 14;
    var fh = parseFloat(getComputedStyle(root).getPropertyValue('--fs-boxh')) || 26;
    var frMin = wide ? 10.5 : 9.2, fhMin = wide ? 16 : 13.5;
    for(var g = 0; g < 22 && box.scrollHeight > box.clientHeight + 1; g++){
      if(fr > frMin){ fr -= 0.5; root.style.setProperty('--fs-rest', fr.toFixed(1) + 'px'); }
      else if(fh > fhMin){ fh -= 1; root.style.setProperty('--fs-boxh', fh.toFixed(1) + 'px'); }
      else { root.style.setProperty('--tag-gap','3px'); root.style.setProperty('--h-gap','2px'); break; }
    }
  }

  /* ---- úvodní animace ---- */
  var armed = false;
  function arm(){
    if(armed) return; armed = true;
    if(window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches){
      root.classList.add('cc-sig--static'); return;
    }
    var peek = cards[1] || cards[0];
    peek.classList.add('cc-sig__peek');
    peek.style.setProperty('--peekAt', (cards.length * 85 + 480));
    root.classList.add('cc-sig--intro');
    setTimeout(function(){
      if(root.classList.contains('cc-sig--intro')){
        root.classList.remove('cc-sig--intro');
        root.classList.add('cc-sig--static');
      }
    }, cards.length * 85 + 480 + 2500);
  }

  update();
  fit();
  var t;
  window.addEventListener('resize', function(){ clearTimeout(t); t = setTimeout(fit, 120); });
  window.addEventListener('load', fit);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

  if('IntersectionObserver' in window){
    var io = new IntersectionObserver(function(es){
      es.forEach(function(e){ if(e.isIntersecting){ arm(); io.disconnect(); } });
    }, {threshold:0.25});
    io.observe(root);
    setTimeout(arm, 2600);
  } else { arm(); }
})();
</script>
</body></html>
